  /* ================= v0.70.0 全局横屏返工 =================
     分档轴 = **视口高度**，不是 orientation。为什么：
     1920x1080 / 1280x720 / 960x540 / 640x360 四个验收尺寸**全是 landscape**
     ⇒ orientation 在这套矩阵上恒真、零区分度，却引入模拟器与分屏误判的假失败面。
     真正失效的语义是「内容比视口高」，那是 height。

     档位（必须**从高到矮**书写：媒体查询不加特异度，同属性靠书写顺序定胜负，
     而原文件是反的 —— 窄档排在宽档前面，只是靠"两档属性基本不重叠"侥幸没出事）：
       基档      无查询       1920x1080、无头 1280x720
       T-mid     ≤700px 高    960x540、1024x640、带浏览器 chrome 的真实 720p
       T-short   ≤560px 高    640x360、667x375、844x390、932x430

     700 是**刻意卡在 720 下面**的：无头 1280x720 必须留在基档（v0.69.0 全部实拍
     基线都在那一档）。代价是只差 20px ⇒ T-mid 只能是**温和档**，误入也不难看。
     560 给 960x540（540）留 20px 余量。
     档内一律 clamp() 高度驱动 ⇒ 一档连续服务 360~560，不给 540 单开一档。

     基档（≥701px 高）本批**一行未改**：它是已验收的基线，改它等于拿验证过的
     东西冒险，而这两个高度档给的都是显式值，本来也不需要基档配合。 */

  /* —— T-mid：矮窗。温和档，只动四件事 —— */
  @media (max-height:700px){
    /* v0.72.0：弧线两个倍率。纵向 .7（矮窗的纵向预算紧一档），横向 .6。
       960×540 命中的是下面更矮的 T-short（.45/.4），这一条服务 561~700。 */
    :root{--rise-unit:.7; --slot-dx-k:.6; --player-inset-x:14px;}
    h1.title{font-size:22px; letter-spacing:3px; margin-bottom:2px;}
    h1.title small{display:none;}
    #app{padding:8px 10px 12px;}
    #topbar{padding:6px 10px; margin-bottom:6px;}
    .tb-toggle{min-height:28px; padding:2px 10px;}
    .hint{display:none;}
    /* 详情条在基档是 flex-basis:100%（独占一整行，为遗物/药水留宽度）。
       矮窗里它**空着也白吃一行**（实测 1024×640 顶栏 65px 里有 20px 是它）。
       改内联：有内容照样自动换行，没内容就不占行。 */
    .tb-detail{flex-basis:auto; border-top:0; padding-top:0; margin-top:0; gap:6px;}
    /* 敌人宽度是写死的 px（92/184/280/372），窗口一窄 #enemy-panel 就换行，
       而 `.battle{align-items:flex-end}` 会把行数**直接乘进纵向高度**——
       实测 1024×640：log 占 236 宽 ⇒ 敌人只剩 540 ⇒ 叠成 664px 高、整页 1010px。
       宽度的问题就用宽度单位解（vw）：1280×720 仍在基档、一行未动。 */
    /* ⚠️ 这里**不能**用 vw：`#app{max-width:1060px}` 把可用宽度封了顶，
       而 vw 跟着视口一起涨 —— 1366 宽时 13vw=178px，可用的只有 572px，照样换行。
       百分比的参照物是 `#enemy-panel` 的 content box，跟可用宽度同增同减，
       所以 min(基档值, N%) 在任何视口下都恒定装得下。 */
    .enemy.e-summon{width:min(92px,15%);}
    .enemy.e-normal{width:min(184px,28%);}
    .enemy.e-elite{width:min(280px,45%);}
    .enemy.e-boss{width:min(372px,60%);}
    /* v0.71.0：立绘高度那四条**已上提到基档**（锚点从 700 抬到 880，公式同源）。
       原来这里是「锚 700」的另一套 k，与基档那套在 700/701 上各算各的 ——
       基档是定值、这里锚 700，于是 701 用基档的定值、700 用这里的公式值，
       看着「正好等于基档值」很安全，其实**基档那一侧根本没在缩**：
       vh=700 时这档算出 372（=基档值），整页就顶穿 112px。
       两档共用一条函数之后这段缺口整段消失（实测 601–1080 全部为 0）。
       ⚠️ 这四条删不得也补不得：补回来就会把基档那条盖掉（同特异度、它写在后面）。 */
    /* 手牌同理：19vh 在 700px 处正好落回基档的 132/200，所以 700 那一档一字未变。
       下限 110/167 是给 561（这档的最低端）留的。 */
    #hand{--card-w:clamp(110px,19vh,132px); min-height:clamp(167px,28.8vh,200px);}
  }

  /* —— T-short：手机横屏。激进档 —— */
  @media (max-height:560px){
    /* v0.72.0：弧线的两个倍率。这一档 **--rise-unit 从 .45 改成 .05**，是有实测依据的
       放小、不是随手压：这档 `#enemy-panel` 另有 `padding-top:2px` 覆盖（下面那条），
       而 `#enemy-panel` 的顶边只比 `#topbar` 底边低 2px ⇒ 最高的那只最多只能抬
       `padding-top + 2 = 4px`，再多就顶进顶栏（v0.60 修过的实机缺陷）。
       实测（960×540，本档最紧的一个）：最高的那只不抬时 top=57，顶栏底边 53。
       dy 表满场是 62 ⇒ 倍率上限 4/62 ≈ .0645，取 .05 留 1px 余量。
       ⚠️ v0.70.0 的 .45 之所以没事，是因为它乘的 RISE_LIFT 把**最大的抬升给了最矮的那只**
          （[0]=0 / [1]=19 / [2]=9，而 [0] 恰好最高 224px）—— 弧线把最大抬升给了最深的那只，
          而最深的那只正是最高的一只（rank 越大越高），两者正好对撞。这一条是本次实测抓到的。
       横向不占高度预算，仍留 .4 —— 这档的纵深靠横向位移读。 */
    /* v0.72.0：`--player-inset-x:0` —— 这一档**必须**显式归零（不能省）：
       960×540 五敌一行只剩 4px 余量，任何内缩都会把它挤成两行、抬高 .battle。 */
    :root{--rise-unit:.05; --slot-dx-k:.4; --player-inset-x:0px;}
    #app{padding:1px 6px 1px;}
    /* ⚠️ `min-height` 不是装饰：`.title-actions` 是 `position:absolute; top:50%`
       + `translateY(-50%)`，参照物是**这个 h1 的盒**。h1 只有 16px 高而按钮 ~22px，
       垂直居中后按钮顶边落到 h1 上沿之外 —— 实测 844×390 上三个按钮
       （战报/牌库/菜单）**顶边在 y=−8，被视口上沿切掉一截**
       （横屏手机那里正是刘海/圆角/状态栏）。撑到 26px 就够包住按钮。 */
    h1.title{font-size:14px; letter-spacing:2px; margin-bottom:0; line-height:22px; min-height:22px;}
    h1.title small{display:none;}
    .title-actions{gap:4px;}
    /* ⚠️ 这三条原先写作 `.title-actions .btn` / `.btn` / `.btn.ghost`，**全是死代码**：
       `@media` 不加特异度，而基档写的是 `button.btn`(0,1,1) 与 `button.btn.ghost`(0,2,1)，
       类型选择器那 +1 直接压过了这三条。
       证据：844×390 上按钮实测 62×37px（= 基档 `.ghost` 的 8px 16px padding + 13px 字号），
       而预期是 11px 字号的小按钮 —— 这就是用户说的「手机端按键做得很奇怪」的头号来源。
       修法：把选择器抬到与基档同级或更高（带上 `button` 前缀），不是加 !important。 */
    .title-actions button.btn{padding:1px 6px; font-size:10px; letter-spacing:0;}
    button.btn{padding:5px 12px; font-size:12px; letter-spacing:1px;}
    button.btn.ghost{padding:3px 9px; font-size:11px;}
    #topbar{padding:3px 8px; margin-bottom:2px; gap:4px; border-radius:7px;}
    /* v0.71.0：390 高的屏上这条回顾占 30px（约 8%），而它讲的正是同一回合
       已经写进战报的那句话 ⇒ 矮屏收成一行小字。不是删功能，是换版位。 */
    #turn-summary{margin-bottom:3px; padding:2px 8px; font-size:11px; line-height:1.3;}
    .stat{font-size:11px;} .stat b{font-size:12px;}
    .tb-toggle{min-height:22px; padding:0 8px; font-size:11px;}
    /* 详情条在基准档是 flex-basis:100%（独占一整行，为遗物/药水留宽度）。
       390 高的屏上它**空着也白吃一行**（实测 9px + 行距 = 20px，正好是溢出的主因），
       所以矮屏档改回内联：有内容照样自动换行，没内容就不占行。 */
    .tb-detail{flex-basis:auto; border-top:0; padding-top:0; margin-top:0; gap:6px;}
    /* v0.71.0：`.tb-summons` 是**同一类漏网**（`.tb-detail` 上面那条修好了，它没有）。
       基档 `.tb-summons{flex-basis:100%}`（:98）让召唤物那行**独占一整行**，
       在 390 高的屏上是又一笔白吃的高度。改为内联：有召唤物照样自动换行，没有就不占行。 */
    .tb-summons{flex-basis:auto; gap:4px;}
    /* v0.71.0：顶栏那枚遗物 chip 在矮屏档一字未改（只有 ≤520 **宽**档收过，横屏拿不到）
       ⇒ 图标 24px + padding 在 390 高的屏上偏胖。与地图顶栏同口径收一档。 */
    .prelic-chip{padding:1px 5px 1px 1px;}
    /* v1.0.17：本档图标同样 2×（遗物芯片 18px → 36px）。 */
    .prelic-chip .ricon{width:36px; height:36px;}
    /* v0.71.0：成就吐司从视口上方掉下来，`top:14px` + `min-width:240px` 正好**盖住
       顶部那三枚按钮**（战报/牌库/菜单）。矮屏压小一圈并往边上去，减少遮挡。 */
    #achieve-toast{top:6px; min-width:180px; padding:7px 12px;}
    #achieve-toast .at-icon{font-size:18px;}
    #achieve-toast .at-title{font-size:14px; letter-spacing:1px; margin-top:3px;}
    #achieve-toast .at-sub{font-size:11px; margin-top:2px;}
    /* v0.71.0：Boss 出场在矮屏档一字未改 ⇒ `.bs-name` 44px + 印章块 22px/34px 的 padding
       ≈150px 高，在 390 高的屏上四个角贴边。压到与屏高相称。 */
    #boss-intro .boss-seal{padding:12px 20px; border-width:2px;}
    #boss-intro .bs-name{font-size:26px; letter-spacing:5px;}
    #boss-intro .bs-sub{font-size:11px; letter-spacing:3px; margin-top:4px;}
    /* v0.71.0：飘字/回合横幅只有 ≤520 **宽**档收过（:1205-1206），横屏（844 宽）拿不到
       ⇒ 26px 的楷体飘字在 390 高的屏上占掉 7% 的高度。与窄屏档同口径收一档。 */
    #float-msg{top:30%;}
    #float-msg .fm{font-size:20px;}
    #turn-banner{font-size:18px; top:14%;}

    /* 横屏版面：显式写回 row，不靠书写顺序碰运气 */
    #field{flex-direction:row; gap:8px; align-items:flex-start;}
    .battle{flex-direction:row; gap:8px; margin-bottom:0;}

    /* 矮屏档的 #log 不再单列 —— v0.71.0 起**基档就是抽屉**（见基档那条长注释），
       这里只剩字号这一处矮屏专属的收窄。
       640 宽下这一档仍然最吃紧（#col-main 362、减掉玩家面板 200 ⇒ 敌人只有 148px），
       但那条宽度账现在由基档的 position:fixed 统一解决了。 */
    #log{font-size:11px;}

    /* 净空归零：JS 只写 --headroom，这条同特异度、写在基档之后 ⇒ 胜 */
    #enemy-panel{padding-top:2px; gap:10px 14px;}
    .enemy::after{width:max(100%,84px);}   /* 热区跟着敌人收窄，否则相邻敌人互相抢点击 */

    #player-panel{flex:0 0 clamp(96px,26vh,140px);}
    /* v0.76.1：玩家立绘放大 —— 用户报「玩家角色尺寸偏小」。换成**锚在 360 的连续公式**
       （与敌人那套同构），上限取旧公式在 560 处的值 123（≈22vh×560=123.2）
       ⇒ **560 及以上的取值一分不涨**，只在 360–560 之间把立绘抬起来：
       390 → 89（+3）、471 → 113（+10）。 */
    .hero-art-box{height:clamp(80px,calc(80px + (100vh - 360px)*0.30),123px); margin-bottom:2px;}
    .pname{font-size:12px; letter-spacing:1px; margin-bottom:2px;}
    .pmech{font-size:9px; padding:1px 6px; margin-bottom:2px;}
    .prow{font-size:11px; margin:1px 0;} .prow b{font-size:12px;}

    /* v0.71.0：立绘高度换成**锚在 360 的连续公式**，取代原来的 12/22/27/32vh。
       原写法在 844×390 上把整页顶穿 41px（精英+小怪）、在 640×360 上顶穿 62px；
       而且四档的 vh 系数不同源，越矮体型差被压得越扁。
       新写法与基档那条同构（clamp(下限, 下限 + (100vh - 锚点) × k, 上限)），
       锚点取 360（本档最矮的验收档），斜率按基数等比。
       ⚠️ 与 T-mid 的交界（560/561）仍是个台阶：560 装得下、561 略溢出。
          这是**既有**现象（改前 T-mid 561 那端就顶穿 63px，比现在还差），
          不是本次引入。两档所需的斜率差得太多，强行接平会让 360 这端缩不下去。 */
    /* ⚠️ 斜率是**扫参**定的，不是拍的：第一版取 0.87/0.90/1.0（想一路接到 560 的旧值），
       结果 360/390 修好了、却把 420–460 顶穿 5–12px（那一段旧曲线本来就装得下，
       新曲线在它上面）。压到 0.50/0.55/0.60 并把上界设成**旧曲线在 560 处的值**
       （123/151/179）之后，360–560 的十七个采样点全为 0。 */
    /* v0.76.1：斜率整体上调（0.11/0.50/0.55/0.60 → 0.16/0.62/0.68/0.72），
       **上限一个都不动** —— 上限正是「560 处刚好装得下」的那三个数（123/151/179），
       抬上限就会在 560 顶穿。斜率只影响 360–560 之间：
       390 → 68.6/88.4/106.6（+3.6/+3.9/+3.6）、471 → 118.8/143.5/165.0（+13/+14/+13），
       560 处被上限截住 ⇒ 与改动前**逐像素相同**。用户报障的 1016×471 正在这一段。
       ⚠️ 宽度照旧不动（一行放得下的预算在 844×390 只剩 4px，加宽必折行）。 */
    .enemy .eportrait.e-summon{height:clamp(44px,calc(44px + (100vh - 360px)*0.16),67px);}
    .enemy .eportrait.e-normal{height:clamp(50px,calc(50px + (100vh - 360px)*0.62),123px);}
    .enemy .eportrait.e-elite{height:clamp(68px,calc(68px + (100vh - 360px)*0.68),151px);}
    .enemy .eportrait.e-boss{height:clamp(85px,calc(85px + (100vh - 360px)*0.72),179px);}
    /* v0.71.0：宽度**不再跟着 vh 缩** —— 原来是 21/26/32vh，390px 高的屏上只给
       82/101/125px，而横向**根本不缺地方**（844 宽的屏上敌区有 832px，
       2–3 只只占三分之一）。窄 + 高 ⇒ 名字/意图/徽章逐个折成两行，白白多吃
       35–45px 纵向 —— 用户报的「手机端 UI 做得很奇怪」，在敌人这一块就是这个。
       改成按**实际横向预算**给足之后，844×390 的溢出从 41px 直接掉到 4px。
       ⚠️ 这改变了敌人在手机上的观感（更宽、文字不再折行）。只动尺寸，
          不动排布/顺序/站位 —— 那些等用户的蓝图。 */
    .enemy.e-summon{width:80px;}
    .enemy.e-normal{width:130px;}
    .enemy.e-elite{width:170px;}
    .enemy.e-boss{width:210px;}
    .enemy .ename{font-size:13px; letter-spacing:1px; margin-bottom:2px;}
    /* 血条改按敌人宽度取百分比（基档 134/194/262 对 184/280/372 也是 ≈70%），
       不再用会跟着 vh 缩的 vh 值 —— 否则盒子加宽后血条还是根短棍。 */
    .enemy .enemyhpbar{width:70%; height:9px;}
    .intent{font-size:11px; margin-top:3px;}
    .badges{margin-top:3px; gap:4px;}
    .badge{font-size:10px; padding:1px 6px;}
    /* v1.0.17：本档字号缩小后，图标**仍保持「相对本档字号 2×」**（10px 字 → 20px 图）——
       写死桌面档的 24/28px 会把窄屏徽章撑成大方块。 */
    .badge .bicon{width:20px; height:20px; vertical-align:-5px;}
    .intent .bicon{width:22px; height:22px; vertical-align:-5.5px;}

    /* 手牌：卡宽当唯一旋钮，重叠量按比例跟着走。
       不能留 -62px 死值 —— 矮屏卡宽会掉到 76~118，固定 -62 只剩 14px 露出，
       整手牌糊成一条。 */
    #hand{--card-w:clamp(74px,19vh,118px); min-height:clamp(104px,30.3vh,179px); padding:3px 0 3px;}
    #hand .card{width:var(--card-w); height:calc(var(--card-w) * 1.515);
                margin-left:calc(var(--card-w) * -0.47);}
    /* 桌面档的 scale(1.3)/(1.5) 会把这 200px 的卡顶到 300px，矮屏直接顶出屏幕 */
    #hand .card:hover{transform:rotate(var(--rot,0deg)) translateY(-12px) scale(1.18);}
    #hand .card.lift{transform:translateY(-22px) scale(1.24);}
    .hand-area{--pile-w:clamp(26px,8vh,50px); --pile-h:clamp(40px,12.5vh,76px);
               --pile-spine:4px; --hand-pad-b:6px; gap:5px;}
    .pile-n{font-size:9px;}
    .rune-display{min-width:clamp(56px,15vh,86px); padding-bottom:6px;}
    .rune-icon{width:clamp(44px,13vh,78px); height:clamp(44px,13vh,78px);}
    .rune-fallback{font-size:clamp(36px,11vh,62px);}
    .rune-count{font-size:15px;}
    .hand-area #endTurn{writing-mode:horizontal-tb; min-height:0; align-self:flex-end;
         font-size:13px; padding:6px 10px; letter-spacing:2px;}

    /* 两条桌面专属浮层：矮屏正好压在手牌卡上，而气泡是可点的 ⇒ 会吃掉出牌落点
       （出牌靠 elementFromPoint，气泡盖住谁就选不中谁）。 */
    .hint{display:none;}
    #tut-hint{bottom:4px; font-size:12px; padding:6px 12px;}
    #tip-bubble{bottom:4px; font-size:12px; padding:6px 12px; line-height:1.5;}
    #end-turn-hint{font-size:11px; padding:4px 8px;}

    /* 面板：横扁的窗口里别退成一条竖列 */
    .panel{padding:12px 10px; max-height:94dvh;}
    .panel h2{font-size:18px; letter-spacing:2px; margin-bottom:8px;}
    .panel p{font-size:12.5px; line-height:1.55;}
    .reward-cards .card{min-height:150px;}
    /* v0.71.0 §四-②：矮屏档把选牌小窗的卡宽收到 **104px**，让 5 张**一排放得下**。
       为什么是 104：`.panel` 内容宽 = 620−26×2 = 568（640 宽下 602−52 = 550），
       5 张要一行放得下 ⇒ 5w+4×10 ≤ 550 ⇒ w ≤ 102…… 实测 104 仍是一行（`.reward-cards`
       自身宽 598/580，flex 会略微压缩卡片），而 **108 在 640 档塌成 4/1**
       ⇒ 104 是安全的最后一位。改 104 后 844×390 与 640×360 的 5 张弹窗内部溢出均为 **0**
       （改前 45 / 74）。
       ⚠️ **只收宽度、不动 `min-height`**：卡面框（`.card.has-frame .cart-wrap` 等）
       全部按**百分比**定位 ⇒ 宽高比一变立绘就拉伸。104:150 ≈ 0.69 与基档 132:200 = 0.66
       基本同形，所以这里保持 150 的高度。
       ⚠️ 代价（已实测，写进更新日志）：手牌 **6~10 张**时仍是 2 行，矮屏档面板会
       **内部滚动** ≤74px。这是「面板内部滚」——用户明确允许的那一类（不是整页滑），
       且只出现在极端手牌数下；把卡再缩小到能塞下 10 张会让字小到不可读，不划算。 */
    .reward-cards .card{width:104px;}
    .relic{width:110px; min-height:82px; padding:7px; font-size:11px;}
    .relic .ricon{width:56px; height:56px;}
    /* v0.71.0：选英雄屏在横屏手机上**放不下**（无头实测 #overlay .panel 内部溢出：
       640×360 → 62px、844×390 → 33px）。基档那条 `hero-scene` 放宽限宽在这里**无效** ——
       94% 的宽度（844×0.94 = 793）本来就小于 700px；而且四张英雄卡的**高度是文字撑出来的**：
       `.reward-cards{align-items:stretch}` ⇒ 四张一样高 = 最长的那张，实测 298px。
       ⇒ 只能压字，字号与行距各降一档。
       ⚠️ 不动 `.relic` 的 width（110px 已经是一排四张的极限），也不动文案本身 ——
       英雄描述与被动是**信息**，不是装饰，不能像 `h1 small` 那样直接 display:none。 */
    #overlay .relic .cname{font-size:13px; margin-bottom:3px;}
    #overlay .relic .cdesc{font-size:10px; line-height:1.3;}
    #overlay .relic .ctype{font-size:9px; margin-top:3px;}

    /* 地图：非弹性部分吃掉近 180px，视口只剩约 178 ⇒ 只看得见 2 层 */
    .map-topbar{padding:3px 8px;}
    .map-plaque{padding:2px 0;}
    .map-bottombar{padding:3px 8px;}
    .map-row{height:clamp(52px,16vh,82px);}
    .map-wrap{padding:14px 0;}
    .map-node .node-ico{width:38px; height:38px;}
    .map-node.locked .node-ico,.map-node.preview .node-ico{width:30px; height:30px;}
  }

  /* v0.71.0：把 `.tb-toggle` 的**触控命中区**放大到 ~34px 高，但**不加一点布局高度**。
     为什么不用 `min-height:30px`：实测 22→30 在 640×360 上白吃 8px、把整页从 1px 顶到 9px
     溢出，而且换 `min-height:28px` + 收顶栏 padding 也只压回 3px —— **这笔高度在最小的
     那一档买不起**。命中区用 `::after` 撑出去则是零布局成本的（实测 640×360 仍 1px、
     844×390 仍 0、960×540 仍 0）。
     ⚠️ 为什么用 `pointer:coarse` 分轴而不是再切一档 max-height：T-short 同时覆盖真手机横屏
        （844×390 起，手指操作）和 640×360 这类**桌面窗口**（有鼠标，只需点得中），
        `pointer:coarse` 正好是这条分界线（与竖屏闸 :1530 同一套判据）。
     ⚠️ 写在 T-short **之后** —— 同特异度靠书写顺序取胜（`@media` 不加特异度）。
     ⚠️ 无头夹具是 fine pointer，**这条在夹具里不生效** ⇒ 上面那组数是用 `css=` 注入
        同一份声明在 640×360 / 844×390 / 960×540 上单独量出来的（见更新日志）。
     ⚠️ 上下各撑 6px 会吃进顶栏 `gap:4px` 的 2px —— 顶栏本来就是折行的密集区，
        这 2px 换的是命中区从 22px 到 34px（触屏推荐值的 3/4），是划算的。 */
  @media (max-height:560px) and (pointer:coarse){
    .tb-toggle{position:relative;}
    .tb-toggle::after{content:""; position:absolute; inset:-6px -4px;}
  }

  /* —— 窄屏闸：弧线归零 ——
     v0.72.0：≤520 / ≤360 宽这两档的 `.battle` 是 flex-direction:column（玩家在上、
     敌人在下），「玩家左下、敌人右上」的构图本来就不成立 ⇒ 弧线整个归零，回扁平排布。
     ⚠️ 必须写在上面 T-mid / T-short **之后**：@media 不加特异度，同属性靠**书写顺序**定胜负。
        一个 500×700 的视口同时命中「≤520 宽」与「≤700 高」，归零块若写在前面就会被
        T-mid 的 .7/.6 盖掉 —— 窄屏当场长出弧线。两条轴上宽度这一轴必须赢，
        所以它排在最后（与 :1530 那条 pointer:coarse 分轴同一个道理）。
     ⚠️--rise-unit 在这两档是 **0**：它的读取判据因此从 v0.70.0 的 `>0` 放宽成 `>=0`
        （见 js/50_ui.js 的 refreshRiseK），否则 0 会被误判成非法而回落成 1。 */
  @media (max-width:520px){ :root{--rise-unit:0; --slot-dx-k:0; --player-inset-x:0px;} }
  @media (max-width:360px){ :root{--rise-unit:0; --slot-dx-k:0; --player-inset-x:0px;} }

  /* —— 竖屏闸 ——
     ⚠️ 必须带 (pointer:coarse)。裸写 orientation:portrait 会把 900x1200 的桌面窗口
        （devtools 停靠、竖屏副屏）当场锁死 —— 那是这条方案最大的代价，必须挡掉。
     隐藏沿用 `body.at-menu #app{display:none}` 那套已验收的写法，不新造轮子。
     ⚠️ 冒烟测不到这条：冒烟宿主里 innerWidth / matchMedia 零命中，
        只能用实拍夹具的 iframe 模式截图肉眼验。 */
  #rotate-tip{display:none; position:fixed; inset:0; z-index:200; background:#0b0a09;
    flex-direction:column; align-items:center; justify-content:center; gap:14px;
    color:var(--gold); font-family:var(--font-kai); text-align:center;}
  #rotate-tip .rt-ico{font-size:52px; animation:rtSpin 2.4s ease-in-out infinite;}
  #rotate-tip .rt-main{font-size:22px; letter-spacing:6px;}
  #rotate-tip .rt-sub{font-size:13px; color:var(--dim); letter-spacing:1px; font-family:"Microsoft YaHei",sans-serif;}
  @keyframes rtSpin{0%,35%{transform:rotate(0)}65%,100%{transform:rotate(90deg)}}
  @media (orientation:portrait) and (pointer:coarse){
    #app, #overlay{display:none;}
    #rotate-tip{display:flex;}
  }

  /* —— 安全区（刘海 / 圆角 / 状态栏）——
     viewport 已带 viewport-fit=cover ⇒ 页面铺满整屏，横屏时刘海压在左右两侧、圆角压住顶部三枚按钮。
     这里把 env(safe-area-inset-*) 补进 #app / #overlay 的内边距。
     为什么写成「末尾复刻四档内边距」而不是去改那四条既有规则：
       ① 既有版面规则一个字不动 —— 评审/回退只需看这一块，难度与风险都集中在眼里；
       ② 不支持 env() 的老浏览器会把整条 calc 判为非法并**丢弃该声明** ⇒ 自动回落到上面各档的
          原始 padding，版面与今天完全一致（而不是塌成 0）。
     桌面与无刘海设备 env() 全为 0 ⇒ calc 结果与原始值逐像素相同，基准档零变化。
     ⚠️ 四档顺序必须与原规则一致（基档 → ≤520 宽 → ≤700 高 → ≤560 高），@media 不加特异度、同属性靠书写顺序定胜负。 */
  #app{padding:calc(10px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-right,0px))
            calc(8px  + env(safe-area-inset-bottom,0px)) calc(14px + env(safe-area-inset-left,0px));}
  @media (max-width:520px){
    #app{padding:calc(6px + env(safe-area-inset-top,0px)) calc(6px + env(safe-area-inset-right,0px))
              calc(24px + env(safe-area-inset-bottom,0px)) calc(6px + env(safe-area-inset-left,0px));}
  }
  @media (max-height:700px){
    #app{padding:calc(8px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-right,0px))
              calc(12px + env(safe-area-inset-bottom,0px)) calc(10px + env(safe-area-inset-left,0px));}
  }
  @media (max-height:560px){
    #app{padding:calc(1px + env(safe-area-inset-top,0px)) calc(6px + env(safe-area-inset-right,0px))
              calc(1px + env(safe-area-inset-bottom,0px)) calc(6px + env(safe-area-inset-left,0px));}
  }
  /* 面板层同样避开安全区：关闭✕在右上角，锻造/图鉴/牌库是整屏面板。 */
  #overlay{padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px)
                   env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);}

  /* ===================== v0.76.1 界面修整（新增覆写块） =====================
     本节全部是「后写的覆写」，上方任何既有规则一个字都没动；同特异度靠书写顺序取胜。
     评审 / 回退只需看这一块。 */

  /* —— ① 系统胶囊避让（TapTap / 微信 / 抖音等小游戏宿主）——
     宿主会在右上角叠一枚**不可移除**的原生按钮（返回 / 退出，俗称「胶囊」），位置由宿主 API 给出。
     这里留一个变量 --sys-cap-r（**右内缩量**，默认 0px）：
       · 桌面浏览器 / 没有该 API 的宿主 ⇒ JS 不写它、保持 0 ⇒ 右锚元素与改动前**逐像素相同**；
       · 小游戏宿主 ⇒ sysSafeInit()（js/60_boot.js）把「视口右沿 → 胶囊左沿」的距离写进来。
     只覆写「贴右边」的三处常驻 UI：顶栏按钮组、主菜单符纸行、战报抽屉的标题行。
     其余元素都靠 flex 居中，胶囊够不到。
     ⚠️ 必须写在基档（.title-actions / .menu-row-talis 那两条）**之后** —— 同特异度看顺序。 */
  :root{--sys-cap-r:0px;}
  .title-actions{right:calc(4px + var(--sys-cap-r,0px));}
  .menu-row-talis{right:calc(6% + var(--sys-cap-r,0px));}
  /* 战报抽屉从右侧滑出、铺满整高，标题行正堵在胶囊底下 ⇒ 整行往左让出胶囊的宽。 */
  #log .log-head{padding-right:var(--sys-cap-r,0px);}

  /* —— ⑦ 战报抽屉的关闭件 ——
     抽屉铺满整高、右上角是宿主胶囊，把 ✕ 放在标题行末尾（上面那条已让出胶囊宽）。 */
  #log .log-close{flex:none; background:transparent; border:1px solid var(--ink3); color:var(--gold);
    border-radius:6px; font-size:12px; line-height:1; padding:3px 10px; cursor:pointer;
    letter-spacing:0; min-height:24px; min-width:28px;}
  #log .log-close:hover{border-color:var(--gold); background:rgba(224,179,65,.12);}
  #log .log-close:active{background:var(--gold); color:#241a10;}

  /* —— ③ 选英雄卡（v1.0.17 用户定稿重做）——
     头像用 panel_nine 做九宫框（border-image），只框住角色**上半身**（object-position 16%）；
     名字用 btn_primary 做按钮底；面板底换成程序化旧纸纹（由生成脚本出图）。
     三张图的真地址由 showHeroSelect 注入 `--hero-*` 变量（走 assetURL）；
     这里保留相对路径兜底，仅服务开发树（产物里由变量覆盖）。 */
  .hero-cards{display:flex; gap:12px; justify-content:center; margin:16px 0 6px; flex-wrap:wrap;}
  .hero-card{width:148px; display:flex; flex-direction:column; align-items:center; cursor:pointer;
    padding:10px 8px 8px; border-radius:10px; background:rgba(0,0,0,.22);
    border:2px solid var(--ink3); transition:border-color .12s, transform .12s, background .12s;}
  .hero-card:hover{border-color:var(--gold); background:rgba(224,179,65,.08); transform:translateY(-3px);}
  .hero-card.locked{filter:grayscale(1) brightness(.85); opacity:.55; cursor:not-allowed;}
  .hero-card.locked:hover{border-color:var(--ink3); background:rgba(0,0,0,.22); transform:none;}
  .hero-frame{width:100%; height:112px; box-sizing:border-box; border:15px solid transparent;
    border-image-source:var(--ui-hero-frame,url(素材/ui/panel_nine.png));
    border-image-slice:74 fill; border-image-width:15px; border-image-repeat:stretch;}
  .hero-frame .hero-portrait{display:block; width:100%; height:100%; object-fit:cover;
    object-position:center 16%; border-radius:4px; background:rgba(0,0,0,.3);}
  .hero-frame .hero-emoji{font-size:52px; opacity:.4; text-align:center; line-height:82px;}
  .hero-name{width:100%; height:30px; margin-top:7px; display:flex; align-items:center; justify-content:center;
    background:var(--ui-hero-name,url(素材/ui/btn_primary.png)) center/100% 100% no-repeat;
    font-family:var(--font-kai); font-size:15px; font-weight:bold; letter-spacing:2px;
    color:#ffe7b8; text-shadow:0 1px 2px rgba(0,0,0,.75);}
  .hero-card:hover .hero-name{background-image:var(--ui-hero-name-on,url(素材/ui/btn_primary_press.png));}
  .hero-brief{font-size:11px; line-height:1.45; color:var(--dim); margin-top:7px; text-align:center;}
  .hero-passive{font-size:11px; line-height:1.45; color:var(--gold); margin-top:5px; text-align:center;}
  .hero-note{font-size:10px; letter-spacing:1px; color:var(--dim); margin-top:6px;}
  /* v1.0.17：面板底换成旧纸纹（选英雄 + 卷轴族：里程碑/图鉴/设置/成就）。
     真地址由 js/60_boot.js 顶部统一注入 --ui-panel-bg，这里的相对路径只服务开发树。 */
  #overlay.hero-scene .panel, #overlay.scroll-scene .panel{
    background-image:var(--ui-panel-bg,url(素材/ui/hero_panel_bg.png));
    background-size:100% 100%; background-repeat:no-repeat;}
  /* 矮屏档：整体降一档，四张卡仍是一排且不撑破面板（沿用下方那套降档口径）。 */
  @media (max-height:560px){
    .hero-card{width:132px; padding:7px 6px 6px;}
    .hero-frame{height:82px; border-width:12px; border-image-width:12px;}
    .hero-frame .hero-emoji{font-size:40px; line-height:58px;}
    .hero-name{height:25px; font-size:13px; margin-top:5px;}
    .hero-brief,.hero-passive{font-size:10px; line-height:1.3; margin-top:4px;}
    .hero-cards{gap:9px; margin:8px 0 4px;}
  }

  /* —— ④ 里程碑「里程轨」界面（v1.0.23 · 用户草图，整屏重做）——
     左列：4 张角色横屏海报（素材/hero/<id>_poster.jpg，3:1）。**未选中只露左边 2/3**
     （露出的右缘压一道暗渐变，暗示还剩 1/3）；点中后展开到全幅，右 1/3 露出该角色机制名，
     并给海报加**厚边立体框**（多层描边 + 内侧高光 + 投影）—— 与其余海报一眼分开。
     右侧：一条蓝色里程轨，节点上方挂奖励白框、下方标里程数；轨可横向拖动（鼠标拖 / 触屏滑）。
     蓝线 = 冷色，与全局金/红分开。⚠️ 奖励内容 / 里程数 / 增长规则待定稿，
     当前渲染既有 MILESTONES 兜底内容，领取仅为占位交互。 */
  #overlay.mile-scene{background:#0b0a09;}
  #overlay.mile-scene #overlayWrap{width:100%; height:100%; max-width:none;}
  #overlay.mile-scene .panel{background:none; border:0; border-radius:0; padding:0;
    height:100%; max-height:none; overflow:hidden; text-align:left;}
  #overlay.mile-scene.ov-enter #overlayWrap{animation:mileIn .42s cubic-bezier(.2,.8,.2,1) both;}
  @keyframes mileIn{from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:none;}}
  .ml-root{position:absolute; inset:0; display:flex; flex-direction:column; overflow:hidden;
    font-family:var(--font-kai);
    /* v1.0.25：海报列宽（--pw）与里程轨纵向落点（--rail-y）由这里统一下发 ——
       .ml-track 要用同一个 --pw 把节点整体右移出海报列，故不能只挂在 .ml-heroes 上。
       --rail-y 用 px 表达式**咬住「第 2 张与第 3 张海报之间的缝」**：卡片高 = --pw/3 + 22(信息条)，
       缝心 = 10(padding-top) + 2×卡片高 + 14(gap) + 7(half gap) = 2×--pw/3 + 75。这样无论视口多高，
       那条蓝线都正好从海报的缝里透出来（用户口径「间隙可以透露一点底部那层里程」）。 */
    --pw:clamp(150px, calc((100vh - 300px) * .6), 460px);
    --rail-y:calc(var(--pw) * 2 / 3 + 75px);}
  .ml-top{flex:0 0 auto; display:flex; align-items:baseline; gap:14px; padding:8px 62px 7px 18px;
    border-bottom:1px solid rgba(224,179,65,.22);
    background:linear-gradient(180deg,rgba(26,20,14,.94),rgba(16,12,9,.55));}
  .ml-title{font-size:20px; letter-spacing:8px; color:#ffe7b8; text-shadow:0 2px 8px #000; white-space:nowrap;}
  .ml-sub{font-size:12px; line-height:1.5; color:var(--dim); min-width:0;}
  .ml-sub b{color:var(--gold);}
  /* v1.0.24：顶栏那块「当前里程」整块撤掉 —— 里程改为**每张海报下面各显示自己的**（用户口径）。 */
  /* v1.0.25（用户纠偏）：**两层浮叠、撤掉分栏硬边界** ——
     底层 .ml-stage = 整屏铺满的里程轨（无边框 / 无圆角 / 无底板）；上层 .ml-heroes = 左列海报浮层
     （透明背景，卡片之间的缝露出底下的里程层）。桌面海报列竖向可滚，手机横屏档改横排左右滑。 */
  .ml-main{position:relative; flex:1 1 auto; min-height:0; overflow:hidden;}
  /* 海报列浮层：宽 = --pw + 左右内边距（**必须把选中卡的外发光算进去** —— 旧版 padding-right:3px
     把 pw 宽的选中卡裁掉约 3px，就是用户报的「海报右边一点被截断」）。 */
  .ml-heroes{position:absolute; left:0; top:0; bottom:0; z-index:2;
    width:calc(var(--pw) + 26px); box-sizing:border-box; padding:10px 12px 10px 14px;
    display:flex; flex-direction:column; gap:14px;
    overflow-y:auto; overflow-x:hidden; scrollbar-width:none; background:none;
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%);
            mask-image:linear-gradient(180deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%);}
  .ml-heroes::-webkit-scrollbar{display:none;}
  .ml-hcard{position:relative; flex:0 0 auto; display:flex; flex-direction:column;
    width:calc(var(--pw) * .667);
    padding:0; border:0; border-radius:7px; background:#140f0b; cursor:pointer; overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.6), 0 0 0 1px rgba(224,179,65,.18), inset 0 0 0 1px rgba(255,230,180,.07);
    transition:width .34s cubic-bezier(.2,.8,.2,1), box-shadow .3s, filter .3s;}
  /* 海报框：固定 pw 宽（未选中时被卡片裁到左边 2/3）+ 斜向高光/内阴影做「起伏感」 */
  .ml-shotwrap{position:relative; display:block; width:var(--pw); height:calc(var(--pw) / 3); overflow:hidden;}
  .ml-shot{position:absolute; left:0; top:0; width:var(--pw); height:calc(var(--pw) / 3); display:block;
    object-fit:cover; filter:saturate(.7) brightness(.68); transition:filter .34s;}
  .ml-em{position:absolute; left:0; top:0; width:var(--pw); height:calc(var(--pw) / 3);
    line-height:calc(var(--pw) / 3); text-align:center; font-size:34px; color:var(--dim);}
  .ml-shotwrap::after{content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(118deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 24%,
      rgba(0,0,0,0) 66%,rgba(0,0,0,.36) 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22), inset 0 -3px 8px rgba(0,0,0,.5);}
  /* 未选中：右缘一道暗渐变 —— 暗示「右边还有 1/3 没露出来」 */
  .ml-hcard:not(.on) .ml-shotwrap::before{content:""; position:absolute; right:0; top:0; bottom:0; width:18px; z-index:3;
    background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.62)); pointer-events:none;}
  .ml-hcard.on{width:var(--pw);
    box-shadow:0 0 0 3px #6b4a24, 0 0 0 7px #241a10, 0 14px 28px rgba(0,0,0,.75),
      inset 0 0 0 2px rgba(255,222,150,.5), inset 0 0 24px rgba(224,179,65,.16);}
  .ml-hcard.on .ml-shot{filter:saturate(1.06) brightness(1);}
  .ml-hcard:focus-visible{outline:2px solid var(--gold); outline-offset:3px;}
  /* 展开后露出的右 1/3：角色机制名（将来的 logo 位） */
  .ml-badge{position:absolute; right:6px; top:50%; transform:translateY(-50%); z-index:4;
    width:calc(var(--pw) / 3 - 14px); text-align:center; font-size:14px; letter-spacing:3px;
    color:#ffe7b8; text-shadow:0 2px 8px #000,0 0 12px #000; opacity:0; transition:opacity .3s .12s;}
  .ml-hcard.on .ml-badge{opacity:1;}
  .ml-hnm{position:absolute; left:9px; bottom:6px; z-index:4; font-size:13px; letter-spacing:3px;
    color:#e9dcbb; text-shadow:0 2px 6px #000,0 0 10px #000;}
  .ml-hcard.on .ml-hnm{color:var(--gold);}
  /* 海报下方一行：该角色**自己的**里程 + 已达成档数 */
  .ml-hinfo{display:flex; align-items:baseline; gap:5px; height:22px; padding:0 8px; box-sizing:border-box;
    background:linear-gradient(180deg,#1c1510,#100c08); border-top:1px solid rgba(224,179,65,.16);
    font-size:10px; color:var(--dim); white-space:nowrap; overflow:hidden;}
  .ml-hinfo b{font-size:14px; color:#ffd77a; letter-spacing:.5px;}
  .ml-hinfo s{text-decoration:none; opacity:.72;}
  .ml-hinfo em{margin-left:auto; font-style:normal; opacity:.85;}
  .ml-hcard.on .ml-hinfo{background:linear-gradient(180deg,#2b1e12,#150e08);}
  .ml-hcard.on .ml-hinfo b{color:var(--gold);}
  /* 神秘人（敬请期待的新角色）：整张压成黑调，信息条只报「???」 */
  .ml-hcard.is-mystery .ml-shot{filter:grayscale(.4) brightness(.52) contrast(1.12);}
  .ml-hcard.is-mystery.on .ml-shot{filter:grayscale(.28) brightness(.8) contrast(1.16);}
  .ml-hcard.is-mystery .ml-hnm{color:#c9c4bb; letter-spacing:5px;}
  .ml-hcard.is-mystery.on .ml-hnm{color:#dfe4ec;}
  .ml-hcard.is-mystery .ml-badge{color:#c6cede; letter-spacing:5px;}
  .ml-hcard.is-mystery .ml-hinfo b{color:#9a9aa8;}
  .ml-hcard.is-mystery.on .ml-hinfo b{color:#cfd3dd;}
  /* 底层里程层：整屏铺满，**无边框、无圆角、无底板**（用户口径「不要明显的布局界限」）。 */
  .ml-stage{position:absolute; inset:0; z-index:1; display:flex; overflow:hidden;}
  /* 一层很淡的冷色晕染 —— 海报的缝隙里透出来的就是这一层（不是死黑，看得出「底下有东西」）。 */
  .ml-stage::before{content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(130% 96% at 76% 50%,rgba(46,84,126,.26),rgba(10,10,14,0) 64%),
      radial-gradient(80% 60% at 16% 120%,rgba(92,62,30,.18),rgba(10,10,14,0) 70%);}
  .ml-scroll{position:relative; flex:1 1 auto; min-width:0; overflow-x:auto; overflow-y:hidden;
    padding:0 68px 0 0; cursor:grab; touch-action:pan-x; scrollbar-width:none;}
  .ml-scroll::-webkit-scrollbar{display:none;}
  .ml-scroll.grabbing{cursor:grabbing;}
  /* 节点整体右移到海报列之外（那条线仍从 x=0 起，穿过海报的缝隙）。 */
  .ml-track{position:relative; width:100%; min-height:100%; margin-left:calc(var(--pw) + 30px);}
  .ml-line{position:absolute; left:calc(-1 * (var(--pw) + 30px)); right:0; top:var(--rail-y);
    height:6px; margin-top:-3px; border-radius:3px;
    background:repeating-linear-gradient(90deg,rgba(140,165,190,.24) 0 12px,rgba(140,165,190,.06) 12px 24px);}
  .ml-line i{display:block; height:100%; border-radius:3px; transition:width .5s cubic-bezier(.2,.8,.2,1);
    background:linear-gradient(90deg,#2f6ba8,#6fc4ff); box-shadow:0 0 10px rgba(111,196,255,.55);}
  .ml-node{position:absolute; top:0; bottom:0; width:0;}
  .ml-dot{position:absolute; left:-8px; top:var(--rail-y); margin-top:-8px; width:16px; height:16px; border-radius:50%;
    background:#16222e; border:2px solid #2f5c8a; box-sizing:border-box;}
  .ml-node.done .ml-dot{background:radial-gradient(circle at 40% 35%,#cdeeff,#5aa7e0 60%,#1b4a76);
    border-color:#8fd4ff; box-shadow:0 0 12px rgba(127,208,255,.7);}
  .ml-stem{position:absolute; left:-1px; bottom:calc(100% - var(--rail-y)); width:2px; height:30px;
    background:linear-gradient(0deg,rgba(127,208,255,.6),rgba(127,208,255,.08));}
  .ml-need{position:absolute; left:-44px; top:calc(var(--rail-y) + 16px); width:88px; text-align:center;
    font-size:11px; letter-spacing:1px; color:#8d8478;}
  .ml-node.done .ml-need{color:#ffd77a;}
  .ml-box{position:absolute; left:-65px; bottom:calc(100% - var(--rail-y) + 34px); width:130px; max-height:96px;
    padding:5px 7px; box-sizing:border-box; border:1px solid #b9a887; border-radius:7px;
    background:#f4efe2; color:#2b241c; text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,.5), inset 0 1px 0 #fff;}
  .ml-box b{display:block; font-size:12px; letter-spacing:1px; line-height:1.15;}
  .ml-box span{display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
    font-size:10px; color:#5c5245; line-height:1.25; margin-top:2px;}
  .ml-state{display:block; margin-top:3px; font-size:10px; font-style:normal; color:#9a8b73;}
  .ml-node.done .ml-box{border-color:var(--gold);}
  .ml-node.can .ml-box{border-color:#d9a83c; cursor:pointer;
    box-shadow:0 0 0 2px rgba(224,179,65,.35), 0 4px 14px rgba(224,179,65,.35), inset 0 1px 0 #fff;
    animation:mlPulse 1.7s ease-in-out infinite;}
  .ml-node.can .ml-state{color:#8a6a1f; font-weight:bold;}
  .ml-node.claimed .ml-box{filter:grayscale(.5) brightness(.94);}
  .ml-node.claimed .ml-state{color:#7a705f;}
  /* —— 阈值待定（定稿前 5 档真实奖励还没定里程数）：只报「?」，仍可点（按当前 pts 判定不可能达标） —— */
  .ml-node.pending .ml-need{color:#6f675c;}
  .ml-node.pending .ml-box{border-style:dashed; border-color:#a89a80; background:#efe9db;}
  .ml-node.pending .ml-state{color:#8a7a5f;}
  /* —— 尾节点「敬请期待」：里程不上限的尽头占位，不承载奖励、不可领 —— */
  .ml-node.ml-end{pointer-events:none;}
  .ml-node.ml-end .ml-dot{width:14px; height:14px; margin-top:-7px; left:-7px;
    background:transparent; border:2px dashed rgba(150,170,196,.55);}
  .ml-node.ml-end .ml-stem{background:linear-gradient(0deg,rgba(150,170,196,.4),rgba(150,170,196,.05));}
  .ml-node.ml-end .ml-need{color:#7d8794; letter-spacing:2px;}
  .ml-node.ml-end .ml-box{left:-72px; width:144px; border:1px dashed rgba(150,170,196,.5);
    background:rgba(22,26,32,.86); color:#aab4c2; box-shadow:none;}
  .ml-node.ml-end .ml-box b{color:#c6cede; letter-spacing:3px; font-size:13px;}
  .ml-node.ml-end .ml-box span{color:#7d8794;}
  /* —— 神秘人未知档：黑色系「?」图标盖住，不透露任何内容 —— */
  .ml-node.unknown .ml-dot{background:#0d0d11; border-color:#3a3a46; box-shadow:0 0 8px rgba(0,0,0,.8);}
  .ml-node.unknown .ml-stem{background:linear-gradient(0deg,rgba(120,120,140,.3),rgba(120,120,140,.04));}
  .ml-node.unknown .ml-need{color:#5a5a68;}
  .ml-node.unknown .ml-box{left:-65px; width:130px; border:1px solid #3a3a46; background:#0d0d11;
    color:#8b8b9b; box-shadow:0 3px 10px rgba(0,0,0,.7);}
  .ml-node.unknown .ml-box b{font-size:22px; letter-spacing:0; color:#6a6a7a; line-height:1;}
  .ml-node.unknown .ml-box span{color:#5f5f6d;}
  .ml-node.unknown .ml-state{color:#55555f;}
  @keyframes mlPulse{0%,100%{transform:translateY(0);} 50%{transform:translateY(-3px);}}
  /* 低配 / 减弱动态：这一屏的入场与白框呼吸一并关掉（特异度必须 >= 上面两条） */
  .low-spec #overlay.mile-scene.ov-enter #overlayWrap{animation:none;}
  .low-spec .ml-node.can .ml-box{animation:none;}
  @media (prefers-reduced-motion: reduce){
    #overlay.mile-scene.ov-enter #overlayWrap{animation:none;}
    .ml-node.can .ml-box{animation:none;}
  }
  /* 矮屏 / 窄屏（手机横屏档）：海报改**顶部横排浮层**（窄了/以后加了新角色就左右滑），
     里程轨仍**整屏铺在底层**（同款设计：没有分栏硬边界，海报的缝里露出底下的轨）。 */
  @media (max-width:520px), (max-height:560px){
    .ml-root{--pw:clamp(120px, 19vw, 210px); --rail-y:56%;}
    .ml-top{padding:6px 60px 5px 12px; gap:8px;}
    .ml-title{font-size:16px; letter-spacing:4px;}
    .ml-sub{font-size:10px;}
    .ml-heroes{left:0; right:0; top:0; bottom:auto; height:auto; width:auto;
      padding:8px 10px 10px; flex-direction:row; align-items:flex-start; gap:10px;
      overflow-x:auto; overflow-y:hidden;
      -webkit-mask-image:none; mask-image:none;}
    .ml-hcard{width:calc(var(--pw) * .667); height:auto;}
    .ml-hinfo{height:19px; font-size:9px; gap:4px; padding:0 6px;}
    .ml-hinfo b{font-size:12px;}
    /* 横排档节点不再右移（海报在顶上，轨在下面整屏铺开）。 */
    .ml-track{margin-left:0;}
    .ml-line{left:0;}
    .ml-scroll{padding:0 56px;}
    .ml-box{left:-54px; width:108px; max-height:70px; padding:4px 5px;
      bottom:calc(100% - var(--rail-y) + 26px);}
    .ml-box b{font-size:11px;}
    .ml-box span{font-size:9px; -webkit-line-clamp:2;}
    .ml-state{font-size:9px;}
    .ml-stem{height:20px;}
    .ml-need{top:calc(var(--rail-y) + 12px); font-size:10px;}
    .ml-badge{font-size:11px; letter-spacing:1px;}
    .ml-hnm{font-size:11px; letter-spacing:1px;}
    .ml-node.unknown .ml-box b{font-size:18px;}
    .ml-node.ml-end .ml-box{left:-54px; width:108px;}
    .ml-node.ml-end .ml-box b{font-size:11px; letter-spacing:2px;}
  }

  /* —— ⑥ 顶栏详情自适应高度 ——
     遗物 / 道具 / 召唤物一多，.tb-detail 会无限长高，把整个战场往下挤（用户报的「顶部蓝框过高」）。
     给一个视口比例上限 + 自己滚：面板**不再随内容增长**，超出部分在面板内滚动。
     矮屏档限得更小（那档纵向预算最紧）。 */
  .tb-detail{max-height:22vh; overflow-y:auto;}
  @media (max-height:560px){ .tb-detail{max-height:15vh;} }

  /* ===================== v1.0.0 界面修整（新增覆写块） =====================
     同样是「末尾覆写」：上方规则一个字未动，同特异度靠书写顺序取胜。
     来源=用户 2026-10-01 真机试玩（1016×471 TapTap H5，命中 T-short 档）逐条反馈。 */

  /* —— ① 版本号：挪到左上角，迷你字号 ——
     原先挂在 h1.title 的 <small> 上（居中标题下方）。用户要求「放在游戏左上角，要迷你字号」。
     z-index 60 > #overlay(10)：主菜单/弹窗盖上来时它也照样看得见。 */
  #ver-tag{position:fixed; top:2px; left:calc(6px + env(safe-area-inset-left,0px)); z-index:60;
    font-family:"Microsoft YaHei",sans-serif; font-size:9px; line-height:12px; letter-spacing:.5px;
    color:var(--dim); opacity:.7; pointer-events:none; user-select:none;}

  /* —— ② 主界面右上角三枚符纸：往右收一点 ——
     上一版给了 6% 的右距再叠宿主胶囊的内缩，真机上看着偏中间 ⇒ 收到 2.5%。 */
  .menu-row-talis{right:calc(2.5% + var(--sys-cap-r,0px));}

  /* —— ③ 战报抽屉收窄 ——
     300px 在手机上占了近半个屏（用户：「战报写写条可以窄一点，弄太宽占位置」）。
     68vw 那半条兜底也一起收：窄屏上 68vw 比 300 还大，等于没兜住。 */
  #log{width:min(258px,46vw);}
  /* ✕ 已挪到标题行**最左**（见 js/60_boot.js 的 renderLogBox），标题行不必再给胶囊让宽。 */
  #log .log-head{padding-right:0;}
  /* 触屏落点：24px 太小，给到 30×26。 */
  #log .log-close{min-width:30px; min-height:26px; font-size:13px;}

  /* —— ④ 引导条提到屏幕中间 ——
     引导是新手的一次性提示，原来贴在屏幕最下沿、正压着刚松开的手牌
     （用户：「引导…却占据了下面的位置」）。挪到屏幕正中；它自带 pointer-events:none（基档），
     所以压在敌人身上也不会挡「把牌拖到敌人身上打出」。 */
  #tut-hint{top:50%; bottom:auto; transform:translate(-50%,-50%);}

  @media (max-height:560px){
    /* ⑤ 手牌往下一点：引导条搬走后底部更空。数值是**实测出来的**——
       ⑥ 把 .battle 抬了约 21px（243 vs 222），已吃掉原来 27px 死区的大半，
       所以这里只再补 2px：手牌底落在 y≈466（视口 471），既不越界也不留空档。 */
    .hand-area{margin-top:2px;}

    /* ⑥ 立绘放大（用户：「敌人和角色的例会，你放大一点」）——
       三档立绘各抬一档；腾出来的纵向预算来自下面 ⑦ 那几条字号收窄，
       以及 ⑧ 那几条横向尺寸。放大后 .battle 会变高，正文尾部因此没有再加更多下移量。 */
    .hero-art-box{height:clamp(88px,calc(88px + (100vh - 360px)*0.42),148px);}
    .enemy .eportrait.e-summon{height:clamp(48px,calc(48px + (100vh - 360px)*0.18),72px);}
    .enemy .eportrait.e-normal{height:clamp(58px,calc(58px + (100vh - 360px)*0.72),148px);}
    .enemy .eportrait.e-elite {height:clamp(76px,calc(76px + (100vh - 360px)*0.78),176px);}
    .enemy .eportrait.e-boss  {height:clamp(94px,calc(94px + (100vh - 360px)*0.82),200px);}
    .enemy.e-summon{width:84px;}
    .enemy.e-normal{width:138px;}
    .enemy.e-elite{width:178px;}
    .enemy.e-boss{width:218px;}

    /* ⑦ 敌人信息词条收一档 ——
       用户：「敌人的名字及图标，词缀，意图和受到的 buff 等信息词条字太大，占了不少位置」。
       缩字 + 缩间距，上下都省；省下来的纵向预算正是 ⑥ 放大立绘要用的。 */
    .enemy .ename{font-size:12px; margin-bottom:1px;}
    .badges{margin-top:2px; gap:3px;}
    .badge{font-size:9px; padding:1px 5px;}
    .intent{font-size:10px; margin-top:2px;}
    /* v1.0.17：同上一档 —— 图标保持「相对本档字号 2×」（9px 字 → 18px 图）。 */
    .badge .bicon{width:18px; height:18px; vertical-align:-4px;}
    .intent .bicon{width:20px; height:20px; vertical-align:-5px;}
    .enemy .ename .bicon{width:22px; height:22px; vertical-align:-5px;}
    .enemy .enemyhpbar{height:8px;}

    /* ⑧ 角色向右挪，别压左边缘（该档原值 0px）。窄屏（≤520）那一档是上下排布、
       刻意归零过，所以只在 ≥521 宽时生效。 */
  }
  @media (max-height:560px) and (min-width:521px){ :root{--player-inset-x:18px;} }

  /* ===================== v1.0.2 手机横屏战斗版面（新增覆写块） =====================
     用户 2026-10-02 手机端布局复审：「整体比较拥挤、立绘比较迷你、不重要的元素体积过大」。
     本块只做**立绘优先**这一件事：三档敌人立绘 + 玩家立绘各抬一档，横竖都不越安全区。
     手牌的扇形（#hand 全部规则、--rise-unit、--slot-dx-k）与敌人宽度**一个字未动** ——
     扇形角度、弧线、换行判据、点击热区全部原样。

     纵向预算「先省后花」，因为 T-short 档的底部余量本来就被吃干净了：
       顶栏 30 → 21（padding 3→1、tb-toggle 22→18、margin-bottom 2→1）
       回合回顾 23 → 13（padding / 字号 / margin 各收一档）
       敌人词条行高再收一档（④ 那四条立绘要的预算正是从这三处来）
     ⚠️ 判据必须按「回合回顾**在场**」来量：它在每次敌方回合里都有内容，而它那 20px
        正好等于改前的全部底部余量。只量空回顾会高估能放大多少。
        实测（1024×474，夹具 ts=1）：改前 .hand-area 底 = 475 **已经 1px 出界**。
     ⚠️ 触控命中区不缩水：tb-toggle 仍由 (pointer:coarse) 那条 ::after{inset:-6px -4px} 撑出 30px。 */
  @media (max-height:560px){
    /* ① 顶栏压薄 9px */
    #topbar{padding:1px 8px; margin-bottom:1px;}
    .tb-toggle{min-height:18px;}
    /* ② 回合回顾压薄 10px：一次性的回合小结，矮屏上只留一行小字 */
    #turn-summary{margin-bottom:1px; padding:0 8px; font-size:10px; line-height:1.2;}
    /* ③ 敌人词条行高再收一档（上一条 v1.0.0 只收了字号，行高还是默认的 1.4~1.5） */
    .enemy .ename{line-height:1.15;}
    .enemy .stat{line-height:1.15;}
    .badges{margin-top:1px;}
    .intent{line-height:1.15; margin-top:1px;}

    /* ④ 三档立绘：仍是同一套 clamp(下限, 下限+(100vh-360px)×k, 上限) 连续公式。
       下限按 360（本档最矮）定、上限按 560（本档最高、纵向最紧的一端）定，
       斜率只负责 360–560 之间那段（474 处 boss:elite:normal ≈ 1 : .89 : .73，档差拉开）。
       ⚠️ 只改高度：宽度一个字未动 ⇒ 一行放得下的横向预算与 enemyRows 换行判据都不变。
       ⚠️ 三条的值是**量出来的**，不是拍的：每加高 1px，.battle 就高 1px、手牌就往下 1px。 */
    .enemy .eportrait.e-normal{height:clamp(82px,calc(82px + (100vh - 360px)*0.58),200px);}
    .enemy .eportrait.e-elite {height:clamp(100px,calc(100px + (100vh - 360px)*0.70),244px);}
    .enemy .eportrait.e-boss  {height:clamp(120px,calc(120px + (100vh - 360px)*0.72),266px);}
    .enemy .eportrait.e-summon{height:clamp(52px,calc(52px + (100vh - 360px)*0.20),80px);}

    /* ⑤ 玩家立绘同抬一档。上限 172 是**宽度**顶住的：立绘 500×700（比例 .714），
       而 #player-panel 在 474 高时只有 123px 宽 ⇒ 123 ÷ .714 ≈ 172，再高会被 max-width 压扁。
       玩家面板比 .battle 矮，抬它**不占** .battle 的纵向预算（那点空间本来就在玩家头顶空着）。 */
    .hero-art-box{height:clamp(100px,calc(100px + (100vh - 360px)*0.58),172px);}

    /* ⑥ 飘字随立绘抬一档（22/24/28 → 24/26/30）。数字是 PNG 字形、尺寸按 em 走
       ⇒ 只改字号，不需要美术另交一套素材；位置本来就贴血条/立绘（见 js/00_base.js 的锚点）。 */
    .fx-dmg{font-size:24px;}
    .fx-dmg.to-player{font-size:26px;}
    .fx-dmg.crit{font-size:30px;}
  }

  /* ===================== v1.0.3 手机横屏：顶部合行 + 左侧竖直窄栏（新增覆写块） =====================
     用户 2026-10-02 第二轮复审：「不重要的元素体积过大，比如顶部栏」，并要求
     「战报 / 牌库 / 菜单 挪进左侧竖直栏」「志怪塔标题缩小」「删「还有 N 张可打」」。

     纵向账（1024×474，夹具 ts=1 最坏值）：
       改前 h1 行 22 + 顶栏 22 = 44px；改后只有顶栏一行 ⇒ 省 ~22px（这笔预算本次**不花**，
       留给「立绘再抬一档」；先确认版面本身对不对，再决定怎么用）。
     ⚠️ 合行是**零布局成本**的做法：h1 压成 17px 的条（只放标题字），#topbar 用
        `margin-top:-17px` 提上来同排。h1 与 #topbar 在这档都是**静态**（h1 把基档的
        `position:relative` 归零），于是 #topbar 的背景先画（层叠第 1 步）、h1 的字后画
        （第 3 步）⇒ 标题字稳定压在顶栏背景**之上**；再给 #topbar 一个左内边距把芯片让开，
        两者互不遮盖。h1 走 `pointer-events:none`，避免标题字抢走顶栏按钮的点击
        （v1.0.21：折叠只由「▾ 详情」按钮触发，顶栏整条不再挂 onclick）。
     ⚠️ h1 归零 `position:relative` 还有第二个作用：`.title-actions` 是 `position:absolute`，
        它的包含块因此从 h1 **上移到 #app**（基档就是 position:relative）⇒ 左竖栏可以直接
        挂在 #app 上：既不吃 .battle 的宽度、`left:2px` 在**任何视口宽度**下都对得齐。
        （若改写成 `position:fixed`，>1060 宽的矮窗口会把竖栏甩到 App 外面 —— #app 是
         max-width:1060 的居中容器，而 T-short 覆盖到 1280×540 这类桌面矮窗。）
     ⚠️ 竖栏让出的那条 30px 由 `--player-inset-x:34px` 把玩家立绘推开 —— 不动 .battle 的
        flex 结构、不动敌人宽度、不动手牌扇形 ⇒ 换行判据与弧线一个字未改。
     ⚠️ 只在 ≥521 宽生效：≤520 宽那一档是「玩家在上、敌人在下」的上下排布，标题行下面
        还有一排**在流**的按钮（基档 :1482 的 `.title-actions{position:static}`），合行会把
        它们压到顶栏底下去。 */
  /* ===== 三个新结构的**基档**（默认即桌面原样，只有手机横屏档才打开） =====
     ⚠️ 必须放在下面所有 media 块**之前**：这些覆盖都靠「同特异度、书写更后」取胜
        （`.sb-short{display:none}` 与 `.stat .sb-short{display:inline}` 特异度还不同，
        后者更长 ⇒ 顺序其实无所谓；但 `.psummons` / `.ct-corner` 是同特异度，
        顺序错了就会「手机档打开、又被后面这条关掉」）。 */
  .ct-corner{display:none;}
  .psummons{display:none;}
  .sb-short{display:none;}
  /* ⚠️ 选择器必须比 :1262 的 `.tb-detail .stat{display:inline-flex}` **更长**：
     那条会把裸 `.stat-detail-full{display:none}` 盖掉 ⇒ 桌面档的详情里凭空多出一行完整信息。 */
  .tb-detail .stat.stat-detail-full{display:none;}

  @media (max-height:560px) and (min-width:521px){
    :root{--player-inset-x:40px;}

    /* ① 标题行与顶栏合行 */
    /* ⚠️ `z-index:2` 不是装饰，是**必须**的：h1 与 #topbar 都是 #app（display:flex）的
       flex item，而 flex item 的绘制顺序与 inline-block 同源 —— 两者的背景与行内内容
       都在「行内级后代」那一层按**文档顺序**画 ⇒ 后画的 #topbar 底板会正好把先画的
       「志 怪 塔」盖掉（实测：字量得到、看不见）。给 h1 一个定位 + 正 z-index 把它抬到
       「正 z-index 子层叠上下文」那一层，就稳在顶栏底板之上。
       ⚠️ 用 `position:relative` 而不是 static：`.title-actions` 因此仍以 h1 为包含块，
       h1 是撑满整宽的 flex item（align-items:stretch）、左上角又正好在 #app 的内容角上
       ⇒ 竖栏 `left:0 / top:27px` 与挂在 #app 上等价，不需要额外校准。
       ⚠️ h1 的盒子（整宽 × 17px）会压在顶栏第一行上 ⇒ 必须 `pointer-events:none`，
       否则顶栏的 onclick（展开详情）与里面的芯片全点不到；竖栏自己再 `auto` 回来。 */
    h1.title{position:relative; z-index:2; height:17px; min-height:0; line-height:17px; margin:0;
             font-size:11px; letter-spacing:1px; text-align:left;
             padding-left:calc(50px + env(safe-area-inset-left,0px));
             pointer-events:none;}
    h1.title small{display:none;}
    /* 左内边距让开「V1.0.0（position:fixed，本来就在左上角）+ 志 怪 塔」。 */
    #topbar{margin-top:-17px; padding-left:calc(104px + env(safe-area-inset-left,0px));}

    /* ② 战报 / 牌库 / 菜单 → 左侧竖直窄栏 */
    /* ⚠️ v1.0.8：top 从 27 抬到 48 —— 用户报「圆角屏四个角落别放按键」。贴角的
       (x≈6, y≈28) 在 R≈56 以上就会被圆角裁掉；x 不动（保持 0 ⇒ 视口 x≈6，与玩家立绘
       起点 46 仍留 6px 间距），只下移：y≈49 对 R≤79 都安全。 */
    /* 竖栏要浮在**战场照片**上（那一段没有顶栏的底板），所以自带一层墨底 ——
       否则 10px 的 `btn.ghost` 字直接落在插画上，读不出是个按钮。 */
    .title-actions{position:absolute; left:0; right:auto; top:48px; transform:none;
                   flex-direction:column; align-items:stretch; gap:3px; width:34px; z-index:5;
                   box-sizing:border-box; padding:3px; pointer-events:auto;
                   background:rgba(16,12,9,.62); border:1px solid var(--ink3); border-radius:8px;}
    .title-actions button.btn{width:100%; padding:1px 0; font-size:10px; letter-spacing:0;}
    /* 按钮实体只有 26×17，够不到手指 ⇒ 用 ::after 往外撑命中区，不加一点布局高度
       （与 (pointer:coarse) 那条 .tb-toggle::after 同一手法）。 */
    .title-actions .btn{position:relative;}
    .title-actions .btn::after{content:""; position:absolute; inset:-4px -4px;}

    /* ③ 立绘「再抬一档」= 加一条**折点项**，而不是抬 clamp 的上限。
       v1.0.2 那四条（:2076-2079 / :2084）在本档内上限**从不咬合** ——
       e-normal 要 vh≈563、e-elite 565.7、e-boss 562.8 才触及 ⇒ 只抬上限等于什么都没做。
       折点项 `max(0px, 100vh - 390px)×k` 在 ≤390 高时恒为 0（矮屏一档逐像素不变），
       390 以上才继续长 ⇒ 1024×474 实测 normal 148→168、elite 180→202、boss 202→224。
       ⚠️ 这笔预算正是①合行省下的 ~22px（改前 .hand-area 底 441、余 33px；花掉后仍余 ~11px）。 */
    .enemy .eportrait.e-normal{height:clamp(82px,calc(82px + (100vh - 360px)*0.58 + max(0px, 100vh - 390px)*0.64),200px);}
    .enemy .eportrait.e-elite {height:clamp(100px,calc(100px + (100vh - 360px)*0.70 + max(0px, 100vh - 390px)*0.34),244px);}
    .enemy .eportrait.e-boss  {height:clamp(120px,calc(120px + (100vh - 360px)*0.72 + max(0px, 100vh - 390px)*0.26),266px);}
    .hero-art-box{height:clamp(100px,calc(100px + (100vh - 360px)*0.58 + max(0px, 100vh - 390px)*0.24),172px);}

    /* ④ 左右牌堆与符文各内收 40px —— 让它们贴着手牌，屏幕两端各留 40px 边距。
       ⚠️ 用 `position:relative` + `left` 做**纯视觉平移**，一点 flex 布局都不动：
          `.hand-area #hand{flex:1 1 auto}`（:337）⇒ 手牌盒子吃掉全部剩余宽度，
          而卡面只占盒子中间那 ~380px（8 张时）⇒ 两端各有 ~180px 空盒，平移 40px 根本碰不到卡。
          若改 margin / flex，手牌可用宽度会变、居中的扇形会跟着漂、结束回合那列会被推走。
       ⚠️ 抽牌堆在**最右端**、结束回合列紧贴它左侧（实测 1024 档：.endcol 891..971、
          抽牌堆 976..1018）⇒ 抽牌堆单独左移 40px 会压在结束按钮上（重叠 35px），
          `.endcol` 必须跟着一起左移，两者保持原有 5px 间距。`.endcol` 已是 position:relative（:345）。
       ⚠️ `.rune-display`（:428）本来**不是**定位元素 ⇒ 必须显式补 position:relative。 */
    .pile-discard{left:40px;}
    .rune-display{position:relative; left:40px;}
    .hand-area .endcol{left:-40px;}
    .pile-draw{left:-40px;}

    /* ⑤ 召唤物筹码条：贴玩家立绘右侧，只显示「名字／数值／剩余回合」。
       v0.76.1 起 vh≤560 的顶栏详情**默认收起**（TOPBAR_OPEN=false）⇒ 详情里的 `.tb-summons`
       在手机上永远看不见（功能缺口），所以给玩家面板挂一条常显筹码条，
       同时把详情里那条藏掉，免得展开详情时重复一遍。
       ⚠️ 横向余量有限但**确定**：敌人在 #enemy-panel 里是 row-reverse（:188
          justify-content:flex-start ⇒ 从**右**往左排），玩家立绘右侧到最左那只敌人之间就是空档
          （1024 档：玩家右沿 169、最左敌盒 448 ⇒ 有 279px）。筹码条按 min(96px,20vw) 收窄，
          640 档三只并排时会与最左敌盒轻微重叠 —— 玩家面板 z-index:2100 高于敌盒 2000，
          筹码盖在敌人之上（可读性优先，矮屏本来就放不下三敌）。 */
    /* v1.0.14【筹码条不再与折叠键打架】：原先筹码条挂 #player-panel 的 `top:50%`，
       而折叠键（.ps-fold）挂 .hero-art-box 的 `bottom:0` —— 两者是**同一条右侧竖带**，
       竖屏/矮屏下玩家面板变矮，50% 就正好落进折叠键那一行 ⇒ 实拍两颗筹码叠在一起。
       改成把筹码条也挂进 .hero-art-box（见 60_boot.js，与折叠键同一父盒），
       `top:100%` = 紧贴立绘底边 ⇒ 恒在折叠键下方，任何高度都不会重合。 */
    .psummons{display:flex; position:absolute; left:100%; top:100%; margin-left:2px; margin-top:2px;
              flex-wrap:wrap; align-content:flex-start; gap:2px; max-width:min(96px,20vw); z-index:2;}
    .psummons .summon{font-size:10px; line-height:1.25; padding:1px 6px; border-radius:10px; white-space:nowrap;}
    .tb-summons{display:none;}

    /* ⑥ 顶栏芯片的短形式（完整文字挪进详情）：只有手机横屏档才把长写换成短写。 */
    .stat .sb-long{display:none;}
    .stat .sb-short{display:inline;}
    .summon .sb-long{display:none;}
    .summon .sb-short{display:inline;}

    /* ⑦ 手牌区**钉死在 #col-main 底部**（用户 2026-10-07 真机报障：
       「手牌区一直在往下移，导致超出现在的屏幕，抽牌堆和弃牌堆以及符文数和手牌都看不到」）。
       成因：`.battle` 是 `flex:0 0 auto`（:207 那条注释明令不许改成可缩），
       而它的**流内高度会随内容长**——敌人的 `.badges`（诅咒/力量/蓄力/记名/词缀…）
       每多一行 +18px，`#turn-summary` 有内容时再 +13px（折行能到 26px）。
       这些高度全部把 `.hand-area` 往下推，一旦越过视口底就被 `#app{overflow:hidden}` 裁掉，
       而且**连点都点不到**（出牌靠 elementFromPoint）。实测夹具没灌敌人徽章 ⇒ 正好卡在
       「余 ~11px」的临界，任何一枚徽章都会让手牌出屏。
       做法：把手牌区从纵向流里摘出来，钉在 #col-main 的底边 ⇒ 无论上面长多高，
       手牌 / 两个牌堆 / 符文数恒在屏内。`#col-main` 补 `position:relative` 当包含块，
       `height:100%` 是**必须**的：`#field` 是 `align-items:flex-start` 的行 flex，
       不给高度时 #col-main 会被内容撑成「只剩 .battle+summary 那么高」，手牌就浮到屏幕中间了。
       ⚠️ 只用 position，**绝不加 transform/filter**（红线：`.hand-area` / `#hand`
          一旦有那两个属性就成了 position:fixed 后代的包含块，会摧毁 #fx-layer 的视口坐标系）。 */
    #col-main{position:relative; height:100%;}
    .hand-area{position:absolute; left:0; right:0; bottom:0;}

    /* ⑧ 「回合回顾」条在这档直接不渲染 —— 本档纵向预算已经被吃干净（见上一条），
       而同一段文字 `js/30_engine.js` 已经逐字写进战报，左侧竖栏「战报」一键可达
       （与 :401 那条「不需要这么大的版位」是同一口径）。去掉它让出 13px 给战场，
       敌人的徽章行才有余量，不至于把手牌/意图顶到屏幕外。 */
    #turn-summary{display:none;}
  }

  /* ③ 「还有 N 张可打」不再出现在手机横屏战斗版面 —— 它与结束回合按钮同排挤在右下角，
     信息量只有「还能出几张」，是这轮「不重要的元素」名单里点名的那一条。
     只隐藏、不删元素：桌面档仍要看它，设置里的「结束回合软提示」开关也仍然有效
     （本块只覆盖 T-short）。它是 position:absolute ⇒ 隐藏对版面零影响。 */
  @media (max-height:560px){
    #end-turn-hint{display:none;}

    /* ⑦ 卡面分类标挪到卡片左下角：铭牌窗那条木带只留稀有度，类型进左下角的小墨牌。
       桌面档的卡片仍由铭牌窗显示「类型 · 稀有度」（.ct-type / .ct-sep / .ct-rar 三个 span
       拼出的文本与原来的 `${TNAME} · ${RNAME}` 逐字相同）⇒ 桌面逐像素不变。 */
    .card.has-frame .ctype .ct-type,
    .card.has-frame .ctype .ct-sep{display:none;}
    .ct-corner{display:block; position:absolute; left:2%; bottom:1.4%; z-index:3;
               font-size:7px; line-height:1; padding:1px 4px; border-radius:4px;
               background:rgba(42,33,25,.85); color:#d8bd82; letter-spacing:.5px;}
    /* 详情里的「完整信息」一行：见 60_boot.js renderTopbar() 的 statsDetail。 */
    .tb-detail .stat.stat-detail-full{display:inline-flex;}

    /* ⑧ 面板尾部的「返回/确认」按钮钉到**小窗**两上角。
       打标在 JS（50_ui.js ovMarkCornerBtns）：只有「末尾一串直接子级按钮 = 面板的全部
       直接子级按钮」的面板才拿到 ov-act-l/ov-act-r ⇒ 设置菜单/篝火选项屏/主菜单壳不受影响。
       左上 = 返回类（返回/放弃/跳过），右上 = 确认类（继续/离开/确定…），
       右上的第一枚必须给 close-x（34px 圆钮 + 间距）让位 ⇒ 从 right:52px 起往左排。
       ⚠️ v1.0.13：position 由 fixed 改成 absolute。fixed 相对**视口**，按钮会落到**屏幕**四角
          （用户 2026-10-05 报障：易物「放弃交换」跑到屏幕左上，而不是小窗左上）。
          absolute 的包含块 = 最近的定位祖先 = #overlayWrap（.panel/#overlayContent 是 static），
          与右上角 close-x 同一个祖先 ⇒ 自动落回**小窗**左/右上角，位置天然对齐。
       ⚠️ 按钮仍在文档流里留了原位置的空位 —— 小屏下面板内容往上贴，这点空位正好当底部留白。 */
    #overlayContent > .btn.ov-act-l{position:absolute; left:8px; top:8px; z-index:12; margin:0;}
    #overlayContent > .btn.ov-act-r{position:absolute; right:52px; top:8px; z-index:12; margin:0;}
    /* 同侧多枚（通关面板的「进入镇妖塔 + 再打一局」都在右上）⇒ 依次向下垛，不重叠。 */
    #overlayContent > .btn.ov-act-r ~ .btn.ov-act-r{top:52px;}
    #overlayContent > .btn.ov-act-r ~ .btn.ov-act-r ~ .btn.ov-act-r{top:96px;}
    #overlayContent > .btn.ov-act-l ~ .btn.ov-act-l{top:52px;}
    #overlayContent > .btn.ov-act-l ~ .btn.ov-act-l ~ .btn.ov-act-l{top:96px;}
    #overlayContent > .btn.ov-act-l, #overlayContent > .btn.ov-act-r{
      font-size:13px; padding:8px 14px; min-height:36px; border-radius:10px;}
    /* 锻造页（forge-scene）小窗是**全宽**的 ⇒ 按钮不占角，改左右两侧、垂直居中（用户 2026-10-05）。
       特异度(2,1,0) 高于上面那条(1,2,0) ⇒ 覆盖 top，无需 !important。 */
    #overlay.forge-scene #overlayContent > .btn.ov-act-l,
    #overlay.forge-scene #overlayContent > .btn.ov-act-r{top:50%; transform:translateY(-50%);}
  }

  /* ===================== v1.0.4 手机横屏：5 敌重排 + 召唤物筹码条折叠（新增覆写块） =====================
     用户 2026-10-02 第三轮：「僵王召唤了 4 个小僵尸，也就是 5 个敌人的时候怎么分布？我的建议
     还是参考 B（boss 在最右、小僵尸在它左侧排 2×2）」「加一个折叠按键，用来折叠召唤物」。

     为什么非改不可（640×360 实拍，夹具 _drvbt.js）：#player-panel 只占 96px ⇒ 敌区只有 484px，
     一行要 610px（boss 218 + 4×84 + 4×14）放不下 ⇒ flex 折成两行，而两行里**有一行是 boss**，
     行高 172px ⇒ .battle 涨到 300px、.hand-area 底落到 459 —— 越视口底 99px 被 #app 裁掉，手牌点不到。
     网格版式把 boss 折进**一列跨两行**，两行的行高就只剩召唤小怪的盒子高（≈92px），总高 ≈192。

     ⚠️ 判据在 JS（60_boot.js render 的 classList.toggle）：只有「恰 1 只 boss + 其余全是 summon 小怪
        + 按算出来的宽度装不下」才加这个类 ⇒ 844×390（一行放得下）与桌面档一个字都不变。 */

  /* —— ① 折叠键的**基档**：桌面档不出现（桌面看顶栏详情里的 .tb-summons，与改动前一致） ——
     ⚠️ 必须写在下面 media 块之前（同特异度靠书写顺序取胜）。 */
  .ps-fold{display:none;}
  /* v1.0.13：玩家立绘右侧的极简状态芯片（只留层数/数值，全名进 data-tip）。
     基档不显示 ⇒ 桌面档零改动（桌面看顶栏「详情」里的完整文字）。手机横屏档才打开。 */
  .pbuffs{display:none;}

  @media (max-height:560px) and (min-width:521px){
    /* ② 召唤物筹码条折叠键：挂玩家立绘右下角（.hero-art-box 是 position:relative）。
       ⚠️ 键与筹码条**不是二选一**：键上恒有预读「召 N · 伤 X · 挡 Y」（见 60_boot.js 的
          summonFoldLabel），点它才展开/收起筹码条 —— 用户口径「不论是否收起，增加一个召唤物的
          预伤害和预格挡的提示数值」。
       ⚠️ 筹码条展开时的样式**一个字未改**（本文件 :2196 那条），这里只决定渲不渲染（由 JS 决定）。
       ⚠️ `::after` 撑命中区（与 .tb-toggle 同一手法）：9px 字号的本体只有 ~16px 高，手指够不到。 */
    .ps-fold{display:inline-flex; position:absolute; left:100%; bottom:0; margin-left:2px; z-index:3;
             align-items:center; font-family:"Microsoft YaHei",sans-serif;
             font-size:9px; line-height:1.1; padding:1px 4px; border-radius:8px;
             background:rgba(42,33,25,.9); color:var(--gold); border:1px solid var(--gold);
             white-space:nowrap; cursor:pointer; -webkit-tap-highlight-color:transparent;}
    .ps-fold::after{content:""; position:absolute; inset:-5px -4px;}
    .ps-fold:active{background:var(--gold); color:#241a10;}

    /* v1.0.13：玩家增益/负面效果芯片 —— 挂在玩家立绘**右侧一点**（#player-panel 是 relative），
       只显示层数/数值，颜色区分增/减益，全名进 data-tip 的 kw 提示（沿用仓内 tooltip 约定）。
       ⚠️ 该档顶栏详情默认收起（TOPBAR_OPEN=false）⇒ buff 原本看不见，这里是补缺口。
       ⚠️ 与 .psummons 同列：本块贴顶(2px)、筹码条垂直居中(50%)，纵向错开不打架。
       左右只离开立绘 6px、限宽 min(108px,22vw)，避免过度靠右遮挡敌人。
       ⚠️ v1.0.14：绝对定位 + 只给 left 时宽度是 shrink-to-fit，实测**每枚占一行**（宽仅 18px、
          12 枚能长到 200px 高，会压到垂直居中的筹码条）。改成给**显式宽度**让芯片并排换行：
          12 枚最多 3~4 行（≈50~70px），永远够不到筹码条那一行。 */
    .pbuffs{display:flex; position:absolute; left:calc(100% + 6px); top:2px; z-index:3;
            flex-wrap:wrap; align-content:flex-start; gap:2px; width:min(108px,22vw);}
    .pbuff{font-size:10px; line-height:1.1; min-width:14px; padding:1px 5px; border-radius:8px;
           text-align:center; white-space:nowrap; background:rgba(42,33,25,.9);
           color:var(--c,#d8bd82); border:1px solid var(--c,#d8bd82);}

    /* ③ 网格版式：召唤小怪在左侧 2×2，boss 独占最右一列、跨两行。
       ⚠️ `grid-row:1 / span 2` **不能**写成 `1 / -1` —— 行是隐式的，`-1` 只指向显式网格的
          最后一条线，没有显式行时它就是第 1 条线 ⇒ 跨度塌成 1 行、boss 被挤成一行高。
       ⚠️ justify-content:end 才能让「内容整体靠右」= boss 贴右边缘（基档是 flex-start 的 row-reverse）。 */
    #enemy-panel.ep-grid{display:grid; grid-template-columns:auto auto auto;
                         justify-content:end; align-content:end; align-items:end;
                         column-gap:14px; row-gap:8px;}
    #enemy-panel.ep-grid > .enemy.e-boss{grid-column:3; grid-row:1 / span 2; align-self:center;}
    /* 弧线位移在网格里没有意义（位置由网格给）⇒ 归零。
       ⚠️ 必须 !important：--ex/--ey 是 JS 写的**内联**样式，内联打不过的只有 !important。
         不去改 `.enemy{transform}` 是因为受击/死亡关键帧里的 transform 还要照常叠加。 */
    #enemy-panel.ep-grid .enemy{--ex:0px !important; --ey:0px !important;}
    /* 纵深变暗同理：`edepth` 是按弧线秩（ey>0）判的，网格里没有纵深 ⇒ 摘掉变暗，
       否则 2×2 里会有一半小僵尸是灰的、看起来像「另一档敌人」。 */
    #enemy-panel.ep-grid .enemy.edepth .eportrait{filter:none;}
    #enemy-panel.ep-grid .enemy.edepth .ename{opacity:1;}

    /* ④ 召唤小怪收成「小方章」：两行的行高预算只有 ~95px（=199 预算 − 8 行长间隔，两行平分）。
       实测拆解（640×360 夹具）：立绘 44+2 + 名字 12+1 + 生命 13 + 血条 6 + 徽章 0+1 + 意图 22 = 102 ——
       其中两笔是「白花」的：`.stat b` 在 T-short 档是 12px（比 `.stat` 的 10px 还大，把行撑到 13px）、
       `.intent` 在 84px 宽里**折成了两行**（22px）。这两笔收掉之后 ≈ 85px，两行 180+8 = 188 ≤ 199。
       ⚠️ 只动 .e-summon：boss 在网格里保持原尺寸（它的 172px 由 188 兜住）。 */
    #enemy-panel.ep-grid .enemy.e-summon .eportrait{height:44px; margin-bottom:0;}
    #enemy-panel.ep-grid .enemy.e-summon .ename{font-size:11px; line-height:1.1; margin-bottom:1px;}
    #enemy-panel.ep-grid .enemy.e-summon .stat{font-size:10px; line-height:1.1;}
    #enemy-panel.ep-grid .enemy.e-summon .stat b{font-size:10px;}
    #enemy-panel.ep-grid .enemy.e-summon .enemyhpbar{height:6px;}
    #enemy-panel.ep-grid .enemy.e-summon .badges{margin-top:0; gap:2px;}
    #enemy-panel.ep-grid .enemy.e-summon .badge{font-size:8px; padding:0 4px;}
    /* v1.0.17：召唤物网格是全场最挤的一处（84px 宽），图标同样保持「相对本档字号 2×」= 16px。 */
    #enemy-panel.ep-grid .enemy.e-summon .badge .bicon{width:16px; height:16px; vertical-align:-3.5px;}
    #enemy-panel.ep-grid .enemy.e-summon .intent .bicon{width:22px; height:22px; vertical-align:-5.5px;}
    /* v1.0.14：意图已是「图标 + 数字」（intentChip），84px 宽里一行放得下 ⇒ 字号从 9px 回到 11px。 */
    #enemy-panel.ep-grid .enemy.e-summon .intent{font-size:11px; line-height:1.15; margin-top:1px;}
    #enemy-panel.ep-grid .enemy.e-summon .intent::before{content:none;}
    /* 热区：网格里两行只隔 8px，基档 ±18px 的伪元素会让上下两行**互相抢点击** ⇒ 收到 ±2px
       （T-short 那条写的是 width:max(100%,84px)，这里只收纵向，横向不动）。 */
    #enemy-panel.ep-grid .enemy::after{top:-2px; bottom:-2px;}
  }

  /* ===================== v1.0.8 手机横屏：圆角避让 + 卡名一行 + 详情浮层（新增覆写块） =====================
     来源 = 用户 2026-10-03 真机（1016×471 TapTap H5）三条反馈：
       ①「大部分手机不是正规的矩形而是圆角的，四个角落都尽量别放按键信息以及版本号」；
       ②「卡名放到牌面顶部后会显示不完全，而且不是一行排列」；
       ③「展开/收起详情时战斗场上下来回移，手牌区卡牌底部有一小部分超出屏幕底，
          抽牌堆、弃牌堆和符文数也一起下沉出屏」。
     ⚠️ 本块只覆盖手机档；桌面档逐像素不变（唯一的 base 改动是 `.cname` 的
        `white-space:nowrap`，而桌面卡宽 132px 时四字牌名本来就有余量，加了不变样）。 */
  @media (max-height:560px){
    /* ③ 顶栏详情改**绝对定位浮层** —— 顶栏高度恒定，展开/收起再不推动下方战场。
       成因：#app 是 flex 列（#topbar `flex:0 0 auto`、#field `flex:1 1 auto`），
       而 .tb-detail 是顶栏的**流内**子项 ⇒ 展开时顶栏长高、#field 被压、内容整体下移，
       #app{overflow:hidden} 再把底部裁掉 —— 手牌底、两个牌堆、符文数就是这么出屏的。
       ⚠️ z-index 必须 2200（> #player-panel 的 2100），否则浮层会被立绘压住；
       ⚠️ #topbar 必须 position:relative 才当得了包含块（对 h1 的层叠关系不变：
          h1 有 z-index:2，顶栏仍是 auto ⇒ 标题字照旧压在顶栏底板之上）。 */
    #topbar{position:relative;}
    .tb-detail{position:absolute; left:0; right:0; top:100%; z-index:2200;
      background:var(--ink2); border:1px solid var(--ink3); border-top:0;
      border-radius:0 0 8px 8px; padding:4px 8px; box-shadow:0 6px 14px rgba(0,0,0,.55);}

    /* ④ v1.0.17b：浮层里的灵汁芯片防误触（用户口径「详情打开后，灵汁布局有点拥挤，
       而且图标有点小，容易导致误触」）。原状：芯片只有 1px 内缝 + 5px 右距、图标走
       基档 `.stat .bicon` 的 24px，相邻两枚的命中区只差 6px ⇒ 想点一枚常打中旁边那枚。
       ⇒ 只在本档浮层内放大：图标 24 → 30px、芯片加内边距 + 圆角底色（把命中区画出来）、
         右距拉到 10px；`.stat-potion` 自身再允许换行，灵汁一多也不会挤成一条溢出。
       ⚠️ 选择器 `.tb-detail .potion-chip .bicon`（0,3,0）压得住基档 `.stat .bicon`（0,2,0），
          不需要 !important；只覆盖 T-short 档，桌面档逐像素不变。 */
    .tb-detail .stat-potion{flex-wrap:wrap; row-gap:4px;}
    .tb-detail .potion-chip{gap:3px; margin-right:10px; padding:2px 7px; border-radius:7px;
      background:rgba(200,107,216,.13);}
    .tb-detail .potion-chip .bicon{width:30px; height:30px; vertical-align:-7px; margin-right:0;}
    .tb-detail .potion-chip b{font-size:14px;}

    /* ② 卡名压成一行：这档手牌卡宽只有 clamp(74px,19vh,118px)（471 高时 ≈89px、
       360 高时被 74px 下限咬住），「图窗上沿标题带」宽 75.32% ⇒ 640×360 时只剩 ≈56px，
       而 base 的左右内边距 14+20=34px 只剩 22px 可用 ⇒ 四字牌名必然折行、第二行被
       overflow:hidden 切掉（这正是用户报的「显示不完全、不是一行」）。
       ⇒ 字号跟**卡宽**走：clamp(8px, var(--card-w)×0.105, 10.5px)。
          74px 卡 → 8px，89px 卡（1016×471 真机）→ 9.4px，109px 及以上 → 10.5px。
          ` ↑`（升级标）白白吃掉 ≈1.5em（空格 0.25em + 箭头 1.25em）—— 4 字名 + ↑ 就是
          5.5em，硬塞不进窄卡 ⇒ 再把它压到 0.6em、并用 word-spacing 把那个空格收掉
          （CJK 字间无空格，word-spacing 只影响牌名与箭头之间那一个空格）。
          ⚠️ var() 必须带兜底 96px：`--card-w` 只定义在 #hand 上，鬼市/锻造/奖励那些
             `.card.has-frame` 在 #overlay 里读不到它，没兜底会整条 font-size 失效
             （96px×0.105=10.08 落在上限内，与既有的 10.5px 视觉近似）。
       ⚠️ 左内边距不能小于 ~17px：费用币压在 left:3.6%、径 23px（74px 卡上占到 25.7px），
          而标题带左沿在 11.69%（8.6px）⇒ 文字起点至少要 17px 才不压到币上（币的 z-index
          相同但 DOM 在后，会盖住牌名首字）。 */
    .card.has-frame .cname{font-size:clamp(8px, calc(var(--card-w, 96px) * 0.105), 10.5px);
      padding:0 0 0 17px; word-spacing:-0.15em;}
    .card.has-frame .cname span:not(.noup){font-size:0.6em;}
    /* v1.0.19：本档 padding-left 覆写成 17px ⇒ 升级标箭头左沿跟着挪到 17px
       （见基档 `.card.has-frame .cname .up-mark` 的推导：必须避开费用币、又不能压到居中牌名）。 */
    .card.has-frame .cname .up-mark{left:17px;}
  }

  @media (max-height:560px) and (min-width:521px){
    /* ① 左上角常驻信息避让圆角（R≈50~60 时贴角会被裁掉）：
       #ver-tag 从 (6,2) 挪到 (26,24)。下移是**必要**的 —— 角点附近（x<R 且 y<R）的
       可见判据是 (x−R)²+(y−R)² ≤ R²，y=2 时无论 x 取多少都落在裁切区；y=24 之后
       R≤85 都安全。x=26 落在「h1 的 50px 左内边距」之内，不与「志 怪 塔」撞上。
       （竖栏 .title-actions 的 top 已在本档原位改成 48，见上面的说明。） */
    #ver-tag{top:calc(24px + env(safe-area-inset-top,0px)); left:calc(26px + env(safe-area-inset-left,0px));}
    /* ② 手牌描述区随卡宽缩放字号 —— 与上面的 .cname 同套路、同 96px 兜底。
       病根：.cdesc 字号是**基档写死的 9.5px/1.25**（L583），不随 --card-w 缩；
       而手机横屏档（1016×471）卡盒只有 89×136，铭牌窗 clientH≈38、.cdesc 可用高≈34px，
       10/10 张牌全被静默截断（雷符 36、金刚符 48、渡魂归己 59 都 >34）。
       实测 7.5px/1.15 即 0/10 溢出（8px 两档仍 4/10）。
       限定 min-width:521px 以免覆盖 ≤520 / ≤360 两档已有的字号（L1549 / L1634）。 */
    .card.has-frame .cdesc{font-size:clamp(7.5px, calc(var(--card-w, 96px) * 0.085), 9.5px);
      line-height:1.15;}
  }

  /* ① 主菜单右上角符纸行：宿主胶囊探不到时（--sys-cap-r:0）它会贴到右上圆角上，
     再加一道纵向避让（10px 在构图上不可见，却足以把 R=50 的裁切完全避开）。 */
  @media (max-height:560px){
    .menu-row-talis{top:calc(10px + env(safe-area-inset-top,0px));}
  }
</style>
</head>
<body>
<div id="ver-tag">V1.0.0</div>
<div id="float-msg"></div>
<div id="turn-banner"></div>
<div id="boss-intro"></div>
<div id="scene-veil"><div class="veil-ink"></div></div>
<div id="rotate-tip"><div class="rt-ico">▯</div><div class="rt-main">请 横 屏</div><div class="rt-sub">《志怪塔》是横屏游戏，把手机转过来即可继续</div></div>
<div id="achieve-toast"></div>
<img id="bg" alt="" style="display:none">
<div id="app">
  <h1 class="title">志 怪 塔 <small>· 玩法原型</small><span class="title-actions"><button class="btn ghost" id="logToggle">战报</button><button class="btn ghost" id="viewDeck">牌库</button><button class="btn ghost" id="menuBtn">菜单</button></span></h1>
  <div id="topbar"></div>
  <div id="field">
    <div id="log"></div>
    <div id="col-main">
      <div class="battle">
        <div id="player-panel"></div>
        <div id="enemy-panel"></div>
      </div>
      <div id="turn-summary"></div>
      <div class="hand-area">
        <!-- v0.69.0：抽牌堆 / 弃牌堆。顶面与侧棱的图地址由 pileInit()（js/10_audio.js）
             用 assetURL() 写进 --pile-back-img / --pile-side-img —— **这里不能写
             <img src="素材/…">**：打包后路径全变，且 verify_dist.py 的 _css_urls / 图片闸会红。 -->
        <div class="pile pile-discard" id="pile-discard" title="弃牌堆">
          <div class="pile-slab"></div><div class="pile-slab"></div><div class="pile-slab"></div>
          <div class="pile-face"></div>
          <span class="pile-n" id="pile-discard-n">0</span>
        </div>
        <div class="rune-display" id="rune-display">
          <img src="素材/rune.png" class="rune-icon" onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
          <span class="rune-fallback">◆</span>
          <span class="rune-count" id="rune-count">3</span>
        </div>
        <div id="hand"></div>
        <div class="endcol">
          <div id="end-turn-hint" class="off"></div>
          <button class="btn" id="endTurn">结束回合</button>
        </div>
        <div class="pile pile-draw" id="pile-draw" title="抽牌堆">
          <div class="pile-slab"></div><div class="pile-slab"></div><div class="pile-slab"></div>
          <div class="pile-face"></div>
          <span class="pile-n" id="pile-draw-n">0</span>
        </div>
      </div>
      <div class="hint">点击/上拖出牌 · 攻击牌按住拖箭头指向敌人 · 长按卡牌放大描述 · 空格=结束回合 · 悬停金色词看说明</div>
    </div>
  </div>
</div>

<div id="overlay" class="hidden">
  <div id="overlayWrap">
    <div class="panel" id="overlayContent"></div>
    <button id="overlayCloseX" class="close-x" onclick="closeOverlay()">✕</button>
  </div>
</div>

<script src="js/00_base.js"></script>
<script src="js/10_audio.js"></script>
<script src="js/20_data.js"></script>
<script src="js/30_engine.js"></script>
<script src="js/40_flow.js"></script>
<script src="js/50_ui.js"></script>
<script src="js/55_cloud.js"></script>
<script src="js/60_boot.js"></script>
</body>
</html>
