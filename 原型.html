<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
<title>志怪塔 · 原型 v0.71.0</title>
<style>
  :root{
    --ink:#171310; --ink2:#221c17; --ink3:#2c251e;
    --paper:#efe3c8; --paper2:#d9c9a8; --text:#ece1cb; --dim:#9a8f78;
    --red:#b23b2e; --red2:#8c2b21; --gold:#e0b341; --green:#3fa060;
    --white:#cfc5b2; --blue:#6ea8d8; --purple:#b07fd8;
    --font-kai:"KaiTi","STKaiti","华文楷体","楷体","Noto Serif SC",serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  /* v0.71.0 整页上锁 —— 用户点名的「严重问题」：界面永远不能上下滑。
     原先 html 根本没有规则，body 只有 min-height:100vh/100dvh + overscroll-behavior:none
     （那两条都**不阻止滚动**），#app 纯自然高度 ⇒ documentElement 一律可滚。
     ⚠️ 用 height:100% 而**不是** min-height:100dvh：
        dvh 在手机地址栏收放时会跳变，body 跟着长高 ⇒ 「上锁了却还能滑」又回来。
        html/body 的 100% 走的是初始包含块（固定视口），不随地址栏变。
     ⚠️ html 也铺底色：手机地址栏收起时 body 下沿会露出 ~几十 px，
        不铺就是一条白边。
     ⚠️ 这一条只禁掉**视口层面**的滚动，不改任何版面 ——
        各个面板自己的内部滚动（.panel / 图鉴 / 地图 / 锻造 / 战报）全部照旧。 */
  html{height:100%; background:#120e0b;}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif; color:var(--text); height:100%; min-height:0; overflow:hidden;
    background:
      radial-gradient(circle at 15% 12%, rgba(178,59,46,.10), transparent 40%),
      radial-gradient(circle at 85% 8%, rgba(224,179,65,.06), transparent 35%),
      linear-gradient(180deg, #241d16 0%, var(--ink) 30%, #120e0b 100%);
    background-attachment:fixed;
    touch-action:manipulation; overscroll-behavior:none; -webkit-user-select:none; user-select:none;}
  /* v0.71.0：`#app` 变成**定高弹性列** —— 上锁之后还得「装得下」，光裁不装等于把用户
     看不到的东西藏起来（用户要的是「显示完整」）。三件事缺一不可：
       height:100%      —— 钉死在视口高；body 已上锁，这里不会溢出
       flex column      —— 让 #field 成为唯一可伸缩的那一项，把余量/亏空都吃掉
       overflow:hidden  —— 最后一道：万一仍超出，裁掉而不是长出滚动条
     ⚠️ 加了 display:flex 之后 margin 不再折叠，实测 h1(6px) / #topbar(10px) 的
        下边距本来就是相邻同向、折叠与否都一样，所以基准档间距零变化。 */
  #app{max-width:1060px; margin:0 auto; padding:10px 14px 8px; position:relative; z-index:1;
       height:100%; display:flex; flex-direction:column; overflow:hidden;}
  @media (max-width:520px){ #app{padding:6px 6px 24px;} }
  /* v0.68.2：`body.at-menu` = "屏幕背后是主菜单，不是战局" ⇒ 整个战斗界面（#app）不渲染。
     ⚠️ 这条是实拍抓出来的，不是推理出来的：`_drvmenu3.js --q "&pull=300&anim=1&at=250"`
        那一帧里，卷轴面板四周明明白白透出**战斗 HUD**（结束回合按钮、红色灵气珠「3」、出牌提示行）。
     根因不在本批 —— `#app` 从开局起就一直挂在 DOM 里、z-index:1 压在 #bg 之上；v0.65.0 之前
        **全靠主菜单那层不透明底盖住**才看不见。而图鉴/排行榜/设置走的是普通半透明底，
        `.menu-scene` 一摘，战斗界面就露出来了 —— 偏偏这正是用户点名要做的那条交互路。
     ⚠️ 为什么不做在「#overlay 挂 menu-scene 时」：那层底会被 showOverlay 摘掉（图鉴要的就是
        摘掉它），而"背后有没有战局"这件事跟当前开的是哪个面板无关 —— 挂在 body 上才与面板解耦。
     ⚠️ 为什么不用 display:none 之外的办法：`#app` 里全是会自己跑的东西（飘字定时器、
        震屏 class、血条宽度过渡），visibility:hidden 会让它们继续算，纯属白烧。
     ⚠️ 唯一写入口是 setBg（见 js/10_audio.js）—— 它本来就是"背后该铺什么"的owner：
        setBg('menu') 亮起，其余任何一张背景（actN / map / camp 三种）都清掉。**风险为零**：
        战局里每一次进战斗、进地图都必经 setBg，卡在 at-menu 只可能是"人确实在主菜单"。
     安全网：continueRun 落进 camp/shop/unknown 三支时不经过 setBg，故在那三支前显式清一次。 */
  body.at-menu #app{display:none;}
  h1.title{flex:0 0 auto; font-family:var(--font-kai); font-size:28px; letter-spacing:6px; color:var(--gold); margin-bottom:4px; text-align:center; text-shadow:0 0 18px rgba(224,179,65,.25); position:relative;}
  h1.title small{color:var(--dim); font-size:12px; letter-spacing:0; font-family:"Microsoft YaHei",sans-serif;}

  #topbar{flex:0 0 auto; display:flex; flex-wrap:wrap; gap:10px; align-items:center; background:var(--ink2); border:1px solid var(--ink3); border-radius:10px; padding:7px 14px; margin-bottom:6px;}
  .stat{font-size:14px;}
  .stat b{color:var(--gold); font-size:16px;}
  .stat-xuenu b{color:var(--red);}
  /* v0.61.37：赶尸人尸气数字走紫色（原先吃通用金色 .stat b，与阴差有专属色不对称） */
  .stat-shiqi b{color:#b98bff;}
  /* 预尸气：紧挨「尸气: N/12」的紫色小标 —— 下回合召唤物将带来的尸气进账。0 时不渲染（同预格挡口径） */
  .stat-preshiqi{display:inline-block; margin-left:4px; font-size:12px; font-weight:bold; color:#b98bff; border-bottom:1px dashed rgba(185,139,255,.55); cursor:help;}
  .hpbar,.enemyhpbar{width:150px; height:12px; background:#000; border:1px solid var(--ink3); border-radius:6px; overflow:hidden; display:inline-block; vertical-align:middle; position:relative;}
  .hpbar i,.enemyhpbar i{position:absolute; left:0; top:0; height:100%; display:block; transition:width .4s cubic-bezier(.22,1,.36,1);}
  .hpbar i.hpfill,.enemyhpbar i.hpfill{background:var(--red);}
  .hpbar i.hpghost,.enemyhpbar i.hpghost{background:rgba(255,206,130,.45); transition:width .85s ease-out .15s;}
  /* 格挡时水晶蓝血条 */
  /* v0.61.20(P9)：有格挡时血条套一层「斜纹护罩」纹理 —— 不再是纯色替换，灰度下仍看得出底下是血 */
  #player-panel .hpbar.has-block .hpfill{background:repeating-linear-gradient(45deg,#5bb8d8 0 3px,#3a9cc0 3px 6px); box-shadow:0 0 6px rgba(90,180,210,.4);}
  #player-panel .hpbar.has-block .hpghost{background:rgba(160,210,240,.35);}
  .hp-label{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:bold; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.7); z-index:1; pointer-events:none;}
  /* 血条下方数值（血量+格挡） */
  .pstats{display:flex; gap:10px; justify-content:center; margin-top:3px; font-size:13px; font-weight:bold;}
  .pstat-hp,.pstat-block{display:inline-flex; align-items:center; gap:3px;}
  .pstat-hp i,.pstat-block i{display:inline-block; width:9px; height:9px; border-radius:50%;}
  .pstat-hp{color:#e8d9c4;} .pstat-hp i{background:var(--red);}
  .pstat-block{color:#bfe6f5;} .pstat-block i{background:repeating-linear-gradient(45deg,#7fd0e8 0 2px,#2f7f9c 2px 4px); border-radius:2px;}
  /* 预格挡：紧挨格挡标记的蓝色向上箭头，箭头 9×11px（与格挡圆点 9px 同宽，不抢视线） */
  .pstat-preblock{display:inline-flex; align-items:center; gap:2px; color:#8ed0ff; font-size:11px; line-height:1;}
  .pstat-preblock svg{display:block; width:9px; height:11px; filter:drop-shadow(0 0 3px rgba(74,168,255,.6));}
  /* 玩家面板遗物 */
  .player-relics{display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
  .prelic-chip{display:inline-flex; align-items:center; gap:3px; background:rgba(224,179,65,.08); border:1px solid var(--ink3); border-radius:6px; padding:2px 6px 2px 2px; cursor:default;}
  .prelic-chip .ricon{width:24px; height:24px; margin:0; border-radius:4px;}
  .prelic-chip .prelic-name{font-size:10px; color:var(--gold); white-space:nowrap;}
  /* 锻造页：升级无变化的牌置灰、不可锻造 */
  .card.locked{filter:grayscale(1) brightness(.88); opacity:.55; cursor:not-allowed;}
  .card.locked:hover{transform:none;}
  .card.locked .cost{background:var(--ink3);}
  .noup{font-size:9px; color:var(--dim); border:1px solid var(--ink3); border-radius:6px; padding:0 4px; margin-left:4px; vertical-align:middle; white-space:nowrap;}
  .tb-summons{display:flex; flex-wrap:wrap; gap:6px; flex-basis:100%;}
  /* 顶栏 stat 图标替换 */
  .stat-hp i,.stat-block i,.stat-gold i{display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:2px; vertical-align:middle;}
  .stat-hp i{background:var(--red);}
  /* v0.61.20(P9)：色弱可辨 —— 格挡用「斜纹 + 方角」，血条用「纯色 + 圆点」。灰度打印/色弱下靠纹理与形状也能分开 */
  .stat-block i{background:repeating-linear-gradient(45deg,#7fd0e8 0 2px,#2f7f9c 2px 4px); border-radius:2px;}
  .stat-gold i{background:var(--gold);}
  .stat-level{color:var(--dim);}
  .stat-deck{color:var(--dim);}
  .stat-deck b{color:var(--dim);}

  /* ⚠️ `align-items:flex-start` **不许改成 stretch**：基准档 #log 曾经靠它 + sticky
     钉在顶部，现在 #log 已改 fixed 不再受影响，但 .battle / #player-panel 的对齐
     仍吃这条（改成 stretch 会把玩家面板拉到与敌人面板等高，整块下移）。 */
  #field{display:flex; gap:14px; align-items:flex-start; flex:1 1 auto; min-height:0;}
  /* 弹性列的第二段：`#col-main` 吃掉 #field 的全部余量，内部再按「敌人区可缩、
     手牌与提示行不可缩」分配。min-height:0 是**必须**的 —— 少了它 flex 子项
     不会缩到内容高以下，上面那层的 overflow:hidden 就白写（项目里已有三处
     正确示范：.map-scroll / .map-frame / .map-viewport）。 */
  #col-main{flex:1 1 auto; min-width:0; min-height:0; display:flex; flex-direction:column;}
  /* ⚠️ `.battle` 是 `flex:0 0 auto`（**不许**改成可缩的 1 1 auto）：
     它内部 `align-items:flex-end` ⇒ 一旦被压到比敌人矮，敌人的**头**会从 .battle
     顶边戳出去，而 #topbar 是 static、绘制顺序在前 ⇒ 敌人直接盖在顶栏上，
     再被 #app{overflow:hidden} 裁掉一截。要省高度只能缩立绘本身（见矮屏档的
     clamp 那套），不能靠压缩容器。 */
  .battle{display:flex; gap:14px; align-items:flex-end; margin-bottom:2px; flex:0 0 auto;}
  #player-panel{flex:0 0 200px; background:transparent; border:none; border-radius:0; padding:0; text-align:center; display:flex; flex-direction:column; align-items:center; position:relative; z-index:2100;}
  .hero-art-box{width:100%; height:186px; margin-bottom:4px; border-radius:0; overflow:visible; background:transparent; display:flex; align-items:flex-end; justify-content:center; position:relative;}
  .hero-art-box::after{content:''; position:absolute; bottom:-2px; left:8%; right:8%; height:3px; background:radial-gradient(ellipse at center, rgba(224,179,65,.28), transparent 80%); pointer-events:none; border-radius:50%;}
  .hero-art-box .hero-art{width:auto; height:100%; max-width:100%; object-fit:contain; object-position:bottom center; display:block; filter:drop-shadow(0 8px 16px rgba(0,0,0,.55)); transition:transform .15s ease, filter .15s ease;}
  /* 角色动画状态（为后续攻击/受击动画预留） */
  .hero-art-box.hero-attack .hero-art{transform:translateX(18px) scale(1.05); filter:drop-shadow(0 8px 16px rgba(0,0,0,.55)) brightness(1.2);}
  .hero-art-box.hero-hit .hero-art{animation:heroHit .35s ease;}
  .hero-art-box.hero-cast .hero-art{filter:drop-shadow(0 0 22px rgba(224,179,65,.8)) brightness(1.3);}
  @keyframes heroHit{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
  .hero-emoji{font-size:72px; opacity:.35;}
  .pname{font-family:var(--font-kai); font-size:19px; color:var(--gold); letter-spacing:2px; margin-bottom:8px;}
  .pmech{display:inline-block; font-size:12px; color:var(--gold); background:rgba(224,179,65,.08); border:1px solid var(--ink3); border-radius:20px; padding:2px 10px; margin-bottom:8px; letter-spacing:1px; cursor:default;}
  .prow{font-size:13px; color:var(--dim); margin:3px 0;}
  .prow b{color:var(--gold); font-size:15px;}
  #player-panel .hpbar{width:100%; margin:4px 0;}
  #player-panel .badges{justify-content:center;}
  .prelics{font-size:11px; color:var(--gold); margin-top:8px; line-height:1.8;}
  /* v0.70.0：净空与后排上抬幅度改成**从 CSS 读的数**，不再由 JS 写死。
     为什么必须改：原先 JS 直接写 `_epEl.style.paddingTop`（内联样式），
     而内联样式 CSS 打不过（除非 !important）⇒ 矮屏档没法把它归零，
     5 个敌人时这 62px 会白吃掉矮屏预算的两成。
     现在 JS 只写 `--headroom`，矮屏档写一条同特异度、书写更后的
     `#enemy-panel{padding-top:2px}` 就能盖掉，**JS 完全不需要知道当前是哪个档**。
     `--rise-unit` 同理：它是后排敌人上抬幅度（RISE_LIFT）的**倍率**，
     基准档 =1（与今天逐像素相同），矮屏档压小。
     ⚠️ RISE_LIFT 数组与 battleHeadroom() 本身一个字都不能动 ——
        冒烟逐条钉死了 0/42/60/20 与 max(RISE_LIFT[i%len])，倍率只能加在调用点。 */
  :root{--rise-unit:1;}
  /* ⚠️ isolation:isolate 不是装饰，是**层叠闸**。
     每个 .enemy 带**内联** `z-index:2000-上抬量`（js/50_ui.js 的 refreshRiseK 那一段，
     用来让后排压前排）。1500+ 级别的内联 z-index 在**同一个层叠上下文**里会完胜
     #log(9) 和 #hand(1) ⇒ 抽屉一开，战报栏和手牌都被敌人盖住
     （用户实机报的「战报背景是透明的、字和敌人重叠、卡牌盖不住敌人」就是这一条，
      不是背景色问题 —— #log 的背景是实心 var(--ink2)）。
     isolate 把内部那个 2000 关在自己家里，只在**敌人之间**排序，对外整体落到 0 级。
     ⚠️ 不许改成 position:relative+z-index —— 那会改 .enemy::after 热区的定位解析链。 */
  #enemy-panel{isolation:isolate; display:flex; flex-direction:row-reverse; flex-wrap:wrap; justify-content:flex-start; align-items:flex-end; gap:24px 30px; flex:1 1 auto; min-width:0; padding:var(--headroom,2px) 2px 0;}
  .enemy{position:relative; background:transparent; border:none; border-radius:0; padding:0; cursor:pointer; display:flex; flex-direction:column; align-items:center; text-align:center; flex:0 0 auto; min-width:0; transition:filter .12s ease; -webkit-tap-highlight-color:transparent;}
  /* v0.61.20(P7)：触屏下用伪元素把点击热区撑到 ≥120px 宽、上下各多 18px。
     伪元素不参与 DOM，elementFromPoint 仍返回宿主 .enemy，所以 enemyAtPoint() 一行不用改。
     只在 (pointer:coarse) 或窄屏生效 —— 桌面用鼠标，热区变大反而会让相邻敌人互相抢点击。 */
  @media (pointer:coarse), (max-width:760px){
    .enemy::after{content:""; position:absolute; left:50%; transform:translateX(-50%); top:-18px; bottom:-18px; width:max(100%,120px);}
  }
  .enemy.e-summon{width:92px;}
  .enemy.e-normal{width:184px;}
  .enemy.e-elite{width:280px;}
  .enemy.e-boss{width:372px;}
  /* v0.71.0：立绘高度换成**一条 vh 连续公式**，取代原来写死的四个定值。
     为什么非改不可（无头实拍，`--headroom` 与灌满的战报都在位的满负荷场景）：
     基档（>700）原来四个高度全是定值、**视口再矮也不缩**，于是 boss 单只（372px）
     把 1280×720 顶穿 **117px**、精英+小怪顶穿 89px，而且溢出一直拖到 vh≈860 才归零
     （1366×768 顶穿 ≈70px）。整页上锁之后这些多出来的像素**不再变成滚动条**，
     而是被 #app 直接裁掉 —— 那正是用户点名要消灭的状态换了个样子回来。
     公式与原来 T-mid 那条同构，但**锚点从 700 抬到 880**：
        calc(基档值 + (100vh - 880px) × k)
     vh ≥ 880 时它算出 ≥ 基档值，被 clamp 上界压回基档值 ⇒
     **1920×1080 与 1440×900 逐像素不变**（只有 701–860 这一段会缩）。
     斜率按基数等比（k = 0.871 × 基档值 ÷ 372）⇒ 缩的是**整族**，
     体型差 boss:elite:normal:summon = 1:0.75:0.5:0.25 在任何视口都保住。
     下限同样近似等比（≈0.26 倍），只在 vh<600 才生效。
     ⚠️ 这四条**同时管基档与 T-mid**（T-mid 原来那四条已删）—— 两档必须共用同一个函数。
        各写一套的话，vh=701 与 vh=700 会算出差上百像素的两个值，拖窗口时敌人瞬间胀缩。
     ⚠️ 别再退回「每个档一套台阶写法」：那正是这四条的成因。 */
  .enemy .eportrait.e-summon{height:clamp(24px,calc(93px + (100vh - 880px)*0.2178),93px);}
  .enemy .eportrait.e-normal{height:clamp(48px,calc(186px + (100vh - 880px)*0.4355),186px);}
  .enemy .eportrait.e-elite{height:clamp(73px,calc(280px + (100vh - 880px)*0.6555),280px);}
  .enemy .eportrait.e-boss{height:clamp(97px,calc(372px + (100vh - 880px)*0.871),372px);}
  .enemy .enemyhpbar{width:134px;}
  .enemy.e-elite .enemyhpbar{width:194px;}
  .enemy.e-boss .enemyhpbar{width:262px;}
  .enemy.edepth .eportrait{filter:brightness(.86) saturate(.9) drop-shadow(0 4px 8px rgba(0,0,0,.4));}
  .enemy.edepth .ename{opacity:.72;}
  .enemy.selected .eportrait{filter:drop-shadow(0 8px 16px rgba(0,0,0,.6)) drop-shadow(0 0 14px rgba(224,179,65,.6)) brightness(1.12);}
  .enemy.selected .ename{color:#ffd76a;}
  .enemy .ename{font-family:var(--font-kai); font-size:19px; color:var(--red); letter-spacing:2px; margin-bottom:6px;}
  .badges{margin-top:6px; display:flex; flex-wrap:wrap; gap:6px;}
  .badge{font-size:12px; padding:2px 8px; border-radius:20px; border:1px solid var(--ink3); color:var(--dim);}
  .badge.curse{color:#c86bd8;} .badge.charm{color:#e06b9b;} .badge.strength{color:#e08b3a;} .badge.seal{color:#3ac0c0;} .badge.thorns{color:#e06b6b;} .badge.affix{color:#e0b060;} .badge.ybtarget{color:#ffd76a; border-color:rgba(255,215,106,.7); background:rgba(255,215,106,.12);}
  .intent{margin-top:8px; font-size:14px; color:var(--gold);}
  .intent::before{content:"⚠ 意图："; color:var(--dim);}
  .summon{font-size:12px; padding:3px 10px; border-radius:16px; border:1px solid var(--gold); color:var(--gold); background:rgba(224,179,65,.08);}
  /* v0.61.41：节点不再是「带边框的按钮」，而是「图标 + 小字」—— 原边框/底色/圆角/内边距全部去掉。
     三档线的语义不变：暗线=可选→下一层可见格、金虚线=上一步→现在能走、已走=淡黄色浅光边。
     注：v0.61.41 那一版把路径换成了用户给的道路贴图，v0.61.42 已按用户要求改回代码自绘。 */
  /* v0.61.42：路径回到「代码自绘」，并做出**淡黄色浅光边沿路径延长**的动画（用户要求）。
     图标不再整齐排在等距列里 —— 每格落在 5 个槽位中随机一个，再叠 ±4% 横向 / ±7px 纵向抖动，
     所以路径天然不等长、不平行；线本身也改成**二次贝塞尔弧**（控制点垂直偏移），不画直线。 */
  .map-wrap{position:relative; padding:30px 0;}   /* 上下留白：弧线外凸时不会被面板裁掉 */
  .map-lines{position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; z-index:0;}
  .map-svg{position:absolute; left:0; top:0; overflow:visible; pointer-events:none;}
  .map-path{fill:none; stroke-linecap:round; stroke-linejoin:round;}
  .map-path.link-dim{stroke:rgba(154,143,120,.30); stroke-width:3; stroke-dasharray:5 9;}
  .map-path.link-reach{stroke:rgba(224,179,65,.85); stroke-width:3.5; stroke-dasharray:9 7; filter:drop-shadow(0 0 3px rgba(224,179,65,.35));}
  .map-path.link-past{stroke:rgba(255,226,150,.55); stroke-width:3.5; filter:drop-shadow(0 0 4px rgba(255,226,150,.45));}
  .map-path.link-new{stroke:rgba(255,236,178,.95); stroke-width:4; stroke-dasharray:var(--len,0); animation:mapGlowGrow 1.1s cubic-bezier(.35,0,.25,1) forwards; filter:drop-shadow(0 0 7px rgba(255,232,160,.95));}
  @keyframes mapGlowGrow{from{stroke-dashoffset:var(--len,0);} to{stroke-dashoffset:0;}}
  .map-row{position:relative; z-index:1; height:88px; margin:0;}
  /* v0.61.42：改**绝对定位** —— left/top 由每格自带的槽位 + 抖动内联给出（showMap 里的 mapNodeStyle）。
     left:50% / top:0 只是没有内联样式时的兜底，保证任何情况下都不是全叠在左上角。 */
  .map-node{position:absolute; left:50%; top:0; transform:translateX(-50%); min-width:0; padding:0; border:none; background:none; color:var(--text); font-size:12px; letter-spacing:1px; cursor:default; text-align:center; display:flex; flex-direction:column; align-items:center; gap:1px; line-height:1.25;}
  .map-node.empty{visibility:hidden;}   /* v0.61.41 兜底：当前没有任何档会渲染它（未解锁改挂 locked.png） */
  .map-node .node-ico{width:56px; height:56px; object-fit:contain; display:block; pointer-events:none; transition:transform .15s ease; filter:drop-shadow(0 2px 4px rgba(0,0,0,.85));}
  /* v0.62.0：地图是**完全不透明的卷轴场景**（详见 #overlay.map-scene），
     小字压在画心上，仍然自带描边才读得清 */
  .map-node .node-label{white-space:nowrap; color:var(--dim); text-shadow:0 1px 3px rgba(0,0,0,.95), 0 0 7px rgba(0,0,0,.85);}
  .map-node.locked{opacity:.4;}
  /* v0.62.0：这里原本还有两条 `.node-ico` 的 filter（locked 灰化 / preview 半灰）——
     已并入下面的 .o-* 描边态（filter 不可跨规则叠加，留着这两条只会被后者整条覆盖）。尺寸保留。 */
  .map-node.locked .node-ico{width:42px; height:42px;}
  .map-node.preview{opacity:.7;}
  .map-node.preview .node-ico{width:46px; height:46px;}
  .map-row.current .map-node{cursor:pointer;}
  .map-row.current .map-node .node-ico{filter:drop-shadow(0 0 10px rgba(224,179,65,.95)) drop-shadow(0 2px 4px rgba(0,0,0,.9));}
  .map-row.current .map-node .node-label{color:var(--gold);}
  .map-row.current .map-node:hover .node-ico{transform:translateY(-3px) scale(1.08);}
  .map-row.past .map-node{opacity:.32;}
  .map-row.future .map-node{opacity:.72;}

  /* —— v0.62.0 解锁态描边（用户要求：「达到的关卡的图标要有淡白色的描边，过去的关卡白色描边消失」）——
     ⚠️ CSS 的 filter **不可跨规则叠加**：后写的整条**覆盖**前面的，不是合并。所以每个状态必须写一条
     **完整**的 filter 链（灰化 + 投影 + 描边一次写全），拆成两条规则只会剩最后一条生效。
     ⚠️ 特异性：`.map-row.current .map-node .node-ico` 是 4 个类，下面每条也都 ≥4 个类且写在它之后，
     否则当前层那圈的暗金发光会把描边整条吃掉。
     「淡白描边」用三层 2px drop-shadow 叠出来 —— 单层 2px 太虚，三层才有一圈实边的感觉。 */
  .map-row .map-node.o-locked .node-ico{          /* 更上面的层：还是锁，灰化、无描边 */
    filter:grayscale(.55) brightness(.7) drop-shadow(0 2px 4px rgba(0,0,0,.9));}
  .map-row .map-node.o-past .node-ico{            /* 走过的层：白色描边**消失** */
    filter:grayscale(.35) brightness(.82) drop-shadow(0 2px 4px rgba(0,0,0,.9));}
  .map-row .map-node.o-reached .node-ico{         /* 达到/前沿：淡白描边 */
    filter:drop-shadow(0 0 2px #e6e3da) drop-shadow(0 0 2px #e6e3da) drop-shadow(0 0 2px #e6e3da) drop-shadow(0 2px 4px rgba(0,0,0,.9));}
  .map-row.current .map-node.o-reached .node-ico{ /* 当前层 + 前沿：暗金发光 **和** 淡白描边一条写完 */
    filter:drop-shadow(0 0 10px rgba(224,179,65,.95)) drop-shadow(0 0 2px #e6e3da) drop-shadow(0 0 2px #e6e3da) drop-shadow(0 2px 4px rgba(0,0,0,.9));}
  /* 锁破裂过渡中的节点：真实图标先藏着，等碎片飞散（t≥0.20）那一帧再显形 + 描边淡入 */
  .map-node .node-ico.o-reveal{opacity:0; transition:opacity .18s ease;}

  /* v0.71.0：收成一行。它是「上一回合结算」的回顾条，`finishEndTurn` 后**常驻**
     （不是一闪而过的提示），在 1280×720 上是一块实打实的 43px ——
     而同一段文字 `js/30_engine.js:1003` 已经写进战报了，不需要这么大的版位。 */
  #turn-summary{flex:0 0 auto; margin-bottom:4px; padding:5px 12px; background:rgba(224,179,65,.08); border:1px solid var(--gold); border-radius:8px; font-size:12.5px; color:var(--gold); line-height:1.45;}
  #turn-summary:empty{display:none;}
  /* v0.71.0 定稿：战报栏**全档只有这一种形态**（关 ⇄ 右侧抽屉）。
     为什么不保留「基准档常驻左栏」这个旧默认：实测 base 档 3 敌时**每一个桌面分辨率都竖滚**
     （1280×720 +365 / 1366×768 +317 / 1440×900 +185 / 1600×900 +185 / 1920×1080 +5），
     成因完全相同 —— 左栏要吃 236px 宽，敌人面板只剩 568px，而 3 个敌人写死 184px
     + 2×30px 间隙 = 612 > 568 ⇒ **flex-wrap 折成两排**，`.battle` 从 332 涨到 664。
     而 pickFightFrom 每场必出 2–3 敌（没有 1 敌的战斗），所以这不是边缘情况。
     改 fixed 后它脱离弹性流，236px 全还给敌人（#enemy-panel 568→818），不再折行。
     ⚠️ 位移用 transform 是安全的：红线只钉 `.hand-area` 与 `#hand`
        （它们一旦有 transform 就成了 position:fixed 后代的包含块、会摧毁 #fx-layer
         的视口坐标系），`#log` 不是 #fx-layer 的祖先。
     ⚠️ 别改成「留在 #field 里但宽度为 0」那种写法 —— 只要它还是 flex 子项，
        那 14px 的 gap 照吃，flex-basis 也仍参与分配。 */
  #log{position:fixed; top:0; right:0; bottom:0; left:auto; height:auto; max-height:none;
       width:min(300px,68vw); min-width:0; overflow-y:auto; box-sizing:border-box;
       background:var(--ink2); border:1px solid var(--ink3); border-radius:0;
       padding:10px 12px; font-size:11.5px; color:var(--dim); line-height:1.6;
       z-index:9; transform:translateX(100%); transition:transform .22s ease;
       word-break:break-word;}
  body.log-open #log{transform:none;}
  #log .log-head{color:var(--gold); font-family:var(--font-kai); font-size:14px; letter-spacing:2px; margin-bottom:6px; border-bottom:1px solid var(--ink3); padding-bottom:4px;}
  #log .log-sep{color:#e0b060; font-weight:bold; margin:5px 0 2px;}
  /* v0.61.20(P5)：战报筛选 chip（伤害 / 获得 / 状态），空选=全部 */
  #log .log-head{display:flex; align-items:center; flex-wrap:wrap; gap:4px;}
  #log .log-chips{margin-left:auto; display:flex; gap:3px;}
  #log .log-chip{font-family:var(--font-kai); font-size:11px; letter-spacing:0; line-height:1.5; border:1px solid var(--ink3); background:transparent;
    color:var(--dim); border-radius:10px; padding:1px 8px; cursor:pointer; user-select:none;}
  #log .log-chip:hover{border-color:var(--gold); color:var(--gold);}
  #log .log-chip.on{background:var(--gold); border-color:var(--gold); color:#241a10; font-weight:bold;}
  #log .log-line{margin:1px 0;}

  #hand{flex:0 0 auto; display:flex; flex-wrap:nowrap; min-height:200px; align-items:flex-end; justify-content:center; padding:6px 0 var(--hand-pad-b,6px); touch-action:none; position:relative; z-index:1;}
  .hand-area{flex:0 0 auto; display:flex; align-items:flex-end; gap:8px;}
  .hand-area #hand{flex:1 1 auto; min-width:0;}
  .hand-area #endTurn{flex:0 0 auto; align-self:center; writing-mode:vertical-rl; letter-spacing:5px; font-size:17px; padding:16px 10px; min-height:132px;}
  /* v0.61.20(P1)：结束回合软提示 —— 竖排按钮左侧浮一枚小气泡，不挡手牌也不弹窗 */
  /* v0.71.0：+ `z-index:2`。`#end-turn-hint` 是 `right:calc(100% + 10px)` 向左伸的气泡，
     必然横穿手牌区；而 `#hand{position:relative; z-index:1}`（:295）在同一个层叠上下文里
     把它压住 ⇒ 「还有 N 张可打」被卡面切成半截（矮屏档卡片还有 hover 的 scale 上浮，更严重）。
     `.endcol` 的盒子只有气泡（`pointer-events:none`）和结束按钮两个子项，抬到 2 既让气泡
     盖住手牌，又**不会**抢走手牌点击。 */
  .hand-area .endcol{position:relative; z-index:2; flex:0 0 auto; align-self:center; display:flex; align-items:center;}
  /* ===== v0.69.0 抽牌堆 / 弃牌堆（手牌两端）=====
     版面：.hand-area = [弃牌堆][灵符][手牌][结束回合][抽牌堆]。
     两堆是**真的 flex 兄弟**，不是绝对定位 —— 这样它们自动与 #hand 同底对齐，
     也不会压到灵符球和结束按钮（那两块都在 flex 流里，绝对定位会直接盖上去）。

     ⚠️ 宽度从哪来（v0.69.0 实测，别照直觉算）：#hand 是 `flex-wrap:nowrap`，
        而手牌 `.card` 默认 flex-shrink:1 ⇒ **牌会自己变窄去适配容器**。
        所以两堆吃掉的 2×49 + 2×8(gap) = 114px 并不会让手牌「溢出」，
        只会让每张牌窄一点（1280 档 8 张：#hand 611→497、卡宽 131→116，仍然刚好铺满）。
        ⇒ plan §C5 里「必须把 #log 从 236 收到 200 才放得下」和「margin-left 要改 -76」
          这两条是**按「不收缩」推算的，与浏览器实测不符**，已按实测作废 ——
          两个旋钮都没动，战报栏宽度和手牌重叠度保持原样。 */
  .hand-area{--pile-w:50px; --pile-h:76px; --pile-spine:5px; --hand-pad-b:6px;}
  .pile{position:relative; flex:0 0 auto; align-self:flex-end;
        margin-bottom:var(--hand-pad-b,6px);
        width:calc(var(--pile-w) + var(--pile-spine)); height:var(--pile-h);}
  /* 侧棱（一摞牌的书口）：木纹来自 side.png。
     ⚠️ 必须「高度对齐 + 宽度裁切」，不能 100% 100% 硬塞：
        side.png 是 227×583 的**竖**板，它的 583 是照 front.png 的 583 做的，
        **不是**照 back.png 的 389 ⇒ 两张图高度天然不匹配。
        硬塞 100% 100% 会把木纹**横向压 26 倍**：纹理变成竖向涂抹，
        上下那两条倒角亮边被拉粗成两条黑杠 —— 反而比不放图更难看。
        正确做法：auto 100% 等比缩到堆高（227 → 227×66/583 ≈ 25.7px 宽），
        再靠 background-position 只露最左 / 最右的一条。 */
  .pile-slab{position:absolute; bottom:0; width:var(--pile-spine); height:100%;
             transform-origin:bottom center;   /* 旋转绕**底边**：一摞牌是坐在桌上的，
                                                  底边必须留在原地、只有上沿歪出去，
                                                  绕中心转会连底边一起甩开，看着像几块漂着的木板 */
             background-color:#6b4a2e;                 /* 图没加载出来时的兜底木色，不是装饰 */
             background-image:var(--pile-side-img,none);
             background-repeat:no-repeat; background-size:auto 100%; border-radius:1px;}
  /* 顶面：完整牌背 back.png（257×389，比例 0.6607）。堆是 44×66（0.6667），
     差 0.9% —— 直接铺满，肉眼不可辨，不值得为它引入含空边的 auto 100%。 */
  .pile-face{position:absolute; top:0; width:var(--pile-w); height:100%;
             background-color:#2a2119;
             background-image:var(--pile-back-img,none);
             background-repeat:no-repeat; background-size:100% 100%;
             border-radius:3px; box-shadow:0 2px 6px rgba(0,0,0,.55);}
  .pile-n{position:absolute; right:1px; bottom:0; font-size:11px; font-weight:bold;
          color:var(--gold); text-shadow:0 1px 3px #000,0 0 5px #000; pointer-events:none;}
  /* 左右朝向：书口一律朝**外**（背离手牌），两堆才像夹住手牌的两摞书；
     朝里会顶着手牌，看着像把书摆反了。所以两张图的 background-position 必须逐堆写：
     弃牌堆在左端 ⇒ 露木板的**左**缘；抽牌堆在右端 ⇒ 露**右**缘。 */
  .pile-discard .pile-slab{left:0;  background-position:left center;}
  .pile-discard .pile-face{left:var(--pile-spine);}
  .pile-draw    .pile-slab{right:0; background-position:right center;}
  .pile-draw    .pile-face{right:var(--pile-spine);}
  /* 整齐 vs 凌乱：抽牌堆是「码齐的一摞」，弃牌堆是「随手一扔」—— 这是区分两堆的主要视觉线索
     （两堆顶面都是同一张 back.png，不看侧棱分不出来）。
     ⚠️ 姿态一律**写死在 CSS 里**，绝不用 JS 的 Math.random()：render() 一回合要跑好几次，
        随机化会让弃牌堆每帧抖动，看着像在抽搐。
     ⚠️ 用 rotate / translate **独立属性**，把 transform 通道整个让给将来的抽牌/弃牌动画
        （.card 的 transform 已经被扇形展开占满了，见 §C6）。 */
  .pile-draw .pile-slab{translate:0 0;}
  .pile-draw .pile-slab:nth-child(2){translate:2px 0;}
  .pile-draw .pile-slab:nth-child(3){translate:4px 0;}
  /* 弃牌堆：高度与角度都各不相同 ⇒ 上沿参差、底边仍压在桌上。
     translate 只往**外**挪 1~3px（不是 5~7px）—— 挪太多那几片会与顶面脱开，
     看着像书旁边散落的两块木板，而不是「一摞扔歪的牌」；凌乱感交给 rotate 和高度差。 */
  .pile-discard .pile-slab:nth-child(1){translate:-3px 0; height:96%; rotate:-9deg;}
  .pile-discard .pile-slab:nth-child(2){translate:-1px 0; height:88%; rotate: 6deg;}
  .pile-discard .pile-slab:nth-child(3){translate:-2px 0; height:93%; rotate:-4deg;}
  .pile-discard .pile-face{rotate:-4deg; translate:-4px 1px;}
  #end-turn-hint{position:absolute; right:calc(100% + 10px); top:50%; transform:translateY(-50%); white-space:nowrap; pointer-events:none;
    background:rgba(24,18,12,.95); border:1px solid var(--gold); color:var(--gold); border-radius:8px; padding:6px 12px; font-size:12.5px; letter-spacing:1px;
    box-shadow:0 4px 14px rgba(0,0,0,.55); animation:hintPulse 1.8s ease-in-out infinite;}
  #end-turn-hint.off{display:none;}
  #end-turn-hint::after{content:""; position:absolute; left:100%; top:50%; margin-top:-5px; border:5px solid transparent; border-left-color:var(--gold);}
  #end-turn-hint b{color:#f0e0b8;}
  @keyframes hintPulse{0%,100%{opacity:.78;} 50%{opacity:1;}}
  .title-actions{position:absolute; right:4px; top:50%; transform:translateY(-50%); display:flex; gap:8px;}
  .title-actions .btn{min-width:0; padding:6px 12px; font-size:13px;}
  /* v0.71.0：战报栏全档统一成右侧抽屉（理由见基档 #log 那条），所以这个开合按钮
     **全档都要显示**。v0.70.0 那条「基准档隐藏」的前提（基准档 #log 是常驻左栏）
     已被实机量测推翻 —— 它正是桌面三敌换行竖滚的成因。 */
  .title-actions #logToggle{display:inline-block;}
  .rune-display{flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:2px; padding-bottom:14px; min-width:110px;}
  .rune-icon{width:105px; height:105px; object-fit:contain; filter:drop-shadow(0 0 8px rgba(180,140,220,.45));}
  .rune-fallback{font-size:90px; color:rgba(180,140,220,.6); line-height:1; display:none;}
  .rune-count{font-size:22px; font-weight:bold; color:var(--gold);}
  .card{width:132px; height:200px; position:relative; background:var(--paper); color:#2a2119; border-radius:8px; display:flex; flex-direction:column; cursor:pointer; border:2px solid transparent; box-shadow:0 3px 8px rgba(0,0,0,.45); transition:transform .13s ease; text-align:left; font-size:11px; overflow:hidden; touch-action:none;}
  .card::before{content:""; position:absolute; top:0; left:0; right:0; height:5px; background:var(--cb, linear-gradient(90deg,var(--red2),var(--red),var(--red2))); border-radius:8px 8px 0 0; opacity:.8; z-index:1;}
  .card.disabled{filter:grayscale(.8) brightness(.7); cursor:not-allowed;}
  .card .cart-wrap{width:100%; height:80px; flex:0 0 auto; background:linear-gradient(160deg,#d9c9a8,#c3a97e); overflow:hidden; position:relative;}
  .card .cart-wrap .cart{width:100%; height:100%; object-fit:cover; display:block;}
  .card .cost{position:absolute; top:6px; left:6px; width:24px; height:24px; border-radius:50%; background:#2a2119; color:var(--gold); font-weight:bold; display:flex; align-items:center; justify-content:center; font-size:14px; z-index:2; box-shadow:0 1px 3px rgba(0,0,0,.5);}
  .card .cname{font-family:var(--font-kai); font-weight:bold; font-size:14px; letter-spacing:1px; padding:6px 8px 2px; z-index:1;}
  .card .cdesc{flex:1; color:#4a3f2f; line-height:1.32; font-size:10.5px; padding:0 8px; overflow:hidden; word-break:break-word;}
  .card .ctype{font-size:9px; color:#7a6c52; padding:3px 8px 6px; letter-spacing:1px;}
  .reward-cards .card{height:auto; min-height:200px;}
  /* v0.71.0：`.card.selected` 此前**全项目没有任何规则** —— 全仓 `.selected` 只有

  /* v0.69.0 改「朱砂封条」。

     ⚠️ 原来的 `margin:4px 0 2px` 必须删掉：绝对定位下 margin 依然生效，会把封条顶偏。
     left/right/top 复用图窗（.cart-wrap）那组实测百分比 ⇒ 三档分辨率自适应：
        left 11.69% / right 12.99%（=100−11.69−75.32）/ top = 图窗垂直中心 − 8px（封条半高）。

        就曾被这么吞掉过 —— 而那条规则正是本条注释要解释的那个修复，等于注释把修复吃了）。

  .exhaust-tag{position:absolute; left:11.69%; right:12.99%;

  /* 消耗牌标记：左侧红条（扇形手牌只露左缘，靠它一眼认出）+ 右上角「消耗」角标 */

  .card .oneuse{position:absolute; top:5px; right:5px; z-index:3; font-size:9px; line-height:1.35; color:#fff; background:var(--red2); border-radius:4px; padding:1px 5px; letter-spacing:1px; box-shadow:0 1px 3px rgba(0,0,0,.55); cursor:help;}

  /* ===== 卡牌换真美术牌框（ui/card/front.png）=====
     旧卡面是 CSS 画的（纸底 + 顶部色条 + 80px 图窗 + 米黄文字区）。现在改挂真牌框图。

     窗位是**实测**的，不是目测：原图 385x583 上量出
       图窗    x  45..335  y  75..280 → left 11.69%  top 12.86%  w 75.32%  h 35.16%
       铭牌窗  x  42..341  y 344..508 → left 10.91%  top 59.01%  w 77.66%  h 28.13%
     量法踩了两个坑，都记在这儿免得重走：
       · 按亮度分不开「图窗」与「木框」—— 两者都暗（木纹 lum 35~57，图窗也在这个区间），
         阈值一放就整张卡连成一片；
       · 按颜色找「米黄铭牌窗」会被木框上的**金描边**污染 —— 窗内米黄 (207,175,109) 与
         描边金 (188,154,88) 是同一色系，bbox 直接圈住整张卡。
     最后是**按金色描边的位置**定的边界（描边是细线，位置干净）。

     ⚠️ 上面那批旧规则**一条都没删**：牌框图加载失败时 cardFrameFail() 会摘掉 .has-frame，
        卡片原样退回 v0.67 的纯 CSS 版面。所以这一整段只做「有牌框时」的覆写。 */
  /* ⚠️ 必须 border:0 —— 全站 `*{box-sizing:border-box}`，`.card` 那圈 2px 边框会把
     子元素的定位基准从 132 缩到 128（子元素按 **padding box** 定位，而量窗位时用的
     getBoundingClientRect 给的是 **border box**）。实测窗位因此整体缩了约 4.5px/385，
     两个窗加起来偏 9px —— 卡图会离开图窗的金边、文字会离开铭牌窗。 */
  .card.has-frame{border:0; border-radius:5px; background:none;}
  .card.has-frame::before{height:3px; opacity:.9;}
  /* 牌框底图：绝对定位铺满，z-index:0 压在所有内容下面 */
  .card .cframe{position:absolute; left:0; top:0; width:100%; height:100%; display:block; z-index:0; pointer-events:none;}
  .card.has-frame .cart-wrap{position:absolute; left:11.69%; top:12.86%; width:75.32%; height:35.16%;
    background:#2a2119; flex:none;}
  /* 文字三件套包一层 .cplate：
     无牌框时 display:contents ⇒ 孩子照旧直接参与 .card 的 flex 列排版（与 v0.67 完全一致）；
     有牌框时 .cplate 才变成铭牌窗里那个绝对定位的窄列。
     用 display:contents 而不是「有条件地在 JS 里加/不加这层」—— 因为加载失败是**异步**的，
     结构不能事后补。 */
  .card .cplate{display:contents;}
  /* v0.69.0 版面收紧：目标是让描述装下 3 行（原为 2 行）。
     ⚠️ 百分比 padding 是按**包含块宽度**解析的，不是高度 —— 132px 宽的卡上 `2.6%` 纵 padding
        实际是 3.43px 而不是 3.43% 卡高。所以「缩小纵 padding」这件事比看上去省得多：
        纵合计 8.184px → 6.864px，而每行可用宽度反而从 91.95 涨到 93.53。
     验算（默认档 132×200，铭牌窗高 56.26）：
        56.26 − 6.864(padding) − 15.375(cname 行盒) = 34.02 ≥ 3 × 11.25(cdesc 行高) ✓
        每行 93.53 / 9 ≈ 10.4 字 ⇒ 整卡 3 行 × 10 字 = 30 字。
     ⚠️ 余量只有 0.27px ⇒ 字号与 padding 是拿无头 Chrome 实拍扫参定的，别凭感觉改。
       （⚠️ 这段注释会**原样进产物**（CSS 注释不被混淆器剥掉，JS 注释才会）⇒
        这里不许写仓库内部路径，否则打包的隐私自检每次都报一笔。） */
  .card.has-frame .cplate{display:flex; flex-direction:column; position:absolute;
    left:10.91%; top:59.01%; width:77.66%; height:28.13%; box-sizing:border-box;
    padding:2.6% 3.4% 2.6%; overflow:hidden; z-index:1;}
  .card.has-frame .cname{padding:0 0 1px; font-size:12.5px; letter-spacing:0; line-height:1.15;}
  .card.has-frame .cdesc{flex:1; font-size:9px; line-height:1.25; padding:0; overflow:hidden;}
  /* 类型标签放进图窗与铭牌窗之间那条空木带。
     ⚠️ v0.69.0 纠正一个先前的错推论：旧版把它写成 .cplate 里的 `bottom:100%`，
        并以为它「吃掉了约 11px 行高」。**两条都不成立**：
        · 它是 position:absolute ⇒ 不产生 flex item、**不占任何行高**；
        · .cplate 有 overflow:hidden，而 bottom:100% 把它整个顶到 .cplate 上沿**外侧**
          ⇒ 它 100% 被裁掉，**本来就没被看见过**。
        所以这里不是「腾地方」，是「把 .ctype 从裁剪区里救出来」。
     `top:48.02% / height:10.99%` 与 .cart-wrap 下沿、.cplate 上沿**同源**（都由 385x583
     原图的实测像素推出：图窗 y 75..280 → 12.86%+35.16%=48.02%，铭牌窗 y 344 → 59.01%）
     ⇒ 三档分辨率下**自适应，不用各写一遍**。那条木带实测高 21.98 / 17.36 / 14.95px，
     而 .ctype 字号本来就是 8.5 / 7.5 / 7px ⇒ 塞得进，字号不用改。
     ⚠️ 必须保持 `.card.has-frame` 前缀 —— 裸 `.ctype{…}` 会污染 `.relic .ctype`（遗物与灵汁卡在用）。
     用 flex 居中而不是 text-align:center —— 绝对定位 + 明确高度时 text-align 管不了垂直方向。 */
  .card.has-frame .ctype{position:absolute; left:0; right:0; top:48.02%; height:10.99%;
    display:flex; align-items:center; justify-content:center;
    font-size:8.5px; padding:0; letter-spacing:1px;
    color:#d8bd82; text-shadow:0 1px 2px rgba(0,0,0,.8);}
  /* 关键词【】在旧卡面上是金褐色，但铭牌窗本身就是米黄 —— 原色压上去几乎看不见。
     换深琥珀才有对比度。 */
  .card.has-frame .kw{color:#8a5a14; border-bottom-color:rgba(110,80,30,.5);}
  /* 费用牌：木框左上角，压在回纹角饰上（用户 2026-09-28 选定）。
     改黄铜币 —— 旧版是「墨黑底 + 金字」，那是在米黄纸底上才压得住；
     现在底色是深色木纹，墨黑会直接糊掉。 */
  .card.has-frame .cost{top:4.5%; left:3.6%; width:23px; height:23px; font-size:13px;
    background:radial-gradient(circle at 35% 30%, #f2d894, #c9a44e 62%, #96762c);
    color:#2a2119; border:1.5px solid #5e4415;
    box-shadow:0 1px 3px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.45);
    text-shadow:0 1px 0 rgba(255,255,255,.3);}
  /* 卡面下方多出来的那行小字（「✓ 已选」/ 商店价格）。
     有牌框时把它放到铭牌窗下沿那条空木带上 —— 不加这条的话它会成为 .card 里
     唯一在流内的孩子，被挤到左上角压住费用牌。 */
  .card.has-frame > .card-extra{position:absolute; left:8%; right:8%; bottom:3.2%; text-align:center;
    font-size:9.5px; line-height:1.2; z-index:2; text-shadow:0 1px 2px rgba(0,0,0,.75);}
  .relic{width:150px; min-height:110px; background:var(--ink2); color:var(--text); border-radius:8px; padding:10px; display:flex; flex-direction:column; cursor:pointer; border:2px solid var(--ink3); text-align:left; font-size:12px; transition:border .1s;}
  .relic:hover{border-color:var(--gold);}

  /* v0.65.0：小窗开合过渡。#overlay.hidden 原为 display:none（不可过渡 ⇒ 硬切），
     改为 opacity + visibility 延迟翻（淡出完才隐藏，无定时器、无竞态）。
     ⚠️ **类名 .hidden 必须保留** —— 它是语义查询，不只样式：
        js/50_ui.js:1335 加 / :1333 摘 / js/60_boot.js:155 showCardZoom 直接摘 /
        js/60_boot.js:537 用 !contains('hidden') 判断「有没有面板开着」（Esc 与交互引导依赖）
        / 冒烟夹具同查（别在这段里写仓库内部路径 —— 打包.py 的隐私自检会当成泄漏，
        verify_dist 的「不含 仓库文件」门禁会 FAIL；基线里本文件此类引用数是 0）。三处触碰点全是 classList.add/remove/contains，无一处依赖 display。
     visibility:hidden 仍阻止命中测试 ⇒ 关着时不挡点击。 */
  #overlay{position:fixed; inset:0; background:rgba(10,8,6,.88); display:flex; align-items:center; justify-content:center; z-index:10;
    opacity:0; visibility:hidden;
    transition:opacity .22s ease, visibility 0s linear .22s;}
  #overlay:not(.hidden){opacity:1; visibility:visible; transition:opacity .28s cubic-bezier(.2,.8,.2,1);}
  /* 面板推入。挂 #overlayWrap 而非 .panel —— .panel 是滚动容器（max-height:88vh/overflow-y:auto），
     不动它就完全避开「transform 与 overflow 交互」这类坑。
     门闩 .ov-enter 由 showOverlay 每次重算（见 js/50_ui.js）：刷新同一场景不重播。 */
  @keyframes overlayIn{from{opacity:0; transform:translateY(10px) scale(.985);} to{opacity:1; transform:none;}}
  #overlay.ov-enter #overlayWrap{animation:overlayIn .3s cubic-bezier(.2,.8,.2,1) both;}
  /* 地图有自己的相机进场（js/50_ui.js mapCamInit 2000ms），不要叠一层。
     取消语义是安全的：.map-scene 加上后本条生效 ⇒ 运行中的动画被取消 ⇒ 直接落到终态。 */
  #overlay.ov-enter.map-scene #overlayWrap{animation:none;}
  #overlay .close-x{position:absolute; top:8px; right:8px; width:34px; height:34px; line-height:32px; text-align:center; font-size:20px; color:#fff; background:var(--red); border:1px solid #5a1d16; border-radius:50%; cursor:pointer; font-weight:bold; z-index:11;}
  #overlay .close-x:hover{background:var(--red2);}
  #overlayWrap{position:relative; max-width:620px; width:94%;}
  /* v0.71.0：选英雄屏**放不下**（无头实测 #overlay .panel 内部溢出：640×360 → 62px、
     844×390 → 33px、**1280×720 → 20px**）—— 用户报的「选英雄的时候它显示不完全所以导致
     它还能上下滑动」在桌面档同样成立。根因不是字号，是**宽度**：四张 `.relic` 各 150px
     + 3×10px 间距 = 630px，而 `.panel` 内容宽只有 566px（620 限宽 − 26×2 padding）
     ⇒ 折成 3+1 两行，高度 503px 顶穿 88dvh 的 633px。
     所以这里只给**选英雄屏**放宽限宽到 700px（内容宽 648 ≥ 630 ⇒ 一排放下，高度回到单行
     ~255px），其余面板一律维持 620px 不变 —— 用户已验收过的面板观感不动。
     ⚠️ `.relic` 的 150px 与 `.panel` 的 padding 都没动 ⇒ 卡片本身的长相零变化。 */
  #overlay.hero-scene #overlayWrap{max-width:700px;}
  .panel{background:var(--ink2); border:1px solid var(--ink3); border-radius:12px; padding:26px; text-align:center; width:100%; max-height:88vh; max-height:88dvh; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .panel h2{font-family:var(--font-kai); font-size:24px; color:var(--gold); letter-spacing:3px; margin-bottom:14px;}
  .panel p{color:var(--dim); line-height:1.8; margin-bottom:14px;}
  .reward-cards{display:flex; gap:10px; justify-content:center; margin:14px 0; flex-wrap:wrap;}
  .kwlist{text-align:left; font-size:13px; line-height:1.9;}
  .kwlist b{color:var(--gold);}
  .hint{flex:0 0 auto; font-size:12px; color:var(--dim); text-align:center; margin-top:2px;}
  /* v0.61 B12：浮字改为小堆叠容器（最多 3 条并存，同类不再互相顶掉） */
  #float-msg{position:fixed; left:50%; top:34%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:2px; pointer-events:none; z-index:20;}
  #float-msg .fm{font-family:var(--font-kai); font-size:26px; color:var(--gold); text-shadow:0 0 12px rgba(0,0,0,.9), 0 2px 4px rgba(0,0,0,.8); letter-spacing:3px; white-space:nowrap; opacity:0; animation:floatUpItem 1.6s ease-out forwards;}
  @keyframes floatUpItem{0%{opacity:0; transform:translateY(10px);}12%{opacity:1;}100%{opacity:0; transform:translateY(-32px);}}
  #turn-banner{position:fixed; left:50%; top:18%; transform:translate(-50%,-50%); font-family:var(--font-kai); font-size:22px; color:var(--gold); text-shadow:0 0 12px rgba(0,0,0,.9); pointer-events:none; opacity:0; z-index:19; letter-spacing:4px; white-space:nowrap;}

  #bestiary-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0; text-align:left;}
  .bcard{background:var(--ink2); border:1px solid var(--ink3); border-radius:10px; padding:12px;}
  .bcard.locked{opacity:.55;}

  .bcard .bstory{font-size:12px; color:#cbbf9e; line-height:1.7;}

  .run-status{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:center; background:var(--ink); border:1px solid var(--ink3); border-radius:8px; padding:8px 12px; margin-bottom:12px; font-size:13px; color:var(--dim);}
  .run-status b{color:var(--gold);}
  .menu-panel{background:var(--ink); border:1px solid var(--ink3); border-radius:10px; padding:14px; margin:6px 0 14px;}
  /* v0.61.33：卡面预伤徽章样式（.dmg-buff/.dmg-nerf/.dmg-plain/.dmg-miss/.dmg-tag/.dmg-aoe）
     与「点击锁定目标」时的闪烁（.dmg-flash / @keyframes dmgFlash）随机制一并删除 ——
     预伤现在只浮在**目标敌人头顶**，样式见下面的 #drag-dmg。 */
  /* —— 外置素材（有则增强，无则优雅回退） —— */
  #bg{position:fixed; inset:0; z-index:0; width:100%; height:100%; object-fit:cover; pointer-events:none;}
  body.has-bg{background:transparent;}
  /* v0.61.42 的「地图背景怎么没有改」：根因是地图页渲染进 #overlay，而 #overlay 是 rgba(10,8,6,.88)
     的全屏黑幕、里面的 .panel 又是完全不透明的 var(--ink2) ⇒ 换哪张背景图都被压成一片黑。
     那一版的对策是**调淡**（黑幕 .22 + 面板 rgba(...,.30)）—— **方向就错了**：
     两层叠出来的合成不透明度是 1-(0.78×0.70)=0.454，也就是说还有约 55% 的战斗 UI 从面板里透出来
     （v0.62.0 用户报「还有半透明的战斗场景，十分失败」，指的就是这个）。
     v0.62.0 真修法：**地图场景完全不透明**，并把 #overlay 从「居中的小卡片」改成「整屏场景」。
     三层覆盖：① #overlay 换不透明底；② #overlayWrap 铺满整屏、去掉 620px 限宽；
               ③ .panel 去掉卡片底/边框/内边距/限高，退化成一个纯容器。
     其它所有面板（奖励/商店/图鉴/结算…）不受影响 —— showOverlay 开任何面板前都会先摘掉 .map-scene。 */
  #overlay.map-scene{background:#0b0a09;}
  #overlay.map-scene #overlayWrap{width:100%; height:100%; max-width:none;}
  #overlay.map-scene .panel{background:none; border:0; border-radius:0; padding:0; max-height:none; overflow:visible; text-align:left;}

  /* —— v0.66.0 主菜单重做：全屏横屏 + 真美术 + 三背景轮换 + 石碑崩碎 / 符纸卷轴 ——
     起因：v0.65.0 虽已整屏，但按钮仍是 CSS 画的、挤在中央一列，用户给的真美术一张没用上；
     且整机此前是按**竖屏**调的适配 —— 前提就是错的，目标形态是 16:9 横屏（桌面与手机横屏统一）。
     布局权威 = 志怪塔UI重设计\主菜单demo.html（顶标题 / 左石碑列 / 右符纸行 / 全屏背景）。
     ⚠️ 素材入库时已裁掉透明边距（画布 = 可见内容），所以尺寸一律按裁后实测比例给：
        start 483×1028 / continue 511×936 / 符纸 57~64×224~238 / topic 2015×709。
        石碑与符纸都是**细高**的（0.25~0.55:1），用 width 定尺寸会在矮屏把整列撑爆
        （640×360 实测 top 算出负值）⇒ 一律**以高度驱动**（vh + height + width:auto）。
     三层覆盖与地图一致：① #overlay 换不透明底；② #overlayWrap 铺满、去掉限宽；③ .panel 退化成纯容器。
     ⚠️ #overlay.menu-scene .panel 带 id ⇒ 优先级高于下面 @media 里的 .panel{padding:16px 10px}，
        不受书写顺序影响（map-scene 今天能正常工作也是这个原因）。 */
  #overlay.menu-scene{background:#0b0a09;}
  /* ⚠️ 三条 `height:100%` 必须成链，缺一条背景就只铺中间一条带（实测：只写 wrap 时
     #overlay 862px、.menu-root 只有 516px，上下两条露出 #0b0a09 纯黑，不叫整屏场景）。
     链：#overlay(定高) → #overlayWrap(height:100%) → .panel(height:100%) → .menu-root(height:100%)。
     最后那条 `.panel{height:100%}` 是最容易漏的一环 —— `.panel` 默认 auto 高，
     百分比高度拿不到确定参照时会退化成内容高，于是 .menu-root 也跟着塌。 */
  #overlay.menu-scene #overlayWrap{width:100%; height:100%; max-width:none;}
  #overlay.menu-scene .panel{background:none; border:0; border-radius:0; padding:0; height:100%; max-height:none; overflow:visible; text-align:center;}
  /* 场景根：CSS 渐变兜底；真背景由 menuBgRotate() 内联铺在 .menu-bgimg 上（有则增强，无则回退，同 #bg 约定）。
     ⚠️ 这里**不再**居中排版 —— 全部按键由 .menu-stage 里的绝对定位组承载，不然「全屏铺开」就退回了中间一列。 */
  .menu-root{position:relative; width:100%; height:100%; overflow:visible;
    background:radial-gradient(ellipse at 50% 30%, #1a1714, #0d0c0a 70%);}
  /* —— 背景双缓冲 ——
     A 是当前图，B 预留给交叉淡入（本轮只有硬切，所以 B 常空）。
     ⚠️ 呼吸动画**必须挂在 .menu-bgimg 上，不能挂 .menu-root** —— 挂根节点会把石碑/符纸/标题一起缩放。 */
  .menu-bgwrap{position:absolute; inset:0; z-index:0; overflow:hidden;}
  .menu-bgimg{position:absolute; inset:0; opacity:0;
    background-size:cover; background-position:center; background-repeat:no-repeat;}
  /* 只给 A 片上呼吸：`infinite alternate` 让它推近推远，22s 极慢 —— 要的是「画面在活着」，不是能看出的缩放 */
  .menu-bgimg.a{opacity:1; transform-origin:50% 46%; animation:menuBgBreathe 22s ease-in-out infinite alternate;}
  /* 暗角（抄 demo 的 .vignette）+ 上下压暗渐变：保证**任何一张**背景上按钮都压得住。
     用 inset 阴影而不是图片 ⇒ 零素材、零体积。 */
  .menu-veil{position:absolute; inset:0; z-index:1; pointer-events:none;
    box-shadow:inset 0 0 200px rgba(0,0,0,.9);
    background:linear-gradient(180deg, rgba(10,8,6,.74), rgba(10,8,6,.16) 26%, rgba(10,8,6,.20) 60%, rgba(10,8,6,.84));}
  .menu-stage{position:absolute; inset:0; z-index:2; overflow:visible;}
  /* 演出期间封住整个舞台 —— 没有这条，1 秒演出窗口里连点会调两次 startGame()（见 steleBreak 的 MENU_BUSY） */
  .menu-stage.is-busy{pointer-events:none;}
  /* 标题：topic.png 是横幅书法（2015×709 ⇒ 2.84:1），按宽度定尺寸 */
  /* ⚠️ 标题栏用 left:0;right:0 + text-align 居中，**不能用 left:50%+translateX(-50%)**：
     它是 .menu-tier，入场动画 menuRise 的 `to{transform:none}` 带 forwards 填充，
     会**永久压掉**基样式里的 transform —— 实测 1280×720 下标题左沿量到 640（=left:50% 处），
     等于"只居中了一半身位"，右沿顶到 947，肉眼明显偏右。换成 text-align 后不依赖 transform。 */
  .menu-titlebar{position:absolute; top:5%; left:0; right:0; z-index:3; pointer-events:none; text-align:center;}
  .menu-title{margin:0; line-height:0; font-family:var(--font-kai); color:var(--gold);}
  /* v0.68.1：标题放大到 1.5 倍 + 「特效渲染字迹边框」（用户：「应该在放大 1.5 倍左右，并且有特效渲染字迹边框」）。
     尺寸改**高度驱动**：topic.png 是 2.84:1 的横幅，只给宽度的话矮屏会出事 ——
     640×360 上 36vw = 230px 宽 ⇒ 81px 高，标题栏底沿压到 99px，离石碑只剩 24px 余量。
     加一层 min(...,25vh) 让矮屏优先按高度收，宽屏才吃 vw。
     ⚠️ 「字迹边框」只能用 **filter:drop-shadow** —— 它是按 **alpha 轮廓**扩散的，描的正是笔画的边。
        box-shadow / text-shadow 对 <img> 无效（图里没有"字形盒"可描）。
        四层叠出「贴边亮线 + 朱砂内辉 + 暗金外晕 + 落影」，再用 4.5s 缓慢呼吸让它活起来。 */
  .menu-title .menu-art{width:auto; height:clamp(88px, min(12.6vw, 25vh), 240px);
    display:block; margin:0 auto;
    filter:drop-shadow(0 0 1px rgba(255,214,140,.9))
           drop-shadow(0 0 6px rgba(184,46,36,.55))
           drop-shadow(0 0 16px rgba(168,139,58,.42))
           drop-shadow(0 2px 6px rgba(0,0,0,.9));
    animation:menuTitleEdge 4.5s ease-in-out infinite alternate;}
  .menu-title small{display:block; line-height:1.6; margin-top:4px; color:var(--dim);
    font-size:12px; letter-spacing:1px; font-family:"Microsoft YaHei",sans-serif;}
  /* —— 左下两块石碑：**左右并排**（v0.68.1，用户：「这两个石碑图标你应该左右摆放」）——
     旧版是竖列（续在上、入塔在下，照抄 demo 的 bottom:15% / 48%）。改成 row + align-items:flex-end：
     两块石碑**底沿对齐**，「谁高谁大」因此一眼可读 —— 这正是用户要的
     「入塔的图标要明显比续的图标大一点」。DOM 顺序也换成入塔在前：主 CTA 先读到，续退成右手边的次级项。 */
  .menu-col-stele{position:absolute; left:6%; bottom:14%; z-index:3; margin:0;
    display:flex; flex-direction:row; align-items:flex-end; gap:clamp(14px, 2.4vh, 34px);}
  /* —— 右锚符纸行 ——
     demo 用 right:18%/12%/6% 逐个百分比平铺 —— 小尺寸 16:9（如 640×360）下三张会互相重叠。
     改成 flex+gap 后任何尺寸都不重叠，且「间距均匀」由 gap 保证，不用手算三个百分比。 */
  .menu-row-talis{position:absolute; top:0; right:6%; z-index:3; margin:0;
    display:flex; flex-direction:row; align-items:flex-start; gap:2.2vw;}
  /* —— 图片按钮 ——
     显式清掉 <button> 的默认底/边框/padding（不清会在真美术上压出一块灰底）。
     min-width/min-height 补热区：符纸在矮屏只有 ~24px 宽，视觉不变但热区回到 48px。 */
  .menu-hit{display:flex; align-items:center; justify-content:center;
    min-width:48px; min-height:48px; padding:0; margin:0; line-height:0;
    background:none; border:0; cursor:pointer; overflow:visible; color:inherit;
    -webkit-tap-highlight-color:transparent;
    transition:transform .16s ease-out;}
  /* 图的**紧贴盒**：碎片与 sway 都要与图 1:1 对齐，所以不能让它们直接铺在按钮上
     （按钮有 min-width:48px，会比图宽 ⇒ clip-path 的百分比就对不上石头了） */
  .menu-artbox{position:relative; display:block; line-height:0;}
  .menu-hit .menu-art{display:block; width:auto; pointer-events:none;}   /* height 由各档分别给 */
  /* v0.68.1：两块石碑都**放大到两倍**（用户：「目前这个尺寸放在界面上会显得比较小，两个都起码放大到两倍」），
     入塔继续压着续一头（52vh vs 40vh，上限 600 vs 452），把主 CTA 顶出来。 */
  .menu-hit.is-continue .menu-art{height:clamp(184px, 40vh, 452px);}   /* 511×936 ⇒ 0.55:1 */
  .menu-hit.is-start .menu-art{height:clamp(240px, 52vh, 600px);       /* 483×1028 ⇒ 0.47:1 */
    animation:menuBreathe 2.5s ease-in-out infinite;}
  /* 三张符纸：挂在绳上的轻微摆动。
     v0.68.1 两处调整（用户：「可以再小一点 然后浮动的动画可以更轻盈 和 自然一点」）：
       · 尺寸收到约 0.65 倍（250 → 170 上限），免得跟放大的石碑抢视线；
       · 飘动交给 menuSway 的新曲线（幅度收到 1deg 内 + 叠垂直起伏 + 7s 一圈），
         错峰改用**负延迟** —— 正延迟会让第 2、3 张先呆立 2.3s / 4.6s 才动，负延迟一上来就在动。 */
  .menu-hit.is-collection .menu-art,
  .menu-hit.is-leaderboard .menu-art,
  .menu-hit.is-setting .menu-art{height:clamp(58px, 15vh, 170px);      /* 57~64×224~238 ⇒ ~0.26:1 */
    transform-origin:top center; animation:menuSway 7s ease-in-out infinite;}
  .menu-hit.is-leaderboard .menu-art{animation-delay:-2.3s;}
  .menu-hit.is-setting .menu-art{animation-delay:-4.6s;}
  .menu-hit:active{transform:scale(.96);}
  .menu-hit:disabled{cursor:not-allowed; filter:grayscale(1) opacity(.45);}
  .menu-hit:focus-visible{outline:2px solid var(--gold); outline-offset:4px;}
  /* ⚠️ 悬停只是**桌面增强** —— 手机横屏没有 hover，任何信息都不能只存在于 hover 里，
     触屏一律靠上面的 :active 兜底。用 @media(hover) 包住，免得触屏出现"按下后悬停态卡住"。 */
  @media (hover:hover){ .menu-hit:hover{transform:scale(1.04);} }
  /* 符纸「纸下拉」：挪到**按下**（demo 里这是 hover 态）。
     ⚠️ 这条必须写在上面 menuSway 那几条**之后** —— 同特异度 (0,3,0)，靠书写顺序取胜，
        写前面会被 sway 盖掉，下拉就完全看不见。 */
  /* v0.68.1：符纸按下 = 「向下拉然后回弹」（用户原话）。旧版只下沉 3px、150ms，
     在真美术上几乎看不见。新版拉 12px 并配合 scaleY 把纸**拽长**
     （transform-origin 是 top center ⇒ 是"从钉子上被拽下来"，不是整体平移），再带回弹收回。
     ⚠️ 时长必须与 js/50_ui.js 里 talisOpen 的定时器一致：定时器短于动画会在回弹中途切走场景
        （纸卡在半途），长于动画则白等。两处一起改。 */
  .menu-hit.tug .menu-art{animation:menuTug .42s cubic-bezier(.4,0,.5,1);}
  /* —— 石碑崩碎：同一张图切 5 片 ——
     每片一个 <img>，**同一个 src**（浏览器复用解码结果，零额外体积）。
     ⚠️ 必须包在 .menu-artbox（与图等大的紧贴盒）里再 inset:0 —— 铺在按钮上会因 min-width:48px
        而比图宽，clip-path 的百分比就对不上石头本体了。
     裂(0~53%) 与 碎(53%~100%) 合成一条 keyframes：两段都在 transform 上，拆两条会互相打断。 */
  .menu-shards{position:absolute; inset:0; pointer-events:none;}
  .menu-shard{position:absolute; inset:0; width:100%; height:100%; opacity:0;}
  .menu-hit.is-breaking .menu-art{opacity:0; animation:none;}       /* 整图隐去，交给碎片 */
  .menu-hit.is-breaking .menu-shard{opacity:1; animation:menuShardBurst .85s ease-in both;}
  /* 5 片的 clip-path **精确拼满**整个画布（相邻片共用顶点），所以裂开前重建出的图与原图逐像素一致，
     不会有"闪一下"的接缝。--dx/--dy = 裂（沿各自外法线 1~2px）；--fx/--fy/--rot = 崩碎飞散。 */
  .menu-shard.s1{clip-path:polygon(0 0, 46% 0, 42% 27%, 0 31%);
    --dx:-1px; --dy:-1.5px; --fx:-70px; --fy:-96px; --rot:-10deg;}
  .menu-shard.s2{clip-path:polygon(46% 0, 100% 0, 100% 24%, 42% 27%);
    --dx:1.2px; --dy:-1.5px; --fx:84px; --fy:-104px; --rot:9deg; animation-delay:.04s;}
  .menu-shard.s3{clip-path:polygon(0 31%, 42% 27%, 100% 24%, 100% 63%, 52% 67%, 0 62%);
    --dx:1.8px; --dy:.4px; --fx:130px; --fy:24px; --rot:12deg; animation-delay:.08s;}
  .menu-shard.s4{clip-path:polygon(0 62%, 52% 67%, 47% 100%, 0 100%);
    --dx:-1.5px; --dy:1.6px; --fx:-88px; --fy:110px; --rot:-11deg; animation-delay:.12s;}
  .menu-shard.s5{clip-path:polygon(52% 67%, 100% 63%, 100% 100%, 47% 100%);
    --dx:1.5px; --dy:1.8px; --fx:96px; --fy:118px; --rot:8deg; animation-delay:.16s;}
  /* 全屏闪（黑）。0→1→0，峰值在 50% —— 切场景正好落在峰值那一刻（见 steleBreak）。
     用**黑**而不是朱砂红：一承接游戏本身的暗场，二避开设计说明里『朱砂红与暗金不许大面积相邻』那一条。 */
  .menu-flash{position:absolute; inset:0; z-index:9; background:#000; opacity:0; pointer-events:none;}
  .menu-flash.on{animation:menuFlash .26s ease-in both;}
  /* 图 404 时的文字兜底：imgFail() 会把 <img> 换成 artImg 的 data-fallback（就是这段 span）。
     有它才不会变成一个点不动的空框。 */
  .menu-fb{display:flex; align-items:center; justify-content:center; box-sizing:border-box;
    min-width:48px; min-height:48px; padding:12px 8px; writing-mode:vertical-rl; letter-spacing:6px;
    font-family:var(--font-kai); color:var(--gold); background:rgba(26,23,20,.72);
    border:1px solid var(--ink3); border-radius:4px;}
  .menu-hit.is-start .menu-fb{color:#ff5040; font-size:22px; letter-spacing:10px;}
  .menu-hit.is-continue .menu-fb{font-size:20px;}
  .menu-hit.is-collection .menu-fb,
  .menu-hit.is-leaderboard .menu-fb,
  .menu-hit.is-setting .menu-fb{font-size:13px; letter-spacing:3px; min-height:120px;}
  .menu-title .menu-fb{writing-mode:horizontal-tb; font-size:30px; letter-spacing:10px;

  .menu-col{position:relative; z-index:1; width:92%; max-width:420px; max-height:100%; overflow-y:auto;

  .menu-tip{font-size:12px; color:var(--dim); line-height:1.7; margin-top:14px;}
  /* —— 待机：三层同时 ——
     背景推近推远（22s，极慢）/ 入塔石碑红光呼吸（2.5s）/ 三符纸飘动（4s，错峰）。
     ⚠️ 呼吸用 filter 的 drop-shadow 而不是 transform：三张符纸已经占了 transform（sway），
        石碑再上 transform 会和 :active 的 scale 抢同一个属性。
     ⚠️ 只给**入塔**呼吸，其余静止 —— 冷暖对比把主 CTA 顶出来。 */
  @keyframes menuBgBreathe{from{transform:scale(1);} to{transform:scale(1.06);}}
  @keyframes menuBreathe{
    from{filter:drop-shadow(0 0 10px rgba(184,46,36,.45));}
    to{filter:drop-shadow(0 0 26px rgba(184,46,36,.9));}}
  /* v0.68.1：飘动改「更轻盈自然」（用户原话）。旧版是 rotate(-1.4deg)↔(1.4deg) 的纯摆动 ——
     像一根刚性摆锤来回打，4s 一个来回也太急。新版：幅度收到 1deg 内、叠一点**垂直起伏**，
     7s 一圈，且首尾同值 ⇒ 无缝循环（所以是 linear/ease-in-out + infinite，不再用 alternate）。
     分段缓动自带轻微"停顿感"，读起来是纸在风里飘而不是机械摆。 */
  @keyframes menuSway{
    0%  {transform:rotate(-1deg)   translateY(0);}
    28% {transform:rotate(-.25deg) translateY(-3.5px);}
    55% {transform:rotate(.7deg)   translateY(-1px);}
    78% {transform:rotate(1deg)    translateY(-3px);}
    100%{transform:rotate(-1deg)   translateY(0);}}
  /* 拽下来 → 弹过头 → 收 —— 三段递减，读起来才像纸的回弹而不是正弦波 */
  @keyframes menuTug{
    0%  {transform:translateY(0)    scaleY(1);}
    34% {transform:translateY(12px) scaleY(1.07);}
    60% {transform:translateY(-4px) scaleY(.97);}
    80% {transform:translateY(2px)  scaleY(1.01);}
    100%{transform:translateY(0)    scaleY(1);}}
  /* v0.68.1：标题的「字迹边框」呼吸。只动 filter（transform 已被 menuRise 的
     `to{transform:none}` + forwards 占着，碰它会永久压掉入场动画的终态）。 */
  @keyframes menuTitleEdge{
    from{filter:drop-shadow(0 0 1px rgba(255,214,140,.85))
                drop-shadow(0 0 5px rgba(184,46,36,.45))
                drop-shadow(0 0 13px rgba(168,139,58,.32))
                drop-shadow(0 2px 6px rgba(0,0,0,.9));}
    to  {filter:drop-shadow(0 0 2px rgba(255,232,180,1))
                drop-shadow(0 0 11px rgba(184,46,36,.78))
                drop-shadow(0 0 27px rgba(168,139,58,.62))
                drop-shadow(0 2px 6px rgba(0,0,0,.9));}}
  @keyframes menuShardBurst{
    0%{transform:none; opacity:1;}
    53%{transform:translate(var(--dx),var(--dy)); opacity:1;}                    /* 裂：只挪 1~2px，接缝露出底色 */
    100%{transform:translate(var(--fx),var(--fy)) rotate(var(--rot)); opacity:0;}} /* 崩：飞散 + 自转 */
  @keyframes menuFlash{0%{opacity:0;} 50%{opacity:1;} 100%{opacity:0;}}
  /* 错峰入场：--i 由标记内联给出（与手牌 --rot 同一手法，js/50_ui.js:1385）。
     挂 .ov-enter ⇒ 刷新同一场景时类被摘掉，选择器不匹配，新 innerHTML 建出的元素不播。 */
  /* ⚠️ 末尾是 `transform:none` + forwards 填充 ⇒ **挂 .menu-tier 的容器自己不能带 transform**，
     否则会被这条永久压掉（标题栏 left:50%+translateX(-50%) 就是这么中招的）。
     要位移请用 margin / left-right 定位，别用 transform。 */
  @keyframes menuRise{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;}}
  #overlay.ov-enter.menu-scene .menu-tier{animation:menuRise .38s cubic-bezier(.2,.8,.2,1) both;
    animation-delay:calc(var(--i,0) * 70ms);}
  /* —— v0.66.0 符纸面板：卷轴从顶落下 · 带回弹 ——
     复用 showOverlay 既有的可选第 3 参 scene（'scroll-scene'），与 map-scene / menu-scene 同一机制。
     纸感全来自 cubic-bezier(.34,1.56,.64,1) 那条过冲曲线（抄 demo 的 .scroll-panel）。
     ⚠️ 特异度 (2,2,0) > `#overlay.ov-enter #overlayWrap` 的 (2,1,0)，压得住 overlayIn，不靠书写顺序。 */
  /* v0.68.1：卷轴下落改「坠落 → 惯性回弹 → 平静落定」（用户原话）。旧版是一条 keyframes +
     cubic-bezier(.34,1.56,.64,1) 的单次过冲 —— 只有一下回弹，既没有"坠"的重力感，也没有余震。
     ⚠️ 起点用 **-120vh** 而不是沿用 -110%：百分比是相对**元素自身高度**算的 ——
        图鉴这类面板在 1080 高的屏上 -110% 只有 -330px 左右，面板顶沿仍留在屏幕里
        （中心 540 − 半高 150 − 330 = 60），于是「从屏幕上方坠落」变成「从屏幕中间冒出来」。
        vh 与面板高度无关，任何面板在任何屏上都从屏外开始。
     分段各自定缓动：坠（0~42%，加速下坠）→ 触底 → 弹起 26px → 再落 → 余震 9px → 落定。 */
  @keyframes scrollDrop{
    0%  {transform:translateY(-120vh); animation-timing-function:cubic-bezier(.45,0,.95,.5);}
    42% {transform:translateY(0);      animation-timing-function:cubic-bezier(.3,0,.2,1);}
    62% {transform:translateY(-26px);  animation-timing-function:cubic-bezier(.42,0,.58,1);}
    78% {transform:translateY(0);      animation-timing-function:cubic-bezier(.3,0,.2,1);}
    89% {transform:translateY(-9px);   animation-timing-function:cubic-bezier(.42,0,.58,1);}
    100%{transform:translateY(0);}}
  #overlay.scroll-scene.ov-enter #overlayWrap{animation:scrollDrop .95s both;}
  /* ⚠️ 卷轴面板**不做整屏不透明底**（第一版做成了 #0b0a09，实拍后撤掉）：
     用户要的是「卷轴从上方坠落、**平静地落在主界面上**」—— 底铺死了，落点就成了纯黑，
     看不到主界面。真正的病根不是"底不够黑"，是下面那条 `body.at-menu #app`。 */

  /* —— v0.62.0 地图场景（整屏 · 卷轴）——
     纵向结构（.map-root 是 flex 纵列，铺满 #overlay）：
       顶栏信息栏 / 幕名匾 / 上木轴（固定）/ 画心窗口 overflow:hidden（只有 .map-sheet 在里面动）/ 下木轴（固定）/ 底栏
     木轴与纸面是从 志怪塔UI重设计\素材\地图背景-UI版.jpg 切出来的（坐标 PIL 实测：上轴 y190-235、
     下轴 y3778-3853、纸面 x96-1003），见 素材/map/scroll_top.png / scroll_bottom.png / scroll_paper.jpg。
     ⚠️ 画心**不用**那张图 —— 它是一整套已完工的**假界面**（画心里画着枯树山石，顶上还有一块写着
     「焦南」的匾额），当纹理不可复用、按字面照搬还会把假界面搬进来。
     画心改用游戏**本来就有**的 素材/bg/bg_map.jpg（1295×3238 竖幅水墨：石阶通道、两侧烛火、远处塔影）
     —— 它正是 设计说明.md §04「塔内石阶通道两侧烛火」那张，也是本作地图页一直想用的图，
     v0.61.42 之前被黑幕盖住看不见，**不是没装**。 */
  .map-root{position:absolute; inset:0; display:flex; flex-direction:column; overflow:hidden;}
  .map-plaque{flex:0 0 auto; text-align:center; padding:6px 0 4px; font-family:var(--font-kai);
    font-size:15px; letter-spacing:4px; color:var(--gold); background:rgba(10,9,7,.72);

  /* 木轴：**固定不动**（用户选的是「木轴固定、画心滑动」）。素材是 1086 宽的长条，
     用 100% 100% 拉伸而不是 repeat-x —— 否则窄屏上会横向平铺，把两端的轴头重复到屏幕中间。 */
  /* v0.63.0：卷轴从「横跨整屏」收成一根**居中**的卷轴（用户：「地图卷轴边缘应该只比地图的宽度长出
     一点，不要横跨屏幕」）。三层各管一件事，别合并：
       .map-scroll = 那一列（桌面 792 = 画心上限 760 + 两侧各 16），居中；
       .map-frame  = 只给左右 16px 内边距 —— 于是木轴恰好比画心宽 32px；
       .map-viewport = 画心窗口（宽度 = 列宽 - 32）。
     窄屏列宽退化成 100%，木轴就是「屏幕宽 - 32」，**不用负 margin**（负 margin 在窄屏会溢出）。 */
  .map-scroll{flex:1 1 auto; min-height:0; width:100%; max-width:792px; margin:0 auto;
    display:flex; flex-direction:column;}
  .map-frame{flex:1 1 auto; min-height:0; padding:0 16px; display:flex; flex-direction:column;}
  .map-roller{flex:0 0 auto; position:relative; z-index:3; height:clamp(22px, 4.6vw, 44px);
    background-size:100% 100%; background-repeat:no-repeat;}
  /* ⚠️ v0.62.0：这两条 url() 只是**开发期兜底**（原型.html 与 素材/ 同级，直接双击就能看）。
     打包.py 不重写 CSS 里的 url()（它只特判 <img src="素材/rune.png">），所以产物里这三个相对路径
     会 404 —— 真正的加载路径是 showMap 里的 applyMapTextures()：用 assetURL() 取 ASSET_MAP 的
     data URI 写成**内联 background-image**，把这里的值覆盖掉。改这里的路径不会影响产物，
     改 applyMapTextures 才会。 */
  .map-roller.top{background-image:url(素材/map/scroll_top.png);}
  .map-roller.bot{background-image:url(素材/map/scroll_bottom.png);}
  /* 画心窗口：overflow:hidden ⇒ 一个屏幕装不下的那张长图只能从这里看到一段（用户要的正是这个）
     v0.63.0：加 touch-action:none —— 触屏上不加的话浏览器会把「手指拖」抢去当页面滚动，
     指针事件根本收不到（全项目只有 body / #hand / .card 三处有这个，地图一直漏了）。 */
  /* v0.64.1：再加 -webkit-user-drag:none —— 节点图标是 artImg() 出的**裸 <img>**，天生可拖：
     左键按住图标一移，浏览器立刻开始「原生拖图」并抛 pointercancel，把我们的 pointermove 流**掐断**
     ⇒ 症状正是「左键拖不动、按住中键才行」（中键不触发原生拖拽，所以那条路反而是通的）。
     body 上已有的 user-select:none **拦不住图片拖拽**，必须显式关掉 user-drag。
     user-drag 在 Blink 里是继承属性，写在这一层就覆盖了里面的所有图标。 */
  .map-viewport{flex:1 1 auto; min-height:0; position:relative; overflow:hidden; touch-action:none;
    -webkit-user-drag:none; user-select:none;
    background:#12100d; box-shadow:inset 0 0 60px rgba(0,0,0,.75);}
  /* 画心本体：只有它在动。transform 由 --camY 驱动，类切换（.cam-nofx / 内联 transition-duration）
     控制有没有动画 —— 不手写 rAF 插值，交给 CSS transition。
     ⚠️ 两层背景：先铺**画**（auto 100% = 按高度等比缩放，绝不拉伸变形），再垫一层可平铺的**旧纸**
     （256×256 无缝，实测 std 1.4）。这样任何宽高比下都铺得满：画比纸窄时两侧露出纸纹，比纸宽时两侧自然裁掉。 */
  .map-sheet{position:absolute; left:50%; top:0; width:100%; max-width:760px;
    padding:30px 0;
    transform:translate3d(-50%, calc(-1 * var(--camY, 0px)), 0);
    transition:transform 600ms cubic-bezier(.2,.8,.3,1); will-change:transform;
    background-image:url(素材/bg/bg_map.jpg), url(素材/map/scroll_paper.jpg);   /* 同上：产物里由 applyMapTextures() 覆盖 */
    background-size:auto 100%, 256px 256px;
    background-position:center top, left top;
    background-repeat:no-repeat, repeat;
    background-color:#12100d;}
  .map-sheet.cam-nofx{transition:none;}

  .map-sheet::before{content:''; position:absolute; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 40%, rgba(8,7,6,.28) 0%, rgba(8,7,6,.62) 70%, rgba(8,7,6,.82) 100%);}
  .map-bottombar{flex:0 0 auto; display:flex; justify-content:center; gap:10px; padding:7px 10px;

  .map-bottombar .btn{padding:6px 14px; font-size:13px;}
  /* —— v0.62.0 地图顶栏（用户说「上方的玩家信息栏你重新设计」，这块交给我）——

     ⚠️ 战斗页的 #topbar + renderTopbar **一行都没动** —— 所以这里只新增 .mt-* 类，

  .map-topbar{flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:7px 10px;

  /* v0.67.0：道具图标框。**只有 .relic 卡在用** —— .prelic-chip / .map-topbar 里的 .ricon
     各自把 width/height/margin 全覆写掉了（特异度也更高），所以改这里不碰顶栏与地图。
     原先是 `width:100%; height:56px` 的**横板**：素材本身是 128×128 方图，
     `object-fit:contain` 把它压成 56×56 塞在 130 宽的板子里，图只占 43%，四周全是空底。

  .ricon-fb{display:flex; align-items:center; justify-content:center; font-size:30px; line-height:1; font-weight:700; color:var(--gold);}
  /* —— 战斗特效（juice） —— */
  #fx-layer{position:fixed; inset:0; pointer-events:none; z-index:5; overflow:hidden;}
  /* v0.64.0：精灵图特效（8 列纵向图，background-position 逐帧步进 —— 见 js/00_base.js 的 playFx）。
     尺寸/位置/background-* 全由 JS 内联写，这里只管「不要边框、不吃点击、铺满格子」。
     不需要 mix-blend-mode：源图是真 RGBA（实测 88~97% 像素 alpha=0），直接 alpha 合成即可。 */
  .fx-sheet{position:absolute; pointer-events:none; background-repeat:no-repeat; will-change:background-position;}
  .fx-dmg{position:absolute; font-family:var(--font-kai); font-weight:bold; font-size:22px; color:#ff7b5a; text-shadow:0 0 8px rgba(0,0,0,.85), 0 2px 3px rgba(0,0,0,.6); animation:fxDmg .9s ease-out forwards; white-space:nowrap; letter-spacing:1px; transform:translate(-50%,-50%);}
  .fx-dmg.to-player{color:#ff4b4b; font-size:24px;}
  .fx-dmg.heal{color:var(--green);}
  @keyframes fxDmg{0%{opacity:0; transform:translate(-50%,-50%) scale(.5)}14%{opacity:1; transform:translate(-50%,-75%) scale(1.1)}100%{opacity:0; transform:translate(-50%,-180%) scale(1)}}
  .enemy.hit{animation:shake .22s ease-out;}
  @keyframes shake{0%,100%{transform:translateX(0)}30%{transform:translateX(-5px)}60%{transform:translateX(5px)}}
  #hurt-vignette{position:fixed; inset:0; pointer-events:none; background:radial-gradient(circle at center, transparent 45%, rgba(178,59,46,.5) 100%); opacity:0; z-index:4;}
  #hurt-vignette.flash{animation:vignette .5s ease-out;}
  @keyframes vignette{0%{opacity:1}100%{opacity:0}}
  .enemy.dying{animation:enemyDie .45s ease-out forwards; pointer-events:none;}
  @keyframes enemyDie{0%{opacity:1; transform:scale(1)}100%{opacity:0; transform:scale(.55)}}
  /* 全屏震屏已移除：受击反馈改用 hurtVignette 红晕 + 伤害飘字，避免连击时重影/重叠 */
  .card.shake{animation:cardShake .28s ease;}
  @keyframes cardShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .fx-dmg.block{color:#7fb0d8;}
  /* v0.61.33/36：数字素材字形（素材/num/{dmg,hurt,block,heal}/0.png…9.png，四档共 40 张）。
     高度按 1.15em 等比缩放 → 一套尺寸覆盖全部字号档（含下面的 .crit 28px），文字与图片都用同一套尺寸。 */
  .fx-num{height:1.15em; width:auto; vertical-align:-.18em; margin:0 -.03em; pointer-events:none;}
  /* v0.61.42：正负号（+ / -）的配色 —— 用户报「前面的加号和减号颜色没变，导致突兀」。
     数字是 PNG，颜色**烤死在图里**；符号是文字，原来继承的是 .fx-dmg 的**文字色**（上面那四条），
     与数字的真实填充色明度差一截。下面四个色值是用 PIL 从 素材/num/<档>/0..9.png
     的**不透明像素主色簇**里取的均值（不是目测）：dmg #fc3802 / hurt #c90902 / block #0398fa / heal #05c504。
     盒子几何与 .fx-num **完全对齐**（同高 1.15em、同 vertical-align:-.18em），
     这样「＋12」的符号与数字在同一基线上，不会再一高一低。
     ⚠ 四档字形本身**没有黑描边** —— 实测「近黑像素（RGB 和 <150）」占比 ≤0.04%；
     四档最暗的像素都是**自己色相的暗部**（hurt 最暗 #770000、heal 最暗 #005900、dmg #b22102、block #16285a），
     那是字形的内阴影/渐变，不是描边。所以这里**不加黑描边** —— 加了反而更突兀。
     （盒子几何是按 .fx-num 的数值对齐推出来的，**没有在真浏览器里逐像素量过**。） */
  .fx-sign{display:inline-block; height:1.15em; line-height:1.15em; vertical-align:-.18em; margin:0 -.02em; font-weight:bold; pointer-events:none;}
  .fx-dmg .fx-sign{color:#fc3802;}
  .fx-dmg.to-player .fx-sign{color:#c90902;}
  .fx-dmg.block .fx-sign{color:#0398fa;}
  .fx-dmg.heal .fx-sign{color:#05c504;}
  /* 拖拽预伤害（#drag-dmg）恒定用 dmg 档字形（numHTML('', …)），所以符号也必须恒用 dmg 档色，
     **不能**跟着 .weak 的蓝色文字走 —— 那又变成「符号一个色、数字另一个色」 */
  #drag-dmg .fx-sign{color:#fc3802;}
  /* v0.61.36 · 浮字抖动 + 闪烁（纯 CSS，图片到位前文字一样抖）
     分工：外层 .fx-dmg 管位移（fxDmg 的 translate/scale），内层 .fx-in 管抖动/闪烁 —— 不抢 transform */
  .fx-in{display:inline-block; animation:fxJitter .16s ease-in-out 2;}
  @keyframes fxJitter{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
  /* 大伤害档：与打击音效 hit_crit 同阈值（isCritHit：击杀 或 ≥20）。抖动幅度 ×2 + 闪一下 + 字号抬到 28px；
     数字图随 em 自动缩放，**不需要美术多交一套尺寸**。 */
  .fx-dmg.crit{font-size:28px;}
  .fx-dmg.crit .fx-in{animation:fxJitterBig .18s ease-in-out 3, fxFlash .22s ease-out 1;}
  @keyframes fxJitterBig{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  @keyframes fxFlash{0%{filter:brightness(2.4)}100%{filter:brightness(1)}}
  #tooltip{position:fixed; z-index:9999; max-width:250px; padding:9px 11px; background:rgba(24,18,12,.96); border:1px solid var(--gold); border-radius:7px; color:#e8dcc0; font-size:12px; line-height:1.5; pointer-events:none; opacity:0; transform:translateY(3px); transition:opacity .12s ease, transform .12s ease; box-shadow:0 6px 18px rgba(0,0,0,.55);}
  #tooltip.show{opacity:1; transform:translateY(0);}
  #tooltip .tt-title{font-weight:bold; color:#f0e0b8; margin-bottom:3px;}
  #tooltip .tt-line{color:#cbbd9a;}
  #tooltip .tt-story{color:#a8987a; font-size:11px; margin-top:5px; border-top:1px dashed rgba(201,168,106,.35); padding-top:5px;}
  .kw{color:var(--gold); cursor:help; border-bottom:1px dotted rgba(201,168,106,.55);}

  /* —— 顶栏折叠 / 底部操作区 / 触控容错 / 流畅模式 —— */
  #topbar{cursor:pointer; user-select:none;}
  .tb-toggle{background:transparent; border:1px solid var(--ink3); color:var(--dim); border-radius:6px; font-size:12px; padding:4px 12px; cursor:pointer; letter-spacing:1px; min-height:28px;}
  .tb-toggle:hover{color:var(--text); border-color:var(--dim);}
  /* v0.71.0：`flex-basis:100%` → `auto`。原先详情条**不管有没有内容都独占一整行**
     （实测空着也是 20px：border-top 1 + padding-top 8 + margin-top 2 + 行高 9），
     而它是靠 `#topbar{flex-wrap:wrap}` 自己折行的 —— 内容多了照样折到新行，
     内容少时却白吃一行。矮窗档早就这么改了（T-mid 那条），基准档一直没跟。
     ⚠️ 这让基准档（含 1920×1080）的顶栏也矮约 20px —— 是本次版面收口的一部分。 */
  .tb-detail{flex-basis:auto; display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
  .tb-detail .stat{display:inline-flex; align-items:center;}
  #actions{position:sticky; bottom:0; z-index:8; display:flex; justify-content:center; gap:12px; padding:14px 0 12px; background:linear-gradient(180deg, transparent, var(--ink) 55%);}
  #actions button{min-width:64px; min-height:48px; padding:10px 20px;}
  #actions button#endTurn{font-size:18px; padding:12px 36px; letter-spacing:3px;}
  .map-node{min-height:0;}
  .map-node .node-ico{width:52px; height:52px;}
  /* v0.61.42：节点改绝对定位后行高由 CSS 定死，窄屏图标变小就得同步收行高，否则空档过大 */
  .map-row{height:82px;}
  #overlay .close-x{width:44px; height:44px; line-height:42px; font-size:22px;}
  #hand .card.pressed{z-index:60; transform:rotate(var(--rot,0deg)) translateY(-16px) scale(1.18); box-shadow:0 8px 24px rgba(0,0,0,.65), 0 0 0 2px var(--gold);}
  /* 流畅模式（低配机）：关闭震动/抖动/飘字等重动画 */
  .low-spec .enemy.hit{animation:none;}
  .low-spec .card.shake{animation:none;}
  /* v0.65.0：新增的小窗/菜单入场也纳入门禁（此前 turnBanner/floatMsg/heroAnim 等均无门禁，是历史遗漏） */
  .low-spec #overlay.ov-enter #overlayWrap{animation:none;}
  .low-spec #overlay.ov-enter.menu-scene .menu-tier{animation:none;}
  .low-spec button.btn,.low-spec button.btn.ghost{transition:none;}
  /* v0.66.0：主菜单那 6 条待机/演出动画一并纳入（`#overlay.ov-enter #overlayWrap` 那条 (2,3,0)
     已经盖住了 scrollDrop 的 (2,2,0)，卷轴不用再写）。
     ⚠️ 这几条的**特异度必须 >= 原规则**：本块在文件里更靠后，同特异度靠书写顺序就能赢，
        但低一档就会被压回去 —— 尤其 `.menu-hit.is-breaking .menu-shard` 是 (0,3,0)，
        写成 `.low-spec .menu-shard`（0,2,0）会漏，碎片照样飞。 */
  .low-spec .menu-bgimg.a,
  .low-spec .menu-hit .menu-art,
  .low-spec .menu-hit.is-breaking .menu-shard,
  .low-spec .menu-flash.on{animation:none;}
  /* v0.68.1：标题的「字迹边框」呼吸。**只关动画、保留静态 filter** ——
     边框特效本身就是静止也成立的描边，低配机上没理由把它一并砍掉。
     ⚠️ 选择器必须带 `.menu-title`：(0,3,0) 才对得过基样式的 `.menu-title .menu-art`（0,2,0）。 */
  .low-spec .menu-title .menu-art{animation:none;}
  .low-spec .menu-hit{transition:none;}
  /* v0.65.0：系统级「减弱动态效果」——全项目此前零处理，这是第一个缺口。
     复用同一套关闭规则，不改造既有 22 条 keyframes。 */
  @media (prefers-reduced-motion: reduce){
    #overlay.ov-enter #overlayWrap{animation:none;}
    #overlay.ov-enter.menu-scene .menu-tier{animation:none;}
    /* ⚠️ 必须**连 scroll-scene 一起写**：`#overlay.ov-enter #overlayWrap` 是 (2,1,0)，
       压不过 scrollDrop 的 (2,2,0)（@media 不加特异度）—— 漏了这条，开了「减弱动态效果」
       卷轴反而照落。同理下面几条也不能省。 */
    #overlay.scroll-scene.ov-enter #overlayWrap{animation:none;}
    /* ⚠️ 这几个选择器**必须带上 `#overlay` 前缀抬特异度**：@media 不加特异度，而基样式里
       `.menu-hit.is-start .menu-art`（呼吸）与 `.menu-hit.is-collection .menu-art`（飘动）都是
       (0,3,0)，原先写成 `.menu-hit .menu-art`（0,2,0）**压不过** ⇒ 开了「减弱动态效果」
       石碑照呼吸、符纸照飘，等于这条没写。抬到 (1,2,0) 后不挑档位、新增符纸也自动覆盖。
       （低配那条没这问题：`.low-spec .menu-hit .menu-art` 本来就是 (0,3,0)，靠书写顺序取胜。） */
    #overlay .menu-bgimg.a,#overlay .menu-hit .menu-art,
    #overlay .menu-hit.is-breaking .menu-shard,#overlay .menu-flash.on,
    #overlay .menu-title .menu-art{animation:none;}
    .menu-hit{transition:none;}
    button.btn,button.btn.ghost{transition:none;}
    #overlay{transition:none;}
  }

  /* —— 出卡动效：攻击=符箓+朱砂爆裂，防御=金光护体，召唤=黑雾聚形 —— */
  .fx-talisman{position:absolute; width:32px; height:44px; left:0; top:0; background:linear-gradient(180deg,#f0e2ac,#d8b45e); border:1px solid var(--red); border-radius:3px; box-shadow:0 0 14px rgba(224,179,65,.8); z-index:6; transition:transform .3s cubic-bezier(.3,.7,.4,1), opacity .3s; pointer-events:none;}
  .fx-talisman::after{content:"符"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--font-kai); color:var(--red); font-size:20px; font-weight:bold;}
  .fx-burst{position:absolute; width:12px; height:12px; left:0; top:0; border-radius:50%; background:var(--red); box-shadow:0 0 20px 8px rgba(178,59,46,.7); transform:translate(-50%,-50%); animation:fxBurst .55s ease-out forwards; pointer-events:none;}
  @keyframes fxBurst{0%{opacity:1; transform:translate(-50%,-50%) scale(.4)}60%{opacity:.95; transform:translate(-50%,-50%) scale(2.4)}100%{opacity:0; transform:translate(-50%,-50%) scale(3.6)}}
  .fx-halo{position:absolute; left:0; top:0; border-radius:50%; border:3px solid var(--gold); box-shadow:0 0 28px 8px rgba(224,179,65,.5), inset 0 0 22px rgba(224,179,65,.3); transform:translate(-50%,-50%); animation:fxHalo .6s ease-out forwards; pointer-events:none;}
  @keyframes fxHalo{0%{opacity:.9; transform:translate(-50%,-50%) scale(.45)}100%{opacity:0; transform:translate(-50%,-50%) scale(1.9)}}
  .fx-mist{position:absolute; left:0; top:0; border-radius:50%; background:radial-gradient(circle, rgba(52,36,64,.92), rgba(16,10,18,0) 70%); filter:blur(5px); transform:translate(-50%,-50%); animation:fxMist .75s ease-out forwards; pointer-events:none;}
  @keyframes fxMist{0%{opacity:0; transform:translate(-50%,-50%) scale(.3)}45%{opacity:.85; transform:translate(-50%,-50%) scale(1.25)}100%{opacity:0; transform:translate(-50%,-50%) scale(2.1)}}
  .fx-skill{position:absolute; left:0; top:0; border-radius:50%; border:2px solid var(--blue); transform:translate(-50%,-50%); animation:fxHalo .45s ease-out forwards; pointer-events:none;}
  /* —— 受击分层：精英屏幕微震 / Boss 全屏墨晕 —— */
  #app.micro-shake{animation:microShake .18s ease;}
  @keyframes microShake{0%,100%{transform:translateX(0)}30%{transform:translateX(-3px)}60%{transform:translateX(3px)}}
  .fx-ink{position:absolute; inset:0; z-index:6; animation:inkWash .6s ease-out forwards; pointer-events:none;}
  @keyframes inkWash{0%{opacity:0}25%{opacity:.85}100%{opacity:.08}}
  /* —— Boss 战前过场：墨韵铺开 + 名讳印章 —— */
  #boss-intro{position:fixed; inset:0; z-index:70; display:none; align-items:center; justify-content:center; pointer-events:auto; opacity:0;}
  #boss-intro.show{display:flex; opacity:1;}
  #boss-intro .boss-ink{position:absolute; inset:0; background:radial-gradient(circle at center, rgba(8,5,8,0) 15%, rgba(8,5,8,.92) 100%); animation:inkSpread 1.15s ease-out forwards;}
  @keyframes inkSpread{0%{opacity:0; transform:scale(.55)}55%{opacity:1}100%{opacity:1; transform:scale(1)}}
  #boss-intro .boss-seal{position:relative; font-family:var(--font-kai); background:linear-gradient(160deg,#a02c20,#7c1f16); color:#f2e6c8; border:3px solid #5a1d16; border-radius:8px; padding:22px 34px; text-align:center; box-shadow:0 0 44px rgba(178,59,46,.65); animation:sealStamp .9s cubic-bezier(.2,.9,.3,1.35) forwards;}
  #boss-intro .bs-name{font-size:44px; letter-spacing:10px; display:block; text-shadow:0 2px 6px rgba(0,0,0,.5);}
  #boss-intro .bs-sub{font-size:14px; letter-spacing:6px; opacity:.85; margin-top:8px; display:block;}
  /* v0.61.20(P4)：二阶段转场 —— 同一枚印章，换成「裂印 + 红目」：印面转暗红、两道裂纹透光、双瞳亮起 */
  #boss-intro.phase2 .boss-seal{background:linear-gradient(160deg,#4a1008,#240705); border-color:#c0342a; overflow:hidden;
    box-shadow:0 0 64px rgba(220,60,40,.75), inset 0 0 34px rgba(0,0,0,.72); animation:sealCrack .9s cubic-bezier(.2,.9,.3,1.35) forwards;}
  #boss-intro.phase2 .boss-seal::after{content:""; position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen;
    background:linear-gradient(74deg, transparent 47.2%, rgba(255,130,95,.95) 47.2% 48.1%, transparent 48.1%),
               linear-gradient(-57deg, transparent 61.5%, rgba(255,130,95,.62) 61.5% 62.2%, transparent 62.2%);}
  #boss-intro.phase2 .bs-eyes{display:block; font-size:26px; letter-spacing:16px; margin-bottom:6px; color:#ff5a34; text-indent:16px;
    text-shadow:0 0 16px rgba(255,70,30,.95), 0 0 34px rgba(255,70,30,.6); animation:eyeBlink 2.4s ease-in-out infinite;}
  #boss-intro.phase2 .bs-name{color:#ff8a68; text-shadow:0 0 20px rgba(255,80,40,.85), 0 2px 6px rgba(0,0,0,.9);}
  #boss-intro.phase2 .bs-sub{color:#ffb08a; opacity:1;}
  #boss-intro.phase2 .boss-ink{background:radial-gradient(circle at center, rgba(72,6,0,0) 12%, rgba(72,6,0,.94) 100%);}
  @keyframes sealCrack{0%{transform:scale(1.55) rotate(-4deg); filter:blur(7px); opacity:0;} 62%{transform:scale(.97) rotate(1deg); opacity:1;} 100%{transform:scale(1) rotate(0); filter:blur(0); opacity:1;}}
  @keyframes eyeBlink{0%,44%,56%,100%{opacity:1;} 50%{opacity:.25;}}
  @keyframes sealStamp{0%{opacity:0; transform:scale(2.3) rotate(-7deg)}55%{opacity:1; transform:scale(.92) rotate(-2deg)}100%{opacity:1; transform:scale(1) rotate(0)}}
  /* —— 交互式新手引导 —— */
  #tut-hint{position:fixed; left:50%; bottom:92px; transform:translateX(-50%); z-index:30; background:rgba(24,18,12,.96); border:1px solid var(--gold); border-radius:10px; padding:10px 18px; color:var(--gold); font-size:14px; letter-spacing:1px; box-shadow:0 6px 20px rgba(0,0,0,.6); pointer-events:none; white-space:nowrap;}

  /* v0.61.20(P8)：条件引导气泡 —— 首次遇到 诅咒/格挡/召唤物/尸气 各弹一次，可点掉、7 秒自动收 */
  #tip-bubble{position:fixed; left:50%; bottom:150px; transform:translateX(-50%); z-index:32; max-width:min(560px,92vw);
    background:rgba(24,18,12,.96); border:1px solid var(--gold); border-left:4px solid var(--gold); border-radius:10px; padding:10px 18px;
    color:var(--text); font-size:14px; line-height:1.75; letter-spacing:1px; box-shadow:0 6px 22px rgba(0,0,0,.66); cursor:pointer;
    pointer-events:none; opacity:0; transition:opacity .25s ease;}
  /* ⚠️ 只在 .show 时可点。原先一直可点 —— 而它是 `opacity:0` **隐藏但仍在**，
     所以没显示时也是一枚看不见的挡板，正好吃掉手牌下方那一带的拖拽落点。 */
  #tip-bubble.show{opacity:1; pointer-events:auto;}
  #tip-bubble .tip-tag{display:inline-block; background:var(--gold); color:#241a10; border-radius:4px; padding:1px 8px; margin-right:8px; font-size:12px; letter-spacing:0; font-weight:bold;}
  #tip-bubble b{color:#f0e0b8;}
  /* v0.61.20(P3)：拖拽指向敌人时，目标头顶的受击预览。
     v0.61.33：卡面徽章已删，这里成为预伤的**唯一**显示处，且按「拖拽所见目标」实时算（previewDamage(c, e)）。 */
  #drag-dmg{position:fixed; z-index:34; pointer-events:none; font-family:var(--font-kai); font-size:30px; font-weight:bold; letter-spacing:1px;
    color:#ff9a3c; text-shadow:0 0 12px rgba(0,0,0,.95), 0 2px 5px rgba(0,0,0,.9); transform:translate(-50%,-100%); transition:opacity .1s ease;}
  #drag-dmg.weak{color:#8fc6ff;}
  #drag-dmg.dyn{opacity:.9;}
  #drag-dmg.off{display:none;}
  /* —— 成就 · 卡背 / 头像框外观（局外收集奖励） —— */
  body[data-cardback="cb_jinsha"]{--cb:linear-gradient(90deg,#d4af37,#8c6d1f,#d4af37);}
  body[data-cardback="cb_moqi"]{--cb:linear-gradient(90deg,#1a1a1a,#000,#1a1a1a);}
  body[data-cardback="cb_yanmo"]{--cb:linear-gradient(90deg,#8c1f1f,#3a0f0f,#8c1f1f);}
  body[data-frame="af_zijin"] .hero-art-box{box-shadow:0 0 0 3px #9b59b6, 0 0 0 6px #f1c40f;}
  body[data-frame="af_chijin"] .hero-art-box{box-shadow:0 0 0 3px #e74c3c, 0 0 0 6px #f39c12;}
  /* ⚠️ 收起态必须用 calc(-100% - 24px)，**不能写 -140%**：toast 是空元素时高度只有 26px
     （padding 12×2 + 边框），-140% 只有 -36.4px，配 top:14px 后底边停在 y≈+4 ——

  /* ================= v0.70.0 全局横屏返工 =================
     分档轴 = **视口高度**，不是 orientation。为什么：
     1920x1080 / 1280x720 / 960x540 / 640x360 四个验收尺寸**全是 landscape**
     ⇒ orientation 在这套矩阵上恒真、零区分度，却引入模拟器与分屏误判的假失败面。
     真正失效的语义是「内容比视口高」，那是 height。

     档位（必须**从高到矮**书写：媒体查询不加特异度，同属性靠书写顺序定胜负，
     而原文件是反的 —— 窄档排在宽档前面，只是靠"两档属性基本不重叠"侥幸没出事）：
       基档      无查询       1920x1080、无头 1280x720
       T-mid     ≤700px 高    960x540、1024x640、带浏览器 chrome 的真实 720p
       T-short   ≤560px 高    640x360、667x375、844x390、932x430

     700 是**刻意卡在 720 下面**的：无头 1280x720 必须留在基档（v0.69.0 全部实拍
     基线都在那一档）。代价是只差 20px ⇒ T-mid 只能是**温和档**，误入也不难看。
     560 给 960x540（540）留 20px 余量。
     档内一律 clamp() 高度驱动 ⇒ 一档连续服务 360~560，不给 540 单开一档。

     基档（≥701px 高）本批**一行未改**：它是已验收的基线，改它等于拿验证过的
     东西冒险，而这两个高度档给的都是显式值，本来也不需要基档配合。 */

  /* —— T-mid：矮窗。温和档，只动四件事 —— */
  @media (max-height:700px){
    h1.title{font-size:22px; letter-spacing:3px; margin-bottom:2px;}
    h1.title small{display:none;}
    #app{padding:8px 10px 12px;}
    #topbar{padding:6px 10px; margin-bottom:6px;}
    .tb-toggle{min-height:28px; padding:2px 10px;}
    .hint{display:none;}
    /* 详情条在基档是 flex-basis:100%（独占一整行，为遗物/药水留宽度）。
       矮窗里它**空着也白吃一行**（实测 1024×640 顶栏 65px 里有 20px 是它）。
       改内联：有内容照样自动换行，没内容就不占行。 */
    .tb-detail{flex-basis:auto; border-top:0; padding-top:0; margin-top:0; gap:6px;}
    /* 敌人宽度是写死的 px（92/184/280/372），窗口一窄 #enemy-panel 就换行，
       而 `.battle{align-items:flex-end}` 会把行数**直接乘进纵向高度**——
       实测 1024×640：log 占 236 宽 ⇒ 敌人只剩 540 ⇒ 叠成 664px 高、整页 1010px。
       宽度的问题就用宽度单位解（vw）：1280×720 仍在基档、一行未动。 */
    /* ⚠️ 这里**不能**用 vw：`#app{max-width:1060px}` 把可用宽度封了顶，
       而 vw 跟着视口一起涨 —— 1366 宽时 13vw=178px，可用的只有 572px，照样换行。
       百分比的参照物是 `#enemy-panel` 的 content box，跟可用宽度同增同减，
       所以 min(基档值, N%) 在任何视口下都恒定装得下。 */
    .enemy.e-summon{width:min(92px,15%);}
    .enemy.e-normal{width:min(184px,28%);}
    .enemy.e-elite{width:min(280px,45%);}
    .enemy.e-boss{width:min(372px,60%);}
    /* v0.71.0：立绘高度那四条**已上提到基档**（锚点从 700 抬到 880，公式同源）。
       原来这里是「锚 700」的另一套 k，与基档那套在 700/701 上各算各的 ——
       基档是定值、这里锚 700，于是 701 用基档的定值、700 用这里的公式值，
       看着「正好等于基档值」很安全，其实**基档那一侧根本没在缩**：
       vh=700 时这档算出 372（=基档值），整页就顶穿 112px。
       两档共用一条函数之后这段缺口整段消失（实测 601–1080 全部为 0）。
       ⚠️ 这四条删不得也补不得：补回来就会把基档那条盖掉（同特异度、它写在后面）。 */
    /* 手牌同理：19vh 在 700px 处正好落回基档的 132/200，所以 700 那一档一字未变。
       下限 110/167 是给 561（这档的最低端）留的。 */
    #hand{--card-w:clamp(110px,19vh,132px); min-height:clamp(167px,28.8vh,200px);}
  }

  /* —— T-short：手机横屏。激进档 —— */

    h1.title{font-size:14px; letter-spacing:2px; margin-bottom:0; line-height:22px; min-height:22px;}

    .title-actions{gap:4px;}

    .title-actions button.btn{padding:1px 6px; font-size:10px; letter-spacing:0;}

    button.btn.ghost{padding:3px 9px; font-size:11px;}

    #turn-summary{margin-bottom:3px; padding:2px 8px; font-size:11px; line-height:1.3;}
    .stat{font-size:11px;} .stat b{font-size:12px;}
    .tb-toggle{min-height:22px; padding:0 8px; font-size:11px;}
    /* 详情条在基准档是 flex-basis:100%（独占一整行，为遗物/药水留宽度）。
       390 高的屏上它**空着也白吃一行**（实测 9px + 行距 = 20px，正好是溢出的主因），
       所以矮屏档改回内联：有内容照样自动换行，没内容就不占行。 */
    .tb-detail{flex-basis:auto; border-top:0; padding-top:0; margin-top:0; gap:6px;}
    /* v0.71.0：`.tb-summons` 是**同一类漏网**（`.tb-detail` 上面那条修好了，它没有）。
       基档 `.tb-summons{flex-basis:100%}`（:98）让召唤物那行**独占一整行**，
       在 390 高的屏上是又一笔白吃的高度。改为内联：有召唤物照样自动换行，没有就不占行。 */
    .tb-summons{flex-basis:auto; gap:4px;}
    /* v0.71.0：顶栏那枚遗物 chip 在矮屏档一字未改（只有 ≤520 **宽**档收过，横屏拿不到）
       ⇒ 图标 24px + padding 在 390 高的屏上偏胖。与地图顶栏同口径收一档。 */
    .prelic-chip{padding:1px 5px 1px 1px;}
    .prelic-chip .ricon{width:18px; height:18px;}
    /* v0.71.0：成就吐司从视口上方掉下来，`top:14px` + `min-width:240px` 正好**盖住
       顶部那三枚按钮**（战报/牌库/菜单）。矮屏压小一圈并往边上去，减少遮挡。 */
    #achieve-toast{top:6px; min-width:180px; padding:7px 12px;}
    #achieve-toast .at-icon{font-size:18px;}
    #achieve-toast .at-title{font-size:14px; letter-spacing:1px; margin-top:3px;}
    #achieve-toast .at-sub{font-size:11px; margin-top:2px;}
    /* v0.71.0：Boss 出场在矮屏档一字未改 ⇒ `.bs-name` 44px + 印章块 22px/34px 的 padding
       ≈150px 高，在 390 高的屏上四个角贴边。压到与屏高相称。 */
    #boss-intro .boss-seal{padding:12px 20px; border-width:2px;}
    #boss-intro .bs-name{font-size:26px; letter-spacing:5px;}
    #boss-intro .bs-sub{font-size:11px; letter-spacing:3px; margin-top:4px;}
    /* v0.71.0：飘字/回合横幅只有 ≤520 **宽**档收过（:1205-1206），横屏（844 宽）拿不到
       ⇒ 26px 的楷体飘字在 390 高的屏上占掉 7% 的高度。与窄屏档同口径收一档。 */
    #float-msg{top:30%;}
    #float-msg .fm{font-size:20px;}
    #turn-banner{font-size:18px; top:14%;}

    /* 横屏版面：显式写回 row，不靠书写顺序碰运气 */
    #field{flex-direction:row; gap:8px; align-items:flex-start;}
    .battle{flex-direction:row; gap:8px; margin-bottom:0;}

    /* 矮屏档的 #log 不再单列 —— v0.71.0 起**基档就是抽屉**（见基档那条长注释），
       这里只剩字号这一处矮屏专属的收窄。
       640 宽下这一档仍然最吃紧（#col-main 362、减掉玩家面板 200 ⇒ 敌人只有 148px），
