<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
<title>志怪塔 · 原型 v0.61.30</title>
<style>
  :root{
    --ink:#171310; --ink2:#221c17; --ink3:#2c251e;
    --paper:#efe3c8; --paper2:#d9c9a8; --text:#ece1cb; --dim:#9a8f78;
    --red:#b23b2e; --red2:#8c2b21; --gold:#e0b341; --green:#3fa060;
    --white:#cfc5b2; --blue:#6ea8d8; --purple:#b07fd8;
    --font-kai:"KaiTi","STKaiti","华文楷体","楷体","Noto Serif SC",serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif; color:var(--text); min-height:100vh; min-height:100dvh;
    background:
      radial-gradient(circle at 15% 12%, rgba(178,59,46,.10), transparent 40%),
      radial-gradient(circle at 85% 8%, rgba(224,179,65,.06), transparent 35%),
      linear-gradient(180deg, #241d16 0%, var(--ink) 30%, #120e0b 100%);
    background-attachment:fixed;
    touch-action:manipulation; overscroll-behavior:none; -webkit-user-select:none; user-select:none;}
  #app{max-width:1060px; margin:0 auto; padding:14px 14px 30px; position:relative; z-index:1;}
  @media (max-width:520px){ #app{padding:6px 6px 24px;} }
  h1.title{font-family:var(--font-kai); font-size:28px; letter-spacing:6px; color:var(--gold); margin-bottom:6px; text-align:center; text-shadow:0 0 18px rgba(224,179,65,.25); position:relative;}
  h1.title small{color:var(--dim); font-size:12px; letter-spacing:0; font-family:"Microsoft YaHei",sans-serif;}

  #topbar{display:flex; flex-wrap:wrap; gap:12px; align-items:center; background:var(--ink2); border:1px solid var(--ink3); border-radius:10px; padding:10px 14px; margin-bottom:10px;}
  .stat{font-size:14px;}
  .stat b{color:var(--gold); font-size:16px;}
  .stat-xuenu b{color:var(--red);}
  .hpbar,.enemyhpbar{width:150px; height:12px; background:#000; border:1px solid var(--ink3); border-radius:6px; overflow:hidden; display:inline-block; vertical-align:middle; position:relative;}
  .hpbar i,.enemyhpbar i{position:absolute; left:0; top:0; height:100%; display:block; transition:width .4s cubic-bezier(.22,1,.36,1);}
  .hpbar i.hpfill,.enemyhpbar i.hpfill{background:var(--red);}
  .hpbar i.hpghost,.enemyhpbar i.hpghost{background:rgba(255,206,130,.45); transition:width .85s ease-out .15s;}
  /* 格挡时水晶蓝血条 */
  /* v0.61.20(P9)：有格挡时血条套一层「斜纹护罩」纹理 —— 不再是纯色替换，灰度下仍看得出底下是血 */
  #player-panel .hpbar.has-block .hpfill{background:repeating-linear-gradient(45deg,#5bb8d8 0 3px,#3a9cc0 3px 6px); box-shadow:0 0 6px rgba(90,180,210,.4);}
  #player-panel .hpbar.has-block .hpghost{background:rgba(160,210,240,.35);}
  .hp-label{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:bold; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.7); z-index:1; pointer-events:none;}
  /* 血条下方数值（血量+格挡） */
  .pstats{display:flex; gap:10px; justify-content:center; margin-top:3px; font-size:13px; font-weight:bold;}
  .pstat-hp,.pstat-block{display:inline-flex; align-items:center; gap:3px;}
  .pstat-hp i,.pstat-block i{display:inline-block; width:9px; height:9px; border-radius:50%;}
  .pstat-hp{color:#e8d9c4;} .pstat-hp i{background:var(--red);}
  .pstat-block{color:#bfe6f5;} .pstat-block i{background:repeating-linear-gradient(45deg,#7fd0e8 0 2px,#2f7f9c 2px 4px); border-radius:2px;}
  /* 预格挡：紧挨格挡标记的蓝色向上箭头，箭头 9×11px（与格挡圆点 9px 同宽，不抢视线） */
  .pstat-preblock{display:inline-flex; align-items:center; gap:2px; color:#8ed0ff; font-size:11px; line-height:1;}
  .pstat-preblock svg{display:block; width:9px; height:11px; filter:drop-shadow(0 0 3px rgba(74,168,255,.6));}
  /* 玩家面板遗物 */
  .player-relics{display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
  .prelic-chip{display:inline-flex; align-items:center; gap:3px; background:rgba(224,179,65,.08); border:1px solid var(--ink3); border-radius:6px; padding:2px 6px 2px 2px; cursor:default;}
  .prelic-chip .ricon{width:24px; height:24px; margin:0; border-radius:4px;}
  .prelic-chip .prelic-name{font-size:10px; color:var(--gold); white-space:nowrap;}
  /* 锻造页：升级无变化的牌置灰、不可锻造 */
  .card.locked{filter:grayscale(1) brightness(.88); opacity:.55; cursor:not-allowed;}
  .card.locked:hover{transform:none;}
  .card.locked .cost{background:var(--ink3);}
  .noup{font-size:9px; color:var(--dim); border:1px solid var(--ink3); border-radius:6px; padding:0 4px; margin-left:4px; vertical-align:middle; white-space:nowrap;}
  .tb-summons{display:flex; flex-wrap:wrap; gap:6px; flex-basis:100%;}
  /* 顶栏 stat 图标替换 */
  .stat-hp i,.stat-block i,.stat-gold i{display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:2px; vertical-align:middle;}
  .stat-hp i{background:var(--red);}
  /* v0.61.20(P9)：色弱可辨 —— 格挡用「斜纹 + 方角」，血条用「纯色 + 圆点」。灰度打印/色弱下靠纹理与形状也能分开 */
  .stat-block i{background:repeating-linear-gradient(45deg,#7fd0e8 0 2px,#2f7f9c 2px 4px); border-radius:2px;}
  .stat-gold i{background:var(--gold);}
  .stat-level{color:var(--dim);}
  .stat-deck{color:var(--dim);}
  .stat-deck b{color:var(--dim);}

  #field{display:flex; gap:14px; align-items:flex-start;}
  #col-main{flex:1 1 auto; min-width:0;}
  .battle{display:flex; gap:14px; align-items:flex-end; margin-bottom:4px;}
  #player-panel{flex:0 0 200px; background:transparent; border:none; border-radius:0; padding:0; text-align:center; display:flex; flex-direction:column; align-items:center; position:relative; z-index:2100;}
  .hero-art-box{width:100%; height:186px; margin-bottom:4px; border-radius:0; overflow:visible; background:transparent; display:flex; align-items:flex-end; justify-content:center; position:relative;}
  .hero-art-box::after{content:''; position:absolute; bottom:-2px; left:8%; right:8%; height:3px; background:radial-gradient(ellipse at center, rgba(224,179,65,.28), transparent 80%); pointer-events:none; border-radius:50%;}
  .hero-art-box .hero-art{width:auto; height:100%; max-width:100%; object-fit:contain; object-position:bottom center; display:block; filter:drop-shadow(0 8px 16px rgba(0,0,0,.55)); transition:transform .15s ease, filter .15s ease;}
  /* 角色动画状态（为后续攻击/受击动画预留） */
  .hero-art-box.hero-attack .hero-art{transform:translateX(18px) scale(1.05); filter:drop-shadow(0 8px 16px rgba(0,0,0,.55)) brightness(1.2);}
  .hero-art-box.hero-hit .hero-art{animation:heroHit .35s ease;}
  .hero-art-box.hero-cast .hero-art{filter:drop-shadow(0 0 22px rgba(224,179,65,.8)) brightness(1.3);}
  @keyframes heroHit{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
  .hero-emoji{font-size:72px; opacity:.35;}
  .pname{font-family:var(--font-kai); font-size:19px; color:var(--gold); letter-spacing:2px; margin-bottom:8px;}
  .pmech{display:inline-block; font-size:12px; color:var(--gold); background:rgba(224,179,65,.08); border:1px solid var(--ink3); border-radius:20px; padding:2px 10px; margin-bottom:8px; letter-spacing:1px; cursor:default;}
  .prow{font-size:13px; color:var(--dim); margin:3px 0;}
  .prow b{color:var(--gold); font-size:15px;}
  #player-panel .hpbar{width:100%; margin:4px 0;}
  #player-panel .badges{justify-content:center;}
  .prelics{font-size:11px; color:var(--gold); margin-top:8px; line-height:1.8;}
  #enemy-panel{display:flex; flex-direction:row-reverse; flex-wrap:wrap; justify-content:flex-start; align-items:flex-end; gap:24px 30px; flex:1 1 auto; min-width:0; padding:2px 2px 0;}
  .enemy{position:relative; background:transparent; border:none; border-radius:0; padding:0; cursor:pointer; display:flex; flex-direction:column; align-items:center; text-align:center; flex:0 0 auto; min-width:0; transition:filter .12s ease; -webkit-tap-highlight-color:transparent;}
  /* v0.61.20(P7)：触屏下用伪元素把点击热区撑到 ≥120px 宽、上下各多 18px。
     伪元素不参与 DOM，elementFromPoint 仍返回宿主 .enemy，所以 enemyAtPoint() 一行不用改。
     只在 (pointer:coarse) 或窄屏生效 —— 桌面用鼠标，热区变大反而会让相邻敌人互相抢点击。 */
  @media (pointer:coarse), (max-width:760px){
    .enemy::after{content:""; position:absolute; left:50%; transform:translateX(-50%); top:-18px; bottom:-18px; width:max(100%,120px);}
  }
  .enemy.e-summon{width:92px;}
  .enemy.e-normal{width:184px;}
  .enemy.e-elite{width:280px;}
  .enemy.e-boss{width:372px;}
  .enemy .eportrait.e-summon{height:93px;}
  .enemy .eportrait.e-normal{height:186px;}
  .enemy .eportrait.e-elite{height:280px;}
  .enemy .eportrait.e-boss{height:372px;}
  .enemy .enemyhpbar{width:134px;}
  .enemy.e-elite .enemyhpbar{width:194px;}
  .enemy.e-boss .enemyhpbar{width:262px;}
  .enemy.edepth .eportrait{filter:brightness(.86) saturate(.9) drop-shadow(0 4px 8px rgba(0,0,0,.4));}
  .enemy.edepth .ename{opacity:.72;}
  .enemy.selected .eportrait{filter:drop-shadow(0 8px 16px rgba(0,0,0,.6)) drop-shadow(0 0 14px rgba(224,179,65,.6)) brightness(1.12);}
  .enemy.selected .ename{color:#ffd76a;}
  .enemy .ename{font-family:var(--font-kai); font-size:19px; color:var(--red); letter-spacing:2px; margin-bottom:6px;}
  .badges{margin-top:6px; display:flex; flex-wrap:wrap; gap:6px;}
  .badge{font-size:12px; padding:2px 8px; border-radius:20px; border:1px solid var(--ink3); color:var(--dim);}
  .badge.curse{color:#c86bd8;} .badge.charm{color:#e06b9b;} .badge.strength{color:#e08b3a;} .badge.seal{color:#3ac0c0;} .badge.thorns{color:#e06b6b;} .badge.affix{color:#e0b060;} .badge.ybtarget{color:#ffd76a; border-color:rgba(255,215,106,.7); background:rgba(255,215,106,.12);}
  .intent{margin-top:8px; font-size:14px; color:var(--gold);}
  .intent::before{content:"⚠ 意图："; color:var(--dim);}
  .summon{font-size:12px; padding:3px 10px; border-radius:16px; border:1px solid var(--gold); color:var(--gold); background:rgba(224,179,65,.08);}
  /* v0.61.20(P2)：地图路径连线 —— 行与行之间用 SVG 曲线连起来，已走=金色实线、可达=金色虚线、其余=暗线 */
  .map-wrap{position:relative;}
  .map-lines{position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; overflow:visible; z-index:0;}
  .map-lines path{fill:none; stroke-linecap:round;}
  .map-lines path.link-dim{stroke:var(--ink3); stroke-width:2; opacity:.55;}
  .map-lines path.link-reach{stroke:var(--gold); stroke-width:3; opacity:.9; stroke-dasharray:7 5; animation:linkFlow 1.1s linear infinite;}
  .map-lines path.link-past{stroke:var(--gold); stroke-width:3.5; opacity:.95;}
  @keyframes linkFlow{to{stroke-dashoffset:-24;}}
  .map-row{position:relative; z-index:1; display:flex; justify-content:center; gap:12px; margin:10px 0;}
  .map-node{min-width:96px; padding:10px 16px; border-radius:8px; border:1px solid var(--ink3); background:var(--ink); color:var(--text); font-size:14px; letter-spacing:1px; cursor:default; text-align:center;}
  .map-node.empty{visibility:hidden;}
  .map-row.current .map-node{background:var(--red); color:#fff; border-color:var(--red); cursor:pointer;}
  .map-row.current .map-node:hover{background:var(--red2);}
  .map-row.current .map-node.blocked{background:var(--ink2); color:var(--dim); border-color:var(--ink3); cursor:not-allowed; opacity:.55;}
  .map-row.past .map-node{opacity:.3;}
  .map-row.future .map-node{opacity:.5;}

  #turn-summary{margin-bottom:6px; padding:8px 12px; background:rgba(224,179,65,.08); border:1px solid var(--gold); border-radius:8px; font-size:13px; color:var(--gold); line-height:1.6;}
  #turn-summary:empty{display:none;}
  #log{flex:0 0 236px; min-width:0; height:clamp(360px, calc(100vh - 190px), 660px); overflow-y:auto; background:var(--ink2); border:1px solid var(--ink3); border-radius:10px; padding:10px 12px; font-size:11.5px; color:var(--dim); line-height:1.6; box-sizing:border-box; position:sticky; top:8px; word-break:break-word;}
  #log .log-head{color:var(--gold); font-family:var(--font-kai); font-size:14px; letter-spacing:2px; margin-bottom:6px; border-bottom:1px solid var(--ink3); padding-bottom:4px;}
  #log .log-sep{color:#e0b060; font-weight:bold; margin:5px 0 2px;}
  /* v0.61.20(P5)：战报筛选 chip（伤害 / 获得 / 状态），空选=全部 */
  #log .log-head{display:flex; align-items:center; flex-wrap:wrap; gap:4px;}
  #log .log-chips{margin-left:auto; display:flex; gap:3px;}
  #log .log-chip{font-family:var(--font-kai); font-size:11px; letter-spacing:0; line-height:1.5; border:1px solid var(--ink3); background:transparent;
    color:var(--dim); border-radius:10px; padding:1px 8px; cursor:pointer; user-select:none;}
  #log .log-chip:hover{border-color:var(--gold); color:var(--gold);}
  #log .log-chip.on{background:var(--gold); border-color:var(--gold); color:#241a10; font-weight:bold;}
  #log .log-line{margin:1px 0;}

  #hand{display:flex; flex-wrap:nowrap; min-height:200px; align-items:flex-end; justify-content:center; padding:8px 0 16px; touch-action:none;}
  .hand-area{display:flex; align-items:flex-end; gap:8px;}
  .hand-area #hand{flex:1 1 auto; min-width:0;}
  .hand-area #endTurn{flex:0 0 auto; align-self:center; writing-mode:vertical-rl; letter-spacing:5px; font-size:17px; padding:16px 10px; min-height:132px;}
  /* v0.61.20(P1)：结束回合软提示 —— 竖排按钮左侧浮一枚小气泡，不挡手牌也不弹窗 */
  .hand-area .endcol{position:relative; flex:0 0 auto; align-self:center; display:flex; align-items:center;}
  #end-turn-hint{position:absolute; right:calc(100% + 10px); top:50%; transform:translateY(-50%); white-space:nowrap; pointer-events:none;
    background:rgba(24,18,12,.95); border:1px solid var(--gold); color:var(--gold); border-radius:8px; padding:6px 12px; font-size:12.5px; letter-spacing:1px;
    box-shadow:0 4px 14px rgba(0,0,0,.55); animation:hintPulse 1.8s ease-in-out infinite;}
  #end-turn-hint.off{display:none;}
  #end-turn-hint::after{content:""; position:absolute; left:100%; top:50%; margin-top:-5px; border:5px solid transparent; border-left-color:var(--gold);}
  #end-turn-hint b{color:#f0e0b8;}
  @keyframes hintPulse{0%,100%{opacity:.78;} 50%{opacity:1;}}
  .title-actions{position:absolute; right:4px; top:50%; transform:translateY(-50%); display:flex; gap:8px;}
  .title-actions .btn{min-width:0; padding:6px 12px; font-size:13px;}
  .rune-display{flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:2px; padding-bottom:14px; min-width:110px;}
  .rune-icon{width:105px; height:105px; object-fit:contain; filter:drop-shadow(0 0 8px rgba(180,140,220,.45));}
  .rune-fallback{font-size:90px; color:rgba(180,140,220,.6); line-height:1; display:none;}
  .rune-count{font-size:22px; font-weight:bold; color:var(--gold);}
  .card{width:132px; height:200px; position:relative; background:var(--paper); color:#2a2119; border-radius:8px; display:flex; flex-direction:column; cursor:pointer; border:2px solid transparent; box-shadow:0 3px 8px rgba(0,0,0,.45); transition:transform .13s ease; text-align:left; font-size:11px; overflow:hidden; touch-action:none;}
  .card::before{content:""; position:absolute; top:0; left:0; right:0; height:5px; background:var(--cb, linear-gradient(90deg,var(--red2),var(--red),var(--red2))); border-radius:8px 8px 0 0; opacity:.8; z-index:1;}
  .card.disabled{filter:grayscale(.8) brightness(.7); cursor:not-allowed;}
  .card .cart-wrap{width:100%; height:80px; flex:0 0 auto; background:linear-gradient(160deg,#d9c9a8,#c3a97e); overflow:hidden; position:relative;}
  .card .cart-wrap .cart{width:100%; height:100%; object-fit:cover; display:block;}
  .card .cost{position:absolute; top:6px; left:6px; width:24px; height:24px; border-radius:50%; background:#2a2119; color:var(--gold); font-weight:bold; display:flex; align-items:center; justify-content:center; font-size:14px; z-index:2; box-shadow:0 1px 3px rgba(0,0,0,.5);}
  .card .cname{font-family:var(--font-kai); font-weight:bold; font-size:14px; letter-spacing:1px; padding:6px 8px 2px; z-index:1;}
  .card .cdesc{flex:1; color:#4a3f2f; line-height:1.32; font-size:10.5px; padding:0 8px; overflow:hidden; word-break:break-word;}
  .card .ctype{font-size:9px; color:#7a6c52; padding:3px 8px 6px; letter-spacing:1px;}
  .reward-cards .card{height:auto; min-height:200px;}
  #hand .card{margin-left:-62px; transform-origin:bottom center; transform:rotate(var(--rot,0deg));}
  #hand .card:first-child{margin-left:0;}
  #hand .card:hover{z-index:40; transform:rotate(var(--rot,0deg)) translateY(-28px) scale(1.3);}
  .card.dragging{z-index:60; cursor:grabbing; box-shadow:0 10px 26px rgba(0,0,0,.6);}
  #hand .card.lift{transform:translateY(-56px) scale(1.5);}
  .enemy.drag-target .eportrait{filter:drop-shadow(0 8px 16px rgba(0,0,0,.6)) drop-shadow(0 0 16px rgba(255,106,60,.75)) brightness(1.15);}
  /* 拖拽箭头改为 SVG 曲线箭头（见 dragArrow / drawArrow） */
  .card.r-white{border-color:#b9ad95;} .card.r-white .cname{color:#4a4232;}
  .card.r-blue{border-color:var(--blue);} .card.r-blue .cname{color:#2b6ba0;}
  .card.r-purple{border-color:var(--purple);} .card.r-purple .cname{color:#7a3fa0;}
  .card.r-gold{border-color:var(--gold);} .card.r-gold .cname{color:#b8860b;}
  .upgrade-preview{color:#8c2b21; margin-top:5px; padding-top:5px; border-top:1px dashed #c9a; font-weight:bold;}
  .exhaust-tag{display:inline-block; font-size:10px; color:#fff; background:var(--red2); border-radius:4px; padding:1px 6px; margin:4px 0 2px; letter-spacing:1px;}
  /* 消耗牌标记：左侧红条（扇形手牌只露左缘，靠它一眼认出）+ 右上角「消耗」角标 */
  .card .oneuse-bar{position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--red2); z-index:3;}
  .card .oneuse{position:absolute; top:5px; right:5px; z-index:3; font-size:9px; line-height:1.35; color:#fff; background:var(--red2); border-radius:4px; padding:1px 5px; letter-spacing:1px; box-shadow:0 1px 3px rgba(0,0,0,.55); cursor:help;}
  .relic{width:150px; min-height:110px; background:var(--ink2); color:var(--text); border-radius:8px; padding:10px; display:flex; flex-direction:column; cursor:pointer; border:2px solid var(--ink3); text-align:left; font-size:12px; transition:border .1s;}
  .relic:hover{border-color:var(--gold);}
  .relic .cname{font-family:var(--font-kai); font-weight:bold; font-size:15px; margin-bottom:6px; color:var(--gold); letter-spacing:1px;}
  .relic .cdesc{flex:1; color:var(--dim); line-height:1.5; font-size:11px;}
  .relic .ctype{font-size:10px; color:var(--dim); margin-top:6px; letter-spacing:1px;}

  #actions{display:flex; justify-content:center; gap:12px; padding:10px 0; flex-wrap:wrap;}
  button.btn{background:var(--red); color:#fff; border:none; padding:10px 26px; border-radius:8px; font-size:16px; cursor:pointer; letter-spacing:2px;}
  button.btn:hover{background:var(--red2);}
  button.btn.ghost{background:transparent; border:1px solid var(--ink3); color:var(--dim); font-size:13px; padding:8px 16px; letter-spacing:1px;}
  button.btn.ghost:hover{color:var(--text); border-color:var(--dim);}

  #overlay{position:fixed; inset:0; background:rgba(10,8,6,.88); display:flex; align-items:center; justify-content:center; z-index:10;}
  #overlay.hidden{display:none;}
  #overlay .close-x{position:absolute; top:8px; right:8px; width:34px; height:34px; line-height:32px; text-align:center; font-size:20px; color:#fff; background:var(--red); border:1px solid #5a1d16; border-radius:50%; cursor:pointer; font-weight:bold; z-index:11;}
  #overlay .close-x:hover{background:var(--red2);}
  #overlayWrap{position:relative; max-width:620px; width:94%;}

  .hint{font-size:12px; color:var(--dim); text-align:center; margin-top:4px;}
  /* v0.61 B12：浮字改为小堆叠容器（最多 3 条并存，同类不再互相顶掉） */
  #float-msg{position:fixed; left:50%; top:34%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:2px; pointer-events:none; z-index:20;}
  #float-msg .fm{font-family:var(--font-kai); font-size:26px; color:var(--gold); text-shadow:0 0 12px rgba(0,0,0,.9), 0 2px 4px rgba(0,0,0,.8); letter-spacing:3px; white-space:nowrap; opacity:0; animation:floatUpItem 1.6s ease-out forwards;}
  @keyframes floatUpItem{0%{opacity:0; transform:translateY(10px);}12%{opacity:1;}100%{opacity:0; transform:translateY(-32px);}}
  #turn-banner{position:fixed; left:50%; top:18%; transform:translate(-50%,-50%); font-family:var(--font-kai); font-size:22px; color:var(--gold); text-shadow:0 0 12px rgba(0,0,0,.9); pointer-events:none; opacity:0; z-index:19; letter-spacing:4px; white-space:nowrap;}
  #turn-banner.show{animation:turnBannerIn 1.2s ease-out forwards;}
  @keyframes turnBannerIn{0%{opacity:0; transform:translate(-50%,-50%) scale(.9)}15%{opacity:1; transform:translate(-50%,-50%) scale(1)}70%{opacity:1}100%{opacity:0; transform:translate(-50%,-50%) translateY(-18px)}}

  #bestiary-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0; text-align:left;}
  .bcard{background:var(--ink2); border:1px solid var(--ink3); border-radius:10px; padding:12px;}

  .run-status{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:center; background:var(--ink); border:1px solid var(--ink3); border-radius:8px; padding:8px 12px; margin-bottom:12px; font-size:13px; color:var(--dim);}
  .run-status b{color:var(--gold);}
  .menu-panel{background:var(--ink); border:1px solid var(--ink3); border-radius:10px; padding:14px; margin:6px 0 14px;}
  .dmg-buff{margin-top:5px; font-size:13px; color:#c86b1a; font-weight:bold;}
  .dmg-nerf{margin-top:5px; font-size:12px; color:#3a6ea0; font-weight:bold;}
  .dmg-plain{margin-top:5px; font-size:13px; color:#4a3f2f; font-weight:bold;}
  .dmg-miss{margin-top:5px; font-size:12px; color:#8c2b21; font-weight:bold;}
  .dmg-tag{font-size:10px; font-weight:normal; color:#8c2b21;}
  .dmg-aoe{font-size:10px; color:#2b6ba0;}
  .dmg-flash{animation:dmgFlash .5s ease-out;}
  @keyframes dmgFlash{0%{background:rgba(224,179,65,.4); border-radius:3px;}100%{background:transparent;}}
  /* —— 外置素材（有则增强，无则优雅回退） —— */
  #bg{position:fixed; inset:0; z-index:0; width:100%; height:100%; object-fit:cover; pointer-events:none;}
  body.has-bg{background:transparent;}
  .eportrait{width:auto; height:186px; max-width:100%; object-fit:contain; object-position:bottom center; border-radius:0; margin-bottom:2px; background:transparent; display:block; filter:drop-shadow(0 8px 16px rgba(0,0,0,.6));}
  .cart{display:block;}
  .ricon{width:100%; height:56px; object-fit:contain; border-radius:6px; margin-bottom:6px; background:rgba(0,0,0,.2);}
  /* —— 战斗特效（juice） —— */
  #fx-layer{position:fixed; inset:0; pointer-events:none; z-index:5; overflow:hidden;}
  .fx-dmg{position:absolute; font-family:var(--font-kai); font-weight:bold; font-size:22px; color:#ff7b5a; text-shadow:0 0 8px rgba(0,0,0,.85), 0 2px 3px rgba(0,0,0,.6); animation:fxDmg .9s ease-out forwards; white-space:nowrap; letter-spacing:1px; transform:translate(-50%,-50%);}
  .fx-dmg.to-player{color:#ff4b4b; font-size:24px;}
  .fx-dmg.heal{color:var(--green);}
  @keyframes fxDmg{0%{opacity:0; transform:translate(-50%,-50%) scale(.5)}14%{opacity:1; transform:translate(-50%,-75%) scale(1.1)}100%{opacity:0; transform:translate(-50%,-180%) scale(1)}}
  .enemy.hit{animation:shake .22s ease-out;}
  @keyframes shake{0%,100%{transform:translateX(0)}30%{transform:translateX(-5px)}60%{transform:translateX(5px)}}
  #hurt-vignette{position:fixed; inset:0; pointer-events:none; background:radial-gradient(circle at center, transparent 45%, rgba(178,59,46,.5) 100%); opacity:0; z-index:4;}
  #hurt-vignette.flash{animation:vignette .5s ease-out;}
  @keyframes vignette{0%{opacity:1}100%{opacity:0}}
  .enemy.dying{animation:enemyDie .45s ease-out forwards; pointer-events:none;}
  @keyframes enemyDie{0%{opacity:1; transform:scale(1)}100%{opacity:0; transform:scale(.55)}}
  /* 全屏震屏已移除：受击反馈改用 hurtVignette 红晕 + 伤害飘字，避免连击时重影/重叠 */
  .card.shake{animation:cardShake .28s ease;}
  @keyframes cardShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .fx-dmg.block{color:#7fb0d8;}
  #tooltip{position:fixed; z-index:9999; max-width:250px; padding:9px 11px; background:rgba(24,18,12,.96); border:1px solid var(--gold); border-radius:7px; color:#e8dcc0; font-size:12px; line-height:1.5; pointer-events:none; opacity:0; transform:translateY(3px); transition:opacity .12s ease, transform .12s ease; box-shadow:0 6px 18px rgba(0,0,0,.55);}
  #tooltip.show{opacity:1; transform:translateY(0);}
  #tooltip .tt-title{font-weight:bold; color:#f0e0b8; margin-bottom:3px;}
  #tooltip .tt-line{color:#cbbd9a;}
  #tooltip .tt-story{color:#a8987a; font-size:11px; margin-top:5px; border-top:1px dashed rgba(201,168,106,.35); padding-top:5px;}
  .kw{color:var(--gold); cursor:help; border-bottom:1px dotted rgba(201,168,106,.55);}

  /* —— 顶栏折叠 / 底部操作区 / 触控容错 / 流畅模式 —— */
  #topbar{cursor:pointer; user-select:none;}
  .tb-toggle{background:transparent; border:1px solid var(--ink3); color:var(--dim); border-radius:6px; font-size:12px; padding:4px 12px; cursor:pointer; letter-spacing:1px; min-height:36px;}
  .tb-toggle:hover{color:var(--text); border-color:var(--dim);}

  .tb-detail .stat{display:inline-flex; align-items:center;}
  #actions{position:sticky; bottom:0; z-index:8; display:flex; justify-content:center; gap:12px; padding:14px 0 12px; background:linear-gradient(180deg, transparent, var(--ink) 55%);}
  #actions button{min-width:64px; min-height:48px; padding:10px 20px;}
  #actions button#endTurn{font-size:18px; padding:12px 36px; letter-spacing:3px;}
  .map-node{min-height:48px; display:flex; align-items:center; justify-content:center;}
  #overlay .close-x{width:44px; height:44px; line-height:42px; font-size:22px;}
  #hand .card.pressed{z-index:60; transform:rotate(var(--rot,0deg)) translateY(-16px) scale(1.18); box-shadow:0 8px 24px rgba(0,0,0,.65), 0 0 0 2px var(--gold);}
  /* 流畅模式（低配机）：关闭震动/抖动/飘字等重动画 */
  .low-spec .enemy.hit{animation:none;}
  .low-spec .card.shake{animation:none;}

  /* —— 出卡动效：攻击=符箓+朱砂爆裂，防御=金光护体，召唤=黑雾聚形 —— */
  .fx-talisman{position:absolute; width:32px; height:44px; left:0; top:0; background:linear-gradient(180deg,#f0e2ac,#d8b45e); border:1px solid var(--red); border-radius:3px; box-shadow:0 0 14px rgba(224,179,65,.8); z-index:6; transition:transform .3s cubic-bezier(.3,.7,.4,1), opacity .3s; pointer-events:none;}
  .fx-talisman::after{content:"符"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--font-kai); color:var(--red); font-size:20px; font-weight:bold;}
  .fx-burst{position:absolute; width:12px; height:12px; left:0; top:0; border-radius:50%; background:var(--red); box-shadow:0 0 20px 8px rgba(178,59,46,.7); transform:translate(-50%,-50%); animation:fxBurst .55s ease-out forwards; pointer-events:none;}
  @keyframes fxBurst{0%{opacity:1; transform:translate(-50%,-50%) scale(.4)}60%{opacity:.95; transform:translate(-50%,-50%) scale(2.4)}100%{opacity:0; transform:translate(-50%,-50%) scale(3.6)}}
  .fx-halo{position:absolute; left:0; top:0; border-radius:50%; border:3px solid var(--gold); box-shadow:0 0 28px 8px rgba(224,179,65,.5), inset 0 0 22px rgba(224,179,65,.3); transform:translate(-50%,-50%); animation:fxHalo .6s ease-out forwards; pointer-events:none;}
  @keyframes fxHalo{0%{opacity:.9; transform:translate(-50%,-50%) scale(.45)}100%{opacity:0; transform:translate(-50%,-50%) scale(1.9)}}
  .fx-mist{position:absolute; left:0; top:0; border-radius:50%; background:radial-gradient(circle, rgba(52,36,64,.92), rgba(16,10,18,0) 70%); filter:blur(5px); transform:translate(-50%,-50%); animation:fxMist .75s ease-out forwards; pointer-events:none;}
  @keyframes fxMist{0%{opacity:0; transform:translate(-50%,-50%) scale(.3)}45%{opacity:.85; transform:translate(-50%,-50%) scale(1.25)}100%{opacity:0; transform:translate(-50%,-50%) scale(2.1)}}
  .fx-skill{position:absolute; left:0; top:0; border-radius:50%; border:2px solid var(--blue); transform:translate(-50%,-50%); animation:fxHalo .45s ease-out forwards; pointer-events:none;}
  /* —— 受击分层：精英屏幕微震 / Boss 全屏墨晕 —— */
  #app.micro-shake{animation:microShake .18s ease;}
  @keyframes microShake{0%,100%{transform:translateX(0)}30%{transform:translateX(-3px)}60%{transform:translateX(3px)}}
  .fx-ink{position:absolute; inset:0; z-index:6; animation:inkWash .6s ease-out forwards; pointer-events:none;}
  @keyframes inkWash{0%{opacity:0}25%{opacity:.85}100%{opacity:.08}}
  /* —— Boss 战前过场：墨韵铺开 + 名讳印章 —— */
  #boss-intro{position:fixed; inset:0; z-index:70; display:none; align-items:center; justify-content:center; pointer-events:auto; opacity:0;}
  #boss-intro.show{display:flex; opacity:1;}
  #boss-intro .boss-ink{position:absolute; inset:0; background:radial-gradient(circle at center, rgba(8,5,8,0) 15%, rgba(8,5,8,.92) 100%); animation:inkSpread 1.15s ease-out forwards;}
  @keyframes inkSpread{0%{opacity:0; transform:scale(.55)}55%{opacity:1}100%{opacity:1; transform:scale(1)}}
  #boss-intro .boss-seal{position:relative; font-family:var(--font-kai); background:linear-gradient(160deg,#a02c20,#7c1f16); color:#f2e6c8; border:3px solid #5a1d16; border-radius:8px; padding:22px 34px; text-align:center; box-shadow:0 0 44px rgba(178,59,46,.65); animation:sealStamp .9s cubic-bezier(.2,.9,.3,1.35) forwards;}
  #boss-intro .bs-name{font-size:44px; letter-spacing:10px; display:block; text-shadow:0 2px 6px rgba(0,0,0,.5);}
  #boss-intro .bs-sub{font-size:14px; letter-spacing:6px; opacity:.85; margin-top:8px; display:block;}
  /* v0.61.20(P4)：二阶段转场 —— 同一枚印章，换成「裂印 + 红目」：印面转暗红、两道裂纹透光、双瞳亮起 */
  #boss-intro.phase2 .boss-seal{background:linear-gradient(160deg,#4a1008,#240705); border-color:#c0342a; overflow:hidden;
    box-shadow:0 0 64px rgba(220,60,40,.75), inset 0 0 34px rgba(0,0,0,.72); animation:sealCrack .9s cubic-bezier(.2,.9,.3,1.35) forwards;}
  #boss-intro.phase2 .boss-seal::after{content:""; position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen;
    background:linear-gradient(74deg, transparent 47.2%, rgba(255,130,95,.95) 47.2% 48.1%, transparent 48.1%),
               linear-gradient(-57deg, transparent 61.5%, rgba(255,130,95,.62) 61.5% 62.2%, transparent 62.2%);}
  #boss-intro.phase2 .bs-eyes{display:block; font-size:26px; letter-spacing:16px; margin-bottom:6px; color:#ff5a34; text-indent:16px;
    text-shadow:0 0 16px rgba(255,70,30,.95), 0 0 34px rgba(255,70,30,.6); animation:eyeBlink 2.4s ease-in-out infinite;}
  #boss-intro.phase2 .bs-name{color:#ff8a68; text-shadow:0 0 20px rgba(255,80,40,.85), 0 2px 6px rgba(0,0,0,.9);}
  #boss-intro.phase2 .bs-sub{color:#ffb08a; opacity:1;}
  #boss-intro.phase2 .boss-ink{background:radial-gradient(circle at center, rgba(72,6,0,0) 12%, rgba(72,6,0,.94) 100%);}
  @keyframes sealCrack{0%{transform:scale(1.55) rotate(-4deg); filter:blur(7px); opacity:0;} 62%{transform:scale(.97) rotate(1deg); opacity:1;} 100%{transform:scale(1) rotate(0); filter:blur(0); opacity:1;}}
  @keyframes eyeBlink{0%,44%,56%,100%{opacity:1;} 50%{opacity:.25;}}
  @keyframes sealStamp{0%{opacity:0; transform:scale(2.3) rotate(-7deg)}55%{opacity:1; transform:scale(.92) rotate(-2deg)}100%{opacity:1; transform:scale(1) rotate(0)}}
  /* —— 交互式新手引导 —— */
  #tut-hint{position:fixed; left:50%; bottom:92px; transform:translateX(-50%); z-index:30; background:rgba(24,18,12,.96); border:1px solid var(--gold); border-radius:10px; padding:10px 18px; color:var(--gold); font-size:14px; letter-spacing:1px; box-shadow:0 6px 20px rgba(0,0,0,.6); pointer-events:none; white-space:nowrap;}

  /* v0.61.20(P8)：条件引导气泡 —— 首次遇到 诅咒/格挡/召唤物/尸气 各弹一次，可点掉、7 秒自动收 */
  #tip-bubble{position:fixed; left:50%; bottom:150px; transform:translateX(-50%); z-index:32; max-width:min(560px,92vw);
    background:rgba(24,18,12,.96); border:1px solid var(--gold); border-left:4px solid var(--gold); border-radius:10px; padding:10px 18px;
    color:var(--text); font-size:14px; line-height:1.75; letter-spacing:1px; box-shadow:0 6px 22px rgba(0,0,0,.66); cursor:pointer;
    opacity:0; transition:opacity .25s ease;}

  /* v0.61.20(P3)：拖拽指向敌人时，目标头顶的受击预览（与卡面徽章同源的 previewDamage） */
  #drag-dmg{position:fixed; z-index:34; pointer-events:none; font-family:var(--font-kai); font-size:30px; font-weight:bold; letter-spacing:1px;
    color:#ff9a3c; text-shadow:0 0 12px rgba(0,0,0,.95), 0 2px 5px rgba(0,0,0,.9); transform:translate(-50%,-100%); transition:opacity .1s ease;}

  #drag-dmg.dyn{opacity:.9;}

  /* —— 成就 · 卡背 / 头像框外观（局外收集奖励） —— */
  body[data-cardback="cb_jinsha"]{--cb:linear-gradient(90deg,#d4af37,#8c6d1f,#d4af37);}

  body[data-cardback="cb_yanmo"]{--cb:linear-gradient(90deg,#8c1f1f,#3a0f0f,#8c1f1f);}
