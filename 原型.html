  .bcard .bstory{font-size:12px; color:#cbbf9e; line-height:1.7;}
  .bcard.locked .bstory{color:var(--dim);}
  .run-status{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:center; background:var(--ink); border:1px solid var(--ink3); border-radius:8px; padding:8px 12px; margin-bottom:12px; font-size:13px; color:var(--dim);}
  .run-status b{color:var(--gold);}
  .menu-panel{background:var(--ink); border:1px solid var(--ink3); border-radius:10px; padding:14px; margin:6px 0 14px;}
  /* v0.61.33：卡面预伤徽章样式（.dmg-buff/.dmg-nerf/.dmg-plain/.dmg-miss/.dmg-tag/.dmg-aoe）
     与「点击锁定目标」时的闪烁（.dmg-flash / @keyframes dmgFlash）随机制一并删除 ——
     预伤现在只浮在**目标敌人头顶**，样式见下面的 #drag-dmg。 */
  /* —— 外置素材（有则增强，无则优雅回退） —— */
  #bg{position:fixed; inset:0; z-index:0; width:100%; height:100%; object-fit:cover; pointer-events:none;}
  body.has-bg{background:transparent;}
  /* v0.61.42 的「地图背景怎么没有改」：根因是地图页渲染进 #overlay，而 #overlay 是 rgba(10,8,6,.88)
     的全屏黑幕、里面的 .panel 又是完全不透明的 var(--ink2) ⇒ 换哪张背景图都被压成一片黑。
     那一版的对策是**调淡**（黑幕 .22 + 面板 rgba(...,.30)）—— **方向就错了**：
     两层叠出来的合成不透明度是 1-(0.78×0.70)=0.454，也就是说还有约 55% 的战斗 UI 从面板里透出来
     （v0.62.0 用户报「还有半透明的战斗场景，十分失败」，指的就是这个）。
     v0.62.0 真修法：**地图场景完全不透明**，并把 #overlay 从「居中的小卡片」改成「整屏场景」。
     三层覆盖：① #overlay 换不透明底；② #overlayWrap 铺满整屏、去掉 620px 限宽；
               ③ .panel 去掉卡片底/边框/内边距/限高，退化成一个纯容器。
     其它所有面板（奖励/商店/图鉴/结算…）不受影响 —— showOverlay 开任何面板前都会先摘掉 .map-scene。 */
  #overlay.map-scene{background:#0b0a09;}
  #overlay.map-scene #overlayWrap{width:100%; height:100%; max-width:none;}
  #overlay.map-scene .panel{background:none; border:0; border-radius:0; padding:0; max-height:none; overflow:visible; text-align:left;}

  /* —— v0.66.0 主菜单重做：全屏横屏 + 真美术 + 三背景轮换 + 石碑崩碎 / 符纸卷轴 ——
     起因：v0.65.0 虽已整屏，但按钮仍是 CSS 画的、挤在中央一列，用户给的真美术一张没用上；
     且整机此前是按**竖屏**调的适配 —— 前提就是错的，目标形态是 16:9 横屏（桌面与手机横屏统一）。
     布局权威 = 志怪塔UI重设计\主菜单demo.html（顶标题 / 左石碑列 / 右符纸行 / 全屏背景）。
     ⚠️ 素材入库时已裁掉透明边距（画布 = 可见内容），所以尺寸一律按裁后实测比例给：
        start 483×1028 / continue 511×936 / 符纸 57~64×224~238 / topic 2015×709。
        石碑与符纸都是**细高**的（0.25~0.55:1），用 width 定尺寸会在矮屏把整列撑爆
        （640×360 实测 top 算出负值）⇒ 一律**以高度驱动**（vh + height + width:auto）。
     三层覆盖与地图一致：① #overlay 换不透明底；② #overlayWrap 铺满、去掉限宽；③ .panel 退化成纯容器。
     ⚠️ #overlay.menu-scene .panel 带 id ⇒ 优先级高于下面 @media 里的 .panel{padding:16px 10px}，
        不受书写顺序影响（map-scene 今天能正常工作也是这个原因）。 */
  #overlay.menu-scene{background:#0b0a09;}
  /* ⚠️ 三条 `height:100%` 必须成链，缺一条背景就只铺中间一条带（实测：只写 wrap 时
     #overlay 862px、.menu-root 只有 516px，上下两条露出 #0b0a09 纯黑，不叫整屏场景）。
     链：#overlay(定高) → #overlayWrap(height:100%) → .panel(height:100%) → .menu-root(height:100%)。
     最后那条 `.panel{height:100%}` 是最容易漏的一环 —— `.panel` 默认 auto 高，
     百分比高度拿不到确定参照时会退化成内容高，于是 .menu-root 也跟着塌。 */
  #overlay.menu-scene #overlayWrap{width:100%; height:100%; max-width:none;}
  #overlay.menu-scene .panel{background:none; border:0; border-radius:0; padding:0; height:100%; max-height:none; overflow:visible; text-align:center;}
  /* 场景根：CSS 渐变兜底；真背景由 menuBgRotate() 内联铺在 .menu-bgimg 上（有则增强，无则回退，同 #bg 约定）。
     ⚠️ 这里**不再**居中排版 —— 全部按键由 .menu-stage 里的绝对定位组承载，不然「全屏铺开」就退回了中间一列。 */
  .menu-root{position:relative; width:100%; height:100%; overflow:visible;
    background:radial-gradient(ellipse at 50% 30%, #1a1714, #0d0c0a 70%);}
  /* —— 背景双缓冲 ——
     A 是当前图，B 预留给交叉淡入（本轮只有硬切，所以 B 常空）。
     ⚠️ 呼吸动画**必须挂在 .menu-bgimg 上，不能挂 .menu-root** —— 挂根节点会把石碑/符纸/标题一起缩放。 */
  .menu-bgwrap{position:absolute; inset:0; z-index:0; overflow:hidden;}
  .menu-bgimg{position:absolute; inset:0; opacity:0;
    background-size:cover; background-position:center; background-repeat:no-repeat;}
  /* 只给 A 片上呼吸：`infinite alternate` 让它推近推远，22s 极慢 —— 要的是「画面在活着」，不是能看出的缩放 */
  .menu-bgimg.a{opacity:1; transform-origin:50% 46%; animation:menuBgBreathe 22s ease-in-out infinite alternate;}
  /* 暗角（抄 demo 的 .vignette）+ 上下压暗渐变：保证**任何一张**背景上按钮都压得住。
     用 inset 阴影而不是图片 ⇒ 零素材、零体积。 */
  .menu-veil{position:absolute; inset:0; z-index:1; pointer-events:none;
    box-shadow:inset 0 0 200px rgba(0,0,0,.9);
    background:linear-gradient(180deg, rgba(10,8,6,.74), rgba(10,8,6,.16) 26%, rgba(10,8,6,.20) 60%, rgba(10,8,6,.84));}
  .menu-stage{position:absolute; inset:0; z-index:2; overflow:visible;}
  /* 演出期间封住整个舞台 —— 没有这条，1 秒演出窗口里连点会调两次 startGame()（见 steleBreak 的 MENU_BUSY） */
  .menu-stage.is-busy{pointer-events:none;}
  /* 标题：topic.png 是横幅书法（2015×709 ⇒ 2.84:1），按宽度定尺寸 */
  /* ⚠️ 标题栏用 left:0;right:0 + text-align 居中，**不能用 left:50%+translateX(-50%)**：
     它是 .menu-tier，入场动画 menuRise 的 `to{transform:none}` 带 forwards 填充，
     会**永久压掉**基样式里的 transform —— 实测 1280×720 下标题左沿量到 640（=left:50% 处），
     等于"只居中了一半身位"，右沿顶到 947，肉眼明显偏右。换成 text-align 后不依赖 transform。 */
  .menu-titlebar{position:absolute; top:5%; left:0; right:0; z-index:3; pointer-events:none; text-align:center;}
  .menu-title{margin:0; line-height:0; font-family:var(--font-kai); color:var(--gold);}
  /* v0.68.1：标题放大到 1.5 倍 + 「特效渲染字迹边框」（用户：「应该在放大 1.5 倍左右，并且有特效渲染字迹边框」）。
     尺寸改**高度驱动**：topic.png 是 2.84:1 的横幅，只给宽度的话矮屏会出事 ——
     640×360 上 36vw = 230px 宽 ⇒ 81px 高，标题栏底沿压到 99px，离石碑只剩 24px 余量。
     加一层 min(...,25vh) 让矮屏优先按高度收，宽屏才吃 vw。
     ⚠️ 「字迹边框」只能用 **filter:drop-shadow** —— 它是按 **alpha 轮廓**扩散的，描的正是笔画的边。
        box-shadow / text-shadow 对 <img> 无效（图里没有"字形盒"可描）。
        四层叠出「贴边亮线 + 朱砂内辉 + 暗金外晕 + 落影」，再用 4.5s 缓慢呼吸让它活起来。 */
  .menu-title .menu-art{width:auto; height:clamp(88px, min(12.6vw, 25vh), 240px);
    display:block; margin:0 auto;
    filter:drop-shadow(0 0 1px rgba(255,214,140,.9))
           drop-shadow(0 0 6px rgba(184,46,36,.55))
           drop-shadow(0 0 16px rgba(168,139,58,.42))
           drop-shadow(0 2px 6px rgba(0,0,0,.9));
    animation:menuTitleEdge 4.5s ease-in-out infinite alternate;}
  .menu-title small{display:block; line-height:1.6; margin-top:4px; color:var(--dim);
    font-size:12px; letter-spacing:1px; font-family:"Microsoft YaHei",sans-serif;}
  /* —— 左下两块石碑：**左右并排**（v0.68.1，用户：「这两个石碑图标你应该左右摆放」）——
     旧版是竖列（续在上、入塔在下，照抄 demo 的 bottom:15% / 48%）。改成 row + align-items:flex-end：
     两块石碑**底沿对齐**，「谁高谁大」因此一眼可读 —— 这正是用户要的
     「入塔的图标要明显比续的图标大一点」。DOM 顺序也换成入塔在前：主 CTA 先读到，续退成右手边的次级项。 */
  .menu-col-stele{position:absolute; left:6%; bottom:14%; z-index:3; margin:0;
    display:flex; flex-direction:row; align-items:flex-end; gap:clamp(14px, 2.4vh, 34px);}
  /* —— 右锚符纸行 ——
     demo 用 right:18%/12%/6% 逐个百分比平铺 —— 小尺寸 16:9（如 640×360）下三张会互相重叠。
     改成 flex+gap 后任何尺寸都不重叠，且「间距均匀」由 gap 保证，不用手算三个百分比。 */
  .menu-row-talis{position:absolute; top:0; right:6%; z-index:3; margin:0;
    display:flex; flex-direction:row; align-items:flex-start; gap:2.2vw;}
  /* —— 图片按钮 ——
     显式清掉 <button> 的默认底/边框/padding（不清会在真美术上压出一块灰底）。
     min-width/min-height 补热区：符纸在矮屏只有 ~24px 宽，视觉不变但热区回到 48px。 */
  .menu-hit{display:flex; align-items:center; justify-content:center;
    min-width:48px; min-height:48px; padding:0; margin:0; line-height:0;
    background:none; border:0; cursor:pointer; overflow:visible; color:inherit;
    -webkit-tap-highlight-color:transparent;
    transition:transform .16s ease-out;}
  /* 图的**紧贴盒**：碎片与 sway 都要与图 1:1 对齐，所以不能让它们直接铺在按钮上
     （按钮有 min-width:48px，会比图宽 ⇒ clip-path 的百分比就对不上石头了） */
  .menu-artbox{position:relative; display:block; line-height:0;}
  .menu-hit .menu-art{display:block; width:auto; pointer-events:none;}   /* height 由各档分别给 */
  /* v0.68.1：两块石碑都**放大到两倍**（用户：「目前这个尺寸放在界面上会显得比较小，两个都起码放大到两倍」），
     入塔继续压着续一头（52vh vs 40vh，上限 600 vs 452），把主 CTA 顶出来。 */
  .menu-hit.is-continue .menu-art{height:clamp(184px, 40vh, 452px);}   /* 511×936 ⇒ 0.55:1 */
  .menu-hit.is-start .menu-art{height:clamp(240px, 52vh, 600px);       /* 483×1028 ⇒ 0.47:1 */
    animation:menuBreathe 2.5s ease-in-out infinite;}
  /* 三张符纸：挂在绳上的轻微摆动。
     v0.68.1 两处调整（用户：「可以再小一点 然后浮动的动画可以更轻盈 和 自然一点」）：
       · 尺寸收到约 0.65 倍（250 → 170 上限），免得跟放大的石碑抢视线；
       · 飘动交给 menuSway 的新曲线（幅度收到 1deg 内 + 叠垂直起伏 + 7s 一圈），
         错峰改用**负延迟** —— 正延迟会让第 2、3 张先呆立 2.3s / 4.6s 才动，负延迟一上来就在动。 */
  .menu-hit.is-collection .menu-art,
  .menu-hit.is-setting .menu-art,
  .menu-hit.is-mileage .menu-art{height:clamp(58px, 15vh, 170px);      /* 57~64×224~238 ⇒ ~0.26:1 */
    transform-origin:top center; animation:menuSway 7s ease-in-out infinite;}
  .menu-hit.is-setting .menu-art{animation-delay:-4.6s;}
  .menu-hit.is-mileage .menu-art{animation-delay:-2.3s;}   /* v1.0.16：三张符纸错峰，免得两张同步摆 */
  .menu-hit:active{transform:scale(.96);}
  .menu-hit:disabled{cursor:not-allowed; filter:grayscale(1) opacity(.45);}
  .menu-hit:focus-visible{outline:2px solid var(--gold); outline-offset:4px;}
  /* ⚠️ 悬停只是**桌面增强** —— 手机横屏没有 hover，任何信息都不能只存在于 hover 里，
     触屏一律靠上面的 :active 兜底。用 @media(hover) 包住，免得触屏出现"按下后悬停态卡住"。 */
  @media (hover:hover){ .menu-hit:hover{transform:scale(1.04);} }
  /* 符纸「纸下拉」：挪到**按下**（demo 里这是 hover 态）。
     ⚠️ 这条必须写在上面 menuSway 那几条**之后** —— 同特异度 (0,3,0)，靠书写顺序取胜，
        写前面会被 sway 盖掉，下拉就完全看不见。 */
  /* v0.68.1：符纸按下 = 「向下拉然后回弹」（用户原话）。旧版只下沉 3px、150ms，
     在真美术上几乎看不见。新版拉 12px 并配合 scaleY 把纸**拽长**
     （transform-origin 是 top center ⇒ 是"从钉子上被拽下来"，不是整体平移），再带回弹收回。
     ⚠️ 时长必须与 js/50_ui.js 里 talisOpen 的定时器一致：定时器短于动画会在回弹中途切走场景
        （纸卡在半途），长于动画则白等。两处一起改。 */
  .menu-hit.tug .menu-art{animation:menuTug .42s cubic-bezier(.4,0,.5,1);}
  /* —— 石碑崩碎：同一张图切 5 片 ——
     每片一个 <img>，**同一个 src**（浏览器复用解码结果，零额外体积）。
     ⚠️ 必须包在 .menu-artbox（与图等大的紧贴盒）里再 inset:0 —— 铺在按钮上会因 min-width:48px
        而比图宽，clip-path 的百分比就对不上石头本体了。
     裂(0~53%) 与 碎(53%~100%) 合成一条 keyframes：两段都在 transform 上，拆两条会互相打断。 */
  .menu-shards{position:absolute; inset:0; pointer-events:none;}
  .menu-shard{position:absolute; inset:0; width:100%; height:100%; opacity:0;}
  .menu-hit.is-breaking .menu-art{opacity:0; animation:none;}       /* 整图隐去，交给碎片 */
  .menu-hit.is-breaking .menu-shard{opacity:1; animation:menuShardBurst .85s ease-in both;}
  /* 5 片的 clip-path **精确拼满**整个画布（相邻片共用顶点），所以裂开前重建出的图与原图逐像素一致，
     不会有"闪一下"的接缝。--dx/--dy = 裂（沿各自外法线 1~2px）；--fx/--fy/--rot = 崩碎飞散。 */
  .menu-shard.s1{clip-path:polygon(0 0, 46% 0, 42% 27%, 0 31%);
    --dx:-1px; --dy:-1.5px; --fx:-70px; --fy:-96px; --rot:-10deg;}
  .menu-shard.s2{clip-path:polygon(46% 0, 100% 0, 100% 24%, 42% 27%);
    --dx:1.2px; --dy:-1.5px; --fx:84px; --fy:-104px; --rot:9deg; animation-delay:.04s;}
  .menu-shard.s3{clip-path:polygon(0 31%, 42% 27%, 100% 24%, 100% 63%, 52% 67%, 0 62%);
    --dx:1.8px; --dy:.4px; --fx:130px; --fy:24px; --rot:12deg; animation-delay:.08s;}
  .menu-shard.s4{clip-path:polygon(0 62%, 52% 67%, 47% 100%, 0 100%);
    --dx:-1.5px; --dy:1.6px; --fx:-88px; --fy:110px; --rot:-11deg; animation-delay:.12s;}
  .menu-shard.s5{clip-path:polygon(52% 67%, 100% 63%, 100% 100%, 47% 100%);
    --dx:1.5px; --dy:1.8px; --fx:96px; --fy:118px; --rot:8deg; animation-delay:.16s;}
  /* 全屏闪（黑）。0→1→0，峰值在 50% —— 切场景正好落在峰值那一刻（见 steleBreak）。
     用**黑**而不是朱砂红：一承接游戏本身的暗场，二避开设计说明里『朱砂红与暗金不许大面积相邻』那一条。 */
  .menu-flash{position:absolute; inset:0; z-index:9; background:#000; opacity:0; pointer-events:none;}
  .menu-flash.on{animation:menuFlash .26s ease-in both;}
  /* 图 404 时的文字兜底：imgFail() 会把 <img> 换成 artImg 的 data-fallback（就是这段 span）。
     有它才不会变成一个点不动的空框。 */
  .menu-fb{display:flex; align-items:center; justify-content:center; box-sizing:border-box;
    min-width:48px; min-height:48px; padding:12px 8px; writing-mode:vertical-rl; letter-spacing:6px;
    font-family:var(--font-kai); color:var(--gold); background:rgba(26,23,20,.72);
    border:1px solid var(--ink3); border-radius:4px;}
  .menu-hit.is-start .menu-fb{color:#ff5040; font-size:22px; letter-spacing:10px;}
  .menu-hit.is-continue .menu-fb{font-size:20px;}
  .menu-hit.is-collection .menu-fb,
  .menu-hit.is-setting .menu-fb,
  .menu-hit.is-mileage .menu-fb{font-size:13px; letter-spacing:3px; min-height:120px;}
  .menu-title .menu-fb{writing-mode:horizontal-tb; font-size:30px; letter-spacing:10px;
    background:none; border:0; min-width:0; min-height:0; padding:0;}
  /* —— 以下 5 条是 v0.64.2 及更早的「居中一列按钮」样式，现已无元素宿主 ——
     ⚠️ **故意保留**：打包后的产物门禁逐字钉着 `.menu-col` / `.menu-sub` /
        `.menu-tier.is-daily` / `.menu-tier.is-main` / `.menu-tier.is-list` / `.menu-tier.is-foot` /
        `.menu-sep` / `.menu-tip` 这些明文串，删规则就等于删串、门禁会 FAIL。
     但它们的**选择器已收进 `.menu-col`**（新结构里不存在该容器）⇒ 与上面的新布局互不干扰 ——
     尤其 `.menu-tier.is-list{display:grid}` 和 `.menu-tier.is-main .btn{...}`，不收进来会
     直接盖掉 .menu-row-talis 的 flex 与 .menu-hit 的尺寸。 */
  .menu-col{position:relative; z-index:1; width:92%; max-width:420px; max-height:100%; overflow-y:auto;
    -webkit-overflow-scrolling:touch; padding:26px 0; text-align:center;}
  .menu-sub{margin-bottom:16px;}
  .menu-col .menu-tier{margin-bottom:12px;}
  /* 签到条已随本批取消（用户：『没有实际意义』），这条规则只剩门禁用途 */
  .menu-col .menu-tier.is-daily .btn{font-size:14px; padding:9px 18px; letter-spacing:1px;}
  .menu-col .menu-tier.is-main .btn{display:block; width:100%; max-width:340px; margin:0 auto 10px; padding:13px 20px; font-size:17px;}
  .menu-col .menu-tier.is-list{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .menu-col .menu-tier.is-list .btn{width:100%; font-size:12px; padding:9px 8px; letter-spacing:0; line-height:1.5;
    white-space:normal;}
  .menu-col .menu-tier.is-foot .btn{margin:0 4px 8px;}
  .menu-sep{height:1px; max-width:300px; margin:14px auto; background:linear-gradient(90deg, transparent, var(--ink3), transparent);}
  .menu-tip{font-size:12px; color:var(--dim); line-height:1.7; margin-top:14px;}
  /* —— 待机：三层同时 ——
     背景推近推远（22s，极慢）/ 入塔石碑红光呼吸（2.5s）/ 三符纸飘动（4s，错峰）。
     ⚠️ 呼吸用 filter 的 drop-shadow 而不是 transform：三张符纸已经占了 transform（sway），
        石碑再上 transform 会和 :active 的 scale 抢同一个属性。
     ⚠️ 只给**入塔**呼吸，其余静止 —— 冷暖对比把主 CTA 顶出来。 */
  @keyframes menuBgBreathe{from{transform:scale(1);} to{transform:scale(1.06);}}
  @keyframes menuBreathe{
    from{filter:drop-shadow(0 0 10px rgba(184,46,36,.45));}
    to{filter:drop-shadow(0 0 26px rgba(184,46,36,.9));}}
  /* v0.68.1：飘动改「更轻盈自然」（用户原话）。旧版是 rotate(-1.4deg)↔(1.4deg) 的纯摆动 ——
     像一根刚性摆锤来回打，4s 一个来回也太急。新版：幅度收到 1deg 内、叠一点**垂直起伏**，
     7s 一圈，且首尾同值 ⇒ 无缝循环（所以是 linear/ease-in-out + infinite，不再用 alternate）。
     分段缓动自带轻微"停顿感"，读起来是纸在风里飘而不是机械摆。 */
  @keyframes menuSway{
    0%  {transform:rotate(-1deg)   translateY(0);}
    28% {transform:rotate(-.25deg) translateY(-3.5px);}
    55% {transform:rotate(.7deg)   translateY(-1px);}
    78% {transform:rotate(1deg)    translateY(-3px);}
    100%{transform:rotate(-1deg)   translateY(0);}}
  /* 拽下来 → 弹过头 → 收 —— 三段递减，读起来才像纸的回弹而不是正弦波 */
  @keyframes menuTug{
    0%  {transform:translateY(0)    scaleY(1);}
    34% {transform:translateY(12px) scaleY(1.07);}
    60% {transform:translateY(-4px) scaleY(.97);}
    80% {transform:translateY(2px)  scaleY(1.01);}
    100%{transform:translateY(0)    scaleY(1);}}
  /* v0.68.1：标题的「字迹边框」呼吸。只动 filter（transform 已被 menuRise 的
     `to{transform:none}` + forwards 占着，碰它会永久压掉入场动画的终态）。 */
  @keyframes menuTitleEdge{
    from{filter:drop-shadow(0 0 1px rgba(255,214,140,.85))
                drop-shadow(0 0 5px rgba(184,46,36,.45))
                drop-shadow(0 0 13px rgba(168,139,58,.32))
                drop-shadow(0 2px 6px rgba(0,0,0,.9));}
    to  {filter:drop-shadow(0 0 2px rgba(255,232,180,1))
                drop-shadow(0 0 11px rgba(184,46,36,.78))
                drop-shadow(0 0 27px rgba(168,139,58,.62))
                drop-shadow(0 2px 6px rgba(0,0,0,.9));}}
  @keyframes menuShardBurst{
    0%{transform:none; opacity:1;}
    53%{transform:translate(var(--dx),var(--dy)); opacity:1;}                    /* 裂：只挪 1~2px，接缝露出底色 */
    100%{transform:translate(var(--fx),var(--fy)) rotate(var(--rot)); opacity:0;}} /* 崩：飞散 + 自转 */
  @keyframes menuFlash{0%{opacity:0;} 50%{opacity:1;} 100%{opacity:0;}}
  /* 错峰入场：--i 由标记内联给出（与手牌 --rot 同一手法，js/50_ui.js:1385）。
     挂 .ov-enter ⇒ 刷新同一场景时类被摘掉，选择器不匹配，新 innerHTML 建出的元素不播。 */
  /* ⚠️ 末尾是 `transform:none` + forwards 填充 ⇒ **挂 .menu-tier 的容器自己不能带 transform**，
     否则会被这条永久压掉（标题栏 left:50%+translateX(-50%) 就是这么中招的）。
     要位移请用 margin / left-right 定位，别用 transform。 */
  @keyframes menuRise{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;}}
  #overlay.ov-enter.menu-scene .menu-tier{animation:menuRise .38s cubic-bezier(.2,.8,.2,1) both;
    animation-delay:calc(var(--i,0) * 70ms);}
  /* —— v0.66.0 符纸面板：卷轴从顶落下 · 带回弹 ——
     复用 showOverlay 既有的可选第 3 参 scene（'scroll-scene'），与 map-scene / menu-scene 同一机制。
     纸感全来自 cubic-bezier(.34,1.56,.64,1) 那条过冲曲线（抄 demo 的 .scroll-panel）。
     ⚠️ 特异度 (2,2,0) > `#overlay.ov-enter #overlayWrap` 的 (2,1,0)，压得住 overlayIn，不靠书写顺序。 */
  /* v0.68.1：卷轴下落改「坠落 → 惯性回弹 → 平静落定」（用户原话）。旧版是一条 keyframes +
     cubic-bezier(.34,1.56,.64,1) 的单次过冲 —— 只有一下回弹，既没有"坠"的重力感，也没有余震。
     ⚠️ 起点用 **-120vh** 而不是沿用 -110%：百分比是相对**元素自身高度**算的 ——
        图鉴这类面板在 1080 高的屏上 -110% 只有 -330px 左右，面板顶沿仍留在屏幕里
        （中心 540 − 半高 150 − 330 = 60），于是「从屏幕上方坠落」变成「从屏幕中间冒出来」。
        vh 与面板高度无关，任何面板在任何屏上都从屏外开始。
     分段各自定缓动：坠（0~42%，加速下坠）→ 触底 → 弹起 26px → 再落 → 余震 9px → 落定。 */
  @keyframes scrollDrop{
    0%  {transform:translateY(-120vh); animation-timing-function:cubic-bezier(.45,0,.95,.5);}
    42% {transform:translateY(0);      animation-timing-function:cubic-bezier(.3,0,.2,1);}
    62% {transform:translateY(-26px);  animation-timing-function:cubic-bezier(.42,0,.58,1);}
    78% {transform:translateY(0);      animation-timing-function:cubic-bezier(.3,0,.2,1);}
    89% {transform:translateY(-9px);   animation-timing-function:cubic-bezier(.42,0,.58,1);}
    100%{transform:translateY(0);}}
  #overlay.scroll-scene.ov-enter #overlayWrap{animation:scrollDrop .95s both;}
  /* ⚠️ 卷轴面板**不做整屏不透明底**（第一版做成了 #0b0a09，实拍后撤掉）：
     用户要的是「卷轴从上方坠落、**平静地落在主界面上**」—— 底铺死了，落点就成了纯黑，
     看不到主界面。真正的病根不是"底不够黑"，是下面那条 `body.at-menu #app`。 */

  /* —— v0.62.0 地图场景（整屏 · 卷轴）——
     纵向结构（.map-root 是 flex 纵列，铺满 #overlay）：
       顶栏信息栏 / 幕名匾 / 上木轴（固定）/ 画心窗口 overflow:hidden（只有 .map-sheet 在里面动）/ 下木轴（固定）/ 底栏
     木轴与纸面是从 志怪塔UI重设计\素材\地图背景-UI版.jpg 切出来的（坐标 PIL 实测：上轴 y190-235、
     下轴 y3778-3853、纸面 x96-1003），见 素材/map/scroll_top.png / scroll_bottom.png / scroll_paper.jpg。
     ⚠️ 画心**不用**那张图 —— 它是一整套已完工的**假界面**（画心里画着枯树山石，顶上还有一块写着
     「焦南」的匾额），当纹理不可复用、按字面照搬还会把假界面搬进来。
     画心改用游戏**本来就有**的 素材/bg/bg_map.jpg（1295×3238 竖幅水墨：石阶通道、两侧烛火、远处塔影）
     —— 它正是 设计说明.md §04「塔内石阶通道两侧烛火」那张，也是本作地图页一直想用的图，
     v0.61.42 之前被黑幕盖住看不见，**不是没装**。 */
  .map-root{position:absolute; inset:0; display:flex; flex-direction:column; overflow:hidden;}
  .map-plaque{flex:0 0 auto; text-align:center; padding:6px 0 4px; font-family:var(--font-kai);
    font-size:15px; letter-spacing:4px; color:var(--gold); background:rgba(10,9,7,.72);
    text-shadow:0 1px 4px rgba(0,0,0,.95);}
  .map-plaque small{color:var(--dim); font-size:11.5px; letter-spacing:1px; margin-left:8px;}
  /* 木轴：**固定不动**（用户选的是「木轴固定、画心滑动」）。素材是 1086 宽的长条，
     用 100% 100% 拉伸而不是 repeat-x —— 否则窄屏上会横向平铺，把两端的轴头重复到屏幕中间。 */
  /* v0.63.0：卷轴从「横跨整屏」收成一根**居中**的卷轴（用户：「地图卷轴边缘应该只比地图的宽度长出
     一点，不要横跨屏幕」）。三层各管一件事，别合并：
       .map-scroll = 那一列（桌面 792 = 画心上限 760 + 两侧各 16），居中；
       .map-frame  = 只给左右 16px 内边距 —— 于是木轴恰好比画心宽 32px；
       .map-viewport = 画心窗口（宽度 = 列宽 - 32）。
     窄屏列宽退化成 100%，木轴就是「屏幕宽 - 32」，**不用负 margin**（负 margin 在窄屏会溢出）。 */
  .map-scroll{flex:1 1 auto; min-height:0; width:100%; max-width:792px; margin:0 auto;
    display:flex; flex-direction:column;}
  .map-frame{flex:1 1 auto; min-height:0; padding:0 16px; display:flex; flex-direction:column;}
  .map-roller{flex:0 0 auto; position:relative; z-index:3; height:clamp(22px, 4.6vw, 44px);
    background-size:100% 100%; background-repeat:no-repeat;}
  /* ⚠️ v0.62.0：这两条 url() 只是**开发期兜底**（原型.html 与 素材/ 同级，直接双击就能看）。
     打包.py 不重写 CSS 里的 url()（它只特判 <img src="素材/rune.png">），所以产物里这三个相对路径
     会 404 —— 真正的加载路径是 showMap 里的 applyMapTextures()：用 assetURL() 取 ASSET_MAP 的
     data URI 写成**内联 background-image**，把这里的值覆盖掉。改这里的路径不会影响产物，
     改 applyMapTextures 才会。 */
  .map-roller.top{background-image:url(素材/map/scroll_top.png);}
  .map-roller.bot{background-image:url(素材/map/scroll_bottom.png);}
  /* 画心窗口：overflow:hidden ⇒ 一个屏幕装不下的那张长图只能从这里看到一段（用户要的正是这个）
     v0.63.0：加 touch-action:none —— 触屏上不加的话浏览器会把「手指拖」抢去当页面滚动，
     指针事件根本收不到（全项目只有 body / #hand / .card 三处有这个，地图一直漏了）。 */
  /* v0.64.1：再加 -webkit-user-drag:none —— 节点图标是 artImg() 出的**裸 <img>**，天生可拖：
     左键按住图标一移，浏览器立刻开始「原生拖图」并抛 pointercancel，把我们的 pointermove 流**掐断**
     ⇒ 症状正是「左键拖不动、按住中键才行」（中键不触发原生拖拽，所以那条路反而是通的）。
     body 上已有的 user-select:none **拦不住图片拖拽**，必须显式关掉 user-drag。
     user-drag 在 Blink 里是继承属性，写在这一层就覆盖了里面的所有图标。 */
  .map-viewport{flex:1 1 auto; min-height:0; position:relative; overflow:hidden; touch-action:none;
    -webkit-user-drag:none; user-select:none;
    background:#12100d; box-shadow:inset 0 0 60px rgba(0,0,0,.75);}
  /* 画心本体：只有它在动。transform 由 --camY 驱动，类切换（.cam-nofx / 内联 transition-duration）
     控制有没有动画 —— 不手写 rAF 插值，交给 CSS transition。
     ⚠️ 两层背景：先铺**画**（auto 100% = 按高度等比缩放，绝不拉伸变形），再垫一层可平铺的**旧纸**
     （256×256 无缝，实测 std 1.4）。这样任何宽高比下都铺得满：画比纸窄时两侧露出纸纹，比纸宽时两侧自然裁掉。 */
  .map-sheet{position:absolute; left:50%; top:0; width:100%; max-width:760px;
    padding:30px 0;
    transform:translate3d(-50%, calc(-1 * var(--camY, 0px)), 0);
    transition:transform 600ms cubic-bezier(.2,.8,.3,1); will-change:transform;
    background-image:url(素材/bg/bg_map.jpg), url(素材/map/scroll_paper.jpg);   /* 同上：产物里由 applyMapTextures() 覆盖 */
    /* v0.76.1：`auto 100%` → `cover`。bg_map.jpg 是 1295×3238 的竖幅水墨，按高度等比缩放时
       宽度只有画心高的 0.4 倍（sheet 高 1110 ⇒ 画宽 ≈444，而画心宽 760）⇒ 画只占中间一半，
       两侧露出旧纸纹理、4%~96% 的关卡节点全落在画外 —— 用户报的「中间贴图过窄、图标溢出」。
       cover 改成按**宽**等比铺满（取 max 缩放比），画心左右两侧不再露白；
       纵向多出来的部分被画心裁掉（`center top` 只显上段），水墨构图仍完整可辨。 */
    background-size:cover, 256px 256px;
    background-position:center top, left top;
    background-repeat:no-repeat, repeat;
    background-color:#12100d;}
  .map-sheet.cam-nofx{transition:none;}
  /* 压一层暗角：画本身很亮很满，不压的话图标和连线会被画面吃掉 */
  .map-sheet::before{content:''; position:absolute; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 40%, rgba(8,7,6,.28) 0%, rgba(8,7,6,.62) 70%, rgba(8,7,6,.82) 100%);}
  .map-bottombar{flex:0 0 auto; display:flex; justify-content:center; gap:10px; padding:7px 10px;
    background:linear-gradient(0deg, rgba(12,10,8,.94), rgba(12,10,8,.72)); border-top:1px solid rgba(224,179,65,.18);}
  .map-bottombar .btn{padding:6px 14px; font-size:13px;}
  /* —— v0.62.0 地图顶栏（用户说「上方的玩家信息栏你重新设计」，这块交给我）——
     取值全部**复用现成件**，只换外壳：头像 = artImg('hero/<id>.png')、血条 = 现成的 .hpbar 三件套 +
     .hp-label 叠数值、金币/幕/层 = G.gold / ACT_NAMES / G.mapRow、遗物 chip = relicIcon + prelic-chip、
     尸气 / 血怒两个分支照抄 renderTopbar 的判据（G.hero==='ganshiren' / 'yincha'）。
     ⚠️ 战斗页的 #topbar + renderTopbar **一行都没动** —— 所以这里只新增 .mt-* 类，
     绝不改 .stat / .hpbar / .prelic-chip 的既有规则，免得波及战斗页。 */
  .map-topbar{flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:7px 10px;
    background:linear-gradient(180deg, rgba(12,10,8,.95), rgba(12,10,8,.74));
    border-bottom:1px solid rgba(224,179,65,.18);}
  .mt-portrait{flex:0 0 auto; width:44px; height:44px; border-radius:50%; overflow:hidden; position:relative;
    border:2px solid var(--gold); background:rgba(0,0,0,.5); box-shadow:0 0 10px rgba(224,179,65,.22);}
  .mt-portrait img{width:100%; height:100%; object-fit:cover; object-position:top center; display:block;}
  .mt-col{flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:4px;}
  .mt-row{display:flex; align-items:center; gap:9px; flex-wrap:wrap; font-size:12px; color:var(--dim); line-height:1.2;}
  .mt-row b{color:var(--gold); font-size:13px;}
  .mt-name{font-family:var(--font-kai); color:var(--gold); letter-spacing:1px; font-size:13.5px;}
  .mt-hp{width:min(190px, 40vw); height:14px;}
  .mt-gold i{display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--gold); margin-right:3px; vertical-align:middle;}
  .mt-shiqi b{color:#b98bff;}
  .mt-xuenu b{color:var(--red);}
  .mt-relics{display:flex; flex-wrap:wrap; gap:4px; align-items:center;}
  .map-topbar .prelic-chip{padding:1px 5px 1px 1px;}
  /* v1.0.17：地图顶栏这排遗物芯片图标 18px → 36px（2×）。顶栏因此会变高一点，
     这是用户口径「所有图标至少 2 倍」的必然结果（.map-topbar 不设固定高，靠 padding 撑着）。 */
  .map-topbar .prelic-chip .ricon{width:36px; height:36px; margin:0;}
  .mt-menu{flex:0 0 auto; width:36px; height:36px; border-radius:50%; border:1px solid var(--ink3);
    background:rgba(255,255,255,.04); color:var(--gold); font-size:16px; line-height:1; cursor:pointer;}
  .mt-menu:hover{border-color:var(--gold);}
  @media (max-width:520px){
    .mt-portrait{width:36px; height:36px;}
    .map-topbar{gap:7px; padding:6px 7px;}
    .mt-row{font-size:11px; gap:7px;}
    .mt-hp{width:min(140px, 34vw); height:12px;}
  }
  .eportrait{width:auto; height:186px; max-width:100%; object-fit:contain; object-position:bottom center; border-radius:0; margin-bottom:2px; background:transparent; display:block; filter:drop-shadow(0 8px 16px rgba(0,0,0,.6));}
  .cart{display:block;}
  /* v0.67.0：道具图标框。**只有 .relic 卡在用** —— .prelic-chip / .map-topbar 里的 .ricon
     各自把 width/height/margin 全覆写掉了（特异度也更高），所以改这里不碰顶栏与地图。
     原先是 `width:100%; height:56px` 的**横板**：素材本身是 128×128 方图，
     `object-fit:contain` 把它压成 56×56 塞在 130 宽的板子里，图只占 43%，四周全是空底。
     改成 **76×76 方框 + margin 居中**：图放大 36%，横板的空档自然消失。
     ⚠️ `.relic` 是 `flex-direction:column` 且默认 `align-items:stretch`，
     显式给了 width 之后 `margin:0 auto` 才真的居中（stretch 不再拉伸它）。 */
  .ricon{width:76px; height:76px; object-fit:contain; border-radius:6px; margin:0 auto 6px; background:rgba(0,0,0,.2);}
  /* v0.67.0：**无图道具的「字牌」占位**（目前只有还阳露 / 孟婆汤两瓶灵汁没有贴图）。
     与 .ricon 同尺寸同暗底，中间一个字（取名字末字：还阳露→露、孟婆汤→汤）。
     为什么要有：同排的 .reward-cards 是 `align-items:stretch`，一排放 4 张卡时
     有图的会把这行撑高，无图的那张就只剩顶部两行字 + 一大片空白，读起来像「图裂了」。
     字牌把这块填满，四张卡等高且都有内容。用户若补上这两瓶的贴图，
     `potionIcon` 会自动改出 <img>，这个占位根本不会被生成 —— 不用回来删代码。 */
  .ricon-fb{display:flex; align-items:center; justify-content:center; font-size:30px; line-height:1; font-weight:700; color:var(--gold);}
  /* —— 战斗特效（juice） —— */
  #fx-layer{position:fixed; inset:0; pointer-events:none; z-index:5; overflow:hidden;}
  /* v0.64.0：精灵图特效（8 列纵向图，background-position 逐帧步进 —— 见 js/00_base.js 的 playFx）。
     尺寸/位置/background-* 全由 JS 内联写，这里只管「不要边框、不吃点击、铺满格子」。
     不需要 mix-blend-mode：源图是真 RGBA（实测 88~97% 像素 alpha=0），直接 alpha 合成即可。 */
  /* v1.0.7（手机端性能）：精灵图改成「外层裁切窗 + 内层 transform 平移」。
     旧写法把整张 3840px 宽的图当背景、每帧改 background-position —— 那不是合成属性，
     手机上每帧都要主线程重新光栅化，实测整段动画帧率被压到 15~31、longtask 273~313ms。
     transform 走合成器：几十帧只光栅化一次，之后每帧几乎零成本。 */
  .fx-sheet{position:absolute; pointer-events:none; overflow:hidden;}
  .fx-sheet-in{position:absolute; left:0; top:0; background-repeat:no-repeat; will-change:transform; backface-visibility:hidden;}
  .fx-dmg{position:absolute; font-family:var(--font-kai); font-weight:bold; font-size:22px; color:#ff7b5a; text-shadow:0 0 8px rgba(0,0,0,.85), 0 2px 3px rgba(0,0,0,.6); animation:fxDmg .9s ease-out forwards; white-space:nowrap; letter-spacing:1px; transform:translate(-50%,-50%);}

     每条 keyframes 的停靠点都带 translate(var(--ex),var(--ey)) —— 同 :1261 那条纪律，

  .enemy.e-act{animation-duration:.42s; animation-timing-function:ease-out;

    40%{transform:translate(calc(var(--ex,0px) - 7px),calc(var(--ey,0px) + 2px)) rotate(-2deg) scale(1.02)}

  #hurt-vignette{position:fixed; inset:0; pointer-events:none; background:radial-gradient(circle at center, transparent 45%, rgba(178,59,46,.5) 100%); opacity:0; z-index:4;}

  /* ===== v1.0.14（P3）三件事的样式 ===== */
  /* ① 道心破碎：致命伤被道心挡下时，全屏放大的道心插图炸成九片虚影。
     透明度压低（v1.0.18 起峰值 .88）并淡出 ⇒ 底下的战斗场面始终看得见；pointer-events:none 不吃点击。 */
  #daoxin-burst{position:fixed; inset:0; pointer-events:none; z-index:6; overflow:hidden; display:flex; align-items:center; justify-content:center;}
  #daoxin-burst .dx-wrap{position:relative; animation:dxZoom 2.1s ease-out forwards;}
  #daoxin-burst .dx-piece{position:absolute; inset:0; animation:dxFly 1.95s cubic-bezier(.25,.6,.3,1) .2s both;}
  #daoxin-burst .dx-piece img{width:100%; height:100%; display:block; pointer-events:none;}
  /* v1.0.17：用户反馈「太淡、一闪就没了」⇒ 峰值透明度 .45/.42 → .72/.66，时长 1.15s → 1.6s。
     v1.0.18：用户再反馈「不够明显、时长再长一点」⇒ 峰值 .72/.66 → .88/.80，时长 1.6s → 2.1s（碎片 1.95s）。
     配套：`js/00_base.js` daoxinBurst 的收尾兜底定时器同步 1900ms → 2500ms（不然动画没播完就被摘掉）。
     ⚠️ 这里动的是**显影**（越高越清楚）。若再往上加，注意它压在战斗画面上、别盖住底部血条与手牌。 */
  @keyframes dxZoom{0%{opacity:0; transform:scale(.78);} 12%{opacity:.88; transform:scale(1);} 40%{opacity:.80;} 100%{opacity:0; transform:scale(1.16);}}
  @keyframes dxFly{0%{opacity:1; transform:translate(0,0) rotate(0deg);} 100%{opacity:0; transform:translate(var(--tx,0px),var(--ty,0px)) rotate(var(--rot,0deg));}}
  /* ② 血魔刀·攻击牌火环：仅「阴差 + 持有血魔刀 + 生命<30%」时，手牌攻击牌边框浮一圈渐变橙红火线。
     ⚠️ 环必须画在卡**内沿**（.card 是 overflow:hidden，负 inset 的外环会被裁掉）——用 mask 抠出 2px 环带；
        只动 opacity / scale（合成属性），节拍不规则但幅度很小，不抢卡面。 */
  .card.xue-fire::after{content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none; z-index:4; padding:2px;
    background:linear-gradient(118deg,#c81e00 0%,#ff5a00 18%,#ff9a2e 36%,#ffd68a 50%,#ff6a00 66%,#e03000 84%,#c81e00 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
            mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite:exclude;
    animation:xueCardFire 3.1s ease-in-out infinite;}
  @keyframes xueCardFire{0%{opacity:.5; transform:scale(1);} 17%{opacity:.82; transform:scale(1.007);} 33%{opacity:.55; transform:scale(1.002);} 52%{opacity:.78; transform:scale(1.006);} 71%{opacity:.48; transform:scale(1);} 86%{opacity:.72; transform:scale(1.005);} 100%{opacity:.5; transform:scale(1);}}
  /* 老 WebView 不支持 mask 合成 ⇒ 上面那圈会被整块渐变**糊住卡面**（比没特效更糟）。
     这里退回 inset 阴影画的实心橙红环：一样贴边、一样只动透明度，但绝不遮卡面。 */
  @supports not ((-webkit-mask-composite: xor) or (mask-composite: exclude)){
    .card.xue-fire::after{-webkit-mask:none; mask:none; background:none; padding:0;
      box-shadow:inset 0 0 0 2px #ff6a00, inset 0 0 9px rgba(255,80,10,.5);}
  }
  /* ③ 战后三选一翻牌：卡背自下升起（加速→急停），点一下翻面看内容，再点一次选走。
     翻面（.revealed）与选牌逻辑**永远生效**（不随流畅模式关），只有「升起」动画挂 .reward-flip 时才播。 */
  .reward-cards.flip-cards{align-items:flex-start;}
  .reward-cards.flip-cards .rcard{position:relative; perspective:900px;}
  /* ⚠️ 默认就是 rotateY(180deg)（= 卡背朝前、内容藏起来），点开（.revealed）才转回 0 露出正面。
     反过来的话卡片一上来就把内容亮着，看起来「跟以前一样、根本没有翻牌」—— 这是最容易写反的一处。 */
  .reward-cards.flip-cards .rcard-inner{position:relative; transform-style:preserve-3d; transform:rotateY(180deg); transition:transform .42s cubic-bezier(.35,.1,.25,1);}
  .reward-cards.flip-cards .rcard.revealed .rcard-inner{transform:rotateY(0deg);}
  .reward-cards.flip-cards .rcard-face{backface-visibility:hidden; -webkit-backface-visibility:hidden;}
  .reward-cards.flip-cards .rcard-back{position:absolute; inset:0; transform:rotateY(180deg); background-color:#2a2119;
    background-image:var(--pile-back-img,none); background-repeat:no-repeat; background-size:100% 100%; border-radius:6px;
    box-shadow:0 3px 8px rgba(0,0,0,.45);}
  .reward-cards.reward-flip .rcard{animation:rcardRise .5s cubic-bezier(.5,0,1,1) both; animation-delay:calc(var(--rd,0) * 75ms);}
  @keyframes rcardRise{from{opacity:0; transform:translateY(74px);} to{opacity:1; transform:translateY(0);}}
  /* 不支持 3D 变换的老引擎：卡背是绝对定位压在最上层，会把正面**盖死**（翻不了、内容也看不见）
     ⇒ 这里直接不画卡背，退回「一上来就亮正面」，至少内容永远可读、点一下照样能选走。 */
  @supports not (transform-style: preserve-3d){
    .reward-cards.flip-cards .rcard-back{display:none;}
  }
  /* 流畅模式 / 系统减弱动效：三处新动画一律关掉（翻面与选牌逻辑不受影响） */
  .low-spec .card.xue-fire::after{animation:none; opacity:.62;}
  .low-spec .reward-cards.reward-flip .rcard{animation:none;}
  .low-spec .reward-cards.flip-cards .rcard-inner{transition-duration:.15s;}
  .enemy.dying{animation:enemyDie .45s ease-out forwards; pointer-events:none;}
  @keyframes enemyDie{0%{opacity:1; transform:translate(var(--ex,0px),var(--ey,0px)) scale(1)}100%{opacity:0; transform:translate(var(--ex,0px),var(--ey,0px)) scale(.55)}}
  /* —— v0.72.0：卡牌动画层（抽 / 弃 / 洗 + 易物） ——
     为什么不复用 #fx-layer(5)：#overlay 是 z-index:10，而「易物打出时牌体在战场中央亮相」
     必须在小窗开着时看得见 ⇒ 必须高于 10。取 12 仍低于 #float-msg(20) 与 #tooltip(9999)，
     不抢飘字。#fx-layer 一行不改 —— fxSeek 的钉帧语义与 FX_LIVE 去重都要原样保留。
     飞的一律是**克隆**，只挂这里、**绝不挂进 #hand**：既不碰 .hand-area 与 #hand 的
     transform / filter / will-change / perspective 红线（它们一旦带上这些属性就成了
     position:fixed 后代的包含块，会摧毁 #fx-layer 的视口坐标系），也不与 .card 已被
     rotate(var(--rot)) 与 hover 占满的 transform 通道打架。

  #anim-layer{position:fixed; inset:0; pointer-events:none; z-index:12; overflow:hidden;}
  .fly-card{position:fixed; left:0; top:0; perspective:800px; pointer-events:none;
            transform-origin:50% 50%; will-change:transform;}
  .fly-inner{position:absolute; inset:0; transform-style:preserve-3d;}
  .fly-face{position:absolute; inset:0; backface-visibility:hidden;}
  /* 卡背预先翻到背面 ⇒ 容器转到 180deg 时露出的正是它；「翻正」就是容器 180 → 0 */
  .fly-back{transform:rotateY(180deg); background-color:#2a2119;
            background-image:var(--pile-back-img,none);
            background-repeat:no-repeat; background-size:100% 100%; border-radius:3px;}
  /* 克隆体内的牌面是「静态牌面」：手牌的扇形角度与 hover 过渡一律不参与。
     ⚠️ 尺寸走 100%（.fly-card 的内联宽高 = **终点**尺寸）。抽牌要从 44×66 的牌堆角
     飞到 132×200 的手位，尺寸差由飞行本身的 scale 承担，所以这里不能留 .card 的定值。 */
  .fly-card .card{width:100%; height:100%; margin:0; transform:none; transition:none; pointer-events:none;}
  /* 洗牌的「一圈光晕」：与 inkBurst 同一套纯 CSS radial-gradient 手法，

  .fx-pulse{position:absolute; pointer-events:none; border-radius:50%;}

  .card.shake{animation:cardShake .28s ease;}
  @keyframes cardShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .fx-dmg.block{color:#7fb0d8;}
  /* v0.61.33/36：数字素材字形（素材/num/{dmg,hurt,block,heal}/0.png…9.png，四档共 40 张）。
     高度按 1.15em 等比缩放 → 一套尺寸覆盖全部字号档（含下面的 .crit 28px），文字与图片都用同一套尺寸。 */
  .fx-num{height:1.15em; width:auto; vertical-align:-.18em; margin:0 -.03em; pointer-events:none;}
  /* v0.61.42：正负号（+ / -）的配色 —— 用户报「前面的加号和减号颜色没变，导致突兀」。
     数字是 PNG，颜色**烤死在图里**；符号是文字，原来继承的是 .fx-dmg 的**文字色**（上面那四条），
     与数字的真实填充色明度差一截。下面四个色值是用 PIL 从 素材/num/<档>/0..9.png
     的**不透明像素主色簇**里取的均值（不是目测）：dmg #fc3802 / hurt #c90902 / block #0398fa / heal #05c504。
     盒子几何与 .fx-num **完全对齐**（同高 1.15em、同 vertical-align:-.18em），
     这样「＋12」的符号与数字在同一基线上，不会再一高一低。
     ⚠ 四档字形本身**没有黑描边** —— 实测「近黑像素（RGB 和 <150）」占比 ≤0.04%；
     四档最暗的像素都是**自己色相的暗部**（hurt 最暗 #770000、heal 最暗 #005900、dmg #b22102、block #16285a），
     那是字形的内阴影/渐变，不是描边。所以这里**不加黑描边** —— 加了反而更突兀。
     （盒子几何是按 .fx-num 的数值对齐推出来的，**没有在真浏览器里逐像素量过**。） */
  .fx-sign{display:inline-block; height:1.15em; line-height:1.15em; vertical-align:-.18em; margin:0 -.02em; font-weight:bold; pointer-events:none;}
  .fx-dmg .fx-sign{color:#fc3802;}
  .fx-dmg.to-player .fx-sign{color:#c90902;}
  .fx-dmg.block .fx-sign{color:#0398fa;}
  .fx-dmg.heal .fx-sign{color:#05c504;}
  /* 拖拽预伤害（#drag-dmg）恒定用 dmg 档字形（numHTML('', …)），所以符号也必须恒用 dmg 档色，
     **不能**跟着 .weak 的蓝色文字走 —— 那又变成「符号一个色、数字另一个色」 */
  #drag-dmg .fx-sign{color:#fc3802;}
  /* v0.61.36 · 浮字抖动 + 闪烁（纯 CSS，图片到位前文字一样抖）

  .fx-in{display:inline-block; animation:fxJitter .16s ease-in-out 2;}

     数字图随 em 自动缩放，**不需要美术多交一套尺寸**。 */
  .fx-dmg.crit{font-size:28px;}
  .fx-dmg.crit .fx-in{animation:fxJitterBig .18s ease-in-out 3, fxFlash .22s ease-out 1;}

  .tb-detail .stat{display:inline-flex; align-items:center;}

  #actions button{min-width:64px; min-height:48px; padding:10px 20px;}
  #actions button#endTurn{font-size:18px; padding:12px 36px; letter-spacing:3px;}
  .map-node{min-height:0;}
  .map-node .node-ico{width:52px; height:52px;}
  /* v0.61.42：节点改绝对定位后行高由 CSS 定死，窄屏图标变小就得同步收行高，否则空档过大 */
  .map-row{height:82px;}
  #overlay .close-x{width:44px; height:44px; line-height:42px; font-size:22px;}
  #hand .card.pressed{z-index:60; transform:rotate(var(--rot,0deg)) translateY(-16px) scale(1.18); box-shadow:0 8px 24px rgba(0,0,0,.65), 0 0 0 2px var(--gold);}
  /* 流畅模式（低配机）：关闭震动/抖动/飘字等重动画 */
  .low-spec .enemy.hit{animation:none;}
  .low-spec .enemy.e-atk{animation:none;}
  .low-spec .card.shake{animation:none;}
  /* v0.65.0：新增的小窗/菜单入场也纳入门禁（此前 turnBanner/floatMsg/heroAnim 等均无门禁，是历史遗漏） */
  .low-spec #overlay.ov-enter #overlayWrap{animation:none;}
  .low-spec #overlay.ov-enter.menu-scene .menu-tier{animation:none;}
  .low-spec button.btn,.low-spec button.btn.ghost{transition:none;}
  /* v0.66.0：主菜单那 6 条待机/演出动画一并纳入（`#overlay.ov-enter #overlayWrap` 那条 (2,3,0)
     已经盖住了 scrollDrop 的 (2,2,0)，卷轴不用再写）。
     ⚠️ 这几条的**特异度必须 >= 原规则**：本块在文件里更靠后，同特异度靠书写顺序就能赢，
        但低一档就会被压回去 —— 尤其 `.menu-hit.is-breaking .menu-shard` 是 (0,3,0)，
        写成 `.low-spec .menu-shard`（0,2,0）会漏，碎片照样飞。 */
  .low-spec .menu-bgimg.a,
  .low-spec .menu-hit .menu-art,
  .low-spec .menu-hit.is-breaking .menu-shard,
  .low-spec .menu-flash.on{animation:none;}
  /* v0.68.1：标题的「字迹边框」呼吸。**只关动画、保留静态 filter** ——
     边框特效本身就是静止也成立的描边，低配机上没理由把它一并砍掉。
     ⚠️ 选择器必须带 `.menu-title`：(0,3,0) 才对得过基样式的 `.menu-title .menu-art`（0,2,0）。 */
  .low-spec .menu-title .menu-art{animation:none;}
  .low-spec .menu-hit{transition:none;}
  /* v0.76.0：结算墨幕也纳入低配门禁。JS 侧本来就有 `menuFxOff()` 早返回（低配根本不铺墨），
     这一条是给「JS 没跑到」兜底 —— 本仓的既有口径：CSS 与 JS 两层都要有。
     ⚠️ 下面那条**必须重新抬特异度**：通用的 `.low-spec #overlay.ov-enter #overlayWrap` 是 (2,2,0)，
        而 `#overlay.result-scene.ov-enter #overlayWrap` 是 (2,3,0) —— 低一档，压不过。
        多一个 `.low-spec` 到 (2,3,1) 才赢得干脆，不用赌书写顺序。 */
  .low-spec #scene-veil{display:none;}
  .low-spec #app.closing #enemy-panel,
  .low-spec #app.closing #hand,
  .low-spec #app.closing .pile,
  .low-spec #app.closing #actions{opacity:1; transition:none;}
  .low-spec #overlay.result-scene.ov-enter #overlayWrap{animation:none;}
  /* v0.65.0：系统级「减弱动态效果」——全项目此前零处理，这是第一个缺口。
     复用同一套关闭规则，不改造既有 22 条 keyframes。 */
  @media (prefers-reduced-motion: reduce){
    #overlay.ov-enter #overlayWrap{animation:none;}
    #overlay.ov-enter.menu-scene .menu-tier{animation:none;}
    /* ⚠️ 必须**连 scroll-scene 一起写**：`#overlay.ov-enter #overlayWrap` 是 (2,1,0)，
       压不过 scrollDrop 的 (2,2,0)（@media 不加特异度）—— 漏了这条，开了「减弱动态效果」
       卷轴反而照落。同理下面几条也不能省。 */
    #overlay.scroll-scene.ov-enter #overlayWrap{animation:none;}
    /* ⚠️ 这几个选择器**必须带上 `#overlay` 前缀抬特异度**：@media 不加特异度，而基样式里
       `.menu-hit.is-start .menu-art`（呼吸）与 `.menu-hit.is-collection .menu-art`（飘动）都是
       (0,3,0)，原先写成 `.menu-hit .menu-art`（0,2,0）**压不过** ⇒ 开了「减弱动态效果」
       石碑照呼吸、符纸照飘，等于这条没写。抬到 (1,2,0) 后不挑档位、新增符纸也自动覆盖。
       （低配那条没这问题：`.low-spec .menu-hit .menu-art` 本来就是 (0,3,0)，靠书写顺序取胜。） */
    #overlay .menu-bgimg.a,#overlay .menu-hit .menu-art,
    #overlay .menu-hit.is-breaking .menu-shard,#overlay .menu-flash.on,
    #overlay .menu-title .menu-art{animation:none;}
    .menu-hit{transition:none;}
    button.btn,button.btn.ghost{transition:none;}
    #overlay{transition:none;}
    /* v0.76.0：结算墨幕。与低配那一组同理，两条都要各自抬特异度（@media 不加特异度，
       通用的 `#overlay.ov-enter #overlayWrap` 只有 (2,1,0)，压不过 resultRise 的 (2,3,0)）。 */
    #scene-veil{display:none;}
    #app.closing #enemy-panel,#app.closing #hand,#app.closing .pile,#app.closing #actions{opacity:1; transition:none;}
    #overlay.result-scene.ov-enter #overlayWrap{animation:none;}
  }

  /* —— 出卡动效：攻击=符箓+朱砂爆裂，防御=金光护体，召唤=黑雾聚形 —— */
  .fx-talisman{position:absolute; width:32px; height:44px; left:0; top:0; background:linear-gradient(180deg,#f0e2ac,#d8b45e); border:1px solid var(--red); border-radius:3px; box-shadow:0 0 14px rgba(224,179,65,.8); z-index:6; transition:transform .3s cubic-bezier(.3,.7,.4,1), opacity .3s; pointer-events:none;}
  .fx-talisman::after{content:"符"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--font-kai); color:var(--red); font-size:20px; font-weight:bold;}
  .fx-burst{position:absolute; width:12px; height:12px; left:0; top:0; border-radius:50%; background:var(--red); box-shadow:0 0 20px 8px rgba(178,59,46,.7); transform:translate(-50%,-50%); animation:fxBurst .55s ease-out forwards; pointer-events:none;}
  @keyframes fxBurst{0%{opacity:1; transform:translate(-50%,-50%) scale(.4)}60%{opacity:.95; transform:translate(-50%,-50%) scale(2.4)}100%{opacity:0; transform:translate(-50%,-50%) scale(3.6)}}
  .fx-halo{position:absolute; left:0; top:0; border-radius:50%; border:3px solid var(--gold); box-shadow:0 0 28px 8px rgba(224,179,65,.5), inset 0 0 22px rgba(224,179,65,.3); transform:translate(-50%,-50%); animation:fxHalo .6s ease-out forwards; pointer-events:none;}
  @keyframes fxHalo{0%{opacity:.9; transform:translate(-50%,-50%) scale(.45)}100%{opacity:0; transform:translate(-50%,-50%) scale(1.9)}}
  .fx-mist{position:absolute; left:0; top:0; border-radius:50%; background:radial-gradient(circle, rgba(52,36,64,.92), rgba(16,10,18,0) 70%); filter:blur(5px); transform:translate(-50%,-50%); animation:fxMist .75s ease-out forwards; pointer-events:none;}
  @keyframes fxMist{0%{opacity:0; transform:translate(-50%,-50%) scale(.3)}45%{opacity:.85; transform:translate(-50%,-50%) scale(1.25)}100%{opacity:0; transform:translate(-50%,-50%) scale(2.1)}}
  /* —— v1.0.17：召唤演出「从打出的鬼怪牌冒出一团翻滚黑雾 → 拖尾加速飞到右下角召唤位」——
     位移/缩放由 JS 的 WAAPI 逐段写（三段：起→隆起→加速到召唤位），这里只管**长相**与自转。
     黑雾在深色底上要看得见，所以不是纯黑：主体是深紫黑，内层再压一团偏亮的紫气。
     `::before` 用**偏心**的径向渐变 —— 正圆渐变自转是看不出来的，偏心才有「翻滚」的读感。
     v1.0.21：三色改由 CSS 变量 --mist-1/2/3 喂（JS 按召唤物上色：纸人白/小鬼黑/五通神紫/阴兵金/尸王红），
     变量缺省值 = 原紫色，故任何未上色的调用与改动前逐像素一致。 */
  .fx-summon-mist{position:fixed; left:0; top:0; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle at 44% 42%, var(--mist-1, rgba(88,42,140,.92)), var(--mist-2, rgba(30,10,52,.88)) 46%, rgba(8,3,16,0) 74%);
    filter:blur(5px); will-change:transform,opacity;}
  .fx-summon-mist::before{content:''; position:absolute; inset:12%; border-radius:50%;
    background:radial-gradient(circle at 68% 64%, var(--mist-3, rgba(158,104,226,.55)), rgba(24,8,42,0) 62%);
    animation:fxMistRoll .8s linear infinite;}
  @keyframes fxMistRoll{to{transform:rotate(360deg);}}
  .fx-skill{position:absolute; left:0; top:0; border-radius:50%; border:2px solid var(--blue); transform:translate(-50%,-50%); animation:fxHalo .45s ease-out forwards; pointer-events:none;}
  /* —— 受击分层：精英屏幕微震 / Boss 全屏墨晕 —— */
  #app.micro-shake{animation:microShake .18s ease;}
  @keyframes microShake{0%,100%{transform:translateX(0)}30%{transform:translateX(-3px)}60%{transform:translateX(3px)}}
  .fx-ink{position:absolute; inset:0; z-index:6; animation:inkWash .6s ease-out forwards; pointer-events:none;}
  @keyframes inkWash{0%{opacity:0}25%{opacity:.85}100%{opacity:.08}}
  /* —— Boss 战前过场：墨韵铺开 + 名讳印章 —— */
  #boss-intro{position:fixed; inset:0; z-index:70; display:none; align-items:center; justify-content:center; pointer-events:auto; opacity:0;}
  #boss-intro.show{display:flex; opacity:1;}
  #boss-intro .boss-ink{position:absolute; inset:0; background:radial-gradient(circle at center, rgba(8,5,8,0) 15%, rgba(8,5,8,.92) 100%); animation:inkSpread 1.15s ease-out forwards;}
  @keyframes inkSpread{0%{opacity:0; transform:scale(.55)}55%{opacity:1}100%{opacity:1; transform:scale(1)}}
  #boss-intro .boss-seal{position:relative; font-family:var(--font-kai); background:linear-gradient(160deg,#a02c20,#7c1f16); color:#f2e6c8; border:3px solid #5a1d16; border-radius:8px; padding:22px 34px; text-align:center; box-shadow:0 0 44px rgba(178,59,46,.65); animation:sealStamp .9s cubic-bezier(.2,.9,.3,1.35) forwards;}
  #boss-intro .bs-name{font-size:44px; letter-spacing:10px; display:block; text-shadow:0 2px 6px rgba(0,0,0,.5);}
  #boss-intro .bs-sub{font-size:14px; letter-spacing:6px; opacity:.85; margin-top:8px; display:block;}
  /* v0.61.20(P4)：二阶段转场 —— 同一枚印章，换成「裂印 + 红目」：印面转暗红、两道裂纹透光、双瞳亮起 */
  #boss-intro.phase2 .boss-seal{background:linear-gradient(160deg,#4a1008,#240705); border-color:#c0342a; overflow:hidden;
    box-shadow:0 0 64px rgba(220,60,40,.75), inset 0 0 34px rgba(0,0,0,.72); animation:sealCrack .9s cubic-bezier(.2,.9,.3,1.35) forwards;}
  #boss-intro.phase2 .boss-seal::after{content:""; position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen;
    background:linear-gradient(74deg, transparent 47.2%, rgba(255,130,95,.95) 47.2% 48.1%, transparent 48.1%),
               linear-gradient(-57deg, transparent 61.5%, rgba(255,130,95,.62) 61.5% 62.2%, transparent 62.2%);}
  #boss-intro.phase2 .bs-eyes{display:block; font-size:26px; letter-spacing:16px; margin-bottom:6px; color:#ff5a34; text-indent:16px;
    text-shadow:0 0 16px rgba(255,70,30,.95), 0 0 34px rgba(255,70,30,.6); animation:eyeBlink 2.4s ease-in-out infinite;}
  #boss-intro.phase2 .bs-name{color:#ff8a68; text-shadow:0 0 20px rgba(255,80,40,.85), 0 2px 6px rgba(0,0,0,.9);}
  #boss-intro.phase2 .bs-sub{color:#ffb08a; opacity:1;}
  #boss-intro.phase2 .boss-ink{background:radial-gradient(circle at center, rgba(72,6,0,0) 12%, rgba(72,6,0,.94) 100%);}
  @keyframes sealCrack{0%{transform:scale(1.55) rotate(-4deg); filter:blur(7px); opacity:0;} 62%{transform:scale(.97) rotate(1deg); opacity:1;} 100%{transform:scale(1) rotate(0); filter:blur(0); opacity:1;}}
  @keyframes eyeBlink{0%,44%,56%,100%{opacity:1;} 50%{opacity:.25;}}
  @keyframes sealStamp{0%{opacity:0; transform:scale(2.3) rotate(-7deg)}55%{opacity:1; transform:scale(.92) rotate(-2deg)}100%{opacity:1; transform:scale(1) rotate(0)}}
  /* ===================== v0.76.0：胜负结算的墨色过场（#scene-veil） =====================
     用户口径：「不只要淡入淡出，还要场景的合理过渡」，形态圈定为
     「收尾拍 → 留白 → 墨汁自四边洇入 → 墨从中裂开褪去 → 结算面板自下升起」，
     并分级——普通战斗只走轻的那一拍，精英 / Boss / 通关 / 败局走完整墨幕；
     胜＝金墨自下升，负＝暗红墨自上压。

     与 #boss-intro 的关系：**并列件，不复用**。它是 Boss **入场**专用、innerHTML 用完即清，
     这里要的是「盖住整个战场再揭开」，生命周期完全不同。共用的只有那套墨色配方。
     z-index 70（= #boss-intro）：必须压在 #overlay 的 10 之上，「揭幕」才成立 ——
     墨在中缝裂开的那一拍，底下的结算面板正好自下升起来。

     ⚠️ 三条硬约定：
       ① 静息是 `display:none`。**不要改成只留 opacity:0** —— 那会变成一块恒在的全屏挡板。
       ② 洇入方向与 #boss-intro 的 inkSpread **是反的**，所以另起 keyframe 而不照抄：
          inkSpread 是 scale(.55)→1，从**中心**长出来（印章登场要的就是这个）；
          而「自四边洇入」要的是**外缘往中心收**——渐变的透明心在正中、不透明边在最外，
          元素从 1.5 倍缩回 1 倍时，那圈不透明的边才从屏幕外滑进来把战场淹掉。
          照抄 inkSpread 会做成「从中间炸开一个墨团」，与用户要的正好相反。
       ③ 揭幕用 clip-path 的 `inset(0 50% 0 50%)`：墨**从中缝往两边退**，一条竖缝越开越大。
          这一句就是「墨从中裂开褪去」的字面实现，不需要切两块 div（切块后渐变会各算各的，反而裂得不像）。 */
  #scene-veil{position:fixed; inset:0; z-index:70; display:none; opacity:0; pointer-events:auto; overflow:hidden;}
  /* ⚠️ `.show` 只负责「显形 + 铺墨」，**不进盒模型** —— 轻档那一拍靠的就是「display:block 但没 .show」：
     一个 opacity:0 的全屏元素**照样吃得下点击**，正好拿来当那 0.5 秒的挡板（见 settleTransition）。 */
  #scene-veil.show{display:block; opacity:1;}
  #scene-veil .veil-ink{position:absolute; inset:0; animation:veilBleedIn .55s ease-out forwards;}
  /* 金墨自下升：透明的「心」留在上方 ⇒ 不透明的那一头落在**底边**，随缩放自下往上淹。
     负局反过来：心在上方之外 ⇒ 暗红压下来。 */
  #scene-veil.win  .veil-ink{background:radial-gradient(circle at 50% 14%, rgba(46,32,10,0) 12%, rgba(24,16,4,.95) 100%);}
  #scene-veil.lose .veil-ink{background:radial-gradient(circle at 50% 86%, rgba(72,6,0,0) 12%, rgba(72,6,0,.95) 100%);}
  #scene-veil.parting .veil-ink{animation:inkPart .5s ease-in forwards;}
  @keyframes veilBleedIn{from{opacity:0; transform:scale(1.5);} to{opacity:1; transform:scale(1);}}
  @keyframes inkPart{from{opacity:1; clip-path:inset(0 0 0 0);} to{opacity:0; clip-path:inset(0 50% 0 50%);}}
  /* 结算面板**自下升起**。特异度 (2,3,0) > 通用进场 `#overlay.ov-enter #overlayWrap` 的 (2,1,0)，
     压得住 overlayIn，不靠书写顺序（与 scrollDrop 同一手法）。
     ⚠️ 也正因为抬到了 (2,3,0)，两处黑名单里那两条通用规则**压不过它** —— 各自要单独写一条。 */
  @keyframes resultRise{from{opacity:0; transform:translateY(28px) scale(.99);} to{opacity:1; transform:none;}}
  #overlay.result-scene.ov-enter #overlayWrap{animation:resultRise .5s cubic-bezier(.2,.8,.2,1) both;}
  /* 收尾拍：敌人先散、手牌次之、牌堆再次 —— 三拍全靠 transition-delay 错开，JS 只挂一个 .closing。
     ⚠️ 只动 opacity，**一律不动 transform/filter**：`.hand-area` / `#hand` 上一旦出现那两个属性，
        它们就成了 position:fixed 后代的**包含块**，#fx-layer 的整套锚点坐标系当场失效
        （`.pile` 那份自查专门扫这条，扫的是**规则文本**，写在 .closing 里一样会红）。 */
  #app.closing #enemy-panel{opacity:0; transition:opacity .34s ease;}
  #app.closing #hand{opacity:0; transition:opacity .3s ease .12s;}
  #app.closing .pile{opacity:0; transition:opacity .3s ease .24s;}
  #app.closing #actions{opacity:0; transition:opacity .26s ease .3s;}
  /* —— 交互式新手引导 —— */
  #tut-hint{position:fixed; left:50%; bottom:92px; transform:translateX(-50%); z-index:30; background:rgba(24,18,12,.96); border:1px solid var(--gold); border-radius:10px; padding:10px 18px; color:var(--gold); font-size:14px; letter-spacing:1px; box-shadow:0 6px 20px rgba(0,0,0,.6); pointer-events:none; white-space:nowrap;}
  #tut-hint .tut-tag{display:inline-block; background:var(--red); color:#fff; border-radius:4px; padding:1px 8px; margin-right:6px; font-size:12px; letter-spacing:0;}
  #tut-hint b{color:#f0e0b8;}
  /* v0.61.20(P8)：条件引导气泡 —— 首次遇到 诅咒/格挡/召唤物/尸气 各弹一次，可点掉、7 秒自动收 */
  #tip-bubble{position:fixed; left:50%; bottom:150px; transform:translateX(-50%); z-index:32; max-width:min(560px,92vw);
    background:rgba(24,18,12,.96); border:1px solid var(--gold); border-left:4px solid var(--gold); border-radius:10px; padding:10px 18px;
    color:var(--text); font-size:14px; line-height:1.75; letter-spacing:1px; box-shadow:0 6px 22px rgba(0,0,0,.66); cursor:pointer;
    pointer-events:none; opacity:0; transition:opacity .25s ease;}
  /* ⚠️ 只在 .show 时可点。原先一直可点 —— 而它是 `opacity:0` **隐藏但仍在**，
     所以没显示时也是一枚看不见的挡板，正好吃掉手牌下方那一带的拖拽落点。 */
  #tip-bubble.show{opacity:1; pointer-events:auto;}
  #tip-bubble .tip-tag{display:inline-block; background:var(--gold); color:#241a10; border-radius:4px; padding:1px 8px; margin-right:8px; font-size:12px; letter-spacing:0; font-weight:bold;}
  #tip-bubble b{color:#f0e0b8;}
  /* v0.61.20(P3)：拖拽指向敌人时，目标头顶的受击预览。
     v0.61.33：卡面徽章已删，这里成为预伤的**唯一**显示处，且按「拖拽所见目标」实时算（previewDamage(c, e)）。 */
  #drag-dmg{position:fixed; z-index:34; pointer-events:none; font-family:var(--font-kai); font-size:30px; font-weight:bold; letter-spacing:1px;
    color:#ff9a3c; text-shadow:0 0 12px rgba(0,0,0,.95), 0 2px 5px rgba(0,0,0,.9); transform:translate(-50%,-100%); transition:opacity .1s ease;}
  #drag-dmg.weak{color:#8fc6ff;}
  #drag-dmg.dyn{opacity:.9;}
  #drag-dmg.off{display:none;}
  /* v0.75.0：拖拽防御牌时的**格挡预演** —— 浮在**玩家头部**的蓝色字（用户口径）。
     与 #drag-dmg 是并列的一对，不是改造：同样零定时器（只有 .off 切换）、同样
     translate(-50%,-100%) 的锚点约定、同样的 .dyn 弱化标记。锚点换成玩家立绘（不是敌人）。
     字形走 num 素材的 **block 档**（与伤害飘字的格挡档同一套，颜色烤在图里），
     所以符号也必须是 block 档色，否则加号与数字两个蓝。 */
  #drag-block{position:fixed; z-index:34; pointer-events:none; font-family:var(--font-kai); font-size:30px; font-weight:bold; letter-spacing:1px;
    color:#0398fa; text-shadow:0 0 12px rgba(0,0,0,.95), 0 2px 5px rgba(0,0,0,.9); transform:translate(-50%,-100%); transition:opacity .1s ease;}
  #drag-block .fx-sign{color:#0398fa;}

     所以桌面档、正常玩法下**根本不存在这个元素** ⇒ 既有样式一个字没动。
     位置刻意挑「没用的角落」：右上角 (top:2px) —— 与左上角的 #ver-tag 对称的那条屏边留白，
     战斗主交互区（手牌／敌人／结束回合）都在中下部，不会盖到可点控件。
     position:fixed + pointer-events:none ⇒ **完全不进布局流**，任何面板都不会被挤动；
     z-index 高于 #overlay(10)，在设置面板里开着也能读到数。 */
  #perf-hud{position:fixed; right:calc(6px + env(safe-area-inset-right,0px)); top:2px; z-index:60; pointer-events:none;
    background:rgba(0,0,0,.74); color:#8fe3a0; border:1px solid rgba(255,255,255,.18); border-radius:6px;

       ① 挂 body，**不挂** #enemy-panel —— 后者的 isolation:isolate 会把内部 z-index 夹到 0 层。

  #enemy-say{position:fixed; z-index:34; pointer-events:none; box-sizing:border-box; max-width:64vw;
