<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
<title>志怪塔 · 原型 v1.0.0</title>
<style>
  :root{
    --ink:#171310; --ink2:#221c17; --ink3:#2c251e;
    --paper:#efe3c8; --paper2:#d9c9a8; --text:#ece1cb; --dim:#9a8f78;
    --red:#b23b2e; --red2:#8c2b21; --gold:#e0b341; --green:#3fa060;
    --white:#cfc5b2; --blue:#6ea8d8; --purple:#b07fd8;
    --font-kai:"KaiTi","STKaiti","华文楷体","楷体","Noto Serif SC",serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  /* v0.71.0 整页上锁 —— 用户点名的「严重问题」：界面永远不能上下滑。
     原先 html 根本没有规则，body 只有 min-height:100vh/100dvh + overscroll-behavior:none
     （那两条都**不阻止滚动**），#app 纯自然高度 ⇒ documentElement 一律可滚。
     ⚠️ 用 height:100% 而**不是** min-height:100dvh：
        dvh 在手机地址栏收放时会跳变，body 跟着长高 ⇒ 「上锁了却还能滑」又回来。
        html/body 的 100% 走的是初始包含块（固定视口），不随地址栏变。
     ⚠️ html 也铺底色：手机地址栏收起时 body 下沿会露出 ~几十 px，
        不铺就是一条白边。
     ⚠️ 这一条只禁掉**视口层面**的滚动，不改任何版面 ——
        各个面板自己的内部滚动（.panel / 图鉴 / 地图 / 锻造 / 战报）全部照旧。 */
  html{height:100%; background:#120e0b;}
  /* v1.0.21：全局抹掉移动端/桌面端点击时的**蓝色高亮方框**（用户报障：短按/长按关卡图标、顶部栏等
     UI 会出现明显蓝框）。原先只有 .menu-hit / .enemy 单独设了 -webkit-tap-highlight-color，
     其余 button（.map-node 关卡按钮、#topbar 内按钮等）都漏网 ⇒ 统一置透明。
     无障碍不受影响：键盘聚焦仍有 `button.btn:focus-visible` 的金色外框兜底。 */
  *, *::before, *::after{ -webkit-tap-highlight-color:transparent; }
  *{ -webkit-touch-callout:none; }
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif; color:var(--text); height:100%; min-height:0; overflow:hidden;
    background:
      radial-gradient(circle at 15% 12%, rgba(178,59,46,.10), transparent 40%),
      radial-gradient(circle at 85% 8%, rgba(224,179,65,.06), transparent 35%),
      linear-gradient(180deg, #241d16 0%, var(--ink) 30%, #120e0b 100%);
    background-attachment:fixed;
    touch-action:manipulation; overscroll-behavior:none; -webkit-user-select:none; user-select:none;}
  /* v0.71.0：`#app` 变成**定高弹性列** —— 上锁之后还得「装得下」，光裁不装等于把用户
     看不到的东西藏起来（用户要的是「显示完整」）。三件事缺一不可：
       height:100%      —— 钉死在视口高；body 已上锁，这里不会溢出
       flex column      —— 让 #field 成为唯一可伸缩的那一项，把余量/亏空都吃掉
       overflow:hidden  —— 最后一道：万一仍超出，裁掉而不是长出滚动条
     ⚠️ 加了 display:flex 之后 margin 不再折叠，实测 h1(6px) / #topbar(10px) 的
        下边距本来就是相邻同向、折叠与否都一样，所以基准档间距零变化。 */
  #app{max-width:1060px; margin:0 auto; padding:10px 14px 8px; position:relative; z-index:1;
       height:100%; display:flex; flex-direction:column; overflow:hidden;}
  @media (max-width:520px){ #app{padding:6px 6px 24px;} }
  /* v0.68.2：`body.at-menu` = "屏幕背后是主菜单，不是战局" ⇒ 整个战斗界面（#app）不渲染。
     ⚠️ 这条是实拍抓出来的，不是推理出来的：`_drvmenu3.js --q "&pull=300&anim=1&at=250"`
        那一帧里，卷轴面板四周明明白白透出**战斗 HUD**（结束回合按钮、红色灵气珠「3」、出牌提示行）。
     根因不在本批 —— `#app` 从开局起就一直挂在 DOM 里、z-index:1 压在 #bg 之上；v0.65.0 之前
        **全靠主菜单那层不透明底盖住**才看不见。而图鉴/排行榜/设置走的是普通半透明底，
        `.menu-scene` 一摘，战斗界面就露出来了 —— 偏偏这正是用户点名要做的那条交互路。
     ⚠️ 为什么不做在「#overlay 挂 menu-scene 时」：那层底会被 showOverlay 摘掉（图鉴要的就是
        摘掉它），而"背后有没有战局"这件事跟当前开的是哪个面板无关 —— 挂在 body 上才与面板解耦。
     ⚠️ 为什么不用 display:none 之外的办法：`#app` 里全是会自己跑的东西（飘字定时器、
        震屏 class、血条宽度过渡），visibility:hidden 会让它们继续算，纯属白烧。
     ⚠️ 唯一写入口是 setBg（见 js/10_audio.js）—— 它本来就是"背后该铺什么"的owner：
        setBg('menu') 亮起，其余任何一张背景（actN / map / camp 三种）都清掉。**风险为零**：
        战局里每一次进战斗、进地图都必经 setBg，卡在 at-menu 只可能是"人确实在主菜单"。
     安全网：continueRun 落进 camp/shop/unknown 三支时不经过 setBg，故在那三支前显式清一次。 */
  body.at-menu #app{display:none;}
  h1.title{flex:0 0 auto; font-family:var(--font-kai); font-size:28px; letter-spacing:6px; color:var(--gold); margin-bottom:4px; text-align:center; text-shadow:0 0 18px rgba(224,179,65,.25); position:relative;}
  h1.title small{color:var(--dim); font-size:12px; letter-spacing:0; font-family:"Microsoft YaHei",sans-serif;}

  #topbar{flex:0 0 auto; display:flex; flex-wrap:wrap; gap:10px; align-items:center; background:var(--ink2); border:1px solid var(--ink3); border-radius:10px; padding:7px 14px; margin-bottom:6px;}
  .stat{font-size:14px;}
  .stat b{color:var(--gold); font-size:16px;}
  .stat-xuenu b{color:var(--red);}
  /* v0.61.37：赶尸人尸气数字走紫色（原先吃通用金色 .stat b，与阴差有专属色不对称） */
  .stat-shiqi b{color:#b98bff;}
  /* 预尸气：紧挨「尸气: N/12」的紫色小标 —— 下回合召唤物将带来的尸气进账。0 时不渲染（同预格挡口径） */
  .stat-preshiqi{display:inline-block; margin-left:4px; font-size:12px; font-weight:bold; color:#b98bff; border-bottom:1px dashed rgba(185,139,255,.55); cursor:help;}
  /* 燃血令：血怒芯片旁的「累积血怒」读数（每满 20 换 1 符文） */
  .stat-rageaccum{display:inline-block; margin-left:4px; font-size:12px; font-weight:bold; color:#ff9a6b; border-bottom:1px dashed rgba(255,154,107,.55); cursor:help;}
  /* 预血怒：紧挨「血怒: N/10」的红色小标 —— 下回合末场上小鬼将带来的血怒进账（仅阴差，0 时不渲染，同预尸气口径） */
  .stat-prexuenu{display:inline-block; margin-left:4px; font-size:12px; font-weight:bold; color:#ff8a8a; border-bottom:1px dashed rgba(255,138,138,.55); cursor:help;}
  /* 尸玉 / 血玉：资源芯片的「火焰包围」进阶态。
     v1.0.17：从「CSS 脉动光晕」升级成**自绘 8 帧火焰精灵图**（由生成脚本出图），
     在芯片身后用 steps(8) 循环播放。图是 8 列 1 排，所以 background-size 宽 = 8×显示宽，
     keyframes 把 background-position-x 从 0 走到 -8×显示宽 —— 8 步正好落在 8 个格子上。
     ⚠️ 素材地址**只**走 `--chip-flame` 自定义属性（由 renderTopbar 用 fxStripURL() 内联写死）：
        伪元素吃不到内联 style，只有自定义属性能继承进 ::before。这里**不留** CSS 相对地址兜底 ——
        单文件/TapTap 产物里整键 fx/shiqi_flame.png 已被按排切成 _r0.png，写整键必 404。 */
  @keyframes fxChipFlame{from{background-position-x:0;} to{background-position-x:-352px;}}
  .stat.relic-flame-blue,.stat.relic-flame-purple{position:relative; border-radius:6px;}
  .stat.relic-flame-blue{box-shadow:0 0 8px 1px rgba(70,150,255,.45);}
  .stat.relic-flame-purple{box-shadow:0 0 8px 1px rgba(160,80,255,.45);}
  .stat.relic-flame-blue::before,.stat.relic-flame-purple::before{
    content:''; position:absolute; left:50%; bottom:-12px; width:44px; height:44px; margin-left:-22px;
    background-repeat:no-repeat; background-size:352px 44px; background-position:0 0;
    animation:fxChipFlame .72s steps(8) infinite; opacity:.92; pointer-events:none; z-index:-1;}
  .stat.relic-flame-blue::before{background-image:var(--chip-flame); filter:drop-shadow(0 0 4px rgba(70,150,255,.7));}
  .stat.relic-flame-purple::before{background-image:var(--chip-flame); filter:drop-shadow(0 0 4px rgba(170,90,255,.7));}
  /* 聚宝盆：鬼市灵汁「划掉原价 / 展示新价」（用户定稿要求「生动的界面改动」） */
  .price-old{opacity:.5; font-weight:normal; text-decoration:line-through;}
  .price-new{color:#ffd97a; font-size:15px;}
  /* 道心：本场战斗已触发 ⇒ 遗物图标变灰（用户定稿要求） */
  .prelic-chip.relic-used{filter:grayscale(1); opacity:.5;}
  .hpbar,.enemyhpbar{width:150px; height:12px; background:#000; border:1px solid var(--ink3); border-radius:6px; overflow:hidden; display:inline-block; vertical-align:middle; position:relative; box-shadow:inset 0 1px 2px rgba(0,0,0,.85), 0 0 4px rgba(0,0,0,.5);}
  /* v1.0.12：血条**玻璃质感**（用户口径：格挡/回血时血条要有玻璃感）。
     与既有填充**叠加**而非替换 —— 红填充 / 格挡斜纹 / 血魔刀金三条规则都还在用，
     所以玻璃只做「外层高光 + 暗金描边」，不动任何 .hpfill 的底色。 */
  .hpbar::after,.enemyhpbar::after{content:''; position:absolute; inset:0; pointer-events:none; z-index:4; border-radius:inherit;
    background:linear-gradient(180deg, rgba(255,255,255,.40) 0%, rgba(255,255,255,.08) 38%, rgba(255,255,255,0) 52%, rgba(0,0,0,.30) 100%);
    box-shadow:inset 0 0 0 1px rgba(216,192,112,.30), inset 0 1px 0 rgba(255,255,255,.45);}
  .hpbar i,.enemyhpbar i{position:absolute; left:0; top:0; height:100%; display:block; z-index:0; transition:width .45s cubic-bezier(.22,1,.36,1);}
  /* v1.0.12：这一次渲染比上一次**涨了**（= 回血）⇒ 换慢档，血条肉眼可见地慢慢涨。
     ⚠️ 加在**容器**上（.hpbar/.enemyhpbar），由 render 时比对上一帧血量得出；降档不触发。 */
  .hpbar.hp-gain i,.enemyhpbar.hp-gain i{transition-duration:.9s;}
  .hpbar.hp-gain i.hpghost,.enemyhpbar.hp-gain i.hpghost{transition-duration:1.15s;}
  .hpbar i.hpfill,.enemyhpbar i.hpfill{background:var(--red);}
  .hpbar i.hpghost,.enemyhpbar i.hpghost{background:rgba(255,206,130,.45); transition:width .85s ease-out .15s;}
  /* 格挡时水晶蓝血条 */
  /* v0.61.20(P9)：有格挡时血条套一层「斜纹护罩」纹理 —— 不再是纯色替换，灰度下仍看得出底下是血 */
  #player-panel .hpbar.has-block .hpfill{background:repeating-linear-gradient(45deg,#5bb8d8 0 3px,#3a9cc0 3px 6px); box-shadow:0 0 6px rgba(90,180,210,.4);}
  #player-panel .hpbar.has-block .hpghost{background:rgba(160,210,240,.35);}
  /* 血魔刀（金）：血条上 30% 处的触发竖线；血量低于该线时整条转金色（=攻击 +25% 生效中）。
     竖线用百分比定位 ⇒ 血量上限变化时临界值自动跟着走，无需改代码。 */
  /* v1.0.12：z-index 由 2 提到 5 —— 玻璃高光层（.hpbar::after）在 z-index:4，竖线要压在它上面才看得清。 */
  /* v1.0.17：30% 刻度标不再用金色（用户口径「血魔刀的血量不要金色的特效了」）——
     改成暖白微红，压在红底上一样看得清，整条血条上不留任何金色。 */
  .hpbar .hpmark{position:absolute; left:30%; top:0; width:2px; height:100%; background:rgba(255,238,232,.92); box-shadow:0 0 4px rgba(255,170,150,.85); z-index:5; pointer-events:none;}
  /* v1.0.14：血魔刀激活（生命 < 30%，即 +25% 真在生效）—— 用户口径「不要金色」，改成
     **红底 + 深红↔淡红来回循环**的渐变：渐变高 200%，background-position 在 0↔100% 之间往返，
     于是整条血在「淡红—深红」之间平滑 ping-pong，而不是闪。
     ⚠️ `.hpmark`（30% 刻度标）也不再用金色 —— v1.0.17 改成暖白微红（见上面的 .hpmark 规则）。 */
  #player-panel .hpbar.xuemodao.xue-active .hpfill{background:linear-gradient(180deg,#ff8a72,#e0392b,#7d1208); background-size:100% 200%; animation:xueHpLoop 1.9s ease-in-out infinite; box-shadow:0 0 8px rgba(214,54,40,.6);}
  #player-panel .hpbar.xuemodao.xue-active .hpghost{background:rgba(255,120,110,.35);}
  @keyframes xueHpLoop{0%,100%{background-position:0 0;} 50%{background-position:0 100%;}}
  /* 流畅模式 / 系统减弱动效：与其它重特效同口径只关动画，静态红渐变留着（特效不消失）。 */
  .low-spec #player-panel .hpbar.xuemodao.xue-active .hpfill{animation:none; background-position:0 50%;}
  /* v1.0.12：z-index 由 1 提到 5 —— 玻璃高光层（.hpbar::after，z-index:4）不再压住血量数字。 */
  .hp-label{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:bold; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.7); z-index:5; pointer-events:none;}
  /* 血条下方数值（血量+格挡） */
  .pstats{display:flex; gap:10px; justify-content:center; margin-top:3px; font-size:13px; font-weight:bold;}
  .pstat-hp,.pstat-block{display:inline-flex; align-items:center; gap:3px;}
  /* v1.0.14：血量图标尺寸调大（用户口径「太小、不协调」）—— 9px → 16px。图到位后 <img> 同规格。 */
  /* v1.0.17：用户口径「所有图标大小都要调大使用，不然迷你好不清，至少要放大为原来的 2 倍」
     —— 下面这一整组图标尺寸（玩家面板 / 顶栏 / 敌人徽章 / 意图 / 档位徽章）全部按 2× 改写。
     ⚠️ 图标一律用 px 或 em 明确写死，不靠父级字号推 —— 父级字号在手机档会被媒体查询缩小，
        跟着走会让「2×」在手机上打折。 */
  .pstat-block i{display:inline-block; width:18px; height:18px; border-radius:50%;}
  .pstat-hp i{display:inline-block; width:19px; height:19px; border-radius:50%; vertical-align:-3px;}
  .pstat-hp{color:#e8d9c4;} .pstat-hp i{background:var(--red);}
  .pstat-block{color:#bfe6f5;} .pstat-block i{background:repeating-linear-gradient(45deg,#7fd0e8 0 2px,#2f7f9c 2px 4px); border-radius:2px;}
  /* v1.0.13：图标换皮（iconTag）到图之后的那枚 <img>。
     v1.0.17：先按用户口径「所有图标至少 2 倍」全量放大；
     v1.0.17b（用户 2026-10-07 复审「buff 的图标才要放大 1 倍，金币、血量以及血怒和尸气
     的图标缩小至现在的 5 分之 3」）：**非 buff 的那几枚回缩到 3/5** ——
       血量（玩家面板 .pstat-hp）、顶栏金币（.stat-gold）由 32px → 19px；
       顶栏尸气 / 血怒（.stat-shiqi / .stat-xuenu）原本吃 `.bicon{2em}`（.stat 字 14px ⇒ 28px）
       → 显式写死 17px。buff 徽章（.badge .bicon 24px / .pbuff .bicon 18px）维持 2× 不动。
     vertical-align 是按同一比例（0.6）跟着收的，不收会让整排图标往上飘。
     ⚠️ 徽章 / 意图 / 名牌三种上下文各自还有显式尺寸（见下），这里只是兜底。 */
  .bicon{width:2em; height:2em; object-fit:contain; display:inline-block; vertical-align:-.6em;}
  .pstat-block .bicon{width:22px; height:22px; vertical-align:0;}
  /* v1.0.14：血量图标调大后，<img> 也要同规格跟上（图到位才生效，缺图仍是上面的圆点）。 */
  .pstat-hp .bicon{width:19px; height:19px; vertical-align:-3px;}
  .pbuff .bicon{width:18px; height:18px; vertical-align:-2px; margin-right:1px;}
  .stat .bicon{width:24px; height:24px; vertical-align:-4px; margin-right:2px;}
  /* v1.0.17b：顶栏尸气（buff/shiqi.png）/ 血怒（buff/xuenu.png）—— 原先没有专属尺寸，
     吃的是兜底 `.bicon{2em}`（28px）。用户口径「缩小至现在的 5 分之 3」⇒ 28×0.6 ≈ 17px。 */
  .stat-shiqi .bicon,.stat-xuenu .bicon{width:17px; height:17px; vertical-align:-3px; margin-right:2px;}
  /* v1.0.17：敌人名牌（.ename，字号 19px）里的分类图标与 Boss/精英档位徽章。
     原来是跟着字号走的 1em（19px）；现在写死 26px —— 是原来 19px 的约 1.4 倍，
     **不是 2 倍**：这一行左边还有 19px 的敌人名，38px 的徽章会把名字挤掉行。
     名牌是纯装饰，用户要的「看不清」主要在大徽章/顶栏那几处，这处取一个不撑爆的上限。 */
  .ename .bicon{width:26px; height:26px; vertical-align:-6px;}
  /* v1.0.17：敌人意图行（.intent）—— 图标原本 1em（14px），现在 2× = 28px。 */
  .intent .bicon{width:28px; height:28px; vertical-align:-7px; margin-right:2px;}
  /* v1.0.17：状态徽章（.badge）—— 图标原本 1em（12px，手机档 9~10px），现在 2× 。 */
  .badge .bicon{width:24px; height:24px; vertical-align:-6px; margin-right:2px;}
  /* v1.0.14：顶栏灵汁芯片 —— 「图标 + 数量」，可点击直接用（替换了原来的「🧪灵汁：名字×n」）。 */
  .potion-chip{display:inline-flex; align-items:center; gap:1px; margin-right:5px; cursor:pointer;}
  .potion-chip b{font-size:11px; font-weight:700;}
  /* 预格挡：紧挨格挡标记的蓝色向上箭头（v1.0.17：9×11 → 18×22，与格挡圆点一起 2×） */
  .pstat-preblock{display:inline-flex; align-items:center; gap:2px; color:#8ed0ff; font-size:11px; line-height:1;}
  .pstat-preblock svg{display:block; width:18px; height:22px; filter:drop-shadow(0 0 3px rgba(74,168,255,.6));}
  /* v1.0.21 预恢复：紧挨血量标记的绿色向上十字（＝这回合之后召唤物将带来的预计总回复量）。全角色显示。 */
  .pstat-preheal{display:inline-flex; align-items:center; gap:2px; color:#6fdc92; font-size:11px; line-height:1;}
  .pstat-preheal svg{display:block; width:18px; height:22px; filter:drop-shadow(0 0 3px rgba(90,220,140,.6));}
  /* 玩家面板遗物 */
  .player-relics{display:flex; flex-wrap:wrap; gap:6px; align-items:center;}

  /* 顶栏 stat 图标替换 */
  /* v1.0.17：顶栏三枚状态图标（血/格挡/金币）全部 2×：圆点 10px → 20px。 */
  .stat-hp i,.stat-block i,.stat-gold i{display:inline-block; width:20px; height:20px; border-radius:50%; margin-right:2px; vertical-align:middle;}
  .stat-hp i{background:var(--red);}
  /* v0.61.20(P9)：色弱可辨 —— 格挡用「斜纹 + 方角」，血条用「纯色 + 圆点」。灰度打印/色弱下靠纹理与形状也能分开 */
  .stat-block i{background:repeating-linear-gradient(45deg,#7fd0e8 0 2px,#2f7f9c 2px 4px); border-radius:2px;}

     缺图时是 `.stat-gold i` 那枚金圆点；图到位后换成 `<img class="bicon">`，一并跟上尺寸。
     ⚠️ 必须写在上面 `.stat .bicon{12px}` 之后才压得住（同特异度靠顺序）。 */

     v1.0.17b：用户复审「金币图标缩小至现在的 5 分之 3」⇒ 32 × 0.6 ≈ 19px
     （与玩家面板血量图标同规格，两者原本就是一对）。vertical-align 同比收到 -3px。
     ⚠️ 必须写在上面 `.stat .bicon{24px}` 之后才压得住（同特异度靠顺序）。 */
  .stat-gold i,.stat-gold .bicon{width:19px; height:19px; vertical-align:-3px;}

  /* ⚠️ `align-items:flex-start` **不许改成 stretch**：基准档 #log 曾经靠它 + sticky
     钉在顶部，现在 #log 已改 fixed 不再受影响，但 .battle / #player-panel 的对齐
     仍吃这条（改成 stretch 会把玩家面板拉到与敌人面板等高，整块下移）。 */
  #field{display:flex; gap:14px; align-items:flex-start; flex:1 1 auto; min-height:0;}
  /* 弹性列的第二段：`#col-main` 吃掉 #field 的全部余量，内部再按「敌人区可缩、
     手牌与提示行不可缩」分配。min-height:0 是**必须**的 —— 少了它 flex 子项
     不会缩到内容高以下，上面那层的 overflow:hidden 就白写（项目里已有三处
     正确示范：.map-scroll / .map-frame / .map-viewport）。 */
  #col-main{flex:1 1 auto; min-width:0; min-height:0; display:flex; flex-direction:column;}
  /* ⚠️ `.battle` 是 `flex:0 0 auto`（**不许**改成可缩的 1 1 auto）：
     它内部 `align-items:flex-end` ⇒ 一旦被压到比敌人矮，敌人的**头**会从 .battle
     顶边戳出去，而 #topbar 是 static、绘制顺序在前 ⇒ 敌人直接盖在顶栏上，
     再被 #app{overflow:hidden} 裁掉一截。要省高度只能缩立绘本身（见矮屏档的
     clamp 那套），不能靠压缩容器。 */
  .battle{display:flex; gap:14px; align-items:flex-end; margin-bottom:2px; flex:0 0 auto;}
  /* v0.72.0：`margin-left:var(--player-inset-x,0)` 把玩家从**左边缘**推进来一点
     （「不要太贴近左下方」）。它同时会吃掉 `#enemy-panel` 的可用宽 ⇒ 每一档的值
     都是照着「不改变敌人换行」定的，见 :root 那条注释。
     ⚠️ 下内缩**不能**用 `margin-bottom`：`.battle` 是 align-items:flex-end，那会把玩家
        整个**抬起来**，与需求正好相反。真要往下压得动 `.battle{margin-bottom}`。 */
  #player-panel{flex:0 0 200px; margin-left:var(--player-inset-x,0); background:transparent; border:none; border-radius:0; padding:0; text-align:center; display:flex; flex-direction:column; align-items:center; position:relative; z-index:2100;}
  .hero-art-box{width:100%; height:186px; margin-bottom:4px; border-radius:0; overflow:visible; background:transparent; display:flex; align-items:flex-end; justify-content:center; position:relative;}
  .hero-art-box::after{content:''; position:absolute; bottom:-2px; left:8%; right:8%; height:3px; background:radial-gradient(ellipse at center, rgba(224,179,65,.28), transparent 80%); pointer-events:none; border-radius:50%;}
  .hero-art-box .hero-art{width:auto; height:100%; max-width:100%; object-fit:contain; object-position:bottom center; display:block; filter:drop-shadow(0 8px 16px rgba(0,0,0,.55)); transition:transform .15s ease, filter .15s ease;}
  /* 角色动画状态（v1.0.11：攻击 / 受击从「静态位移」升级成关键帧动作） */
  .hero-art-box.hero-attack .hero-art{animation:heroAttack .38s ease-out; filter:drop-shadow(0 8px 16px rgba(0,0,0,.55)) brightness(1.2);}
  .hero-art-box.hero-hit .hero-art{animation:heroHit .35s ease; filter:drop-shadow(0 8px 16px rgba(0,0,0,.55)) brightness(1.55);}
  .hero-art-box.hero-cast .hero-art{filter:drop-shadow(0 0 22px rgba(224,179,65,.8)) brightness(1.3);}
  /* 出拳：先后撤 7px 蓄势，再前冲 26px（带一点放大），收在原点。
     ⚠️ 关键帧里**只写 transform**，滤镜留在上面那条类规则里 ——
        关键帧里的 filter 会把 `.hero-art` 自己的 drop-shadow 整条替掉（滤镜不是叠加）。
     ⚠️ 时长（.38s）与 heroAnim 里 350ms 的摘类定时器是一对，改一个必须改另一个。 */
  @keyframes heroAttack{0%{transform:translateX(0) scale(1)}18%{transform:translateX(-7px) scale(.98)}55%{transform:translateX(26px) scale(1.06)}100%{transform:translateX(0) scale(1)}}
  @keyframes heroHit{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
  .hero-emoji{font-size:72px; opacity:.35;}
  .pname{font-family:var(--font-kai); font-size:19px; color:var(--gold); letter-spacing:2px; margin-bottom:8px;}
  .pmech{display:inline-block; font-size:12px; color:var(--gold); background:rgba(224,179,65,.08); border:1px solid var(--ink3); border-radius:20px; padding:2px 10px; margin-bottom:8px; letter-spacing:1px; cursor:default;}
  .prow{font-size:13px; color:var(--dim); margin:3px 0;}
  .prow b{color:var(--gold); font-size:15px;}
  #player-panel .hpbar{width:100%; margin:4px 0;}
  #player-panel .badges{justify-content:center;}
  .prelics{font-size:11px; color:var(--gold); margin-top:8px; line-height:1.8;}
  /* v0.70.0：净空与后排上抬幅度改成**从 CSS 读的数**，不再由 JS 写死。
     为什么必须改：原先 JS 直接写 `_epEl.style.paddingTop`（内联样式），
     而内联样式 CSS 打不过（除非 !important）⇒ 矮屏档没法把它归零，
     5 个敌人时这 62px 会白吃掉矮屏预算的两成。
     现在 JS 只写 `--headroom`，矮屏档写一条同特异度、书写更后的
     `#enemy-panel{padding-top:2px}` 就能盖掉，**JS 完全不需要知道当前是哪个档**。
     `--rise-unit` 同理：它是敌人上抬幅度的**倍率**，
     基准档 =1（与今天逐像素相同），矮屏档压小。
     v0.72.0：它乘的那张表从 RISE_LIFT 换成了弧线槽位表 SLOT_SHAPE 的 dy ——
     语义（「敌人往上抬多少」）一个字没变，所以名字也没改。
     ⚠️ RISE_LIFT 数组与 battleHeadroom() 本身一个字都不能动 ——
        冒烟逐条钉死了 0/42/60/20 与 max(RISE_LIFT[i%len])，倍率只能加在调用点。 */
  /* v0.72.0：敌人弧线构图的**横向倍率**。基准档 =1。
     `--slot-dx-k` 管横向（向左拉向玩家的幅度）；**纵向不新造变量**，复用上面的
     `--rise-unit` —— 弧线的 dy 就是「敌人往上抬多少」，同一个意思挂两个名字，
     读的人只会对不上。所以这一批只多出**一个**新旋钮。
     与 `--rise-unit` 同一套路：矮屏档只要写一条同特异度、书写更后的同名变量就能压小，
     **JS 完全不需要知道当前是哪个档**（所以也不需要 innerWidth，无头宿主里照样安全）。
     ⚠️ 两个都必须容忍 0：窄屏档（≤520 / ≤360）要把弧线**整个归零**（那两档
        .battle 是 flex-direction:column ⇒ 玩家在上、敌人在下，「玩家左下」本来就失效）。
        读的时候判据必须是「有限且 ≥0」，写成 >0 会把 0 误判成非法而回落成 1。 */
  :root{--rise-unit:1; --slot-dx-k:1; --player-inset-x:24px;}
  /* v0.72.0：`--player-inset-x` 是**玩家面板的左内缩**（用户要求「玩家在左下方但
     不要太贴近左下方」）。挂成 `#player-panel{margin-left}`（见下面那条规则）。
     为什么也做成变量、也按档给：margin 占的是 `.battle` 的可用宽 ⇒ 直接吃
     `#enemy-panel` 的宽（1280×720 下 812 → 788）⇒ 有可能把一行敌人挤成两行。
     实测最紧的一处是 T-short（960×540 五敌一行 786/790，只剩 4px 余量），
     所以那一档必须是 **0**。
     ⚠️ 自定义属性是**继承**的：矮屏档若不显式写 0，会从这条基档继承 24px。
        所以「不该有内缩」的每一档都要显式写 0，不能省略。 */
  /* ⚠️ isolation:isolate 不是装饰，是**层叠闸**。
     每个 .enemy 带**内联** `z-index:2000-上抬量`（js/50_ui.js 的 refreshRiseK 那一段，
     用来让后排压前排）。1500+ 级别的内联 z-index 在**同一个层叠上下文**里会完胜
     #log(9) 和 #hand(1) ⇒ 抽屉一开，战报栏和手牌都被敌人盖住
     （用户实机报的「战报背景是透明的、字和敌人重叠、卡牌盖不住敌人」就是这一条，
      不是背景色问题 —— #log 的背景是实心 var(--ink2)）。
     isolate 把内部那个 2000 关在自己家里，只在**敌人之间**排序，对外整体落到 0 级。
     ⚠️ 不许改成 position:relative+z-index —— 那会改 .enemy::after 热区的定位解析链。 */
  /* v0.72.0：右边那 2px → 8px，是给弧线最深那只留的「不贴角」内缩（用户要求
     「敌人在右上方但不要太贴近右上方」）。row-reverse + justify-content:flex-start
     下这一条会把整组往左推 6px。代价是可用宽 -6px（1280×720 下 818→812），
     远小于 3 只 e-normal 的 612 ⇒ 换行判定不变（这一条是步 4 点名的「最可能出错」）。 */
  #enemy-panel{isolation:isolate; display:flex; flex-direction:row-reverse; flex-wrap:wrap; justify-content:flex-start; align-items:flex-end; gap:24px 30px; flex:1 1 auto; min-width:0; padding:var(--headroom,2px) 8px 0 2px;}
  /* v0.72.0：二维位移（弧线）由**这一段 CSS** 拥有，JS 只写两个自定义属性 `--ex/--ey`。
     为什么不让 JS 直接写内联 `transform`（v0.61–v0.71 就是那么写的）：
       内联属性打不过任何非 !important 的样式表声明 ⇒ 关键帧一开，内联位移当场被盖掉。
       下面 @keyframes shake / enemyDie 里也有 transform，所以敌人一死就会
       「跳回未抬升的原位再缩小」。改成 CSS 拥有 + 关键帧里组合 translate(...) 之后，
       位移与动画**可以叠加**，这个跳变顺手就没了。
     为什么 JS 写自定义属性就够：内联属性优先级高于样式表，所以
       量「敌人换行」那个离线夹具里那句 `style.transform='none'` **依然能把它整个归零**
       ⇒ 量敌人换行的那套夹具（enemyRows）一行都不用改。
     ⚠️ 兜底值 0px 不是装饰：自定义属性没被赋值时 var() 会取兜底；
        而一旦它被赋成 NaN 之类的非法值，浏览器会**整条丢弃** transform
        （不是退回 0）⇒ 所有敌人塌回原点。所以 JS 那边有 isFinite 闸。 */
  .enemy{position:relative; transform:translate(var(--ex,0px),var(--ey,0px)); background:transparent; border:none; border-radius:0; padding:0; cursor:pointer; display:flex; flex-direction:column; align-items:center; text-align:center; flex:0 0 auto; min-width:0; transition:filter .12s ease; -webkit-tap-highlight-color:transparent;}
  /* v0.61.20(P7)：触屏下用伪元素把点击热区撑到 ≥120px 宽、上下各多 18px。
     伪元素不参与 DOM，elementFromPoint 仍返回宿主 .enemy，所以 enemyAtPoint() 一行不用改。
     只在 (pointer:coarse) 或窄屏生效 —— 桌面用鼠标，热区变大反而会让相邻敌人互相抢点击。 */
  @media (pointer:coarse), (max-width:760px){
    .enemy::after{content:""; position:absolute; left:50%; transform:translateX(-50%); top:-18px; bottom:-18px; width:max(100%,120px);}
  }
  .enemy.e-summon{width:92px;}
  .enemy.e-normal{width:184px;}
  .enemy.e-elite{width:280px;}
  .enemy.e-boss{width:372px;}
  /* v0.71.0：立绘高度换成**一条 vh 连续公式**，取代原来写死的四个定值。
     为什么非改不可（无头实拍，`--headroom` 与灌满的战报都在位的满负荷场景）：
     基档（>700）原来四个高度全是定值、**视口再矮也不缩**，于是 boss 单只（372px）
     把 1280×720 顶穿 **117px**、精英+小怪顶穿 89px，而且溢出一直拖到 vh≈860 才归零
     （1366×768 顶穿 ≈70px）。整页上锁之后这些多出来的像素**不再变成滚动条**，
     而是被 #app 直接裁掉 —— 那正是用户点名要消灭的状态换了个样子回来。
     公式与原来 T-mid 那条同构，但**锚点从 700 抬到 880**：
        calc(基档值 + (100vh - 880px) × k)
     vh ≥ 880 时它算出 ≥ 基档值，被 clamp 上界压回基档值 ⇒
     **1920×1080 与 1440×900 逐像素不变**（只有 701–860 这一段会缩）。
     斜率按基数等比（k = 0.871 × 基档值 ÷ 372）⇒ 缩的是**整族**，
     体型差 boss:elite:normal:summon = 1:0.75:0.5:0.25 在任何视口都保住。
     下限同样近似等比（≈0.26 倍），只在 vh<600 才生效。
     ⚠️ 这四条**同时管基档与 T-mid**（T-mid 原来那四条已删）—— 两档必须共用同一个函数。
        各写一套的话，vh=701 与 vh=700 会算出差上百像素的两个值，拖窗口时敌人瞬间胀缩。
     ⚠️ 别再退回「每个档一套台阶写法」：那正是这四条的成因。 */
  .enemy .eportrait.e-summon{height:clamp(24px,calc(93px + (100vh - 880px)*0.2178),93px);}
  .enemy .eportrait.e-normal{height:clamp(48px,calc(186px + (100vh - 880px)*0.4355),186px);}
  .enemy .eportrait.e-elite{height:clamp(73px,calc(280px + (100vh - 880px)*0.6555),280px);}
  .enemy .eportrait.e-boss{height:clamp(97px,calc(372px + (100vh - 880px)*0.871),372px);}
  .enemy .enemyhpbar{width:134px;}
  .enemy.e-elite .enemyhpbar{width:194px;}
  .enemy.e-boss .enemyhpbar{width:262px;}
  .enemy.edepth .eportrait{filter:brightness(.86) saturate(.9) drop-shadow(0 4px 8px rgba(0,0,0,.4));}
  .enemy.edepth .ename{opacity:.72;}
  .enemy.selected .eportrait{filter:drop-shadow(0 8px 16px rgba(0,0,0,.6)) drop-shadow(0 0 14px rgba(224,179,65,.6)) brightness(1.12);}
  .enemy.selected .ename{color:#ffd76a;}
  .enemy .ename{font-family:var(--font-kai); font-size:19px; color:var(--red); letter-spacing:2px; margin-bottom:6px;}
  .badges{margin-top:6px; display:flex; flex-wrap:wrap; gap:6px;}
  .badge{font-size:12px; padding:2px 8px; border-radius:20px; border:1px solid var(--ink3); color:var(--dim);}
  .badge.curse{color:#c86bd8;} .badge.charm{color:#e06b9b;} .badge.strength{color:#e08b3a;} .badge.seal{color:#3ac0c0;} .badge.thorns{color:#e06b6b;} .badge.affix{color:#e0b060;} .badge.ybtarget{color:#ffd76a; border-color:rgba(255,215,106,.7); background:rgba(255,215,106,.12);}
  /* v1.0.12：诅咒**满 6 层**时徽章变样（太上咒箓[金·天师]的定稿要求「满 6 层诅咒图标要变化」）。
     走代码画（美术方案 B）：金边 + 金色光晕 + 轻微放大，一眼区别于 1~5 层。
     后四张 buff 贴图（buff/curse.png）到位后，这里可换成贴图版，届时再改这两行即可。 */
  .badge.curse.curse-max{color:#ffd76a; border-color:rgba(255,215,106,.85); background:rgba(255,215,106,.14);
    box-shadow:0 0 8px rgba(255,215,106,.55); transform:scale(1.06);}
  .intent{margin-top:8px; font-size:14px; color:var(--gold);}
  /* v1.0.14：意图改「图标 + 数字」，不再有「⚠ 意图：」前缀（正文见 50_ui.js intentChip，
     完整释义在 .intent 的 title 上）。两条 ::before 一并停用。 */
  .intent::before{content:none;}
  .summon{font-size:12px; padding:3px 10px; border-radius:16px; border:1px solid var(--gold); color:var(--gold); background:rgba(224,179,65,.08);}
  /* v1.0.21：召唤物名前的彩色小圆点（纸人白/小鬼黑/五通神紫/阴兵金/尸王红）。
     统一加一圈细白描边，保证「小鬼黑点」在深色筹码条上也看得见。 */
  .summon-dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; vertical-align:1px;
    box-shadow:0 0 0 1px rgba(255,255,255,.4), 0 0 4px rgba(0,0,0,.55);}
  /* v0.61.41：节点不再是「带边框的按钮」，而是「图标 + 小字」—— 原边框/底色/圆角/内边距全部去掉。
     三档线的语义不变：暗线=可选→下一层可见格、金虚线=上一步→现在能走、已走=淡黄色浅光边。
     注：v0.61.41 那一版把路径换成了用户给的道路贴图，v0.61.42 已按用户要求改回代码自绘。 */
  /* v0.61.42：路径回到「代码自绘」，并做出**淡黄色浅光边沿路径延长**的动画（用户要求）。
     图标不再整齐排在等距列里 —— 每格落在 5 个槽位中随机一个，再叠 ±3% 横向 / ±7px 纵向抖动，
     所以路径天然不等长、不平行；线本身也改成**二次贝塞尔弧**（控制点垂直偏移），不画直线。 */
  .map-wrap{position:relative; padding:30px 0;}   /* 上下留白：弧线外凸时不会被面板裁掉 */
  .map-lines{position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; z-index:0;}
  .map-svg{position:absolute; left:0; top:0; overflow:visible; pointer-events:none;}
  .map-path{fill:none; stroke-linecap:round; stroke-linejoin:round;}
  .map-path.link-dim{stroke:rgba(154,143,120,.30); stroke-width:3; stroke-dasharray:5 9;}
  .map-path.link-reach{stroke:rgba(224,179,65,.85); stroke-width:3.5; stroke-dasharray:9 7; filter:drop-shadow(0 0 3px rgba(224,179,65,.35));}
  .map-path.link-past{stroke:rgba(255,226,150,.55); stroke-width:3.5; filter:drop-shadow(0 0 4px rgba(255,226,150,.45));}
  .map-path.link-new{stroke:rgba(255,236,178,.95); stroke-width:4; stroke-dasharray:var(--len,0); animation:mapGlowGrow 1.1s cubic-bezier(.35,0,.25,1) forwards; filter:drop-shadow(0 0 7px rgba(255,232,160,.95));}
  @keyframes mapGlowGrow{from{stroke-dashoffset:var(--len,0);} to{stroke-dashoffset:0;}}
  .map-row{position:relative; z-index:1; height:88px; margin:0;}
  /* v0.61.42：改**绝对定位** —— left/top 由每格自带的槽位 + 抖动内联给出（showMap 里的 mapNodeStyle）。
     left:50% / top:0 只是没有内联样式时的兜底，保证任何情况下都不是全叠在左上角。 */
  .map-node{position:absolute; left:50%; top:0; transform:translateX(-50%); min-width:0; padding:0; border:none; background:none; color:var(--text); font-size:12px; letter-spacing:1px; cursor:default; text-align:center; display:flex; flex-direction:column; align-items:center; gap:1px; line-height:1.25;}
  .map-node.empty{visibility:hidden;}   /* v0.61.41 兜底：当前没有任何档会渲染它（未解锁改挂 locked.png） */
  .map-node .node-ico{width:56px; height:56px; object-fit:contain; display:block; pointer-events:none; transition:transform .15s ease; filter:drop-shadow(0 2px 4px rgba(0,0,0,.85));}
  /* v0.62.0：地图是**完全不透明的卷轴场景**（详见 #overlay.map-scene），
     小字压在画心上，仍然自带描边才读得清 */
  .map-node .node-label{white-space:nowrap; color:var(--dim); text-shadow:0 1px 3px rgba(0,0,0,.95), 0 0 7px rgba(0,0,0,.85);}
  .map-node.locked{opacity:.4;}
  /* v0.62.0：这里原本还有两条 `.node-ico` 的 filter（locked 灰化 / preview 半灰）——
     已并入下面的 .o-* 描边态（filter 不可跨规则叠加，留着这两条只会被后者整条覆盖）。尺寸保留。 */
  .map-node.locked .node-ico{width:42px; height:42px;}
  .map-node.preview{opacity:.7;}
  .map-node.preview .node-ico{width:46px; height:46px;}
  .map-row.current .map-node{cursor:pointer;}
  .map-row.current .map-node .node-ico{filter:drop-shadow(0 0 10px rgba(224,179,65,.95)) drop-shadow(0 2px 4px rgba(0,0,0,.9));}
  .map-row.current .map-node .node-label{color:var(--gold);}
  .map-row.current .map-node:hover .node-ico{transform:translateY(-3px) scale(1.08);}
  .map-row.past .map-node{opacity:.32;}
  .map-row.future .map-node{opacity:.72;}

  /* —— v0.62.0 解锁态描边（用户要求：「达到的关卡的图标要有淡白色的描边，过去的关卡白色描边消失」）——
     ⚠️ CSS 的 filter **不可跨规则叠加**：后写的整条**覆盖**前面的，不是合并。所以每个状态必须写一条
     **完整**的 filter 链（灰化 + 投影 + 描边一次写全），拆成两条规则只会剩最后一条生效。
     ⚠️ 特异性：`.map-row.current .map-node .node-ico` 是 4 个类，下面每条也都 ≥4 个类且写在它之后，
     否则当前层那圈的暗金发光会把描边整条吃掉。
     「淡白描边」用三层 2px drop-shadow 叠出来 —— 单层 2px 太虚，三层才有一圈实边的感觉。 */
  .map-row .map-node.o-locked .node-ico{          /* 更上面的层：还是锁，灰化、无描边 */
    filter:grayscale(.55) brightness(.7) drop-shadow(0 2px 4px rgba(0,0,0,.9));}
  .map-row .map-node.o-past .node-ico{            /* 走过的层：白色描边**消失** */
    filter:grayscale(.35) brightness(.82) drop-shadow(0 2px 4px rgba(0,0,0,.9));}
  .map-row .map-node.o-reached .node-ico{         /* 达到/前沿：淡白描边 */
    filter:drop-shadow(0 0 2px #e6e3da) drop-shadow(0 0 2px #e6e3da) drop-shadow(0 0 2px #e6e3da) drop-shadow(0 2px 4px rgba(0,0,0,.9));}
  .map-row.current .map-node.o-reached .node-ico{ /* 当前层 + 前沿：暗金发光 **和** 淡白描边一条写完 */
    filter:drop-shadow(0 0 10px rgba(224,179,65,.95)) drop-shadow(0 0 2px #e6e3da) drop-shadow(0 0 2px #e6e3da) drop-shadow(0 2px 4px rgba(0,0,0,.9));}
  /* 锁破裂过渡中的节点：真实图标先藏着，等碎片飞散（t≥0.20）那一帧再显形 + 描边淡入 */
  .map-node .node-ico.o-reveal{opacity:0; transition:opacity .18s ease;}

  /* v0.71.0：收成一行。它是「上一回合结算」的回顾条，`finishEndTurn` 后**常驻**
     （不是一闪而过的提示），在 1280×720 上是一块实打实的 43px ——
     而同一段文字 `js/30_engine.js:1003` 已经写进战报了，不需要这么大的版位。 */
  #turn-summary{flex:0 0 auto; margin-bottom:4px; padding:5px 12px; background:rgba(224,179,65,.08); border:1px solid var(--gold); border-radius:8px; font-size:12.5px; color:var(--gold); line-height:1.45;}
  #turn-summary:empty{display:none;}
  /* v0.71.0 定稿：战报栏**全档只有这一种形态**（关 ⇄ 右侧抽屉）。
     为什么不保留「基准档常驻左栏」这个旧默认：实测 base 档 3 敌时**每一个桌面分辨率都竖滚**
     （1280×720 +365 / 1366×768 +317 / 1440×900 +185 / 1600×900 +185 / 1920×1080 +5），
     成因完全相同 —— 左栏要吃 236px 宽，敌人面板只剩 568px，而 3 个敌人写死 184px
     + 2×30px 间隙 = 612 > 568 ⇒ **flex-wrap 折成两排**，`.battle` 从 332 涨到 664。
     而 pickFightFrom 每场必出 2–3 敌（没有 1 敌的战斗），所以这不是边缘情况。
     改 fixed 后它脱离弹性流，236px 全还给敌人（#enemy-panel 568→818），不再折行。
     ⚠️ 位移用 transform 是安全的：红线只钉 `.hand-area` 与 `#hand`
        （它们一旦有 transform 就成了 position:fixed 后代的包含块、会摧毁 #fx-layer
         的视口坐标系），`#log` 不是 #fx-layer 的祖先。
     ⚠️ 别改成「留在 #field 里但宽度为 0」那种写法 —— 只要它还是 flex 子项，
        那 14px 的 gap 照吃，flex-basis 也仍参与分配。 */
  #log{position:fixed; top:0; right:0; bottom:0; left:auto; height:auto; max-height:none;
       width:min(300px,68vw); min-width:0; overflow-y:auto; box-sizing:border-box;
       background:var(--ink2); border:1px solid var(--ink3); border-radius:0;
       padding:10px 12px; font-size:11.5px; color:var(--dim); line-height:1.6;
       z-index:9; transform:translateX(100%); transition:transform .22s ease;
       word-break:break-word;}
  body.log-open #log{transform:none;}
  #log .log-head{color:var(--gold); font-family:var(--font-kai); font-size:14px; letter-spacing:2px; margin-bottom:6px; border-bottom:1px solid var(--ink3); padding-bottom:4px;}
  #log .log-sep{color:#e0b060; font-weight:bold; margin:5px 0 2px;}
  #log .log-head{display:flex; align-items:center; flex-wrap:wrap; gap:4px;}
  /* v1.0.8：战报标题行的三枚筛选 chip（伤害 / 获得 / 状态）连样式一起取消（用户口径
     「三个栏目可以取消」）。`.log-chips` / `.log-chip` / `.log-chip.on` 三条已删，
     renderLogBox 也不再拼它们；分类函数本身照旧在位（冒烟有断言）。 */
  #log .log-line{margin:1px 0;}

  #hand{flex:0 0 auto; display:flex; flex-wrap:nowrap; min-height:200px; align-items:flex-end; justify-content:center; padding:6px 0 var(--hand-pad-b,6px); touch-action:none; position:relative; z-index:1;}
  .hand-area{flex:0 0 auto; display:flex; align-items:flex-end; gap:8px;}
  .hand-area #hand{flex:1 1 auto; min-width:0;}
  .hand-area #endTurn{flex:0 0 auto; align-self:center; writing-mode:vertical-rl; letter-spacing:5px; font-size:17px; padding:16px 10px; min-height:132px;}
  /* v0.61.20(P1)：结束回合软提示 —— 竖排按钮左侧浮一枚小气泡，不挡手牌也不弹窗 */
  /* v0.71.0：+ `z-index:2`。`#end-turn-hint` 是 `right:calc(100% + 10px)` 向左伸的气泡，
     必然横穿手牌区；而 `#hand{position:relative; z-index:1}`（:295）在同一个层叠上下文里
     把它压住 ⇒ 「还有 N 张可打」被卡面切成半截（矮屏档卡片还有 hover 的 scale 上浮，更严重）。
     `.endcol` 的盒子只有气泡（`pointer-events:none`）和结束按钮两个子项，抬到 2 既让气泡
     盖住手牌，又**不会**抢走手牌点击。 */
  .hand-area .endcol{position:relative; z-index:2; flex:0 0 auto; align-self:center; display:flex; align-items:center;}
  /* ===== v0.69.0 抽牌堆 / 弃牌堆（手牌两端）=====
     版面：.hand-area = [弃牌堆][灵符][手牌][结束回合][抽牌堆]。
     两堆是**真的 flex 兄弟**，不是绝对定位 —— 这样它们自动与 #hand 同底对齐，
     也不会压到灵符球和结束按钮（那两块都在 flex 流里，绝对定位会直接盖上去）。

     ⚠️ 宽度从哪来（v0.69.0 实测，别照直觉算）：#hand 是 `flex-wrap:nowrap`，
        而手牌 `.card` 默认 flex-shrink:1 ⇒ **牌会自己变窄去适配容器**。
        所以两堆吃掉的 2×49 + 2×8(gap) = 114px 并不会让手牌「溢出」，
        只会让每张牌窄一点（1280 档 8 张：#hand 611→497、卡宽 131→116，仍然刚好铺满）。
        ⇒ plan §C5 里「必须把 #log 从 236 收到 200 才放得下」和「margin-left 要改 -76」
          这两条是**按「不收缩」推算的，与浏览器实测不符**，已按实测作废 ——
          两个旋钮都没动，战报栏宽度和手牌重叠度保持原样。 */
  .hand-area{--pile-w:50px; --pile-h:76px; --pile-spine:5px; --hand-pad-b:6px;}
  .pile{position:relative; flex:0 0 auto; align-self:flex-end;
        cursor:pointer;   /* v0.76.0：点它可以看牌堆内容（showPile）。
                             ⚠️ 这里**只能加 cursor** —— 它不进盒模型、不参与层叠。
                                不许加 padding / 改 position / 改尺寸 / 加 z-index：
                                上面那条注释讲了加 z-index 会反过来盖住手牌，
                                而 _drvpile.js 逐条钉着两个堆的 rect、与手牌的
                                「不重叠」与「底对齐」——那些断言没有别的兜底。 */
        margin-bottom:var(--hand-pad-b,6px);
        width:calc(var(--pile-w) + var(--pile-spine)); height:var(--pile-h);}
  /* 侧棱（一摞牌的书口）：木纹来自 side.png。
     ⚠️ 必须「高度对齐 + 宽度裁切」，不能 100% 100% 硬塞：
        side.png 是 227×583 的**竖**板，它的 583 是照 front.png 的 583 做的，
        **不是**照 back.png 的 389 ⇒ 两张图高度天然不匹配。
        硬塞 100% 100% 会把木纹**横向压 26 倍**：纹理变成竖向涂抹，
        上下那两条倒角亮边被拉粗成两条黑杠 —— 反而比不放图更难看。
        正确做法：auto 100% 等比缩到堆高（227 → 227×66/583 ≈ 25.7px 宽），
        再靠 background-position 只露最左 / 最右的一条。 */
  .pile-slab{position:absolute; bottom:0; width:var(--pile-spine); height:100%;
             transform-origin:bottom center;   /* 旋转绕**底边**：一摞牌是坐在桌上的，
                                                  底边必须留在原地、只有上沿歪出去，
                                                  绕中心转会连底边一起甩开，看着像几块漂着的木板 */
             background-color:#6b4a2e;                 /* 图没加载出来时的兜底木色，不是装饰 */
             background-image:var(--pile-side-img,none);
             background-repeat:no-repeat; background-size:auto 100%; border-radius:1px;}
  /* 顶面：完整牌背 back.png（257×389，比例 0.6607）。堆是 44×66（0.6667），
     差 0.9% —— 直接铺满，肉眼不可辨，不值得为它引入含空边的 auto 100%。 */
  .pile-face{position:absolute; top:0; width:var(--pile-w); height:100%;
             background-color:#2a2119;
             background-image:var(--pile-back-img,none);
             background-repeat:no-repeat; background-size:100% 100%;
             border-radius:3px; box-shadow:0 2px 6px rgba(0,0,0,.55);}
  .pile-n{position:absolute; right:1px; bottom:0; font-size:11px; font-weight:bold;
          color:var(--gold); text-shadow:0 1px 3px #000,0 0 5px #000; pointer-events:none;}
  /* 左右朝向：书口一律朝**外**（背离手牌），两堆才像夹住手牌的两摞书；
     朝里会顶着手牌，看着像把书摆反了。所以两张图的 background-position 必须逐堆写：
     弃牌堆在左端 ⇒ 露木板的**左**缘；抽牌堆在右端 ⇒ 露**右**缘。 */
  .pile-discard .pile-slab{left:0;  background-position:left center;}
  .pile-discard .pile-face{left:var(--pile-spine);}
  .pile-draw    .pile-slab{right:0; background-position:right center;}
  .pile-draw    .pile-face{right:var(--pile-spine);}
  /* 整齐 vs 凌乱：抽牌堆是「码齐的一摞」，弃牌堆是「随手一扔」—— 这是区分两堆的主要视觉线索
     （两堆顶面都是同一张 back.png，不看侧棱分不出来）。
     ⚠️ 姿态一律**写死在 CSS 里**，绝不用 JS 的 Math.random()：render() 一回合要跑好几次，
        随机化会让弃牌堆每帧抖动，看着像在抽搐。
     ⚠️ 用 rotate / translate **独立属性**，把 transform 通道整个让给将来的抽牌/弃牌动画
        （.card 的 transform 已经被扇形展开占满了，见 §C6）。 */
  .pile-draw .pile-slab{translate:0 0;}
  .pile-draw .pile-slab:nth-child(2){translate:2px 0;}
  .pile-draw .pile-slab:nth-child(3){translate:4px 0;}
  /* 弃牌堆：高度与角度都各不相同 ⇒ 上沿参差、底边仍压在桌上。
     translate 只往**外**挪 1~3px（不是 5~7px）—— 挪太多那几片会与顶面脱开，
     看着像书旁边散落的两块木板，而不是「一摞扔歪的牌」；凌乱感交给 rotate 和高度差。 */
  .pile-discard .pile-slab:nth-child(1){translate:-3px 0; height:96%; rotate:-9deg;}
  .pile-discard .pile-slab:nth-child(2){translate:-1px 0; height:88%; rotate: 6deg;}
  .pile-discard .pile-slab:nth-child(3){translate:-2px 0; height:93%; rotate:-4deg;}
  .pile-discard .pile-face{rotate:-4deg; translate:-4px 1px;}
  #end-turn-hint{position:absolute; right:calc(100% + 10px); top:50%; transform:translateY(-50%); white-space:nowrap; pointer-events:none;
    background:rgba(24,18,12,.95); border:1px solid var(--gold); color:var(--gold); border-radius:8px; padding:6px 12px; font-size:12.5px; letter-spacing:1px;
    box-shadow:0 4px 14px rgba(0,0,0,.55); animation:hintPulse 1.8s ease-in-out infinite;}
  #end-turn-hint.off{display:none;}
  #end-turn-hint::after{content:""; position:absolute; left:100%; top:50%; margin-top:-5px; border:5px solid transparent; border-left-color:var(--gold);}
  #end-turn-hint b{color:#f0e0b8;}
  @keyframes hintPulse{0%,100%{opacity:.78;} 50%{opacity:1;}}
  .title-actions{position:absolute; right:4px; top:50%; transform:translateY(-50%); display:flex; gap:8px;}
  .title-actions .btn{min-width:0; padding:6px 12px; font-size:13px;}
  /* v0.71.0：战报栏全档统一成右侧抽屉（理由见基档 #log 那条），所以这个开合按钮
     **全档都要显示**。v0.70.0 那条「基准档隐藏」的前提（基准档 #log 是常驻左栏）
     已被实机量测推翻 —— 它正是桌面三敌换行竖滚的成因。 */
  .title-actions #logToggle{display:inline-block;}
  .rune-display{flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:2px; padding-bottom:14px; min-width:110px;}
  .rune-icon{width:105px; height:105px; object-fit:contain; filter:drop-shadow(0 0 8px rgba(180,140,220,.45));}
  .rune-fallback{font-size:90px; color:rgba(180,140,220,.6); line-height:1; display:none;}
  .rune-count{font-size:22px; font-weight:bold; color:var(--gold);}
  .card{width:132px; height:200px; position:relative; background:var(--paper); color:#2a2119; border-radius:8px; display:flex; flex-direction:column; cursor:pointer; border:2px solid transparent; box-shadow:0 3px 8px rgba(0,0,0,.45); transition:transform .13s ease; text-align:left; font-size:11px; overflow:hidden; touch-action:none;}
  .card::before{content:""; position:absolute; top:0; left:0; right:0; height:5px; background:var(--cb, linear-gradient(90deg,var(--red2),var(--red),var(--red2))); border-radius:8px 8px 0 0; opacity:.8; z-index:1;}
  .card.disabled{filter:grayscale(.8) brightness(.7); cursor:not-allowed;}
  .card .cart-wrap{width:100%; height:80px; flex:0 0 auto; background:linear-gradient(160deg,#d9c9a8,#c3a97e); overflow:hidden; position:relative;}
  .card .cart-wrap .cart{width:100%; height:100%; object-fit:cover; display:block;}
  .card .cost{position:absolute; top:6px; left:6px; width:24px; height:24px; border-radius:50%; background:#2a2119; color:var(--gold); font-weight:bold; display:flex; align-items:center; justify-content:center; font-size:14px; z-index:2; box-shadow:0 1px 3px rgba(0,0,0,.5);}
  .card .cname{font-family:var(--font-kai); font-weight:bold; font-size:14px; letter-spacing:1px; padding:6px 8px 2px; z-index:1;}
  .card .cdesc{flex:1; color:#4a3f2f; line-height:1.32; font-size:10.5px; padding:0 8px; overflow:hidden; word-break:break-word;}
  .card .ctype{font-size:9px; color:#7a6c52; padding:3px 8px 6px; letter-spacing:1px;}
  .reward-cards .card{height:auto; min-height:200px;}
  /* v0.71.0：`.card.selected` 此前**全项目没有任何规则** —— 全仓 `.selected` 只有
     `.enemy.selected`（:197）。而选牌小窗（焚符/火符/守一/忘忧汤/易物 五处共用
     `.reward-cards` 模板）里 `renderXxxSelect()` 拼的就是 `.card.selected`
     （js/30_engine.js:442 / :582）⇒ **点一张牌，除了右下角一行 9.5px 的「✓ 已选」小字，
     卡面零反馈**。这就是用户说的「选牌小窗看着奇怪」最可能的根因。
     视觉与 `.enemy.selected` 同族（金边 + 外发光），但**只动 border-color 与 box-shadow**：
     `.card{border:2px solid transparent}` ⇒ 改颜色不引起任何位移；
     ⚠️ 绝不能碰 `transform` —— `#hand .card` 的 `rotate(var(--rot))` 占着这条通道，
     在扇形手牌上叠一个位移会把整条弧线打乱。
     ⚠️⚠️ 真正在起作用的是 box-shadow 那圈**实心金环**，不是 border-color：
     `.card.has-frame{border:0}`（:461）把边框宽度归零了，而选牌小窗里的卡**全都带
     `has-frame`**（`cardBody()` 拼的）⇒ `border-color` 算了也是白算（改宽度会顶内容 2px，
     选中/取消时卡面会跳）。`box-shadow` 的扩散环画在盒子**外面**，零布局代价、
     观感与 2px 实心边框一致 ⇒ 保留 `border-color` 只为 `cardFrameFail()` 摘掉
     `has-frame` 之后那条退路。
     ⚠️⚠️⚠️ 上面这段说明**必须留在同一个注释块里**。曾经在「打乱。」后面多写了一个
     注释结束符（星号加斜杠），把「选择器必须是…」那几行变成了裸 CSS ——
     解析器把它们当成一个**非法选择器**一路吞到规则真身的 `{`，整条规则被判无效丢弃
     ⇒ 金环根本没生效。
     ⚠️⚠️⚠️⚠️ 连**写「注释结束符」这三个字都不许用那两个字面字符** —— 本注释自己
     就踩过一次：说明里直接写出那两个字符，等于当场把注释关掉，后半段全变裸 CSS，
     连 `#overlay` 的 `position:fixed` 都被一起吃掉（面板跑到 y=1145）。
     凡是要提这件事，一律用「注释结束符」描述，绝不写出字符本身。
     冒烟与越界表都发现不了（CSS 静默失败），是靠 `_drvclip.js` 的 `dialog=N` 模式读
     `.card.selected` 的 `getComputedStyle` 才挖出来的。
     ⚠️ 选择器必须是 `.reward-cards .card.selected`（0,3,0）而**不能**是 `.card.selected`（0,2,0）：
     `.card.r-blue/.r-purple/.r-gold` 那三条（:414-416）**特异度相同 (0,2,0) 且写在后面**
     ⇒ 平局看顺序，稀有度边框会把金色选中边框整个盖掉，只有白卡看得见选中效果
     （发光还在，但「金边」这个主信号没了）。多带一层 `.reward-cards` 就压过去了 ——
     而这五处选牌弹窗本来就都在 `.reward-cards` 里（js/30_engine.js:444/492/583…）。 */
  .reward-cards .card.selected{border-color:var(--gold); box-shadow:0 0 0 2px var(--gold), 0 6px 20px rgba(0,0,0,.55), 0 0 24px rgba(224,179,65,.55);}
  #hand .card{margin-left:-62px; transform-origin:bottom center; transform:rotate(var(--rot,0deg));}
  #hand .card:first-child{margin-left:0;}
  #hand .card:hover{z-index:40; transform:rotate(var(--rot,0deg)) translateY(-28px) scale(1.3);}
  .card.dragging{z-index:60; cursor:grabbing; box-shadow:0 10px 26px rgba(0,0,0,.6);}
  #hand .card.lift{transform:translateY(-56px) scale(1.5);}
  .enemy.drag-target .eportrait{filter:drop-shadow(0 8px 16px rgba(0,0,0,.6)) drop-shadow(0 0 16px rgba(255,106,60,.75)) brightness(1.15);}
  /* 拖拽箭头改为 SVG 曲线箭头（见 dragArrow / drawArrow） */
  .card.r-white{border-color:#b9ad95;} .card.r-white .cname{color:#4a4232;}
  .card.r-blue{border-color:var(--blue);} .card.r-blue .cname{color:#2b6ba0;}

  .upgrade-preview{color:#8c2b21; margin-top:5px; padding-top:5px; border-top:1px dashed #c9a; font-weight:bold;}
  /* v0.69.0 改「朱砂封条」。
     ⚠️ 旧版是 in-flow 的 `display:inline-block; margin:4px 0 2px` ⇒ 在 .cplate 的 flex 列里
        实打实吃掉约 16px，把 .cdesc 从 2 行压到 1 行 —— **这才是「被封印的牌描述看不全」的根因**
        （不是字号问题）。改成绝对定位后**零行高成本**。
     ⚠️ 原来的 `margin:4px 0 2px` 必须删掉：绝对定位下 margin 依然生效，会把封条顶偏。
     left/right/top 复用图窗（.cart-wrap）那组实测百分比 ⇒ 三档分辨率自适应：
        left 11.69% / right 12.99%（=100−11.69−75.32）/ top = 图窗垂直中心 − 8px（封条半高）。
     ⚠️ verify_dist.py 有「注释配平」闸 —— 写注释时**绝不能在正文里写出注释起止符那两个
        字面符号**。CSS 注释**不嵌套**：正文里一旦出现结束符，浏览器**当场就把注释关掉**，
        正文后半句 + 原本的结束符一起变成**裸 CSS**，被解析器当成非法选择器前奏、
        一路吞到下一个 `{`，**把紧随其后的那条真规则整个丢弃**（本行下方 `.exhaust-tag`
        就曾被这么吞掉过 —— 而那条规则正是本条注释要解释的那个修复，等于注释把修复吃了）。
        要提这两个符号，一律用「注释起止符」四个字描述，不写出字符本身。 */
  .exhaust-tag{position:absolute; left:11.69%; right:12.99%;
    top:calc(12.86% + 35.16%/2 - 8px); height:16px;
    display:flex; align-items:center; justify-content:center;
    font-size:10px; color:#fff; letter-spacing:2px; z-index:4;
    background:repeating-linear-gradient(-45deg, rgba(150,26,22,.92) 0 8px, rgba(110,18,15,.92) 8px 16px);
    border-top:1px solid rgba(255,220,180,.5); border-bottom:1px solid rgba(0,0,0,.5);
    box-shadow:0 2px 6px rgba(0,0,0,.6); pointer-events:none;}
  /* 消耗牌标记：左侧红条（扇形手牌只露左缘，靠它一眼认出）+ 右上角「消耗」角标 */
  .card .oneuse-bar{position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--red2); z-index:3;}
  .card .oneuse{position:absolute; top:5px; right:5px; z-index:3; font-size:9px; line-height:1.35; color:#fff; background:var(--red2); border-radius:4px; padding:1px 5px; letter-spacing:1px; box-shadow:0 1px 3px rgba(0,0,0,.55); cursor:help;}

  /* ===== 卡牌换真美术牌框（ui/card/front.png）=====
     旧卡面是 CSS 画的（纸底 + 顶部色条 + 80px 图窗 + 米黄文字区）。现在改挂真牌框图。

     窗位是**实测**的，不是目测：原图 385x583 上量出
       图窗    x  45..335  y  75..280 → left 11.69%  top 12.86%  w 75.32%  h 35.16%
       铭牌窗  x  42..341  y 344..508 → left 10.91%  top 59.01%  w 77.66%  h 28.13%
     量法踩了两个坑，都记在这儿免得重走：
       · 按亮度分不开「图窗」与「木框」—— 两者都暗（木纹 lum 35~57，图窗也在这个区间），
         阈值一放就整张卡连成一片；
       · 按颜色找「米黄铭牌窗」会被木框上的**金描边**污染 —— 窗内米黄 (207,175,109) 与
         描边金 (188,154,88) 是同一色系，bbox 直接圈住整张卡。
     最后是**按金色描边的位置**定的边界（描边是细线，位置干净）。

     ⚠️ 上面那批旧规则**一条都没删**：牌框图加载失败时 cardFrameFail() 会摘掉 .has-frame，
        卡片原样退回 v0.67 的纯 CSS 版面。所以这一整段只做「有牌框时」的覆写。 */
  /* ⚠️ 必须 border:0 —— 全站 `*{box-sizing:border-box}`，`.card` 那圈 2px 边框会把
     子元素的定位基准从 132 缩到 128（子元素按 **padding box** 定位，而量窗位时用的
     getBoundingClientRect 给的是 **border box**）。实测窗位因此整体缩了约 4.5px/385，
     两个窗加起来偏 9px —— 卡图会离开图窗的金边、文字会离开铭牌窗。 */
  .card.has-frame{border:0; border-radius:5px; background:none;}
  .card.has-frame::before{height:3px; opacity:.9;}
  /* 牌框底图：绝对定位铺满，z-index:0 压在所有内容下面 */
  .card .cframe{position:absolute; left:0; top:0; width:100%; height:100%; display:block; z-index:0; pointer-events:none;}
  .card.has-frame .cart-wrap{position:absolute; left:11.69%; top:12.86%; width:75.32%; height:35.16%;
    background:#2a2119; flex:none;}
  /* 文字三件套包一层 .cplate：
     无牌框时 display:contents ⇒ 孩子照旧直接参与 .card 的 flex 列排版（与 v0.67 完全一致）；
     有牌框时 .cplate 才变成铭牌窗里那个绝对定位的窄列。
     用 display:contents 而不是「有条件地在 JS 里加/不加这层」—— 因为加载失败是**异步**的，
     结构不能事后补。 */
  .card .cplate{display:contents;}
  /* v0.69.0 版面收紧：目标是让描述装下 3 行（原为 2 行）。
     ⚠️ 百分比 padding 是按**包含块宽度**解析的，不是高度 —— 132px 宽的卡上 `2.6%` 纵 padding
        实际是 3.43px 而不是 3.43% 卡高。所以「缩小纵 padding」这件事比看上去省得多：
        纵合计 8.184px → 6.864px，而每行可用宽度反而从 91.95 涨到 93.53。
     验算（默认档 132×200，铭牌窗高 56.26）：
        56.26 − 6.864(padding) − 15.375(cname 行盒) = 34.02 ≥ 3 × 11.25(cdesc 行高) ✓
        每行 93.53 / 9 ≈ 10.4 字 ⇒ 整卡 3 行 × 10 字 = 30 字。
     ⚠️ 余量只有 0.27px ⇒ 字号与 padding 是拿无头 Chrome 实拍扫参定的，别凭感觉改。
       （⚠️ 这段注释会**原样进产物**（CSS 注释不被混淆器剥掉，JS 注释才会）⇒
        这里不许写仓库内部路径，否则打包的隐私自检每次都报一笔。） */
  .card.has-frame .cplate{display:flex; flex-direction:column; position:absolute;
    left:10.91%; top:59.01%; width:77.66%; height:28.13%; box-sizing:border-box;
    padding:2.6% 3.4% 2.6%; overflow:hidden; z-index:1;}
  /* v1.0.6：卡名从铭牌窗**搬到牌面顶部** —— 在「图窗」上沿内侧压一条标题带。
     为什么改（用户报的问题）：卡名与描述原先挤在同一个 28.13% 高的铭牌窗里，
     132x200 上 .cdesc 只剩约 34px ⇒ 3 行封顶（v0.69.0 那套「≤30 列短版」正是照这个上限裁的），
     手机上更窄，手牌描述常只露 1~2 行。现在铭牌窗**整块归描述** ⇒ 可用高度约 49px ⇒ 4 行，
     长文案也能完整显示。
     ⚠️ 特异度：本规则 (0,3,0) 与 `.card.r-blue .cname` 那四条（:480 起，同为 0,3,0）**平局**，
        靠**书写顺序**取胜 ⇒ 必须留在它们**之后**（就是现在这个位置，别往上搬）。
        那四个稀有度名色是给「米黄纸底」调的可读色，压到深色图窗上会糊，故这里统一改暖金 + 描影。
     ⚠️ left/top/width 与 .cart-wrap 同源（图窗实测百分比）⇒ 三档分辨率自适应，不用各写一遍。
     ⚠️ 必须 flex 居中：height 是百分比，不能写成 `line-height:100%` 那类
        （百分比 line-height 相对的是**字号**，不是盒高，会缩成一条线）。
     ⚠️ padding-left 是给左上角费用币让位的（币径 23px、压在 left:3.6%），
        卡名居中后本来也够开，留 20px 是防最长牌名贴上去。
     ⚠️ v1.0.8：加 `white-space:nowrap` + 把升级标 `↑` 收到 0.78em、并收掉牌名与
        `↑` 之间那个空格（word-spacing）—— 用户报「卡名显示不完全、而且不是一行」。
        牌名最长 4 字 + ` ↑` 合计 5.5em：base 卡宽 132px 时标题带 99px、可用 65px，
        4 字（50px）本来放得下，但**加了 ↑ 的 4 字牌**会顶破右沿 1px ⇒ 收箭头最省事
        （它是状态标记不是正名）。手机横屏档手牌卡更窄，由文件末尾 v1.0.8 覆写块
        再收字号与内边距。nowrap 只负责**禁止折行**，免得第二行被 overflow:hidden 切掉。 */
  .card.has-frame .cname{position:absolute; left:11.69%; top:12.86%; width:75.32%; height:12%;
    box-sizing:border-box; padding:0 14px 0 20px; z-index:2; overflow:hidden;
    white-space:nowrap; word-spacing:-0.12em;
    display:flex; align-items:center; justify-content:center;
    font-size:12.5px; letter-spacing:0; line-height:1.15; color:#f2dda6;
    text-shadow:0 1px 3px rgba(0,0,0,.95), 0 0 7px rgba(0,0,0,.85);
    background:linear-gradient(180deg, rgba(18,12,8,.88), rgba(18,12,8,.6) 62%, rgba(18,12,8,0));}
  /* 卡名里的 `↑`（已升级标）。`:not(.noup)` 是必须的 —— 锻造对照卡会把
     `<span class="noup">不可升级</span>` 也放进 .cname，不排除掉它会被一起缩小。
     手机横屏档（文件末尾 v1.0.8 覆写块）压得更狠：0.6em。 */
  .card.has-frame .cname span:not(.noup){font-size:0.78em;}
  /* v1.0.19：已升级标 `↑` 仍钉在**名字左侧、且让名字保持居中**（绝对定位摘出文档流），
     但位置必须避开左上角的费用币 —— 原先写 `left:3px`，手机横屏档手牌卡只有 ~89px 宽，
     费用币（base 23px 压在 `left:3.6%`）会把箭头**整块盖住**（同 z-index、币的 DOM 在后），
     用户报「升级的箭头在手牌看不到」正是这条。
     ⇒ 改为压在**内容盒左沿**（= .cname 的 padding-left：桌面 20px / 手机横屏档 17px），
        刚好落在费用币右侧、居中牌名左侧的空隙里；字号与字重沿用上面的规则**逐格不变**。
     ⚠️ `left` 必须跟着各档的 padding-left 走：手机横屏档在文件末尾把它覆写成 17px。 */
  .card.has-frame .cname .up-mark{position:absolute; left:20px; top:0; bottom:0; display:flex;
    align-items:center; font-weight:900; color:var(--green);}
  /* 描述独占铭牌窗（卡名的行不再从这里扣） ⇒ 高度上限自己长到 4 行；
     字号从 9 提到 9.5（132x200 实拍：9.5 档 10 张样例仍 0 溢出，见 _drvcard G 段），
     旧版 9px 是为「卡名也占一行」的窄窗选的，现在没必要再省。 */
  .card.has-frame .cdesc{flex:1; font-size:9.5px; line-height:1.25; padding:0; overflow:hidden;}
  /* 类型标签放进图窗与铭牌窗之间那条空木带。
     ⚠️ v0.69.0 纠正一个先前的错推论：旧版把它写成 .cplate 里的 `bottom:100%`，
        并以为它「吃掉了约 11px 行高」。**两条都不成立**：
        · 它是 position:absolute ⇒ 不产生 flex item、**不占任何行高**；
        · .cplate 有 overflow:hidden，而 bottom:100% 把它整个顶到 .cplate 上沿**外侧**
          ⇒ 它 100% 被裁掉，**本来就没被看见过**。
        所以这里不是「腾地方」，是「把 .ctype 从裁剪区里救出来」。
     `top:48.02% / height:10.99%` 与 .cart-wrap 下沿、.cplate 上沿**同源**（都由 385x583
     原图的实测像素推出：图窗 y 75..280 → 12.86%+35.16%=48.02%，铭牌窗 y 344 → 59.01%）
     ⇒ 三档分辨率下**自适应，不用各写一遍**。那条木带实测高 21.98 / 17.36 / 14.95px，
     而 .ctype 字号本来就是 8.5 / 7.5 / 7px ⇒ 塞得进，字号不用改。
     ⚠️ 必须保持 `.card.has-frame` 前缀 —— 裸 `.ctype{…}` 会污染 `.relic .ctype`（遗物与灵汁卡在用）。
     用 flex 居中而不是 text-align:center —— 绝对定位 + 明确高度时 text-align 管不了垂直方向。 */
  .card.has-frame .ctype{position:absolute; left:0; right:0; top:48.02%; height:10.99%;
    display:flex; align-items:center; justify-content:center;
    font-size:8.5px; padding:0; letter-spacing:1px;
    color:#d8bd82; text-shadow:0 1px 2px rgba(0,0,0,.8);}
  /* 关键词【】在旧卡面上是金褐色，但铭牌窗本身就是米黄 —— 原色压上去几乎看不见。
     换深琥珀才有对比度。 */
  .card.has-frame .kw{color:#8a5a14; border-bottom-color:rgba(110,80,30,.5);}
  /* 费用牌：木框左上角，压在回纹角饰上（用户 2026-09-28 选定）。
     改黄铜币 —— 旧版是「墨黑底 + 金字」，那是在米黄纸底上才压得住；
     现在底色是深色木纹，墨黑会直接糊掉。 */
  .card.has-frame .cost{top:4.5%; left:3.6%; width:23px; height:23px; font-size:13px;
    background:radial-gradient(circle at 35% 30%, #f2d894, #c9a44e 62%, #96762c);
    color:#2a2119; border:1.5px solid #5e4415;
    box-shadow:0 1px 3px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.45);
    text-shadow:0 1px 0 rgba(255,255,255,.3);}
  /* 卡面下方多出来的那行小字（「✓ 已选」/ 商店价格）。
     有牌框时把它放到铭牌窗下沿那条空木带上 —— 不加这条的话它会成为 .card 里
     唯一在流内的孩子，被挤到左上角压住费用牌。 */
  .card.has-frame > .card-extra{position:absolute; left:8%; right:8%; bottom:3.2%; text-align:center;
    font-size:9.5px; line-height:1.2; z-index:2; text-shadow:0 1px 2px rgba(0,0,0,.75);}
  .relic{width:150px; min-height:110px; background:var(--ink2); color:var(--text); border-radius:8px; padding:10px; display:flex; flex-direction:column; cursor:pointer; border:2px solid var(--ink3); text-align:left; font-size:12px; transition:border .1s;}
  .relic:hover{border-color:var(--gold);}
  .relic .cname{font-family:var(--font-kai); font-weight:bold; font-size:15px; margin-bottom:6px; color:var(--gold); letter-spacing:1px;}
  .relic .cdesc{flex:1; color:var(--dim); line-height:1.5; font-size:11px;}

  /* v0.65.0：小窗开合过渡。#overlay.hidden 原为 display:none（不可过渡 ⇒ 硬切），
     改为 opacity + visibility 延迟翻（淡出完才隐藏，无定时器、无竞态）。
     ⚠️ **类名 .hidden 必须保留** —— 它是语义查询，不只样式：
        js/50_ui.js:1335 加 / :1333 摘 / js/60_boot.js:155 showCardZoom 直接摘 /
        js/60_boot.js:537 用 !contains('hidden') 判断「有没有面板开着」（Esc 与交互引导依赖）
        / 冒烟夹具同查（别在这段里写仓库内部路径 —— 打包.py 的隐私自检会当成泄漏，
        verify_dist 的「不含 仓库文件」门禁会 FAIL；基线里本文件此类引用数是 0）。三处触碰点全是 classList.add/remove/contains，无一处依赖 display。
     visibility:hidden 仍阻止命中测试 ⇒ 关着时不挡点击。 */
  #overlay{position:fixed; inset:0; background:rgba(10,8,6,.88); display:flex; align-items:center; justify-content:center; z-index:10;
    opacity:0; visibility:hidden;
    transition:opacity .22s ease, visibility 0s linear .22s;}
  #overlay:not(.hidden){opacity:1; visibility:visible; transition:opacity .28s cubic-bezier(.2,.8,.2,1);}
  /* 面板推入。挂 #overlayWrap 而非 .panel —— .panel 是滚动容器（max-height:88vh/overflow-y:auto），
     不动它就完全避开「transform 与 overflow 交互」这类坑。
     门闩 .ov-enter 由 showOverlay 每次重算（见 js/50_ui.js）：刷新同一场景不重播。 */
  @keyframes overlayIn{from{opacity:0; transform:translateY(10px) scale(.985);} to{opacity:1; transform:none;}}
  #overlay.ov-enter #overlayWrap{animation:overlayIn .3s cubic-bezier(.2,.8,.2,1) both;}
  /* 地图有自己的相机进场（js/50_ui.js mapCamInit 2000ms），不要叠一层。
     取消语义是安全的：.map-scene 加上后本条生效 ⇒ 运行中的动画被取消 ⇒ 直接落到终态。 */
  #overlay.ov-enter.map-scene #overlayWrap{animation:none;}
  #overlay .close-x{position:absolute; top:8px; right:8px; width:34px; height:34px; line-height:32px; text-align:center; font-size:20px; color:#fff; background:var(--red); border:1px solid #5a1d16; border-radius:50%; cursor:pointer; font-weight:bold; z-index:11;}
  #overlay .close-x:hover{background:var(--red2);}
  #overlayWrap{position:relative; max-width:620px; width:94%;}
  /* v0.71.0：选英雄屏**放不下**（无头实测 #overlay .panel 内部溢出：640×360 → 62px、
     844×390 → 33px、**1280×720 → 20px**）—— 用户报的「选英雄的时候它显示不完全所以导致
     它还能上下滑动」在桌面档同样成立。根因不是字号，是**宽度**：四张 `.relic` 各 150px
     + 3×10px 间距 = 630px，而 `.panel` 内容宽只有 566px（620 限宽 − 26×2 padding）
     ⇒ 折成 3+1 两行，高度 503px 顶穿 88dvh 的 633px。
     所以这里只给**选英雄屏**放宽限宽到 700px（内容宽 648 ≥ 630 ⇒ 一排放下，高度回到单行
     ~255px），其余面板一律维持 620px 不变 —— 用户已验收过的面板观感不动。
     ⚠️ `.relic` 的 150px 与 `.panel` 的 padding 都没动 ⇒ 卡片本身的长相零变化。 */
  #overlay.hero-scene #overlayWrap{max-width:700px;}
  .panel{background:var(--ink2); border:1px solid var(--ink3); border-radius:12px; padding:26px; text-align:center; width:100%; max-height:88vh; max-height:88dvh; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .panel h2{font-family:var(--font-kai); font-size:24px; color:var(--gold); letter-spacing:3px; margin-bottom:14px;}
  .panel p{color:var(--dim); line-height:1.8; margin-bottom:14px;}
  .reward-cards{display:flex; gap:10px; justify-content:center; margin:14px 0; flex-wrap:wrap;}
  /* v0.72.0：桌面档「选牌小窗」改版 —— 去掉小窗的纯色底、把可选的牌直接画在场景上、卡牌放到 1.25 倍。
     纯色底有**两个**来源，必须一起治：.panel 的 --ink2（不透明）与 #overlay 的 88% 黑幕；
     只去一个，另一个照样把战场挡死。
     ⚠️ .panel 与 #overlayContent 是**同一个元素**，且二十多处别的界面共用它（选英雄 / 图鉴 / 周榜 /
     设置 / 奖励三选一 / 篝火 / 锻造 / 鬼市 / 卡牌放大 …）⇒ 那些界面一律保留纯色底。所以「无底」
     只能做成**新的第 5 个场景类**，绝不直接改 .panel；那几个共用界面的样式零变化。
     ⚠️ 限宽 620 也必须解开：桌面 .panel 内容宽只有 568，5×165 加 4×10 的间距共 865 会塌成两行
     —— max-width 重新写成 none 加上 width 100% 才是 1.25 倍能成立的关键。
     ⚠️ 范围＝**只桌面档**。本表的三个还原档是 ≤520 宽 / ≤360 宽 / T-short（max-height 560），
     取它们的**补集**当门（min-width 521 且 min-height 561），把「只桌面档」写成一条判据：
     矮屏与窄屏里本节**一条都不匹配** ⇒ 那些档的 .panel 原样生效，实心面板零像素变化。
     这比照抄三份「还原」更稳 —— 还原要把 padding、max-height 之类的值再抄一遍，哪一档漏抄或
     抄成旧值就是静默失效；而补集门不吃书写顺序（@media 不加特异度，同属性只靠顺序分胜负）。
     ⚠️ 1.25 倍只能挂**场景选择器**：全局 .card 的 132×200 是手牌 / 锻造 / 图鉴 / 奖励三选一共用的，
     动它等于全站卡牌变形。132→165 与 200→250 的比例仍是 0.66，百分比定位的子元素零拉伸。
     v1 不缩放字号：卡名与描述是绝对 px，放大外框只让文字占比变小，不拉歪版面。
     ⚠️ 不要用 backdrop-filter：它会成为 fixed 后代的包含块（与本文件既有的红线同类陷阱），
     而且 #overlay 还带 opacity 与 visibility 的过渡。标题与说明文字用三层投影压暗底衬保证可读；
     实拍若仍糊，退路是给 h2 / p 加**局部**底板（inline-block 加深色底），而不是整块纯色底。
     ⚠️ 面板高度上限给到 94dvh（不是 .panel 的 88dvh）：这一档 .panel 没有任何外框与底色，
     多吃的纵向空间不会顶到任何东西，而 88dvh 在 1280×720 装十张牌时会逼出 18px 内部滚动
     （实测：十张牌折两行 7/3，内容高 652，88dvh 只有 633.6）。94dvh 与本文件矮屏档的取值一致。 */
  @media (min-width:521px) and (min-height:561px){
    #overlay.pick-scene{background:rgba(8,6,5,.22);}
    #overlay.pick-scene #overlayWrap{max-width:none; width:100%;}
    #overlay.pick-scene .panel{background:none; border:0; box-shadow:none; padding:0 10px; max-height:94dvh; overflow-y:auto;}
    #overlay.pick-scene .panel h2,
    #overlay.pick-scene .panel p{text-shadow:0 2px 6px #000, 0 0 14px #000, 0 0 3px #000;}
    /* flex 基准写成 auto 且不许收缩：.card 默认是 flex:0 1 auto，容器不够宽时会被压瘦而
       高度仍是内容撑的 ⇒ 宽高比破掉，has-frame 的百分比子元素全部拉歪。不收缩则走 wrap
       换行（窗口窄到放不下一行时折两行），比例永远保持。 */
    #overlay.pick-scene .reward-cards .card{flex:0 0 auto; width:165px; min-height:250px;}
  }
  /* v0.75.0 锻造页（forge-scene）：面板加宽 + 每两列一组「当前 ▸ 升级后」的并排对照。
     用户口径：「六列就是 每两列展示一种卡牌 左边是初始状态右边是升级状态中间有个箭头来
     指示升级」。
     ⚠️ v0.76.1：用户又报「面板宽度充足，但卡牌仅排列 3 列」⇒ 列数**不再写死**，改成下面那条
        auto-fit × --cell-w（面板多宽就摆多少列）；窄屏那两档（700px / 560px）的列数覆写已删 ——
        写死的列数会在**所有**档一起生效（@media 不加特异度，只比书写顺序），把 auto-fit 的承诺废掉。
     ⚠️ **加宽 #overlayWrap 是六列成立的前提**：它基档是 max-width:620px，三组要 866px，
        锁在 620 里必然折行 —— 与 pick-scene 同一条理由（那条见上方 media 块）。
     ⚠️ **保留 .panel 的纯色底**（与 pick-scene 刻意相反）：锻造页里整屏都是卡牌与说明文字，
        那层底是正文可读性的依托。**不要**顺手抄 pick-scene 的 background:none。
     ⚠️ 用 grid 而**不是** flex-wrap：只有 grid 的 `auto-fit` 才给得出「按面板宽算列数」这个
        承诺；flex-wrap 只保证「放不下才换行」，给不出列数、也算不出 --cell-w。
     ⚠️ 这里只动容器与排列，**不动任何卡宽** —— 全局 .card{width:132px} 与
        .reward-cards .card{min-height:200px} 是手牌/图鉴/奖励三选一共用的，有产物闸钉着。 */
  /* v0.76.0 牌堆页（pile-scene，点抽牌堆/弃牌堆看内容）：**与 forge-scene 共用下面三条**，
     不复制第二份 —— 复制出来的两份必然漂（改了一处忘了另一处，矮屏档尤其容易漏）。
     分组而不是各写一条，是为了让「两个场景同一套容器与排列」在源码里是**一条**约定。
     ⚠️ 只有容器与排列共享：锻造的 .forge-pair / 箭头 / 红色升级描述**不**并进来，
        牌堆页是单张卡（没有对照、没有升级预览）。 */
  #overlay.forge-scene #overlayWrap, #overlay.pile-scene #overlayWrap{max-width:none; width:100%;}
  #overlay.forge-scene .panel,        #overlay.pile-scene .panel{padding:22px 14px;}
  #overlay.forge-scene .reward-cards, #overlay.pile-scene .reward-cards{
    display:grid; grid-template-columns:repeat(auto-fit, var(--cell-w,304px));
    justify-content:center; align-items:start; gap:12px 10px;}
  /* v0.76.1：列数由「写死的 3」改成 **auto-fit × 单元格宽** —— 面板多宽就摆多少列。
     为什么是 auto-fit 不是 auto-fill：auto-fill 会**保留空轨道**，牌少时整格靠左、右侧一大片空；
     auto-fit 把空轨道收掉，配合 justify-content:center 让整格居中
     （无头实测 1000px 宽 + 4 张 132 卡：auto-fill 首卡 left=16 / auto-fit left=229）。
     ⚠️ 单元格宽**必须**与卡宽同源：forge 是「一对」= 卡宽×2 + 箭头槽 40，pile 是单张卡宽；
        与全局 `.card{width:132px}`、矮屏 `.reward-cards .card{width:104px}` 是同一处真相。
        改了卡宽必须同步这里，否则 forge 探针的「组宽」判据立刻报红。 */
  #overlay.pile-scene .reward-cards{--cell-w:132px;}
  .forge-pair{display:flex; align-items:center; gap:9px;}
  .forge-arrow{display:flex; align-items:center; justify-content:center; flex:0 0 auto; opacity:.85;}
  .forge-arrow svg{display:block;}
  /* ⚠️ 描边必须由 CSS 给：SVG 的**表现属性**（stroke="…"）不接受 var()，
     写在标签上会被当非法值丢掉，实拍是一支暗红箭头而不是金的。 */
  .forge-arrow path{fill:none; stroke:var(--gold); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round;}
  /* 升级后那张的描述：直接复用本仓「红色字 = 升级后的效果」的既有语汇（.upgrade-preview）。
     ⚠️ `.card .cdesc`(0,2,0) 的 color **压得过** `.upgrade-preview`(0,1,0) ⇒ 下面这条
        高特异度规则是**必需**的，不是可选修饰：不写的话右卡是黑字，两栏看起来一模一样。
     ⚠️ 同时中和掉 .upgrade-preview 的盒模型（margin-top / border-top）—— 那两个是给
        「卡内一行红字」写的，落在 .cdesc 上会多出一条虚线分隔；padding 不用管，

  #overlay.forge-scene .reward-cards .cdesc.upgrade-preview{color:#8c2b21; font-weight:bold; margin:0; border:0;}
  /* v0.76.1：窄屏两档的**列数**覆写已删 —— 列数现在完全由单元格宽 × 面板宽算出来。

  @media (max-height:560px){

     ⚠️ 必须**用同一条选择器**写在这里 —— 基档那条 (1,2,0) 压得过矮屏档的 `.panel`(0,1,0)，
        不加这条的话 844×390 会在 22px 的内边距上白丢 20px 内容高。同特异度、写在后面 ⇒ 这条赢。 */
  @media (max-height:560px){

       是 94dvh（=366）。卡高**不能动** —— `.card.has-frame` 的子元素全是**百分比定位**
       （图窗 35.16% / 名牌 48.02% / 类型条 10.99%），压扁卡片就是把边框美术整张拉歪；
       而 104×150（比例 0.693）是 v0.71.0 定的、与基档 132×200（0.66）基本同形，越压越歪。
       ⇒ 只能从**卡以外**的留白里把整行挤出来：标题下间距 / 段落行距 / 网格上下留白 /
          行间距，四处一共让出约 44px。实测让出后前两行**完整可见**，第三行起转入面板内
          滚动 —— 那是本仓既有的、用户明确允许的那一类（不是整页滑）。

    #overlay.forge-scene .reward-cards, #overlay.pile-scene .reward-cards{gap:6px 10px; margin:4px 0;}
    #overlay.forge-scene .panel h2, #overlay.pile-scene .panel h2{margin-bottom:4px;}
    #overlay.forge-scene .panel p, #overlay.pile-scene .panel p{line-height:1.35; margin-bottom:4px;}
  }
  /* v0.73.0 事件房背景 / v0.74.0 另加六张整屏场景背景（商店/篝火/胜利/失败/选英雄/胜利奖励）：
     把 #overlay 那层常驻黑幕放松，让底下那张场景图真的看得见（不放松的话任何深色夜景图
