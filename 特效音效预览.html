<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>志怪塔 · 特效音效预览（单文件）</title>
<style>
/* ============================================================
   志怪塔 特效/音效逐个预览页
   - 几何：完全复用 js/00_base.js 的 fxBoxSize / fxCellPos / playFx 公式
   - 立绘高：取自 原型.html 的媒体查询（手机横屏档 = max-height:560px 系列）
   - 素材：相对路径 素材/fx/*.png、素材/sfx/*.mp3、素材/enemy/*.png、素材/hero/*.png
   ============================================================ */
:root{
  --ink:#14100c; --ink2:#1d1712; --ink3:#3a2f22;
  --gold:#e0b341; --gold2:#ffd76a; --red:#c8402f; --dim:#b9a888; --green:#6ec06b;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--ink);color:#e8ddc8;
  font-family:"Kaiti SC","KaiTi","STKaiti",system-ui,"Microsoft YaHei",sans-serif;}
body{padding:12px 14px 40px;}
h1{font-size:20px;color:var(--gold2);letter-spacing:3px;margin:4px 0 6px;}
h1 small{color:var(--dim);font-size:12px;letter-spacing:1px;}
a{color:var(--gold);}
.panel{background:var(--ink2);border:1px solid var(--ink3);border-radius:10px;padding:10px 12px;margin-bottom:12px;}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;}
label{font-size:13px;color:var(--dim);}
button{
  font-family:inherit;font-size:12px;color:#f4ead6;background:#241c14;
  border:1px solid var(--ink3);border-radius:8px;padding:4px 10px;cursor:pointer;letter-spacing:1px;
}
button:hover{background:#2e2419;border-color:var(--gold);}
button.active{background:rgba(224,179,65,.18);border-color:var(--gold);color:var(--gold2);}
input[type=number]{width:70px;font-family:inherit;font-size:12px;background:#100c08;color:#f4ead6;
  border:1px solid var(--ink3);border-radius:6px;padding:4px 6px;}
input[type=text],select{font-family:inherit;font-size:12px;background:#100c08;color:#f4ead6;
  border:1px solid var(--ink3);border-radius:6px;padding:4px 6px;}
.hint{font-size:12px;color:var(--gold);background:rgba(224,179,65,.07);
  border:1px dashed var(--ink3);border-radius:8px;padding:6px 10px;margin-bottom:10px;}
.geo{font-size:12px;color:var(--dim);line-height:1.9;}
.geo b{color:var(--gold2);font-weight:normal;}

/* —— 模拟舞台 —— */
#stageWrap{position:relative;height:46vh;min-height:240px;margin-bottom:12px;
  background:#0c0906;border:1px solid var(--ink3);border-radius:10px;overflow:hidden;}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;
  background:radial-gradient(ellipse at 50% 76%, #241a10 0%, #120d08 58%, #0a0705 100%);
  overflow:hidden;font-size:12px;}
#stage .band{position:absolute;left:0;right:0;pointer-events:none;}
#stage .topbar{top:0;height:8%;background:linear-gradient(#1d1712,#191309);border-bottom:1px solid #2a2117;
  color:var(--dim);font-size:11px;padding:2px 10px;display:flex;align-items:center;}
#stage .hand-strip{background:repeating-linear-gradient(90deg,#191309,#191309 6%,#1d1712 6%,#1d1712 12%);
  border-top:1px solid #2a2117;display:flex;align-items:center;justify-content:center;color:#6f6152;font-size:11px;letter-spacing:2px;}
#battle{position:absolute;left:0;right:0;display:flex;align-items:flex-end;justify-content:space-between;}
#player-panel{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;position:relative;}
#player-panel .hero-art-box{display:flex;align-items:flex-end;justify-content:center;width:100%;position:relative;}
#player-panel .hero-art{height:100%;width:auto;max-width:100%;object-fit:contain;object-position:bottom center;display:block;
  filter:drop-shadow(0 6px 12px rgba(0,0,0,.6));}
#player-panel .pname{font-size:13px;color:var(--gold);letter-spacing:2px;margin-top:3px;}
#enemy-panel{display:flex;flex-direction:row-reverse;align-items:flex-end;justify-content:flex-start;min-width:0;}
.enemy{display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;}
.enemy .eportrait{height:auto;width:auto;max-width:100%;object-fit:contain;object-position:bottom center;display:block;
  filter:drop-shadow(0 6px 12px rgba(0,0,0,.6));}
.enemy .ename{font-size:13px;color:var(--red);letter-spacing:1px;margin-top:3px;}
.anchor-dot{position:absolute;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;
  background:rgba(255,215,106,.5);box-shadow:0 0 6px rgba(255,215,106,.7);pointer-events:none;}
.field-tag{position:absolute;font-size:10px;color:rgba(224,179,65,.55);pointer-events:none;transform:translate(-50%,-50%);}

/* —— 特效精灵图（与 js/00_base.js 的 playFx 同结构）—— */
.fx-sheet{position:absolute;overflow:hidden;pointer-events:none;will-change:transform;}
.fx-sheet-in{position:absolute;left:0;top:0;background-repeat:no-repeat;
  background-position:0 0;image-rendering:auto;will-change:transform;}

/* —— 清单 —— */
.grp-title{font-size:15px;color:var(--gold2);letter-spacing:2px;margin:16px 0 6px;
  border-left:3px solid var(--gold);padding-left:8px;}
.grp-title span{color:var(--dim);font-size:11px;letter-spacing:0;}
.fxrow{display:grid;grid-template-columns:96px 210px 1fr;gap:6px 12px;align-items:start;
  background:#191309;border:1px solid #2a2117;border-radius:8px;padding:7px 10px;margin-bottom:5px;}
.fxrow .fx-name{font-size:12px;color:#8fd3ff;word-break:break-all;line-height:1.5;}
.fxrow .fx-name .sfxline{display:block;color:var(--dim);}
.fxrow .fx-trig{font-size:12.5px;color:#e8ddc8;line-height:1.7;}
.fxrow .fx-trig .tags{margin-top:2px;}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:10px;border:1px solid var(--ink3);
  color:var(--dim);margin-right:4px;}
.tag.sfx{color:var(--gold);border-color:#4a3c26;background:rgba(224,179,65,.07);}
.tag.nosfx{color:#e08b3a;}
.tag.loop{color:#c86bd8;border-color:#4a2f52;}
.tag.box{color:#8fd3ff;border-color:#26414a;}
button.play{grid-column:1;}
@media(max-width:780px){ .fxrow{grid-template-columns:1fr;} }

/* —— 每条特效的反馈区 —— */
.fx-fb{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:5px;
  margin-top:6px;padding-top:6px;border-top:1px dashed #2a2117;}
.fb-title{font-size:11px;color:var(--dim);letter-spacing:1px;margin-right:2px;}
.chip{font-size:11px;padding:1px 8px;border-radius:10px;border:1px solid var(--ink3);
  color:var(--dim);cursor:pointer;user-select:none;line-height:1.7;}
.chip:hover{border-color:var(--gold);color:#e8ddc8;}
.chip.on{background:rgba(224,179,65,.22);border-color:var(--gold);color:var(--gold2);font-weight:bold;}
.fb-note{flex:1 1 140px;min-width:120px;max-width:280px;font-size:11px;padding:2px 6px;}

/* —— 音效库（试听与标注）—— */
.sub-title{font-size:13px;color:#d8c48f;letter-spacing:1px;margin:10px 0 4px;
  border-left:2px solid #6b5a38;padding-left:6px;}
.sub-title span{color:var(--dim);font-size:11px;letter-spacing:0;}
.sfxrow{display:grid;grid-template-columns:74px 1fr;gap:4px 12px;align-items:start;
  background:#181208;border:1px solid #2a2117;border-radius:8px;padding:6px 10px;margin-bottom:4px;}
.sfxrow button.play{align-self:start;}
button.play.off{opacity:.4;cursor:not-allowed;}
.sfxrow .sfx-name{font-size:12px;color:#8fd3ff;word-break:break-all;line-height:1.5;}
.sfxrow .sfx-meta{margin-top:3px;line-height:1.9;}
.tag.sfxb.used{color:var(--green);border-color:#2e4a2c;background:rgba(110,192,107,.08);}
.tag.sfxb.orphan{color:#e08b3a;border-color:#4a3320;background:rgba(224,139,58,.08);}
.tag.sfxb.missing{color:#e0c23a;border-color:#4a4224;background:rgba(224,194,58,.08);}
.tag.sfxb.tableonly{color:#c86bd8;border-color:#4a2f52;background:rgba(200,107,216,.07);}
.tag.sfxb.file{color:#8fd3ff;border-color:#26414a;}
@media(max-width:780px){ .sfxrow{grid-template-columns:1fr;} }

/* —— 左右分栏 —— */
.layout{display:flex;gap:14px;align-items:flex-start;}
.col-left{flex:0 0 400px;max-width:400px;position:sticky;top:12px;
  max-height:calc(100vh - 24px);overflow-y:auto;overflow-x:hidden;}
.col-right{flex:1 1 auto;min-width:0;height:calc(100vh - 24px);overflow-y:auto;overflow-x:hidden;
  padding-right:4px;}
.right-head{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  background:var(--ink2);padding:6px 2px 8px;border-bottom:1px solid var(--ink3);margin-bottom:8px;}
.right-head .rh-title{font-size:14px;color:var(--gold2);letter-spacing:2px;font-weight:bold;}
#fbCount{font-size:11px;color:var(--dim);}
@media(max-width:900px){
  .layout{display:block;}
  .col-left{position:static;max-width:100%;max-height:none;overflow:visible;}
  .col-right{height:auto;overflow:visible;}
}

.foot{font-size:11px;color:#7c6f5c;line-height:1.8;margin-top:20px;}
</style>
</head>
<body>

<h1>志怪塔 · 特效音效预览 <small>单文件静态页 · 尺寸与实机同源</small></h1>

<div class="hint" id="audioHint">提示：浏览器需一次用户手势才能出声 —— 请<b>先点任意一个「播放」按钮</b>解锁音频，之后每次播放都会自动配音效。</div>

<div class="layout">
<div class="col-left">
<!-- ============ 控制条 ============ -->
<div class="panel">
  <div class="row">
    <label>视口预设：</label>
    <button data-vp="844x390" class="active">手机横屏 844×390</button>
    <button data-vp="1280x720">桌面 1280×720</button>
    <label>自定义：</label>
    <input type="number" id="vpW" value="844" min="240" max="2560"> ×
    <input type="number" id="vpH" value="390" min="240" max="1600">
    <button id="applyVp">应用</button>
    <span class="geo" id="vplabel"></span>
  </div>
  <div class="row" style="margin-top:8px;">
    <label>敌人档位：</label>
    <button data-tier="normal" class="active">杂兵 (e-normal)</button>
    <button data-tier="elite">精英 (e-elite)</button>
    <button data-tier="boss">Boss (e-boss)</button>
    <label style="margin-left:10px;">敌人立绘：</label>
    <select id="selEnemy"></select>
    <label>玩家角色：</label>
    <select id="selHero"></select>
  </div>
</div>

<!-- ============ 模拟舞台 ============ -->
<div id="stageWrap"><div id="stage"></div></div>

<!-- ============ 几何读数 ============ -->
<div class="panel geo" id="geoBox"></div>
</div><!-- /col-left -->

<div class="col-right">
  <div class="right-head">
    <span class="rh-title">特效 / 音效清单</span>
    <button id="btnExport">导出反馈</button>
    <button id="btnClear">清空反馈</button>
    <span id="fbCount"></span>
  </div>

<!-- ============ 特效清单 ============ -->
<div id="list"></div>

<div class="foot" id="foot"></div>
</div><!-- /col-right -->
</div><!-- /layout -->

/* 立绘高度：取自 原型.html 的媒体查询
   宽 ≥521（手机横屏/桌面）：短屏档 max-height:560px 用 v1.0.3 折点公式；
   561px 以上用基档(361-364 行) 的 vh 连续公式。窄屏 ≤520 另有定值档。 */
function clampv(v,lo,hi){ return Math.min(Math.max(v,lo),hi); }
function portraitHeights(vw,vh){
  var wide=vw>=521;
  if(vh<=560){
    if(wide){ // 原型.html:1422-1426 / 1443-1446（v1.0.2/v1.0.3 折点项）
      return {
        summon:clampv(52+(vh-360)*0.20,52,80),
        normal:clampv(82+(vh-360)*0.58+Math.max(0,vh-390)*0.64,82,200),
        elite: clampv(100+(vh-360)*0.70+Math.max(0,vh-390)*0.34,100,244),
        boss:  clampv(120+(vh-360)*0.72+Math.max(0,vh-390)*0.26,120,266),
        hero:  clampv(100+(vh-360)*0.58+Math.max(0,vh-390)*0.24,100,172)
      };
    }
    return { // 窄屏 ≤520：原型.html:1422-1426
      summon:clampv(52+(vh-360)*0.20,52,80),
      normal:clampv(82+(vh-360)*0.58,82,200),
      elite: clampv(100+(vh-360)*0.70,100,244),
      boss:  clampv(120+(vh-360)*0.72,120,266),
      hero:  clampv(100+(vh-360)*0.58,100,172)
    };
  }
  if(!wide) return {hero:120,summon:60,normal:120,elite:180,boss:240}; // 原型.html:972-977
  return { // 基档（原型.html:92,123-126,300）
    hero:186,
    summon:clampv(93+(vh-880)*0.2178,24,93),
    normal:clampv(186+(vh-880)*0.4355,48,186),
    elite: clampv(280+(vh-880)*0.6555,73,280),
    boss:  clampv(372+(vh-880)*0.871,97,372)
  };
}

  var dot=document.createElement('span'); dot.className='anchor-dot';
  var r=el.getBoundingClientRect(), br=box.getBoundingClientRect();
  var lx=(r.left+r.width/2-br.left)/state.k, ly=(r.top+r.height/2-br.top)/state.k;
  dot.style.left=lx+'px'; dot.style.top=ly+'px';
  box.appendChild(dot);
  var tag=document.createElement('span'); tag.className='field-tag'; tag.textContent=label;
  tag.style.left=lx+'px'; tag.style.top=(ly+10)+'px';
  box.appendChild(tag);
}
function scaleStage(){
  var wrap=document.getElementById('stageWrap');
  var aw=wrap.clientWidth-2, ah=wrap.clientHeight-2;
  state.k=Math.min(aw/state.vw, ah/state.vh);
  stage.style.transform='scale('+state.k+')';
}
/* 逻辑坐标（除以缩放） */
function logicalRect(el){
  var sr=stage.getBoundingClientRect(), r=el.getBoundingClientRect();
  return {left:(r.left-sr.left)/state.k, top:(r.top-sr.top)/state.k,
          width:r.width/state.k, height:r.height/state.k};
}
function anchorEl(a){
  if(a==='enemy') return stage.querySelector('.enemy')||stage.querySelector('#enemy-panel');
  if(a==='field') return stage.querySelector('#enemy-panel');
  return stage.querySelector('.hero-art-box');   /* player / summon 同落立绘框 */
}
function anchorShort(a){
  var H=portraitHeights(state.vw,state.vh);
  if(a==='player'||a==='summon') return H.hero*Math.min(state.heroAR,1);
  return H[state.tier]*Math.min(state.enemyAR,1);
}
function boxFor(name){
  var S=FX[name];
  var short=anchorShort(anchorOf(name));
  var box=Math.round(fxBoxSize(short,state.vw,state.vh)*(S.scale||1));
  var cap=Math.round(Math.min(state.vw,state.vh)*0.9);
  if(cap>0 && box>cap) box=cap;
  return box;
}

/* =====================================================================
   5) 播放特效（结构/公式与 playFx 一致）
   ===================================================================== */
function stopAll(){
  playing.forEach(function(p){ try{cancelAnimationFrame(p.raf);}catch(e){} if(p.el&&p.el.remove) p.el.remove(); });
  playing=[];
}
function startAudio(){
  if(state.audioUnlocked) return;   /* 第一次点「播放」本身就是解锁手势，无需空音频 */
  state.audioUnlocked=true;
  var h=document.getElementById('audioHint');
  if(h) h.innerHTML='音频已解锁。点击任一「播放」即可逐条试听特效 + 音效。';
}
function playSfx(key){
  if(!key) return;   /* null → 静默（芯片循环等无专属音效） */
  var cands=['素材/sfx/'+key+'_1.mp3','素材/sfx/'+key+'.mp3','素材/sfx/'+key+'_2.mp3'];
  (function tryAt(i){
    if(i>=cands.length) return;   /* 全部缺失：静默兜底 */
    var au=new Audio(cands[i]); au.volume=0.9; var done=false;
    function fail(){ if(done) return; done=true; tryAt(i+1); }
    au.onerror=fail;
    var p=au.play(); if(p&&p.catch) p.catch(fail);
  })(0);
}
function spawnFx(name){
  stopAll();
  var S=FX[name]; if(!S) return;
  var it=CITEM[name]||{a:anchorOf(name),s:null};
  var a=it.a||'enemy';
  var el=anchorEl(a); if(!el) return;
  var r=logicalRect(el);
  var box=boxFor(name);
  var ch=S.ch||1, c0=Math.max(1,S.c||8);
  var rows=S.rows||(Math.floor(((S.i0||0)+Math.max(1,S.f)-1)/c0)+1);
  var ox=(S.ox||0)*box, oy=(S.oy||0)*box*ch;

  var sheet=document.createElement('div'); sheet.className='fx-sheet';
  sheet.style.width=box+'px'; sheet.style.height=(box*ch)+'px';
  var lft=Math.round(r.left+r.width/2-box/2-ox);
  var tp =Math.round(r.top +r.height/2-box*ch/2-oy);
  sheet.style.left=lft+'px'; sheet.style.top=tp+'px';

  var inner=document.createElement('div'); inner.className='fx-sheet-in';
  inner.style.width=(c0*box)+'px'; inner.style.height=(rows*box*ch)+'px';
  inner.style.backgroundImage='url("素材/fx/'+name+'.png")';
  inner.style.backgroundSize=(c0*box)+'px auto';
  var i0=S.i0||0;
  inner.style.transform=fxCellTf(fxCellPos(i0,c0,box,ch));
  sheet.appendChild(inner);
  stage.appendChild(sheet);

  /* 音效（Boss 的 _hit 也配同一 base 键，与游戏一致：起手已出声，这里只是让预览可听） */
  playSfx(it.s);

  /* 帧循环：dur = 1000/((S.fps||24)*(rate||1)) */
  var dur=1000/((S.fps||24)*1);
  var t0=(window.performance&&performance.now?performance.now():Date.now());
  var cur=-1, raf=0;
  function step(){
    var now=(window.performance&&performance.now?performance.now():Date.now());
    var i=Math.floor((now-t0)/dur);
    if(it.loop){ i=i%Math.max(1,S.f); }
    else if(i>=S.f){ sheet.remove(); return; }
    if(i!==cur){ cur=i; var k=i0+i;
      inner.style.transform=fxCellTf(fxCellPos(k,c0,box,ch)); }
    raf=requestAnimationFrame(step);
  }
  raf=requestAnimationFrame(step);
  playing.push({el:sheet,raf:raf,key:name});
}

   5.5) 反馈：标签 chips + 备注，存 localStorage（键 zgt_fx_feedback_v1，按特效名存）

var FB_KEY='zgt_fx_feedback_v1';
var FB_TAGS=['没有音效','音效不对','特效太大','特效太小','特效长了','特效短了','音效长了','音效短了','其他'];
var FB={};
function loadFB(){
  FB={};
  try{ var s=localStorage.getItem(FB_KEY); var o=s?JSON.parse(s):null;
    if(o&&typeof o==='object'&&!Array.isArray(o)) FB=o; }catch(e){ FB={}; }
}
function saveFB(){ try{ localStorage.setItem(FB_KEY,JSON.stringify(FB)); }catch(e){} }
function fbRead(name){ var f=FB[name];
  if(!f||typeof f!=='object') return {tags:[],note:''};
  return {tags:Array.isArray(f.tags)?f.tags:[], note:(typeof f.note==='string')?f.note:''}; }
function fbOf(name){ var f=FB[name];
  if(!f||typeof f!=='object'){ f={tags:[],note:''}; FB[name]=f; }
  if(!Array.isArray(f.tags)) f.tags=[];
  if(typeof f.note!=='string') f.note=String(f.note==null?'':f.note);
  return f; }
function escAttr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;')
  .replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function hasFeedback(f){ return !!(f&&((f.tags&&f.tags.length)||(f.note&&f.note.replace(/\s/g,'')))); }
function toggleTag(name,tag,el){
  var f=fbOf(name), i=f.tags.indexOf(tag);
  if(i>=0) f.tags.splice(i,1); else f.tags.push(tag);
  saveFB();
  if(el) el.classList.toggle('on', i<0);
  updateFbCount();
}
function fbHTML(name){
  var f=fbRead(name);
  var chips=FB_TAGS.map(function(t){
    var on=f.tags.indexOf(t)>=0;
    return '<span class="chip'+(on?' on':'')+'" data-fbname="'+name+'" data-tag="'+t+'">'+t+'</span>';
  }).join('');
  return '<div class="fx-fb">'
    + '<span class="fb-title">反馈</span>' + chips
    + '<input class="fb-note" type="text" placeholder="备注（其他）" data-note="'+name+'" value="'+escAttr(f.note)+'">'
    + '</div>';
}
function exportRows(){
  var seen={}, rows=[];
  catalog.forEach(function(it){ seen[it.name]=1; var f=FB[it.name]; if(hasFeedback(f)) rows.push([it.name,f]); });
  Object.keys(FB).forEach(function(n){ if(!seen[n]){ var f=FB[n]; if(hasFeedback(f)) rows.push([n,f]); } });
  return rows;
}
function updateFbCount(){
  var fxN=exportRows().length, sfxN=sfxExportRows().length, n=fxN+sfxN;
  var el=document.getElementById('fbCount');

}
function pad2(n){ return (n<10?'0':'')+n; }
function todayStr(){ var d=new Date();
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function rowsToLines(rows,title,emptyTxt){
  var L=[title];
  if(!rows.length){ L.push('（'+emptyTxt+'）'); L.push(''); return L; }
  rows.forEach(function(r,i){
    var tags=(r[1].tags&&r[1].tags.length)?r[1].tags.join('、'):'（无）';
    var note=(r[1].note||'').replace(/\s+$/,'')||'（无）';
    L.push((i+1)+'. '+r[0]+' → 标签：'+tags+' ｜ 备注：'+note);
  });
  L.push('');
  return L;
}
function exportText(){

  L=L.concat(rowsToLines(sfxRows,'【二、音效反馈·音效库】（'+sfxRows.length+' 条）','暂无音效反馈'));
  return L.join('\n');
}
function fallbackCopy(text){
  try{ var ta=document.createElement('textarea'); ta.value=text;
    ta.style.position='fixed'; ta.style.left='-9999px';
    document.body.appendChild(ta); ta.focus(); ta.select();
    document.execCommand('copy'); ta.remove();
  }catch(e){}
}
function doExport(){

  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(function(){ fallbackCopy(text); });
  }else{ fallbackCopy(text); }
  try{
    var blob=new Blob([text],{type:'text/plain;charset=utf-8'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=fname;
    document.body.appendChild(a); a.click(); a.remove();

  selH.value=state.hero;
  selE.addEventListener('change',function(){ state.enemyKey=this.value; rebuild(); });
  selH.addEventListener('change',function(){ state.hero=this.value; rebuild(); });
  document.getElementById('applyVp').addEventListener('click',function(){
    var w=Math.max(240,Math.min(2560,+document.getElementById('vpW').value||844));
    var h=Math.max(240,Math.min(1600,+document.getElementById('vpH').value||390));
    document.querySelectorAll('[data-vp]').forEach(function(b){b.classList.remove('active');});
    setVp(w,h);
  });
  window.addEventListener('resize',function(){ scaleStage(); refreshGeo(); });
  document.getElementById('btnExport').addEventListener('click',doExport);
  document.getElementById('btnClear').addEventListener('click',doClear);
  loadFB();
  loadSfxFB();
  buildStage(); renderList();
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
</script>
</body>
</html>
